<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" role="img">
  <title>Sliding window state with bucket expiration</title>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <path d="M0 0L10 3L0 6Z" fill="#55728f"/>
    </marker>
  </defs>
  <style>
    .title{font:700 26px sans-serif;fill:#17324d}
    .h{font:700 17px sans-serif;fill:#17324d}
    .b{font:14px sans-serif;fill:#45627d}
    .c{font:13px monospace;fill:#17324d}
    .line{stroke:#55728f;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <rect width="1200" height="590" rx="24" fill="#f7fafc"/>
  <text x="600" y="46" text-anchor="middle" class="title">Sliding window maintenance uses bucket deltas</text>

  <rect x="75" y="110" width="1050" height="120" rx="20" fill="#ffffff" stroke="#c7d5e2"/>
  <text x="600" y="147" text-anchor="middle" class="h">Five-minute window as 300 one-second buckets</text>
  <g transform="translate(130 175)">
    <rect x="0" y="0" width="55" height="36" rx="6" fill="#fff1f1" stroke="#dd7777"/>
    <text x="27" y="24" text-anchor="middle" class="c">exp</text>
    <rect x="70" y="0" width="55" height="36" rx="6" fill="#dbe7f6" stroke="#7399dc"/>
    <rect x="140" y="0" width="55" height="36" rx="6" fill="#dbe7f6" stroke="#7399dc"/>
    <rect x="210" y="0" width="55" height="36" rx="6" fill="#dbe7f6" stroke="#7399dc"/>
    <rect x="280" y="0" width="55" height="36" rx="6" fill="#dbe7f6" stroke="#7399dc"/>
    <rect x="350" y="0" width="55" height="36" rx="6" fill="#dbe7f6" stroke="#7399dc"/>
    <rect x="420" y="0" width="55" height="36" rx="6" fill="#dbe7f6" stroke="#7399dc"/>
    <rect x="490" y="0" width="55" height="36" rx="6" fill="#dbe7f6" stroke="#7399dc"/>
    <rect x="560" y="0" width="55" height="36" rx="6" fill="#dbe7f6" stroke="#7399dc"/>
    <rect x="630" y="0" width="55" height="36" rx="6" fill="#dbe7f6" stroke="#7399dc"/>
    <rect x="700" y="0" width="55" height="36" rx="6" fill="#dbe7f6" stroke="#7399dc"/>
    <rect x="770" y="0" width="55" height="36" rx="6" fill="#17324d"/>
    <text x="797" y="24" text-anchor="middle" font-family="monospace" font-size="13" fill="#fff">now</text>
    <rect x="840" y="0" width="55" height="36" rx="6" fill="#fff8e7" stroke="#d6a63f"/>
    <text x="867" y="24" text-anchor="middle" class="c">late</text>
  </g>

  <rect x="100" y="315" width="255" height="120" rx="18" fill="#fff1f1" stroke="#dd7777"/>
  <text x="228" y="355" text-anchor="middle" class="h">Expired bucket</text>
  <text x="228" y="388" text-anchor="middle" class="c">A=4, B=9</text>
  <text x="228" y="416" text-anchor="middle" class="b">subtract from active counts</text>

  <path d="M355 375H455" class="line"/>
  <rect x="455" y="285" width="290" height="180" rx="20" fill="#edf8f6" stroke="#5ab5a4"/>
  <text x="600" y="325" text-anchor="middle" class="h">Active counts</text>
  <text x="600" y="363" text-anchor="middle" class="c">A = A - 4</text>
  <text x="600" y="398" text-anchor="middle" class="c">B = B - 9</text>
  <text x="600" y="433" text-anchor="middle" class="b">repair ranking entries</text>

  <path d="M745 375H845" class="line"/>
  <rect x="845" y="315" width="255" height="120" rx="18" fill="#17324d"/>
  <text x="973" y="357" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">Local Top-K</text>
  <text x="973" y="392" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#bfd2e3">updated after increment</text>
  <text x="973" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#bfd2e3">and after expiration</text>
</svg>
