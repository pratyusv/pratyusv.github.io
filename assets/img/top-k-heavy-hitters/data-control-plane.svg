<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" role="img">
  <title>Top-K data plane and control plane</title>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <path d="M0 0L10 3L0 6Z" fill="#55728f"/>
    </marker>
  </defs>
  <style>
    .title{font:700 26px sans-serif;fill:#17324d}
    .h{font:700 16px sans-serif;fill:#17324d}
    .b{font:14px sans-serif;fill:#45627d}
    .c{font:13px monospace;fill:#17324d}
    .w{font:13px sans-serif;fill:#ffffff}
    .line{stroke:#55728f;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .dash{stroke:#55728f;stroke-width:3;stroke-dasharray:7 7;fill:none;marker-end:url(#arrow)}
  </style>
  <rect width="1200" height="650" rx="24" fill="#f7fafc"/>
  <text x="600" y="46" text-anchor="middle" class="title">The data plane counts events; the control plane changes counting rules</text>

  <rect x="70" y="105" width="1060" height="210" rx="24" fill="#ffffff" stroke="#c7d5e2"/>
  <text x="130" y="145" class="h">Data plane</text>
  <rect x="130" y="190" width="140" height="70" rx="14" fill="#eef4ff" stroke="#7399dc"/>
  <text x="200" y="233" text-anchor="middle" class="h">Ingest</text>
  <path d="M270 225H345" class="line"/>
  <rect x="345" y="190" width="140" height="70" rx="14" fill="#17324d"/>
  <text x="415" y="233" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">Log</text>
  <path d="M485 225H560" class="line"/>
  <rect x="560" y="190" width="150" height="70" rx="14" fill="#edf8f6" stroke="#5ab5a4"/>
  <text x="635" y="233" text-anchor="middle" class="h">Workers</text>
  <path d="M710 225H785" class="line"/>
  <rect x="785" y="190" width="150" height="70" rx="14" fill="#fff8e7" stroke="#d6a63f"/>
  <text x="860" y="233" text-anchor="middle" class="h">Reducers</text>
  <path d="M935 225H1010" class="line"/>
  <rect x="1010" y="190" width="80" height="70" rx="14" fill="#eef4ff" stroke="#7399dc"/>
  <text x="1050" y="233" text-anchor="middle" class="h">API</text>

  <rect x="70" y="380" width="1060" height="190" rx="24" fill="#17324d"/>
  <text x="130" y="420" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">Control plane</text>
  <rect x="130" y="455" width="150" height="62" rx="12" fill="#eef4ff"/>
  <text x="205" y="493" text-anchor="middle" class="c">metric defs</text>
  <rect x="320" y="455" width="150" height="62" rx="12" fill="#edf8f6"/>
  <text x="395" y="493" text-anchor="middle" class="c">ownership</text>
  <rect x="510" y="455" width="150" height="62" rx="12" fill="#fff8e7"/>
  <text x="585" y="493" text-anchor="middle" class="c">split registry</text>
  <rect x="700" y="455" width="150" height="62" rx="12" fill="#fff1f1"/>
  <text x="775" y="493" text-anchor="middle" class="c">window config</text>
  <rect x="890" y="455" width="150" height="62" rx="12" fill="#ffffff"/>
  <text x="965" y="493" text-anchor="middle" class="c">versions</text>

  <path d="M395 455L635 260" class="dash"/>
  <path d="M585 455L860 260" class="dash"/>
  <path d="M775 455L635 260" class="dash"/>
  <text x="600" y="610" text-anchor="middle" class="b">Control-plane versions must be stamped on worker summaries and reducer outputs.</text>
</svg>
