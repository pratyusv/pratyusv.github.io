<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background-color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
    
    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- TITLE HEADER -->
  <text x="600" y="45" text-anchor="middle" font-size="22" font-weight="800" fill="#0F172A" letter-spacing="0.5">
    REAL-TIME MULTI-SCOPE TOP-K HEAVY HITTERS ARCHITECTURE
  </text>
  <text x="600" y="70" text-anchor="middle" font-size="13" font-weight="500" fill="#64748B">
    End-to-End Event Ingestion, Scope Partitioning, In-Memory Sliding Windows, and Cache Materialization
  </text>

  <!-- ================================================================= -->
  <!-- LAYER 1: CLIENTS AND API GATEWAY                                  -->
  <!-- ================================================================= -->
  <g filter="url(#shadow)">
    <!-- Edge Ingestion Box -->
    <rect x="50" y="110" width="1100" height="100" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="70" y="135" font-size="12" font-weight="700" fill="#64748B" letter-spacing="1">1. INGESTION LAYER</text>
    
    <!-- Mobile/Web Clients -->
    <rect x="90" y="148" width="140" height="48" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="160" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Music Clients</text>
    <text x="160" y="185" text-anchor="middle" font-size="11" fill="#64748B">Mobile / Web App</text>

    <!-- API Gateway / Ingestion Service -->
    <rect x="360" y="148" width="220" height="48" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="470" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">API Ingestion Service</text>
    <text x="470" y="185" text-anchor="middle" font-size="11" fill="#2563EB">Extracts (Country, Language, SongID)</text>

    <!-- Kafka/Pulsar Scope Router -->
    <rect x="700" y="148" width="410" height="48" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="905" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#78350F">Partitioned Message Bus (Kafka / Pulsar)</text>
    <text x="905" y="185" text-anchor="middle" font-size="11" fill="#92400E">Partitioned by Scope Key: metric | country | language</text>

    <!-- Arrows in Layer 1 -->
    <path d="M 230 172 L 354 172" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 580 172 L 694 172" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  </g>

  <!-- Flow Label 1 -->
  <text x="292" y="162" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">Play Event</text>

  <!-- ================================================================= -->
  <!-- LAYER 2: WORKER CLUSTER (MULTI-SCOPE PARTITIONING)               -->
  <!-- ================================================================= -->
  
  <!-- Outer Cluster Container -->
  <rect x="50" y="240" width="1100" height="430" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="265" font-size="12" font-weight="700" fill="#64748B" letter-spacing="1">2. STATEFUL STREAM WORKER CLUSTER (C++ ENGINE)</text>

  <!-- WORKER 1 (HINDI SCOPE) -->
  <g>
    <rect x="80" y="285" width="510" height="360" rx="10" fill="#F8FAFC" stroke="#0284C7" stroke-width="2"/>
    
    <!-- Header -->
    <rect x="80" y="285" width="510" height="35" rx="10" fill="#E0F2FE"/>
    <text x="95" y="308" font-size="13" font-weight="800" fill="#0369A1">WORKER 1</text>
    <text x="575" y="308" text-anchor="end" font-size="11" font-weight="700" fill="#0284C7">Scope: metric=song_plays | country=IN | language=hi</text>

    <!-- In-Memory Data Structures -->
    <!-- Structure A: Ring Buffer -->
    <rect x="100" y="335" width="470" height="135" rx="8" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5"/>
    <text x="115" y="355" font-size="12" font-weight="700" fill="#0369A1">Ring Buffer (5 x 1-Min Time Buckets)</text>
    <text x="555" y="355" text-anchor="end" font-size="10" font-weight="600" fill="#64748B">Slot = (Timestamp / 60) % 5</text>

    <!-- Ring Buffer Visual Boxes -->
    <rect x="115" y="370" width="80" height="55" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="155" y="390" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">10:00</text>
    <text x="155" y="412" text-anchor="middle" font-size="9" fill="#94A3B8">[EXPIRED]</text>

    <rect x="205" y="370" width="80" height="55" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="245" y="390" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">10:01</text>
    <text x="245" y="412" text-anchor="middle" font-size="9" fill="#475569">180 plays</text>

    <rect x="295" y="370" width="80" height="55" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="335" y="390" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">10:02</text>
    <text x="335" y="412" text-anchor="middle" font-size="9" fill="#475569">210 plays</text>

    <rect x="385" y="370" width="80" height="55" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="425" y="390" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">10:03</text>
    <text x="425" y="412" text-anchor="middle" font-size="9" fill="#475569">350 plays</text>

    <!-- Active Bucket -->
    <rect x="475" y="370" width="80" height="55" rx="6" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    <text x="515" y="388" text-anchor="middle" font-size="10" font-weight="800" fill="#0369A1">10:04</text>
    <text x="515" y="403" text-anchor="middle" font-size="8" font-weight="700" fill="#0284C7">ACTIVE</text>
    <text x="515" y="417" text-anchor="middle" font-size="8" fill="#0369A1">song_8472: 300</text>

    <text x="115" y="452" font-size="10" font-family="monospace" fill="#0369A1">struct Bucket { uint64_t start; unordered_map&lt;string, uint64_t&gt; counts; };</text>

    <!-- Structure B: Global Window Counts and Heap -->
    <rect x="100" y="485" width="225" height="140" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="115" y="508" font-size="12" font-weight="700" fill="#1E293B">window_counts Map</text>
    <text x="115" y="525" font-size="10" fill="#64748B">Aggregated 5-min totals</text>
    <text x="115" y="550" font-size="11" font-family="monospace" fill="#0F172A">"song_8472" ──► 1200</text>
    <text x="115" y="570" font-size="11" font-family="monospace" fill="#0F172A">"song_1931" ──►  950</text>
    <text x="115" y="590" font-size="11" font-family="monospace" fill="#0F172A">"song_4409" ──►  700</text>

    <!-- Structure C: Min Heap -->
    <rect x="345" y="485" width="225" height="140" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="360" y="508" font-size="12" font-weight="700" fill="#1E293B">Local Top-K Min-Heap</text>
    <text x="360" y="525" font-size="10" fill="#64748B">Tracks top K items in O(log K)</text>
    
    <!-- Heap Visual Nodes -->
    <circle cx="457" cy="552" r="14" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="457" y="556" text-anchor="middle" font-size="9" font-weight="800" fill="#78350F">700</text>

    <circle cx="420" cy="595" r="14" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <text x="420" y="599" text-anchor="middle" font-size="9" font-weight="800" fill="#065F46">950</text>

    <circle cx="494" cy="595" r="14" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <text x="494" y="599" text-anchor="middle" font-size="9" font-weight="800" fill="#065F46">1200</text>

    <line x1="447" y1="563" x2="430" y2="583" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="467" y1="563" x2="484" y2="583" stroke="#94A3B8" stroke-width="1.5"/>
  </g>

  <!-- WORKER 2 (ENGLISH SCOPE) -->
  <g>
    <rect x="610" y="285" width="510" height="360" rx="10" fill="#F8FAFC" stroke="#16A34A" stroke-width="2"/>
    
    <!-- Header -->
    <rect x="610" y="285" width="510" height="35" rx="10" fill="#DCFCE7"/>
    <text x="625" y="308" font-size="13" font-weight="800" fill="#15803D">WORKER 2</text>
    <text x="1105" y="308" text-anchor="end" font-size="11" font-weight="700" fill="#16A34A">Scope: metric=song_plays | country=GLOBAL | language=en</text>

    <!-- Ring Buffer -->
    <rect x="630" y="335" width="470" height="135" rx="8" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5"/>
    <text x="645" y="355" font-size="12" font-weight="700" fill="#15803D">Ring Buffer (Isolated Scope State)</text>

    <rect x="645" y="370" width="80" height="55" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="685" y="390" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">10:00</text>
    <text x="685" y="412" text-anchor="middle" font-size="9" fill="#94A3B8">[EXPIRED]</text>

    <rect x="735" y="370" width="80" height="55" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="775" y="390" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">10:01</text>
    <text x="775" y="412" text-anchor="middle" font-size="9" fill="#475569">410 plays</text>

    <rect x="825" y="370" width="80" height="55" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="865" y="390" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">10:02</text>
    <text x="865" y="412" text-anchor="middle" font-size="9" fill="#475569">520 plays</text>

    <rect x="915" y="370" width="80" height="55" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="955" y="390" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">10:03</text>
    <text x="955" y="412" text-anchor="middle" font-size="9" fill="#475569">610 plays</text>

    <!-- Active Bucket -->
    <rect x="1005" y="370" width="80" height="55" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
    <text x="1045" y="388" text-anchor="middle" font-size="10" font-weight="800" fill="#15803D">10:04</text>
    <text x="1045" y="403" text-anchor="middle" font-size="8" font-weight="700" fill="#16A34A">ACTIVE</text>
    <text x="1045" y="417" text-anchor="middle" font-size="8" fill="#15803D">song_9912: 540</text>

    <text x="645" y="452" font-size="10" font-family="monospace" fill="#15803D">Independent memory footprint — zero lock contention</text>

    <!-- Window Counts -->
    <rect x="630" y="485" width="225" height="140" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="645" y="508" font-size="12" font-weight="700" fill="#1E293B">window_counts Map</text>
    <text x="645" y="525" font-size="10" fill="#64748B">English Leaderboard Totals</text>
    <text x="645" y="550" font-size="11" font-family="monospace" fill="#0F172A">"song_9912" ──► 2450</text>
    <text x="645" y="570" font-size="11" font-family="monospace" fill="#0F172A">"song_1042" ──► 1890</text>
    <text x="645" y="590" font-size="11" font-family="monospace" fill="#0F172A">"song_3311" ──► 1120</text>

    <!-- Min Heap -->
    <rect x="875" y="485" width="225" height="140" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="890" y="508" font-size="12" font-weight="700" fill="#1E293B">Local Top-K Min-Heap</text>
    <text x="890" y="525" font-size="10" fill="#64748B">Top English Songs</text>

    <circle cx="987" cy="552" r="14" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="987" y="556" text-anchor="middle" font-size="9" font-weight="800" fill="#78350F">1120</text>

    <circle cx="950" cy="595" r="14" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <text x="950" y="599" text-anchor="middle" font-size="9" font-weight="800" fill="#065F46">1890</text>

    <circle cx="1024" cy="595" r="14" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <text x="1024" y="599" text-anchor="middle" font-size="9" font-weight="800" fill="#065F46">2450</text>

    <line x1="977" y1="563" x2="960" y2="583" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="997" y1="563" x2="1014" y2="583" stroke="#94A3B8" stroke-width="1.5"/>
  </g>

  <!-- Connectors from Kafka Layer 1 to Worker Layer 2 -->
  <path d="M 800 196 L 800 220 L 335 220 L 335 285" fill="none" stroke="#0284C7" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <path d="M 1000 196 L 1000 220 L 865 220 L 865 285" fill="none" stroke="#16A34A" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>

  <text x="440" y="215" font-size="10" font-weight="700" fill="#0284C7">Partition 1: Hindi Stream</text>
  <text x="940" y="215" font-size="10" font-weight="700" fill="#16A34A">Partition 2: English Stream</text>

  <!-- ================================================================= -->
  <!-- LAYER 3: MATERIALIZATION, CACHE, AND API CONSUMERS                -->
  <!-- ================================================================= -->
  <g filter="url(#shadow)">
    <rect x="50" y="700" width="1100" height="160" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="70" y="725" font-size="12" font-weight="700" fill="#64748B" letter-spacing="1">3. PUBLISH, CACHE &amp; READ PATH</text>

    <!-- Redis Cluster -->
    <rect x="360" y="745" width="480" height="90" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="380" y="770" font-size="13" font-weight="800" fill="#991B1B">Redis Cluster (Materialized Ranking Cache)</text>
    <text x="820" y="770" text-anchor="end" font-size="10" font-weight="700" fill="#EF4444">Sorted Sets (ZSET) or JSON Arrays</text>

    <!-- Cache Keys -->
    <rect x="380" y="785" width="210" height="38" rx="6" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1"/>
    <text x="390" y="800" font-size="9" font-weight="800" font-family="monospace" fill="#991B1B">ranking:song_plays:IN:hi:5m</text>
    <text x="390" y="814" font-size="9" fill="#7F1D1D">1. song_8472 (1200) | 2. song_1931 (950)</text>

    <rect x="610" y="785" width="210" height="38" rx="6" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1"/>
    <text x="620" y="800" font-size="9" font-weight="800" font-family="monospace" fill="#991B1B">ranking:song_plays:GLOBAL:en:5m</text>
    <text x="620" y="814" font-size="9" fill="#7F1D1D">1. song_9912 (2450) | 2. song_1042 (1890)</text>

    <!-- API Client / Readers -->
    <rect x="940" y="755" width="170" height="70" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <text x="1025" y="785" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Leaderboard API</text>
    <text x="1025" y="803" text-anchor="middle" font-size="11" fill="#64748B">GET /topk?scope=IN_hi</text>

    <!-- Safe Replay Metadata Box -->
    <rect x="80" y="745" width="230" height="90" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="95" y="768" font-size="11" font-weight="700" fill="#334155">Published Snapshot Metadata</text>
    <text x="95" y="788" font-size="9" font-family="monospace" fill="#475569">• partition_id &amp; epoch</text>
    <text x="95" y="803" font-size="9" font-family="monospace" fill="#475569">• input_offset / sequence</text>
    <text x="95" y="818" font-size="9" font-family="monospace" fill="#475569">• window_start / window_end</text>
  </g>

  <!-- Connectors from Workers to Redis -->
  <path d="M 335 645 L 335 675 L 480 675 L 480 745" fill="none" stroke="#0284C7" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 865 645 L 865 675 L 715 675 L 715 745" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow-green)"/>

  <text x="345" y="668" font-size="10" font-weight="700" fill="#0284C7">Publish Active Top-K</text>
  <text x="875" y="668" font-size="10" font-weight="700" fill="#16A34A">Publish Active Top-K</text>

  <!-- Connector from Redis to API -->
  <path d="M 840 790 L 932 790" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="886" y="782" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">O(1) Read</text>

</svg>
