<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%" style="background-color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>

    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- TITLE -->
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#0F172A">
    ARCHITECTURE 2: TWO-STAGE RE-KEYING (NETWORK SHUFFLE)
  </text>
  <text x="500" y="60" text-anchor="middle" font-size="12" font-weight="500" fill="#64748B">
    Decoupled Ingestion Log and Network Shuffle to Isolated Scope Aggregator Nodes
  </text>

  <!-- ================================================================= -->
  <!-- STEP 1: KAFKA TOPIC (INGESTION LOG)                               -->
  <!-- ================================================================= -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="180" height="420" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="40" y="100" width="180" height="36" rx="10" fill="#FEF3C7"/>
    <text x="130" y="123" text-anchor="middle" font-size="12" font-weight="800" fill="#78350F">KAFKA TOPIC</text>
    <text x="130" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">raw_ingestion_log</text>

    <!-- Partitions -->
    <rect x="55" y="170" width="150" height="65" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="65" y="190" font-size="10" font-weight="800" fill="#92400E">Partition 0</text>
    <text x="65" y="210" font-size="9" font-family="monospace" fill="#78350F">[IN_hi] [US_en]</text>

    <rect x="55" y="250" width="150" height="65" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="65" y="270" font-size="10" font-weight="800" fill="#92400E">Partition 1</text>
    <text x="65" y="290" font-size="9" font-family="monospace" fill="#78350F">[GLOBAL_en] [IN_hi]</text>

    <rect x="55" y="330" width="150" height="65" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="65" y="350" font-size="10" font-weight="800" fill="#92400E">Partition 2</text>
    <text x="65" y="370" font-size="9" font-family="monospace" fill="#78350F">[US_en] [GLOBAL_en]</text>

    <text x="130" y="430" text-anchor="middle" font-size="10" fill="#94A3B8">Stateless Ingestion</text>
    <text x="130" y="445" text-anchor="middle" font-size="10" fill="#94A3B8">No scope alignment</text>
  </g>

  <!-- ================================================================= -->
  <!-- STEP 2: STAGE 1 WORKERS (STATELESS PARSERS & ROUTERS)            -->
  <!-- ================================================================= -->
  <g filter="url(#shadow)">
    <rect x="270" y="100" width="190" height="420" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="270" y="100" width="190" height="36" rx="10" fill="#E0F2FE"/>
    <text x="365" y="123" text-anchor="middle" font-size="12" font-weight="800" fill="#0369A1">STAGE 1 WORKERS</text>
    <text x="365" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#0284C7">Stateless Routers</text>

    <!-- Node A -->
    <rect x="285" y="170" width="160" height="85" rx="6" fill="#F8FAFC" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="295" y="190" font-size="11" font-weight="800" fill="#1E3A8A">Ingestion Worker A</text>
    <text x="295" y="210" font-size="9" fill="#475569">• Parses JSON events</text>
    <text x="295" y="225" font-size="9" font-weight="700" font-family="monospace" fill="#2563EB">hash(metric, scope)</text>

    <!-- Node B -->
    <rect x="285" y="280" width="160" height="85" rx="6" fill="#F8FAFC" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="295" y="300" font-size="11" font-weight="800" fill="#1E3A8A">Ingestion Worker B</text>
    <text x="295" y="320" font-size="9" fill="#475569">• Parses JSON events</text>
    <text x="295" y="335" font-size="9" font-weight="700" font-family="monospace" fill="#2563EB">hash(metric, scope)</text>

    <text x="365" y="420" text-anchor="middle" font-size="10" fill="#64748B">Zero In-Memory State</text>
    <text x="365" y="435" text-anchor="middle" font-size="10" fill="#64748B">Scales with throughput</text>
  </g>

  <!-- Kafka to Stage 1 Connections -->
  <path d="M 205 202 L 285 202" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 205 282 L 285 312" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 205 362 L 285 332" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================================================================= -->
  <!-- STEP 3: NETWORK SHUFFLE LAYER                                     -->
  <!-- ================================================================= -->
  <g>
    <circle cx="530" cy="310" r="45" fill="#EEF2FF" stroke="#6366F1" stroke-width="2" stroke-dasharray="4,4" filter="url(#shadow)"/>
    <text x="530" y="303" text-anchor="middle" font-size="10" font-weight="800" fill="#3730A3">NETWORK</text>
    <text x="530" y="316" text-anchor="middle" font-size="10" font-weight="800" fill="#3730A3">SHUFFLE</text>
    <text x="530" y="330" text-anchor="middle" font-size="8" fill="#4338CA">(gRPC / TCP)</text>
  </g>

  <!-- Connections Stage 1 to Shuffle -->
  <path d="M 445 212 L 490 285" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M 445 322 L 488 322" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- ================================================================= -->
  <!-- STEP 4: STAGE 2 WORKERS (STATEFUL SCOPE AGGREGATORS)             -->
  <!-- ================================================================= -->
  <!-- Aggregator Node A -->
  <g filter="url(#shadow)">
    <rect x="610" y="100" width="350" height="195" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <rect x="610" y="100" width="350" height="32" rx="10" fill="#E0F2FE"/>
    <text x="625" y="121" font-size="12" font-weight="800" fill="#0369A1">STAGE 2: AGGREGATOR NODE A</text>
    <text x="945" y="121" text-anchor="end" font-size="10" font-weight="700" fill="#0284C7">Dedicated Scope: country=IN|lang=hi</text>

    <!-- Ring Buffer -->
    <rect x="625" y="145" width="200" height="60" rx="6" fill="#F8FAFC" stroke="#BAE6FD" stroke-width="1"/>
    <text x="635" y="162" font-size="10" font-weight="700" fill="#0369A1">Time Buckets (Ring Buffer)</text>
    <rect x="635" y="170" width="35" height="25" rx="3" fill="#E2E8F0"/><text x="652" y="186" text-anchor="middle" font-size="8" fill="#64748B">10:02</text>
    <rect x="675" y="170" width="35" height="25" rx="3" fill="#E2E8F0"/><text x="692" y="186" text-anchor="middle" font-size="8" fill="#64748B">10:03</text>
    <rect x="715" y="170" width="45" height="25" rx="3" fill="#E0F2FE" stroke="#0284C7"/><text x="737" y="186" text-anchor="middle" font-size="8" font-weight="800" fill="#0369A1">10:04</text>

    <!-- Heap -->
    <rect x="835" y="145" width="110" height="60" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="890" y="162" text-anchor="middle" font-size="10" font-weight="700" fill="#1E293B">Min-Heap</text>
    <circle cx="890" cy="183" r="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
    <text x="890" y="186" text-anchor="middle" font-size="8" font-weight="800" fill="#78350F">Top-K</text>

    <text x="625" y="222" font-size="9" font-family="monospace" fill="#0369A1">window_counts["song_8472"] = 1200</text>
    <text x="625" y="280" font-size="10" font-weight="700" fill="#0284C7">100% Isolated State — No locks or external key contention</text>
  </g>

  <!-- Aggregator Node B -->
  <g filter="url(#shadow)">
    <rect x="610" y="325" width="350" height="195" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
    <rect x="610" y="325" width="350" height="32" rx="10" fill="#FEE2E2"/>
    <text x="625" y="346" font-size="12" font-weight="800" fill="#991B1B">STAGE 2: AGGREGATOR NODE B</text>
    <text x="945" y="346" text-anchor="end" font-size="10" font-weight="700" fill="#DC2626">Dedicated Scope: country=GLOBAL|lang=en</text>

    <!-- Ring Buffer -->
    <rect x="625" y="370" width="200" height="60" rx="6" fill="#F8FAFC" stroke="#FCA5A5" stroke-width="1"/>
    <text x="635" y="387" font-size="10" font-weight="700" fill="#991B1B">Time Buckets (Ring Buffer)</text>
    <rect x="635" y="395" width="35" height="25" rx="3" fill="#E2E8F0"/><text x="652" y="411" text-anchor="middle" font-size="8" fill="#64748B">10:02</text>
    <rect x="675" y="395" width="35" height="25" rx="3" fill="#E2E8F0"/><text x="692" y="411" text-anchor="middle" font-size="8" fill="#64748B">10:03</text>
    <rect x="715" y="395" width="45" height="25" rx="3" fill="#FEE2E2" stroke="#DC2626"/><text x="737" y="411" text-anchor="middle" font-size="8" font-weight="800" fill="#991B1B">10:04</text>

    <!-- Heap -->
    <rect x="835" y="370" width="110" height="60" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="890" y="387" text-anchor="middle" font-size="10" font-weight="700" fill="#1E293B">Min-Heap</text>
    <circle cx="890" cy="408" r="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
    <text x="890" y="411" text-anchor="middle" font-size="8" font-weight="800" fill="#78350F">Top-K</text>

    <text x="625" y="447" font-size="9" font-family="monospace" fill="#991B1B">window_counts["song_9912"] = 2450</text>
    <text x="625" y="505" font-size="10" font-weight="700" fill="#DC2626">Scales memory independently from Kafka partition count</text>
  </g>

  <!-- Connections Shuffle to Stage 2 -->
  <path d="M 572 295 L 610 210" stroke="#0284C7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M 572 325 L 610 410" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

</svg>
