<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" role="img">
  <title>Ranking publication commit protocol</title>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <path d="M0 0L10 3L0 6Z" fill="#55728f"/>
    </marker>
  </defs>
  <style>
    .title{font:700 26px sans-serif;fill:#17324d}
    .h{font:700 16px sans-serif;fill:#17324d}
    .b{font:14px sans-serif;fill:#45627d}
    .c{font:13px monospace;fill:#17324d}
    .line{stroke:#55728f;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <rect width="1200" height="610" rx="24" fill="#f7fafc"/>
  <text x="600" y="46" text-anchor="middle" class="title">Publishing uses an immutable version and one atomic visibility step</text>

  <rect x="70" y="180" width="160" height="95" rx="18" fill="#fff8e7" stroke="#d6a63f"/>
  <text x="150" y="218" text-anchor="middle" class="h">Reducer</text>
  <text x="150" y="248" text-anchor="middle" class="b">build top K</text>
  <path d="M230 228H320" class="line"/>

  <rect x="320" y="155" width="210" height="145" rx="20" fill="#ffffff" stroke="#c7d5e2"/>
  <text x="425" y="195" text-anchor="middle" class="h">1. Write version</text>
  <text x="425" y="230" text-anchor="middle" class="c">ranking:scope:v42</text>
  <text x="425" y="260" text-anchor="middle" class="b">items + metadata</text>
  <path d="M530 228H620" class="line"/>

  <rect x="620" y="155" width="210" height="145" rx="20" fill="#edf8f6" stroke="#5ab5a4"/>
  <text x="725" y="195" text-anchor="middle" class="h">2. Verify</text>
  <text x="725" y="230" text-anchor="middle" class="b">K items present</text>
  <text x="725" y="260" text-anchor="middle" class="b">watermark, inputs</text>
  <path d="M830 228H920" class="line"/>

  <rect x="920" y="155" width="210" height="145" rx="20" fill="#17324d"/>
  <text x="1025" y="195" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">3. Move latest</text>
  <text x="1025" y="230" text-anchor="middle" font-family="monospace" font-size="13" fill="#fff">latest -> v42</text>
  <text x="1025" y="260" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#bfd2e3">atomic compare-set</text>

  <rect x="320" y="405" width="210" height="85" rx="18" fill="#fff1f1" stroke="#dd7777"/>
  <text x="425" y="440" text-anchor="middle" class="h">Crash before latest</text>
  <text x="425" y="468" text-anchor="middle" class="b">readers still see v41</text>
  <rect x="920" y="405" width="210" height="85" rx="18" fill="#eef4ff" stroke="#7399dc"/>
  <text x="1025" y="440" text-anchor="middle" class="h">Crash after latest</text>
  <text x="1025" y="468" text-anchor="middle" class="b">readers see complete v42</text>
</svg>
