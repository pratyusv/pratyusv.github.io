<title id="title">Merge local Top-2 lists into the global Top-2</title><desc id="description">Partitions 0, 1, and 2 send their Top-2 lists. song_707=10, song_808=9, and song_909=8 are omitted. The merger ranks six candidates and returns song_303=790 and song_101=600.</desc>
