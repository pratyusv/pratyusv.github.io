<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" role="img" aria-labelledby="title description">
<title id="title">Group local results by the exact window endpoint</title><desc id="description">Partition 0 and partition 2 have results ending at 10:05, while partition 1 has sent a result ending at 10:06. The merger keeps separate groups and waits for partition 1 at 10:05 rather than mixing the windows.</desc>
<defs><marker id="normal" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8b9bb0"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c74747"/></marker></defs>
<rect width="1000" height="710" rx="20" fill="#f8fafc"/>
<path d="M340 192H440" fill="none" stroke="#8b9bb0" stroke-width="2.5" marker-end="url(#normal)"/>
<path d="M340 342H440" fill="none" stroke="#8b9bb0" stroke-width="2.5" marker-end="url(#normal)"/>
<path d="M340 492H440" fill="none" stroke="#8b9bb0" stroke-width="2.5" marker-end="url(#normal)"/>
<text x="40" y="48" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#172b4d">Group local results by the exact window endpoint</text>
<text x="40" y="84" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#52647b">One endpoint needs a result from every expected partition.</text>
<rect x="40" y="135" width="300" height="115" rx="14" fill="#eaf2ff" stroke="#d2dce8" stroke-width="1.5"/>
<text x="60" y="172" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Partition 0 result</text>
<text x="60" y="211" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">window_end = 10:05</text>
<rect x="40" y="285" width="300" height="115" rx="14" fill="#eaf2ff" stroke="#d2dce8" stroke-width="1.5"/>
<text x="60" y="322" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Partition 2 result</text>
<text x="60" y="361" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">window_end = 10:05</text>
<rect x="40" y="435" width="300" height="115" rx="14" fill="#f0eaff" stroke="#d2dce8" stroke-width="1.5"/>
<text x="60" y="472" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Partition 1 result</text>
<text x="60" y="511" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">window_end = 10:06</text>
<rect x="440" y="125" width="520" height="265" rx="14" fill="#fff4d9" stroke="#d2dce8" stroke-width="1.5"/>
<text x="460" y="162" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Group: window ending 10:05</text>
<text x="460" y="201" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Partition 0: received</text>
<text x="460" y="233" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Partition 2: received</text>
<text x="460" y="265" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Partition 1: waiting</text>
<rect x="440" y="425" width="520" height="170" rx="14" fill="#f0eaff" stroke="#d2dce8" stroke-width="1.5"/>
<text x="460" y="462" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Group: window ending 10:06</text>
<text x="460" y="501" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Partition 1: received</text>
<text x="460" y="533" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Partitions 0 and 2: waiting</text>
<rect x="40" y="620" width="920" height="58" rx="14" fill="#edf1f6" stroke="#d2dce8" stroke-width="1.5"/>
<text x="500" y="656" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#172b4d">Keep serving the last complete ranking while a required result is missing.</text>
</svg>
