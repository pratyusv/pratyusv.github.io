<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1190" viewBox="0 0 1000 1190" role="img" aria-labelledby="title description">
<title id="title">Expanded architecture for high traffic and recovery</title><desc id="description">Raw Kafka records feed input workers that deduplicate and aggregate plays by song and second. Counting workers maintain window state. Ordinary local Top-K lists flow through a summary topic, while registered hot-song partials flow through combiners. Both paths reach the global merger, then Redis and the Query API. A coordinator manages ownership and versions, and durable checkpoints support replay.</desc>
