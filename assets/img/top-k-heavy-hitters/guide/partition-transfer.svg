<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title description">
<title id="title">Add a worker by transferring one partition</title><desc id="description">Before a transfer Worker 1 owns partitions 0 and 1 and Worker 2 owns partition 2. After state transfer Worker 3 owns partition 1. Its counts, buckets, ranking index, and input position move together.</desc>
<defs><marker id="normal" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8b9bb0"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c74747"/></marker></defs>
<rect width="1000" height="700" rx="20" fill="#f8fafc"/>
<path d="M420 280H490V480H565" fill="none" stroke="#8b9bb0" stroke-width="2.5" marker-end="url(#normal)"/>
<text x="40" y="48" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#172b4d">Add a worker by transferring one partition</text>
<text x="40" y="84" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#52647b">Partition 1 keeps its ID and song membership.</text>
<text x="40" y="132" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#172b4d">BEFORE</text>
<text x="565" y="132" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#172b4d">AFTER</text>
<rect x="40" y="155" width="380" height="165" rx="14" fill="#eaf2ff" stroke="#d2dce8" stroke-width="1.5"/>
<text x="60" y="192" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Worker 1</text>
<text x="60" y="231" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Partition 0</text>
<text x="60" y="263" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Partition 1  ← move this group</text>
<rect x="40" y="350" width="380" height="110" rx="14" fill="#eaf2ff" stroke="#d2dce8" stroke-width="1.5"/>
<text x="60" y="387" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Worker 2</text>
<text x="60" y="426" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Partition 2</text>
<rect x="565" y="155" width="395" height="110" rx="14" fill="#eaf2ff" stroke="#d2dce8" stroke-width="1.5"/>
<text x="585" y="192" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Worker 1</text>
<text x="585" y="231" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Partition 0</text>
<rect x="565" y="290" width="395" height="110" rx="14" fill="#eaf2ff" stroke="#d2dce8" stroke-width="1.5"/>
<text x="585" y="327" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Worker 2</text>
<text x="585" y="366" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Partition 2</text>
<rect x="565" y="425" width="395" height="110" rx="14" fill="#e5f6f0" stroke="#d2dce8" stroke-width="1.5"/>
<text x="585" y="462" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Worker 3</text>
<text x="585" y="501" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Partition 1</text>
<rect x="40" y="570" width="920" height="58" rx="14" fill="#eaf2ff" stroke="#d2dce8" stroke-width="1.5"/>
<text x="500" y="606" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#172b4d">Transfer counts + buckets + index + input progress, then switch the assignment.</text>
<text x="40" y="676" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#52647b">A coordinated handoff keeps one active counting owner for the transferred group.</text>
</svg>
