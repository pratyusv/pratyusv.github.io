<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="title description">
<title id="title">The counting path and the query path</title><desc id="description">Playback records flow from the playback service through Kafka and counting workers to a merger and Redis. The Query API reads Redis. Workers and the merger save checkpoints for recovery.</desc>
<defs><marker id="normal" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8b9bb0"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c74747"/></marker></defs>
<rect width="1000" height="790" rx="20" fill="#f8fafc"/>
<path d="M300 202H370" fill="none" stroke="#8b9bb0" stroke-width="2.5" marker-end="url(#normal)"/>
<path d="M630 202H700" fill="none" stroke="#8b9bb0" stroke-width="2.5" marker-end="url(#normal)"/>
<path d="M830 275V330H500V385" fill="none" stroke="#8b9bb0" stroke-width="2.5" marker-end="url(#normal)"/>
<path d="M630 457H700" fill="none" stroke="#8b9bb0" stroke-width="2.5" marker-end="url(#normal)"/>
<path d="M750 275V300H335V350H170V385" fill="none" stroke="#8b9bb0" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M370 490H300" fill="none" stroke="#8b9bb0" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M830 530V615" fill="none" stroke="#8b9bb0" stroke-width="2.5" marker-end="url(#normal)"/>
<text x="40" y="48" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#172b4d">The counting path and the query path</text>
<text x="40" y="84" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#52647b">Workers process every play; queries read one completed result.</text>
<rect x="40" y="130" width="260" height="145" rx="14" fill="#eaf2ff" stroke="#d2dce8" stroke-width="1.5"/>
<text x="60" y="167" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Playback service</text>
<text x="60" y="206" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">One record per play</text>
<text x="60" y="238" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Stable event IDs</text>
<rect x="370" y="130" width="260" height="145" rx="14" fill="#eaf2ff" stroke="#d2dce8" stroke-width="1.5"/>
<text x="390" y="167" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Kafka</text>
<text x="390" y="206" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Retained records</text>
<text x="390" y="238" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Replay after a crash</text>
<rect x="700" y="130" width="260" height="145" rx="14" fill="#e5f6f0" stroke="#d2dce8" stroke-width="1.5"/>
<text x="720" y="167" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Counting workers</text>
<text x="720" y="206" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Buckets and counts</text>
<text x="720" y="238" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Local Top-K lists</text>
<text x="540" y="319" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#52647b">Local rankings for named windows</text>
<rect x="370" y="385" width="260" height="145" rx="14" fill="#fff4d9" stroke="#d2dce8" stroke-width="1.5"/>
<text x="390" y="422" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Merger</text>
<text x="390" y="461" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#172b4d">Wait for all partitions</text>
<text x="390" y="493" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Select global Top-K</text>
<rect x="700" y="385" width="260" height="145" rx="14" fill="#f0eaff" stroke="#d2dce8" stroke-width="1.5"/>
<text x="720" y="422" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Redis</text>
<text x="720" y="461" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Complete ranking</text>
<text x="720" y="493" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Counts + timestamps</text>
<rect x="40" y="385" width="260" height="145" rx="14" fill="#edf1f6" stroke="#d2dce8" stroke-width="1.5"/>
<text x="60" y="422" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Checkpoints</text>
<text x="60" y="461" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#172b4d">Counts + input offsets</text>
<text x="60" y="493" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#172b4d">Durable recovery copy</text>
<rect x="700" y="615" width="260" height="110" rx="14" fill="#eaf2ff" stroke="#d2dce8" stroke-width="1.5"/>
<text x="720" y="652" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Query API</text>
<text x="720" y="691" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Read completed list</text>
<text x="848" y="578" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#52647b">Read</text>
<rect x="40" y="615" width="590" height="110" rx="14" fill="#edf1f6" stroke="#d2dce8" stroke-width="1.5"/>
<text x="60" y="652" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Coordinator</text>
<text x="60" y="691" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Partition assignments, worker epochs, and definitions</text>
<text x="40" y="766" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#52647b">Solid arrows carry records or results. Dashed lines show recovery snapshots.</text>
</svg>
