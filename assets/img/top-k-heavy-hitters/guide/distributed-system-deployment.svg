<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1030" viewBox="0 0 1000 1030" role="img" aria-labelledby="title description">
<title id="title">Deployment: three partitions and two counting workers</title><desc id="description">Kafka partitions 0 and 1 are assigned to Worker 1; Kafka partition 2 is assigned to Worker 2. Each worker maintains separate counting state for its partitions and sends local lists to a retained summary topic. A merger waits for partitions 0, 1, and 2 and publishes song_303=790 and song_101=600 to Redis for the Query API.</desc>
