<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="950" viewBox="0 0 1000 950" role="img" aria-labelledby="title description">
<title id="title">End-to-end components of the Top-K service</title><desc id="description">The playback service sends records to an ingestion API, which validates them and writes them to Kafka. Counting workers consume Kafka partitions and write local Top-K results to a summary topic. Merger workers build complete global rankings in Redis. Query API instances return those rankings to readers.</desc>
