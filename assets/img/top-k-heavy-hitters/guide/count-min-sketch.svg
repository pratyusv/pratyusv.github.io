<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title description">
<title id="title">Estimate a known song with Count-Min Sketch</title><desc id="description">For song_101 with true count ten, the three hash rows select counters 13, 10, and 12. Their minimum is ten. Other songs can collide with the selected counters and cause overestimation.</desc>
