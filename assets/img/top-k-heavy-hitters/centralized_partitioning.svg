<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%" style="background-color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>

    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- TITLE -->
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#0F172A">
    METHOD 2: CENTRALIZED CONTROL PLANE &amp; PARTITION ASSIGNMENTS
  </text>
  <text x="500" y="60" text-anchor="middle" font-size="12" font-weight="500" fill="#64748B">
    Deterministic scope routing via a central manager publishing explicit partition tables to worker caches
  </text>

  <!-- ================================================================= -->
  <!-- TOP: CENTRAL CONTROL PLANE / CLUSTER MANAGER                      -->
  <!-- ================================================================= -->
  <g filter="url(#shadow)">
    <rect x="250" y="85" width="500" height="100" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="250" y="85" width="500" height="28" rx="10" fill="#F3E8FF"/>
    <text x="500" y="104" text-anchor="middle" font-size="11" font-weight="800" fill="#5B21B6">CENTRAL CONTROL PLANE / CLUSTER MANAGER (e.g. Helix / K8s Operator)</text>
    
    <!-- Inner Table Representation -->
    <rect x="270" y="122" width="460" height="50" rx="6" fill="#F8FAFC" stroke="#DDD6FE"/>
    <text x="500" y="140" text-anchor="middle" font-size="10" font-weight="700" fill="#6D28D9">Master Partition Assignment Table (Fixed 1024 Virtual Partitions)</text>
    <text x="500" y="158" text-anchor="middle" font-size="9" font-family="monospace" fill="#4C1D95">
      Partitions [0..340] ➔ Node A  |  Partitions [341..682] ➔ Node B  |  Partitions [683..1023] ➔ Node C
    </text>
  </g>

  <!-- ================================================================= -->
  <!-- LEFT: STAGE 1 INGESTION WORKERS                                   -->
  <!-- ================================================================= -->
  <g filter="url(#shadow)">
    <rect x="40" y="220" width="280" height="300" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="40" y="220" width="280" height="32" rx="10" fill="#E0F2FE"/>
    <text x="180" y="241" text-anchor="middle" font-size="11" font-weight="800" fill="#0369A1">STAGE 1 INGESTION WORKERS</text>

    <!-- Worker 1 -->
    <rect x="55" y="265" width="250" height="115" rx="6" fill="#F8FAFC" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="65" y="285" font-size="11" font-weight="800" fill="#1E3A8A">Ingestion Worker 1</text>
    <text x="65" y="303" font-size="8" font-family="monospace" fill="#0369A1">1. partition_id = hash(scope) % 1024</text>
    <text x="65" y="318" font-size="8" font-family="monospace" fill="#0369A1">2. target_node = CachedTable[partition_id]</text>
    
    <rect x="65" y="328" width="230" height="40" rx="4" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="75" y="343" font-size="8" font-weight="700" fill="#1D4ED8">Local Cached Routing Table (v4)</text>
    <text x="75" y="358" font-size="8" font-family="monospace" fill="#1E40AF">P_42 ➔ Node A | P_512 ➔ Node B</text>

    <!-- Worker 2 -->
    <rect x="55" y="390" width="250" height="115" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
    <text x="65" y="410" font-size="11" font-weight="800" fill="#334155">Ingestion Worker 2</text>
    <text x="65" y="428" font-size="8" font-family="monospace" fill="#475569">1. partition_id = hash(scope) % 1024</text>
    <text x="65" y="443" font-size="8" font-family="monospace" fill="#475569">2. target_node = CachedTable[partition_id]</text>
    
    <rect x="65" y="453" width="230" height="40" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="75" y="468" font-size="8" font-weight="700" fill="#475569">Local Cached Routing Table (v4)</text>
    <text x="75" y="483" font-size="8" font-family="monospace" fill="#64748B">P_42 ➔ Node A | P_512 ➔ Node B</text>
  </g>

  <!-- Control Plane to Stage 1 Push -->
  <path d="M 330 185 L 180 220" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-purple)"/>
  <text x="210" y="195" font-size="8" font-weight="700" fill="#6D28D9">1. Push Table Updates</text>

  <!-- ================================================================= -->
  <!-- CENTER: EVENT ROUTING EXECUTION STEP                             -->
  <!-- ================================================================= -->
  <g filter="url(#shadow)">
    <rect x="360" y="280" width="280" height="180" rx="10" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
    <rect x="360" y="280" width="280" height="28" rx="10" fill="#EEF2FF"/>
    <text x="500" y="298" text-anchor="middle" font-size="10" font-weight="800" fill="#3730A3">ROUTING EXECUTION WALKTHROUGH</text>

    <text x="375" y="325" font-size="9" font-weight="800" fill="#1E1B4B">Incoming Event: scope = "country=IN|lang=hi"</text>
    <text x="375" y="345" font-size="8" font-family="monospace" fill="#4338CA">hash("country=IN|lang=hi") % 1024 = 42</text>
    
    <path d="M 375 355 L 625 355" stroke="#E0E7FF" stroke-width="1"/>

    <text x="375" y="375" font-size="9" font-weight="800" fill="#1E1B4B">Cached Table Lookup:</text>
    <text x="375" y="395" font-size="8" font-family="monospace" fill="#4338CA">Partition 42 ➔ Assigned to Aggregator Node A</text>

    <path d="M 375 405 L 625 405" stroke="#E0E7FF" stroke-width="1"/>

    <text x="375" y="425" font-size="8" font-weight="700" fill="#16A34A">➔ Direct Dispatch over Persistent TCP Pool</text>
    <text x="375" y="440" font-size="8" fill="#64748B">Zero inter-worker communication needed</text>
  </g>

  <!-- Route from Stage 1 to Execution Box -->
  <path d="M 305 328 L 360 328" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- ================================================================= -->
  <!-- RIGHT: STAGE 2 SCOPE AGGREGATORS                                 -->
  <!-- ================================================================= -->
  <g filter="url(#shadow)">
    <rect x="680" y="220" width="280" height="300" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="680" y="220" width="280" height="32" rx="10" fill="#FEF3C7"/>
    <text x="820" y="241" text-anchor="middle" font-size="11" font-weight="800" fill="#78350F">STAGE 2 SCOPE AGGREGATORS</text>

    <!-- Node A -->
    <rect x="695" y="265" width="250" height="70" rx="6" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.5"/>
    <text x="705" y="285" font-size="11" font-weight="800" fill="#1E40AF">Aggregator Node A</text>
    <text x="705" y="303" font-size="8" font-family="monospace" fill="#1E3A8A">Assigned Partitions: [0 .. 340]</text>
    <text x="705" y="320" font-size="8" font-weight="700" fill="#16A34A">• Owns Partition 42 (country=IN|lang=hi)</text>

    <!-- Node B -->
    <rect x="695" y="345" width="250" height="70" rx="6" fill="#F8FAFC" stroke="#16A34A" stroke-width="1.5"/>
    <text x="705" y="365" font-size="11" font-weight="800" fill="#15803D">Aggregator Node B</text>
    <text x="705" y="383" font-size="8" font-family="monospace" fill="#166534">Assigned Partitions: [341 .. 682]</text>
    <text x="705" y="400" font-size="8" fill="#475569">• Owns Partition 512 (country=US|lang=en)</text>

    <!-- Node C -->
    <rect x="695" y="425" width="250" height="70" rx="6" fill="#F8FAFC" stroke="#DC2626" stroke-width="1.5"/>
    <text x="705" y="445" font-size="11" font-weight="800" fill="#991B1B">Aggregator Node C</text>
    <text x="705" y="463" font-size="8" font-family="monospace" fill="#991B1B">Assigned Partitions: [683 .. 1023]</text>
    <text x="705" y="480" font-size="8" fill="#475569">• Owns Partition 800 (country=BR|lang=pt)</text>
  </g>

  <!-- Control Plane to Stage 2 Assignment -->
  <path d="M 670 185 L 820 220" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-purple)"/>
  <text x="730" y="195" font-size="8" font-weight="700" fill="#6D28D9">2. Assign Partitions</text>

  <!-- Dispatch Route from Execution Box to Aggregator A -->
  <path d="M 640 365 L 695 300" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

</svg>
