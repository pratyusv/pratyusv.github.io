<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" role="img">
  <title>Distributed Top-K write path and read path</title>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <path d="M0 0L10 3L0 6Z" fill="#55728f"/>
    </marker>
  </defs>
  <style>
    .title{font:700 26px sans-serif;fill:#17324d}
    .h{font:700 16px sans-serif;fill:#17324d}
    .b{font:14px sans-serif;fill:#45627d}
    .c{font:13px monospace;fill:#17324d}
    .line{stroke:#55728f;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <rect width="1200" height="650" rx="24" fill="#f7fafc"/>
  <text x="600" y="46" text-anchor="middle" class="title">Distributed shape: partitioned writes, materialized reads</text>

  <rect x="50" y="135" width="150" height="95" rx="16" fill="#eef4ff" stroke="#7399dc"/>
  <text x="125" y="173" text-anchor="middle" class="h">Ingest</text>
  <text x="125" y="202" text-anchor="middle" class="b">validate events</text>
  <path d="M200 183H265" class="line"/>

  <rect x="265" y="110" width="185" height="145" rx="18" fill="#17324d"/>
  <text x="358" y="150" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">Durable log</text>
  <text x="358" y="183" text-anchor="middle" font-family="monospace" font-size="13" fill="#fff">p0 p1 p2 ... pn</text>
  <text x="358" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#bfd2e3">ordered replay</text>

  <path d="M450 183H520" class="line"/>
  <rect x="520" y="70" width="210" height="225" rx="20" fill="#edf8f6" stroke="#5ab5a4"/>
  <text x="625" y="110" text-anchor="middle" class="h">Stateful workers</text>
  <text x="625" y="145" text-anchor="middle" class="b">partition ownership</text>
  <text x="625" y="174" text-anchor="middle" class="b">buckets and counts</text>
  <text x="625" y="203" text-anchor="middle" class="b">local Top-K</text>
  <text x="625" y="250" text-anchor="middle" class="c">checkpointed</text>

  <path d="M730 183H800" class="line"/>
  <rect x="800" y="105" width="165" height="155" rx="18" fill="#fff8e7" stroke="#d6a63f"/>
  <text x="883" y="146" text-anchor="middle" class="h">Reducers</text>
  <text x="883" y="178" text-anchor="middle" class="b">merge summaries</text>
  <text x="883" y="207" text-anchor="middle" class="b">publish versions</text>

  <path d="M965 183H1035" class="line"/>
  <rect x="1035" y="120" width="125" height="125" rx="18" fill="#ffffff" stroke="#c7d5e2"/>
  <text x="1098" y="162" text-anchor="middle" class="h">Rank store</text>
  <text x="1098" y="193" text-anchor="middle" class="b">latest</text>
  <text x="1098" y="220" text-anchor="middle" class="b">versions</text>

  <rect x="520" y="390" width="210" height="105" rx="18" fill="#ffffff" stroke="#c7d5e2"/>
  <text x="625" y="430" text-anchor="middle" class="h">Checkpoint store</text>
  <text x="625" y="462" text-anchor="middle" class="b">state plus offsets</text>
  <path d="M625 295V390" class="line"/>

  <rect x="1035" y="390" width="125" height="105" rx="18" fill="#eef4ff" stroke="#7399dc"/>
  <text x="1098" y="430" text-anchor="middle" class="h">Query API</text>
  <text x="1098" y="462" text-anchor="middle" class="b">read latest</text>
  <path d="M1098 245V390" class="line"/>

  <text x="355" y="555" text-anchor="middle" class="b">write path: events, state, summaries</text>
  <text x="925" y="555" text-anchor="middle" class="b">read path: complete ranking snapshots</text>
</svg>
