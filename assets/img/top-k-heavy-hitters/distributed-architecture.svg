<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" role="img">
  <title>Detailed real-time Top-K system architecture</title>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <path d="M0 0L10 3L0 6Z" fill="#55728f"/>
    </marker>
  </defs>
  <style>
    .title{font:700 28px sans-serif;fill:#17324d}
    .lane{font:700 15px sans-serif;fill:#61778d}
    .h{font:700 16px sans-serif;fill:#17324d}
    .b{font:14px sans-serif;fill:#45627d}
    .c{font:13px monospace;fill:#17324d}
    .w{font:13px sans-serif;fill:#ffffff}
    .wc{font:13px monospace;fill:#ffffff}
    .line{stroke:#55728f;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .dash{stroke:#55728f;stroke-width:3;stroke-dasharray:7 7;fill:none;marker-end:url(#arrow)}
  </style>
  <rect width="1400" height="820" rx="24" fill="#f7fafc"/>
  <text x="700" y="45" text-anchor="middle" class="title">Real-time Top-K Heavy Hitters Architecture</text>

  <rect x="40" y="80" width="1320" height="205" rx="22" fill="#ffffff" stroke="#d5e0ea"/>
  <text x="65" y="112" class="lane">Write path: accept events and place them in a durable message queue topic</text>

  <rect x="75" y="145" width="160" height="85" rx="16" fill="#eef4ff" stroke="#7399dc"/>
  <text x="155" y="178" text-anchor="middle" class="h">Producers</text>
  <text x="155" y="207" text-anchor="middle" class="b">clients / services</text>

  <path d="M235 188H300" class="line"/>
  <rect x="300" y="145" width="120" height="85" rx="16" fill="#ffffff" stroke="#c7d5e2"/>
  <text x="360" y="178" text-anchor="middle" class="h">LB</text>
  <text x="360" y="207" text-anchor="middle" class="b">HTTP / gRPC</text>

  <path d="M420 188H495" class="line"/>
  <rect x="495" y="125" width="210" height="125" rx="18" fill="#edf8f6" stroke="#5ab5a4"/>
  <text x="600" y="158" text-anchor="middle" class="h">Ingestion API fleet</text>
  <text x="600" y="187" text-anchor="middle" class="b">stateless web servers</text>
  <text x="600" y="216" text-anchor="middle" class="c">validate, normalize</text>

  <path d="M705 188H785" class="line"/>
  <rect x="785" y="115" width="230" height="145" rx="20" fill="#17324d"/>
  <text x="900" y="153" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">Message queue topic</text>
  <text x="900" y="184" text-anchor="middle" class="wc">song_play_events</text>
  <text x="900" y="214" text-anchor="middle" class="wc">p0 p1 p2 ... pn</text>
  <text x="900" y="238" text-anchor="middle" class="w">Kafka / Kinesis / Pub/Sub</text>

  <path d="M1015 188H1090" class="line"/>
  <rect x="1090" y="125" width="210" height="125" rx="18" fill="#fff8e7" stroke="#d6a63f"/>
  <text x="1195" y="158" text-anchor="middle" class="h">Raw event archive</text>
  <text x="1195" y="187" text-anchor="middle" class="b">object storage</text>
  <text x="1195" y="216" text-anchor="middle" class="c">audit, rebuild</text>

  <rect x="40" y="325" width="1320" height="245" rx="22" fill="#ffffff" stroke="#d5e0ea"/>
  <text x="65" y="357" class="lane">Aggregation path: long-running workers maintain state and publish summaries</text>

  <path d="M900 260V360" class="line"/>
  <rect x="120" y="405" width="230" height="120" rx="18" fill="#edf8f6" stroke="#5ab5a4"/>
  <text x="235" y="438" text-anchor="middle" class="h">Stream workers</text>
  <text x="235" y="467" text-anchor="middle" class="b">ECS / K8s / Flink</text>
  <text x="235" y="495" text-anchor="middle" class="c">p0,p1 owners</text>

  <rect x="405" y="405" width="230" height="120" rx="18" fill="#edf8f6" stroke="#5ab5a4"/>
  <text x="520" y="438" text-anchor="middle" class="h">Stream workers</text>
  <text x="520" y="467" text-anchor="middle" class="b">Kafka Streams / VMs</text>
  <text x="520" y="495" text-anchor="middle" class="c">p2,p3 owners</text>

  <rect x="690" y="405" width="230" height="120" rx="18" fill="#edf8f6" stroke="#5ab5a4"/>
  <text x="805" y="438" text-anchor="middle" class="h">Stream workers</text>
  <text x="805" y="467" text-anchor="middle" class="b">stateful consumers</text>
  <text x="805" y="495" text-anchor="middle" class="c">buckets, counts, Top-K</text>

  <path d="M350 465H405" class="line"/>
  <path d="M635 465H690" class="line"/>
  <path d="M920 465H995" class="line"/>
  <rect x="995" y="390" width="245" height="150" rx="20" fill="#fff8e7" stroke="#d6a63f"/>
  <text x="1118" y="429" text-anchor="middle" class="h">Reducer fleet</text>
  <text x="1118" y="459" text-anchor="middle" class="b">long-running workers</text>
  <text x="1118" y="488" text-anchor="middle" class="c">merge local summaries</text>
  <text x="1118" y="516" text-anchor="middle" class="c">publish ranking versions</text>

  <path d="M900 260L805 405" class="line"/>
  <path d="M900 260L520 405" class="line"/>
  <path d="M900 260L235 405" class="line"/>

  <rect x="40" y="610" width="1320" height="155" rx="22" fill="#ffffff" stroke="#d5e0ea"/>
  <text x="65" y="642" class="lane">Serving and recovery paths: serve snapshots, restore state, and validate history</text>

  <path d="M1118 540V625" class="line"/>
  <rect x="965" y="625" width="220" height="95" rx="18" fill="#17324d"/>
  <text x="1075" y="660" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">Ranking store</text>
  <text x="1075" y="690" text-anchor="middle" class="wc">latest pointer + versions</text>

  <path d="M965 672H865" class="line"/>
  <rect x="690" y="625" width="175" height="95" rx="18" fill="#eef4ff" stroke="#7399dc"/>
  <text x="778" y="660" text-anchor="middle" class="h">Query API fleet</text>
  <text x="778" y="690" text-anchor="middle" class="b">stateless reads</text>

  <path d="M690 672H590" class="line"/>
  <rect x="425" y="625" width="165" height="95" rx="18" fill="#ffffff" stroke="#c7d5e2"/>
  <text x="508" y="660" text-anchor="middle" class="h">Readers</text>
  <text x="508" y="690" text-anchor="middle" class="b">dashboard / product</text>

  <rect x="120" y="625" width="220" height="95" rx="18" fill="#ffffff" stroke="#c7d5e2"/>
  <text x="230" y="660" text-anchor="middle" class="h">Checkpoint store</text>
  <text x="230" y="690" text-anchor="middle" class="c">state + offsets + epoch</text>
  <path d="M230 625L235 525" class="dash"/>
  <path d="M230 625L520 525" class="dash"/>
  <path d="M230 625L805 525" class="dash"/>

  <path d="M1195 250V625" class="dash"/>
  <rect x="1205" y="625" width="115" height="95" rx="18" fill="#fff1f1" stroke="#dd7777"/>
  <text x="1263" y="660" text-anchor="middle" class="h">Offline</text>
  <text x="1263" y="690" text-anchor="middle" class="b">exact validation</text>

  <rect x="1090" y="300" width="210" height="70" rx="16" fill="#ffffff" stroke="#c7d5e2"/>
  <text x="1195" y="328" text-anchor="middle" class="h">Control plane</text>
  <text x="1195" y="354" text-anchor="middle" class="b">ownership, windows, splits</text>
  <path d="M1195 370L1118 390" class="dash"/>
  <path d="M1090 335L805 405" class="dash"/>
</svg>
