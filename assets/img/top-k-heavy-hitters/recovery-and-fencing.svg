<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" role="img">
  <title>Worker recovery with checkpoint replay and epoch fencing</title>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <path d="M0 0L10 3L0 6Z" fill="#55728f"/>
    </marker>
  </defs>
  <style>
    .title{font:700 26px sans-serif;fill:#17324d}
    .h{font:700 17px sans-serif;fill:#17324d}
    .b{font:14px sans-serif;fill:#45627d}
    .c{font:13px monospace;fill:#17324d}
    .line{stroke:#55728f;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <rect width="1200" height="620" rx="24" fill="#f7fafc"/>
  <text x="600" y="46" text-anchor="middle" class="title">Failure recovery uses checkpoint plus replay, then fences stale owners</text>

  <rect x="70" y="120" width="220" height="120" rx="20" fill="#17324d"/>
  <text x="180" y="160" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">Durable log</text>
  <text x="180" y="194" text-anchor="middle" font-family="monospace" font-size="13" fill="#fff">partition 17</text>
  <text x="180" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#bfd2e3">offsets continue</text>

  <rect x="70" y="365" width="220" height="120" rx="20" fill="#ffffff" stroke="#c7d5e2"/>
  <text x="180" y="405" text-anchor="middle" class="h">Checkpoint</text>
  <text x="180" y="437" text-anchor="middle" class="c">state at offset 92000</text>
  <text x="180" y="464" text-anchor="middle" class="b">buckets, counts, heap</text>

  <path d="M290 180H390" class="line"/>
  <path d="M290 425H390" class="line"/>

  <rect x="390" y="230" width="235" height="160" rx="22" fill="#edf8f6" stroke="#5ab5a4"/>
  <text x="508" y="273" text-anchor="middle" class="h">New worker</text>
  <text x="508" y="310" text-anchor="middle" class="b">load checkpoint</text>
  <text x="508" y="338" text-anchor="middle" class="b">replay after offset</text>
  <text x="508" y="366" text-anchor="middle" class="c">epoch=4</text>

  <path d="M625 310H740" class="line"/>
  <rect x="740" y="160" width="210" height="120" rx="20" fill="#eef4ff" stroke="#7399dc"/>
  <text x="845" y="202" text-anchor="middle" class="h">Valid summary</text>
  <text x="845" y="235" text-anchor="middle" class="c">p17 epoch=4</text>

  <rect x="740" y="355" width="210" height="120" rx="20" fill="#fff1f1" stroke="#dd7777"/>
  <text x="845" y="397" text-anchor="middle" class="h">Stale summary</text>
  <text x="845" y="430" text-anchor="middle" class="c">p17 epoch=3</text>

  <path d="M950 220H1045" class="line"/>
  <path d="M950 415H1045" class="line"/>
  <rect x="1045" y="240" width="105" height="140" rx="20" fill="#ffffff" stroke="#c7d5e2"/>
  <text x="1098" y="288" text-anchor="middle" class="h">Reducer</text>
  <text x="1098" y="322" text-anchor="middle" class="b">accepts</text>
  <text x="1098" y="349" text-anchor="middle" class="b">epoch 4</text>
</svg>
