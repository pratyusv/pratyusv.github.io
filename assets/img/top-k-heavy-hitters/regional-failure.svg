<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" role="img">
  <title>Regional failure behavior in multi-region Top-K</title>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <path d="M0 0L10 3L0 6Z" fill="#55728f"/>
    </marker>
  </defs>
  <style>
    .title{font:700 26px sans-serif;fill:#17324d}
    .h{font:700 16px sans-serif;fill:#17324d}
    .b{font:14px sans-serif;fill:#45627d}
    .c{font:13px monospace;fill:#17324d}
    .line{stroke:#55728f;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .dash{stroke:#dd7777;stroke-width:3;stroke-dasharray:8 8;fill:none}
  </style>
  <rect width="1200" height="650" rx="24" fill="#f7fafc"/>
  <text x="600" y="46" text-anchor="middle" class="title">Regional-first aggregation preserves local rankings and marks incomplete global input</text>

  <rect x="80" y="110" width="220" height="115" rx="20" fill="#edf8f6" stroke="#5ab5a4"/>
  <text x="190" y="150" text-anchor="middle" class="h">eu-west</text>
  <text x="190" y="182" text-anchor="middle" class="b">regional ranking</text>
  <text x="190" y="207" text-anchor="middle" class="c">watermark 19:05</text>
  <rect x="80" y="270" width="220" height="115" rx="20" fill="#edf8f6" stroke="#5ab5a4"/>
  <text x="190" y="310" text-anchor="middle" class="h">us-east</text>
  <text x="190" y="342" text-anchor="middle" class="b">regional ranking</text>
  <text x="190" y="367" text-anchor="middle" class="c">watermark 19:05</text>
  <rect x="80" y="430" width="220" height="115" rx="20" fill="#fff1f1" stroke="#dd7777"/>
  <text x="190" y="470" text-anchor="middle" class="h">ap-south</text>
  <text x="190" y="502" text-anchor="middle" class="b">link isolated</text>
  <text x="190" y="527" text-anchor="middle" class="c">stale 19:01</text>

  <path d="M300 168L510 285" class="line"/>
  <path d="M300 328L510 328" class="line"/>
  <path d="M300 488L510 370" class="dash"/>

  <rect x="510" y="250" width="230" height="155" rx="22" fill="#17324d"/>
  <text x="625" y="292" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">Global reducer</text>
  <text x="625" y="326" text-anchor="middle" font-family="monospace" font-size="13" fill="#fff">merge available</text>
  <text x="625" y="356" text-anchor="middle" font-family="monospace" font-size="13" fill="#fff">mark missing/stale</text>

  <path d="M740 328H845" class="line"/>
  <rect x="845" y="220" width="275" height="215" rx="22" fill="#ffffff" stroke="#c7d5e2"/>
  <text x="983" y="262" text-anchor="middle" class="h">Global response</text>
  <text x="983" y="305" text-anchor="middle" class="c">complete_regions=[eu,us]</text>
  <text x="983" y="338" text-anchor="middle" class="c">stale_regions=[ap]</text>
  <text x="983" y="371" text-anchor="middle" class="c">watermark=19:01</text>
  <text x="983" y="408" text-anchor="middle" class="b">not a silent partial result</text>
</svg>
