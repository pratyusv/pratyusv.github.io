<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" role="img"><title>UUID version 4 bit layout</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="500" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">UUIDv4 keeps 122 bits for random data</text><rect x="70" y="155" width="1060" height="150" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="560" y="155" width="70" height="150" fill="#fff8e7" stroke="#d6a63f"/><rect x="790" y="155" width="55" height="150" fill="#edf8f6" stroke="#5ab5a4"/><text x="300" y="215" text-anchor="middle" class="h">random</text><text x="300" y="255" text-anchor="middle" class="c">48 bits</text><text x="595" y="215" text-anchor="middle" class="h">ver</text><text x="595" y="255" text-anchor="middle" class="c">4</text><text x="710" y="215" text-anchor="middle" class="h">random</text><text x="817" y="215" text-anchor="middle" class="h">var</text><text x="817" y="255" text-anchor="middle" class="c">2</text><text x="985" y="215" text-anchor="middle" class="h">random</text><text x="985" y="255" text-anchor="middle" class="c">remaining bits</text><text x="70" y="345" class="c">bit 0</text><text x="1130" y="345" text-anchor="end" class="c">bit 127</text><rect x="350" y="390" width="500" height="58" rx="14" fill="#17324d"/><text x="600" y="427" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff">128 total − 6 fixed = 122 random</text></svg>
