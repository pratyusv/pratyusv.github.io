<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" role="img"><title>Snowflake worker timestamp and sequence state machine</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="570" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">One serialized state transition decides every ID</text><rect x="45" y="210" width="230" height="130" rx="20" fill="#eef4ff" stroke="#7399dc"/><text x="160" y="250" text-anchor="middle" class="h">Read clock</text><text x="160" y="288" text-anchor="middle" class="c">now vs last_timestamp</text><path d="M275 275H390" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><g><rect x="390" y="80" width="340" height="120" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="390" y="225" width="340" height="120" rx="18" fill="#fff8e7" stroke="#d6a63f"/><rect x="390" y="370" width="340" height="120" rx="18" fill="#fff0f0" stroke="#d97979"/></g><text x="560" y="120" text-anchor="middle" class="h">now &gt; last</text><text x="560" y="158" text-anchor="middle" class="c">last=now · sequence=0</text><text x="560" y="265" text-anchor="middle" class="h">now = last</text><text x="560" y="303" text-anchor="middle" class="c">sequence++ · check overflow</text><text x="560" y="410" text-anchor="middle" class="h">now &lt; last</text><text x="560" y="448" text-anchor="middle" class="c">rollback policy</text><path d="M275 275L390 140M275 275H390M275 275L390 430" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><path d="M730 140L875 240M730 285H875M730 430L875 310" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="875" y="205" width="280" height="140" rx="20" fill="#17324d"/><text x="1015" y="247" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">Compose or stop</text><text x="1015" y="287" text-anchor="middle" font-family="monospace" font-size="13" fill="#fff">validate every field</text><text x="1015" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffcf99">never wrap silently</text><text x="600" y="535" text-anchor="middle" class="b">Concurrent threads must not read and update this state independently.</text></svg>
