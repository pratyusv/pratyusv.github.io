<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" role="img"><title>Snowflake bit-width capacity trade-offs</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Every extra bit doubles one capacity and removes it elsewhere</text><g><rect x="55" y="100" width="350" height="245" rx="22" fill="#edf8f6" stroke="#5ab5a4"/><rect x="425" y="100" width="350" height="245" rx="22" fill="#fff8e7" stroke="#d6a63f"/><rect x="795" y="100" width="350" height="245" rx="22" fill="#eef4ff" stroke="#7399dc"/></g><text x="230" y="145" text-anchor="middle" class="h">Timestamp T = 41</text><text x="230" y="195" text-anchor="middle" class="c">2⁴¹ milliseconds</text><text x="230" y="235" text-anchor="middle" class="c">≈ 69.7 years</text><text x="230" y="290" text-anchor="middle" class="b">epoch lifetime</text><text x="600" y="145" text-anchor="middle" class="h">Worker W = 10</text><text x="600" y="195" text-anchor="middle" class="c">2¹⁰ identities</text><text x="600" y="235" text-anchor="middle" class="c">= 1,024 workers</text><text x="600" y="290" text-anchor="middle" class="b">simultaneous generators</text><text x="970" y="145" text-anchor="middle" class="h">Sequence S = 12</text><text x="970" y="195" text-anchor="middle" class="c">2¹² per tick</text><text x="970" y="235" text-anchor="middle" class="c">= 4,096 IDs/ms</text><text x="970" y="290" text-anchor="middle" class="b">per worker throughput</text><rect x="250" y="405" width="700" height="75" rx="17" fill="#17324d"/><text x="600" y="451" text-anchor="middle" font-family="monospace" font-size="15" fill="#fff">1 + T + W + S = 64</text><text x="600" y="525" text-anchor="middle" class="b">The layout is an API and a decades-long exhaustion plan.</text></svg>
