<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" role="img"><title>Snowflake ID composition using shifts and bitwise OR</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="550" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Each field occupies a non-overlapping bit range</text><g><rect x="55" y="95" width="350" height="95" rx="17" fill="#edf8f6" stroke="#5ab5a4"/><rect x="55" y="225" width="350" height="95" rx="17" fill="#fff8e7" stroke="#d6a63f"/><rect x="55" y="355" width="350" height="95" rx="17" fill="#eef4ff" stroke="#7399dc"/></g><text x="230" y="133" text-anchor="middle" class="h">Elapsed milliseconds</text><text x="230" y="165" text-anchor="middle" class="c">elapsed &lt;&lt; 22</text><text x="230" y="263" text-anchor="middle" class="h">Worker ID</text><text x="230" y="295" text-anchor="middle" class="c">worker &lt;&lt; 12</text><text x="230" y="393" text-anchor="middle" class="h">Sequence</text><text x="230" y="425" text-anchor="middle" class="c">sequence</text><path d="M405 142L565 225M405 272H565M405 402L565 315" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="565" y="185" width="240" height="150" rx="20" fill="#17324d"/><text x="685" y="230" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">Bitwise OR</text><text x="685" y="272" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff">time | worker | seq</text><text x="685" y="307" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dce5ed">no field overlaps</text><path d="M805 260H920" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><rect x="920" y="190" width="230" height="140" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="1035" y="232" text-anchor="middle" class="h">64-bit ID</text><text x="1035" y="272" text-anchor="middle" class="c">725001937144832</text><text x="1035" y="305" text-anchor="middle" class="b">positive integer</text><text x="600" y="500" text-anchor="middle" class="b">Uniqueness comes from field invariants, not from the OR operation.</text></svg>
