<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" role="img"><title>Different levels of ID ordering guarantees</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="580" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">“Ordered ID” can describe four different guarantees</text><g><rect x="55" y="95" width="1090" height="90" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="140" y="205" width="920" height="90" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="225" y="315" width="750" height="90" rx="18" fill="#fff8e7" stroke="#d6a63f"/><rect x="310" y="425" width="580" height="90" rx="18" fill="#fff0f0" stroke="#d97979"/></g><text x="600" y="133" text-anchor="middle" class="h">Per-generator monotonic</text><text x="600" y="163" text-anchor="middle" class="b">one process emits increasing values</text><text x="600" y="243" text-anchor="middle" class="h">Millisecond sortable</text><text x="600" y="273" text-anchor="middle" class="b">high bits group observed timestamps</text><text x="600" y="353" text-anchor="middle" class="h">Globally roughly time ordered</text><text x="600" y="383" text-anchor="middle" class="b">clock skew bounds a disorder neighborhood</text><text x="600" y="463" text-anchor="middle" class="h">Strict total order</text><text x="600" y="493" text-anchor="middle" class="b">one authority orders every event</text><text x="80" y="555" class="c">less coordination</text><text x="1120" y="555" text-anchor="end" class="c">stronger claim</text></svg>
