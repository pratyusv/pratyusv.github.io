<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Highly available worker ID allocator</title><desc id="d">A quorum-backed allocator records worker assignments by term and generation before generators may use them.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 26px system-ui;fill:#17324d}.h{font:700 17px system-ui;fill:#17324d}.b{font:14px system-ui;fill:#45627d}.s{font:12px system-ui;fill:#45627d}.w{font:700 15px system-ui;fill:#fff}</style></defs><rect width="1200" height="680" rx="26" fill="#f7fafc"/><text x="600" y="48" text-anchor="middle" class="t">Worker allocation is a replicated authority with fenced terms</text><rect x="45" y="220" width="190" height="115" rx="15" fill="#fff8e8" stroke="#e4b85b"/><text x="140" y="258" text-anchor="middle" class="h">Generator G17</text><text x="140" y="286" text-anchor="middle" class="b">request ID req-91</text><text x="140" y="310" text-anchor="middle" class="s">needs worker assignment</text><rect x="330" y="90" width="500" height="450" rx="22" fill="#f3effb" stroke="#9377c6"/><text x="580" y="128" text-anchor="middle" class="h">Worker allocator cluster</text><rect x="375" y="175" width="180" height="95" rx="14" fill="#17324d"/><text x="465" y="210" text-anchor="middle" class="w">A1 · leader</text><text x="465" y="236" text-anchor="middle" class="s" fill="#fff">term 42 · assigns</text><rect x="610" y="165" width="170" height="78" rx="14" fill="#fff" stroke="#9377c6"/><text x="695" y="197" text-anchor="middle" class="h">A2 · follower</text><text x="695" y="220" text-anchor="middle" class="s">domain B</text><rect x="610" y="300" width="170" height="78" rx="14" fill="#fff" stroke="#9377c6"/><text x="695" y="332" text-anchor="middle" class="h">A3 · follower</text><text x="695" y="355" text-anchor="middle" class="s">domain C</text><path d="M555 210H610M555 245L610 326" stroke="#55728f" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="405" y="410" width="350" height="82" rx="13" fill="#edf8f6" stroke="#5ab5a4"/><text x="580" y="440" text-anchor="middle" class="h">Committed assignment</text><text x="580" y="466" text-anchor="middle" class="b">slot 17 · G17 · generation 884 · term 42</text><path d="M235 277H330" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="925" y="220" width="230" height="115" rx="15" fill="#edf8f6" stroke="#5ab5a4"/><text x="1040" y="258" text-anchor="middle" class="h">Assignment accepted</text><text x="1040" y="286" text-anchor="middle" class="b">only after quorum commit</text><text x="1040" y="310" text-anchor="middle" class="s">retry req-91 returns same slot</text><path d="M830 277H925" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="130" y="575" width="940" height="60" rx="14" fill="#17324d"/><text x="600" y="601" text-anchor="middle" class="w">After failover, the new leader recovers every live assignment before reusing any slot.</text><text x="600" y="623" text-anchor="middle" class="s" fill="#fff">An old allocator term cannot create a second valid owner for worker 17.</text></svg>
