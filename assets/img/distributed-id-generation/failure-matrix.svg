<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" role="img"><title>Distributed ID generation failure matrix</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 14px sans-serif;fill:#17324d}.b{font:12px sans-serif;fill:#45627d}.c{font:11px monospace;fill:#17324d}</style><rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="43" text-anchor="middle" class="t">Every generator assumption needs a failure response</text><rect x="45" y="80" width="1110" height="60" rx="14" fill="#17324d"/><text x="205" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">Failure</text><text x="555" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">Risk</text><text x="945" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">Containment</text><g><rect x="45" y="150" width="1110" height="65" fill="#fff"/><rect x="45" y="215" width="1110" height="65" fill="#eef4ff"/><rect x="45" y="280" width="1110" height="65" fill="#fff"/><rect x="45" y="345" width="1110" height="65" fill="#eef4ff"/><rect x="45" y="410" width="1110" height="65" fill="#fff"/><rect x="45" y="475" width="1110" height="65" fill="#eef4ff"/><rect x="45" y="540" width="1110" height="65" fill="#fff"/></g><g class="h"><text x="205" y="190" text-anchor="middle">range holder crashes</text><text x="205" y="255" text-anchor="middle">RNG repeats</text><text x="205" y="320" text-anchor="middle">worker slot duplicated</text><text x="205" y="385" text-anchor="middle">clock rolls back</text><text x="205" y="450" text-anchor="middle">sequence exhausts</text><text x="205" y="515" text-anchor="middle">generator restarts empty</text><text x="205" y="580" text-anchor="middle">64-bit JSON number</text></g><g class="b"><text x="555" y="190" text-anchor="middle">unused values become uncertain</text><text x="555" y="255" text-anchor="middle">probability model fails</text><text x="555" y="320" text-anchor="middle">same time/worker/sequence</text><text x="555" y="385" text-anchor="middle">old timestamp range reused</text><text x="555" y="450" text-anchor="middle">counter wraps to duplicate</text><text x="555" y="515" text-anchor="middle">last tuple forgotten</text><text x="555" y="580" text-anchor="middle">precision collision</text></g><g class="c"><text x="945" y="190" text-anchor="middle">never reissue range</text><text x="945" y="255" text-anchor="middle">CSPRNG + UNIQUE constraint</text><text x="945" y="320" text-anchor="middle">assignment + reuse invariant</text><text x="945" y="385" text-anchor="middle">refuse / wait / durable generation</text><text x="945" y="450" text-anchor="middle">backpressure; never wrap</text><text x="945" y="515" text-anchor="middle">persist high-water + startup check</text><text x="945" y="580" text-anchor="middle">string or exact integer type</text></g><text x="600" y="645" text-anchor="middle" class="b">A unique database index is the final detector, not the primary algorithm.</text></svg>
