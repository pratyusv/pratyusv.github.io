<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" role="img"><title>Clock skew reverses numeric order of IDs across regions</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="550" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Time-prefixed IDs inherit clock skew</text><rect x="55" y="110" width="490" height="190" rx="22" fill="#eef4ff" stroke="#7399dc"/><text x="300" y="153" text-anchor="middle" class="h">eu-west clock +4 ms</text><text x="300" y="198" text-anchor="middle" class="c">real time 004 → encoded time 008</text><text x="300" y="245" text-anchor="middle" class="c">ID E</text><rect x="655" y="110" width="490" height="190" rx="22" fill="#edf8f6" stroke="#5ab5a4"/><text x="900" y="153" text-anchor="middle" class="h">us-east clock −4 ms</text><text x="900" y="198" text-anchor="middle" class="c">real time 006 → encoded time 002</text><text x="900" y="245" text-anchor="middle" class="c">ID U</text><rect x="120" y="370" width="420" height="85" rx="17" fill="#fff8e7" stroke="#d6a63f"/><text x="330" y="405" text-anchor="middle" class="h">Real-time order</text><text x="330" y="435" text-anchor="middle" class="c">E before U</text><rect x="660" y="370" width="420" height="85" rx="17" fill="#fff0f0" stroke="#d97979"/><text x="870" y="405" text-anchor="middle" class="h">Numeric ID order</text><text x="870" y="435" text-anchor="middle" class="c">U before E</text><path d="M545 205H655" stroke="#55728f" stroke-width="3" stroke-dasharray="8 6"/><text x="600" y="330" text-anchor="middle" class="b">Neither generator observes the other's event.</text><text x="600" y="510" text-anchor="middle" class="b">Approximate time order is not a causal or commit-order guarantee.</text></svg>
