<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" role="img"><title>Paused worker overlaps with reassigned worker slot</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="570" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Reassigning a slot does not erase a paused generator</text><text x="100" y="130" class="h">Old W17</text><text x="100" y="280" class="h">Registry</text><text x="100" y="430" class="h">New W17</text><g stroke="#b9c9d8" stroke-width="3"><line x1="210" y1="125" x2="1110" y2="125"/><line x1="210" y1="275" x2="1110" y2="275"/><line x1="210" y1="425" x2="1110" y2="425"/></g><rect x="300" y="90" width="310" height="70" rx="14" fill="#fff8e7" stroke="#d6a63f"/><text x="455" y="133" text-anchor="middle" class="c">process paused</text><line x1="650" y1="240" x2="650" y2="310" stroke="#d97979" stroke-width="5"/><text x="665" y="268" class="b">lease expires</text><line x1="760" y1="275" x2="760" y2="425" stroke="#5ab5a4" stroke-width="3"/><text x="770" y="355" class="c">assign slot 17</text><circle cx="920" cy="425" r="15" fill="#5ab5a4"/><text x="920" y="397" text-anchor="middle" class="c">emit tuple X</text><rect x="895" y="90" width="130" height="70" rx="14" fill="#fff0f0" stroke="#d97979"/><text x="960" y="133" text-anchor="middle" class="b">resume</text><circle cx="1050" cy="125" r="15" fill="#d97979"/><text x="1050" y="98" text-anchor="middle" class="c">emit tuple X</text><rect x="300" y="490" width="600" height="50" rx="13" fill="#17324d"/><text x="600" y="522" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffcf99">The 64-bit ID contains no assignment generation to fence the old worker.</text></svg>
