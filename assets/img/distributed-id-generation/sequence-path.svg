<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" role="img"><title>Concurrent transactions obtain IDs from one database sequence</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="530" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">One sequence authority gives distinct values atomically</text><g><rect x="45" y="100" width="220" height="90" rx="16" fill="#eef4ff" stroke="#7399dc"/><rect x="45" y="220" width="220" height="90" rx="16" fill="#edf8f6" stroke="#5ab5a4"/><rect x="45" y="340" width="220" height="90" rx="16" fill="#fff8e7" stroke="#d6a63f"/></g><text x="155" y="153" text-anchor="middle" class="h">Transaction T1</text><text x="155" y="273" text-anchor="middle" class="h">Transaction T2</text><text x="155" y="393" text-anchor="middle" class="h">Transaction T3</text><path d="M265 145L495 225M265 265H495M265 385L495 305" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="495" y="155" width="310" height="180" rx="22" fill="#17324d"/><text x="650" y="198" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">order_id_seq</text><text x="650" y="240" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff">nextval() atomic</text><text x="650" y="282" text-anchor="middle" font-family="monospace" font-size="13" fill="#a9eadc">101 · 102 · 103</text><path d="M805 215L955 140M805 245H955M805 275L955 370" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><g><rect x="955" y="100" width="190" height="80" rx="15" fill="#fff" stroke="#b9c9d8"/><rect x="955" y="220" width="190" height="80" rx="15" fill="#fff" stroke="#b9c9d8"/><rect x="955" y="340" width="190" height="80" rx="15" fill="#fff" stroke="#b9c9d8"/></g><text x="1050" y="148" text-anchor="middle" class="c">ID 101</text><text x="1050" y="268" text-anchor="middle" class="c">ID 102</text><text x="1050" y="388" text-anchor="middle" class="c">ID 103</text><text x="600" y="480" text-anchor="middle" class="b">The database cluster is the availability and ordering boundary.</text></svg>
