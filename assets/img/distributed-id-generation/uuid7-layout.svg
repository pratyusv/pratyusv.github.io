<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" role="img"><title>UUID version 7 bit layout</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 15px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">UUIDv7 places Unix milliseconds in the most significant bits</text><rect x="50" y="155" width="1100" height="150" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="50" y="155" width="410" height="150" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><rect x="460" y="155" width="70" height="150" fill="#fff8e7" stroke="#d6a63f"/><rect x="530" y="155" width="150" height="150" fill="#eef4ff" stroke="#7399dc"/><rect x="680" y="155" width="55" height="150" fill="#fff8e7" stroke="#d6a63f"/><text x="255" y="210" text-anchor="middle" class="h">unix_ts_ms</text><text x="255" y="250" text-anchor="middle" class="c">48 bits</text><text x="495" y="210" text-anchor="middle" class="h">ver</text><text x="495" y="250" text-anchor="middle" class="c">7</text><text x="605" y="210" text-anchor="middle" class="h">rand_a</text><text x="605" y="250" text-anchor="middle" class="c">12 bits</text><text x="707" y="210" text-anchor="middle" class="h">var</text><text x="707" y="250" text-anchor="middle" class="c">2</text><text x="942" y="210" text-anchor="middle" class="h">rand_b</text><text x="942" y="250" text-anchor="middle" class="c">62 bits</text><rect x="290" y="380" width="620" height="65" rx="15" fill="#17324d"/><text x="600" y="420" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff">48 time + 4 version + 74 variable + 2 variant = 128</text><text x="600" y="485" text-anchor="middle" class="b">Optional counter or sub-millisecond state may occupy part of the 74 bits.</text></svg>
