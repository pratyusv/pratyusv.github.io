<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" role="img"><title>Worker crash abandons unused values in an allocated range</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Gaps preserve safety after a range holder fails</text><rect x="80" y="150" width="1040" height="150" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="80" y="150" width="250" height="150" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><rect x="330" y="150" width="790" height="150" rx="20" fill="#fff0f0" stroke="#d97979"/><text x="205" y="205" text-anchor="middle" class="h">27 values used</text><text x="205" y="245" text-anchor="middle" class="c">1,000,000 .. 1,000,026</text><text x="725" y="205" text-anchor="middle" class="h">9,973 values abandoned</text><text x="725" y="245" text-anchor="middle" class="c">never reissue uncertain tail</text><line x1="330" y1="125" x2="330" y2="330" stroke="#d97979" stroke-width="4"/><text x="330" y="105" text-anchor="middle" class="c">W1 crashes</text><rect x="300" y="380" width="600" height="70" rx="16" fill="#17324d"/><text x="600" y="423" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">A missing number is cheaper than a duplicate identity.</text></svg>
