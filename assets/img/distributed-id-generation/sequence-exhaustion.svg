<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" role="img"><title>Snowflake sequence exhaustion within one millisecond</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">The 4,097th ID must not wrap sequence to zero</text><rect x="65" y="150" width="870" height="150" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><rect x="65" y="150" width="865" height="150" rx="20" fill="#eef4ff" fill-opacity=".6"/><text x="500" y="200" text-anchor="middle" class="h">millisecond 12,500</text><text x="500" y="245" text-anchor="middle" class="c">sequence 0 … 4095</text><text x="500" y="278" text-anchor="middle" class="b">all 4,096 tuples consumed</text><line x1="935" y1="120" x2="935" y2="330" stroke="#d97979" stroke-width="4"/><rect x="975" y="155" width="180" height="140" rx="18" fill="#fff0f0" stroke="#d97979"/><text x="1065" y="195" text-anchor="middle" class="h">Next request</text><text x="1065" y="235" text-anchor="middle" class="c">sequence 0?</text><text x="1065" y="270" text-anchor="middle" class="b">duplicate → forbidden</text><rect x="275" y="385" width="650" height="75" rx="17" fill="#17324d"/><text x="600" y="430" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">Wait for a later millisecond or return backpressure.</text></svg>
