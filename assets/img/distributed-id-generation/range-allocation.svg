<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" role="img"><title>Central allocator hands non-overlapping ID ranges to workers</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="550" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">One durable range grant supports many local IDs</text><rect x="420" y="80" width="360" height="145" rx="22" fill="#17324d"/><text x="600" y="122" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">Range allocator</text><text x="600" y="162" text-anchor="middle" font-family="monospace" font-size="13" fill="#fff">persist high-water = 1,020,000</text><text x="600" y="195" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dce5ed">commit before returning grants</text><g><rect x="70" y="330" width="460" height="140" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="670" y="330" width="460" height="140" rx="20" fill="#edf8f6" stroke="#5ab5a4"/></g><text x="300" y="370" text-anchor="middle" class="h">Worker W1</text><text x="300" y="408" text-anchor="middle" class="c">[1,000,000 .. 1,009,999]</text><text x="300" y="442" text-anchor="middle" class="b">increment locally</text><text x="900" y="370" text-anchor="middle" class="h">Worker W2</text><text x="900" y="408" text-anchor="middle" class="c">[1,010,000 .. 1,019,999]</text><text x="900" y="442" text-anchor="middle" class="b">increment locally</text><path d="M500 225L350 330M700 225L850 330" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><text x="600" y="515" text-anchor="middle" class="c">coordination rate = ID rate / range size</text></svg>
