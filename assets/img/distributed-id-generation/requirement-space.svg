<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" role="img"><title>Trade-offs among distributed ID requirements</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="580" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">An ID format is a bundle of independent contracts</text><g><rect x="45" y="95" width="260" height="120" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="335" y="95" width="240" height="120" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="605" y="95" width="250" height="120" rx="18" fill="#fff8e7" stroke="#d6a63f"/><rect x="885" y="95" width="270" height="120" rx="18" fill="#fff" stroke="#b9c9d8"/><rect x="45" y="285" width="260" height="120" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="335" y="285" width="240" height="120" rx="18" fill="#fff8e7" stroke="#d6a63f"/><rect x="605" y="285" width="250" height="120" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="885" y="285" width="270" height="120" rx="18" fill="#fff0f0" stroke="#d97979"/></g><text x="175" y="137" text-anchor="middle" class="h">Uniqueness</text><text x="175" y="177" text-anchor="middle" class="b">domain + collision model</text><text x="455" y="137" text-anchor="middle" class="h">Availability</text><text x="455" y="177" text-anchor="middle" class="b">generate while partitioned?</text><text x="730" y="137" text-anchor="middle" class="h">Ordering</text><text x="730" y="177" text-anchor="middle" class="b">approximate or strict?</text><text x="1020" y="137" text-anchor="middle" class="h">Capacity</text><text x="1020" y="177" text-anchor="middle" class="b">workers × IDs per tick</text><text x="175" y="327" text-anchor="middle" class="h">Compactness</text><text x="175" y="367" text-anchor="middle" class="b">64 or 128 bits?</text><text x="455" y="327" text-anchor="middle" class="h">Index locality</text><text x="455" y="367" text-anchor="middle" class="b">random or time clustered?</text><text x="730" y="327" text-anchor="middle" class="h">Opacity</text><text x="730" y="367" text-anchor="middle" class="b">what does the ID reveal?</text><text x="1020" y="327" text-anchor="middle" class="h">Failure recovery</text><text x="1020" y="367" text-anchor="middle" class="b">clock, clone, restart</text><rect x="300" y="470" width="600" height="60" rx="15" fill="#17324d"/><text x="600" y="508" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">No common scheme maximizes every property.</text></svg>
