<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" role="img"><title>Precision loss when a 64-bit ID becomes a JavaScript number</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">A unique integer can collide after lossy transport</text><g><rect x="55" y="120" width="300" height="110" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="55" y="300" width="300" height="110" rx="18" fill="#edf8f6" stroke="#5ab5a4"/></g><text x="205" y="160" text-anchor="middle" class="h">ID A</text><text x="205" y="198" text-anchor="middle" class="c">725001937144832000</text><text x="205" y="340" text-anchor="middle" class="h">ID B</text><text x="205" y="378" text-anchor="middle" class="c">725001937144832001</text><path d="M355 175L520 225M355 355L520 275" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="520" y="155" width="300" height="190" rx="22" fill="#fff0f0" stroke="#d97979"/><text x="670" y="198" text-anchor="middle" class="h">JavaScript Number</text><text x="670" y="238" text-anchor="middle" class="c">exact only through 2⁵³−1</text><text x="670" y="285" text-anchor="middle" class="b">both may round to</text><text x="670" y="318" text-anchor="middle" class="c">the same value</text><path d="M820 250H930" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><rect x="930" y="175" width="220" height="150" rx="20" fill="#17324d"/><text x="1040" y="217" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">JSON contract</text><text x="1040" y="260" text-anchor="middle" font-family="monospace" font-size="12" fill="#a9eadc">"order_id": "…"</text><text x="1040" y="295" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dce5ed">decimal string</text><text x="600" y="465" text-anchor="middle" class="b">Validate database, protobuf, logs, browsers, CSV, and analytics end to end.</text></svg>
