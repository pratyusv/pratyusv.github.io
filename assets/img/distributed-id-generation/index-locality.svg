<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" role="img"><title>Random and time-ordered ID insertion patterns in B-trees</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="570" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">ID shape moves the storage hotspot</text><rect x="55" y="90" width="520" height="400" rx="22" fill="#eef4ff" stroke="#7399dc"/><text x="315" y="132" text-anchor="middle" class="h">Random UUIDv4 keys</text><g fill="#fff" stroke="#7399dc"><rect x="95" y="205" width="95" height="90" rx="10"/><rect x="205" y="205" width="95" height="90" rx="10"/><rect x="315" y="205" width="95" height="90" rx="10"/><rect x="425" y="205" width="95" height="90" rx="10"/></g><g fill="#d97979"><circle cx="135" cy="230" r="9"/><circle cx="245" cy="270" r="9"/><circle cx="355" cy="230" r="9"/><circle cx="465" cy="270" r="9"/><circle cx="245" cy="230" r="9"/></g><text x="315" y="355" text-anchor="middle" class="b">new inserts touch many pages</text><text x="315" y="397" text-anchor="middle" class="c">distributed cache pressure</text><text x="315" y="450" text-anchor="middle" class="b">may avoid one range hotspot</text><rect x="625" y="90" width="520" height="400" rx="22" fill="#edf8f6" stroke="#5ab5a4"/><text x="885" y="132" text-anchor="middle" class="h">Time-ordered keys</text><g fill="#fff" stroke="#5ab5a4"><rect x="665" y="205" width="95" height="90" rx="10"/><rect x="775" y="205" width="95" height="90" rx="10"/><rect x="885" y="205" width="95" height="90" rx="10"/><rect x="995" y="205" width="95" height="90" rx="10"/></g><g fill="#5ab5a4"><circle cx="1030" cy="230" r="9"/><circle cx="1055" cy="230" r="9"/><circle cx="1030" cy="270" r="9"/><circle cx="1055" cy="270" r="9"/></g><text x="885" y="355" text-anchor="middle" class="b">recent inserts cluster at the right edge</text><text x="885" y="397" text-anchor="middle" class="c">good locality</text><text x="885" y="450" text-anchor="middle" class="b">possible page or range-shard hotspot</text><text x="600" y="535" text-anchor="middle" class="b">Benchmark the database and partitioning scheme, not only the generator.</text></svg>
