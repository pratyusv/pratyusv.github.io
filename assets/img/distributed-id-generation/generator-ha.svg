<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Highly available distributed ID generator tier</title><desc id="d">Clients reach several generator nodes through a load balancer, and every generator owns a disjoint worker identity and local state machine.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 26px system-ui;fill:#17324d}.h{font:700 17px system-ui;fill:#17324d}.b{font:14px system-ui;fill:#45627d}.s{font:12px system-ui;fill:#45627d}.w{font:700 15px system-ui;fill:#fff}</style></defs><rect width="1200" height="680" rx="26" fill="#f7fafc"/><text x="600" y="48" text-anchor="middle" class="t">Availability comes from disjoint generators, not a shared counter</text><rect x="45" y="230" width="180" height="100" rx="15" fill="#fff8e8" stroke="#e4b85b"/><text x="135" y="268" text-anchor="middle" class="h">Applications</text><text x="135" y="296" text-anchor="middle" class="b">batch request + retry ID</text><rect x="300" y="230" width="180" height="100" rx="15" fill="#edf8f6" stroke="#5ab5a4"/><text x="390" y="268" text-anchor="middle" class="h">Load balancer</text><text x="390" y="296" text-anchor="middle" class="b">healthy generator</text><path d="M225 280H300" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="565" y="90" width="590" height="450" rx="22" fill="#f3effb" stroke="#9377c6"/><text x="860" y="128" text-anchor="middle" class="h">Generator fleet</text><rect x="620" y="170" width="475" height="88" rx="14" fill="#fff" stroke="#9377c6"/><text x="735" y="204" text-anchor="middle" class="h">Generator G17</text><text x="735" y="229" text-anchor="middle" class="s">worker 17 · generation 884</text><text x="975" y="204" text-anchor="middle" class="b">local clock + sequence</text><text x="975" y="229" text-anchor="middle" class="s">durable high-water state</text><rect x="620" y="290" width="475" height="88" rx="14" fill="#fff" stroke="#9377c6"/><text x="735" y="324" text-anchor="middle" class="h">Generator G23</text><text x="735" y="349" text-anchor="middle" class="s">worker 23 · generation 119</text><text x="975" y="324" text-anchor="middle" class="b">local clock + sequence</text><text x="975" y="349" text-anchor="middle" class="s">independent ID space</text><rect x="620" y="410" width="475" height="88" rx="14" fill="#fff" stroke="#9377c6"/><text x="735" y="444" text-anchor="middle" class="h">Generator G41</text><text x="735" y="469" text-anchor="middle" class="s">worker 41 · generation 205</text><text x="975" y="444" text-anchor="middle" class="b">local clock + sequence</text><text x="975" y="469" text-anchor="middle" class="s">independent ID space</text><path d="M480 280H540V214H620M540 280V334H620M540 334V454H620" stroke="#55728f" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="150" y="585" width="900" height="58" rx="14" fill="#17324d"/><text x="600" y="620" text-anchor="middle" class="w">A failed generator is bypassed; its worker slot is quarantined instead of immediately reused.</text></svg>
