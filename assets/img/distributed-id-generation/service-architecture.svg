<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" role="img"><title>Distributed ID generator service architecture</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="570" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">A generator tier centralizes clocks, slots, and durable state</text><g><rect x="45" y="105" width="230" height="90" rx="16" fill="#fff" stroke="#b9c9d8"/><rect x="45" y="240" width="230" height="90" rx="16" fill="#fff" stroke="#b9c9d8"/><rect x="45" y="375" width="230" height="90" rx="16" fill="#fff" stroke="#b9c9d8"/></g><text x="160" y="158" text-anchor="middle" class="h">Checkout</text><text x="160" y="293" text-anchor="middle" class="h">Messaging</text><text x="160" y="428" text-anchor="middle" class="h">Media</text><path d="M275 150L430 230M275 285H430M275 420L430 320" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="430" y="145" width="380" height="260" rx="22" fill="#eef4ff" stroke="#7399dc"/><text x="620" y="188" text-anchor="middle" class="h">ID generator service</text><g><rect x="475" y="225" width="130" height="90" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><rect x="635" y="225" width="130" height="90" rx="14" fill="#fff8e7" stroke="#d6a63f"/></g><text x="540" y="263" text-anchor="middle" class="c">worker 17</text><text x="540" y="291" text-anchor="middle" class="b">clock + state</text><text x="700" y="263" text-anchor="middle" class="c">worker 18</text><text x="700" y="291" text-anchor="middle" class="b">clock + state</text><text x="620" y="360" text-anchor="middle" class="c">batch RPC + request ID</text><path d="M810 275H920" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><rect x="920" y="185" width="235" height="180" rx="20" fill="#17324d"/><text x="1037" y="227" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">Registry + durable state</text><text x="1037" y="270" text-anchor="middle" font-family="monospace" font-size="12" fill="#fff">slot assignments</text><text x="1037" y="305" text-anchor="middle" font-family="monospace" font-size="12" fill="#fff">high-water marks</text><text x="1037" y="338" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffcf99">coordination dependency</text><text x="600" y="515" text-anchor="middle" class="b">Clients trade local generation for one operated implementation.</text></svg>
