<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" role="img"><title>Versioned migration from old IDs to a new format</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="600" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">An ID migration crosses every storage and protocol boundary</text><rect x="45" y="215" width="190" height="115" rx="18" fill="#fff8e7" stroke="#d6a63f"/><text x="140" y="257" text-anchor="middle" class="h">Old generator</text><text x="140" y="293" text-anchor="middle" class="c">64-bit v1</text><rect x="320" y="150" width="310" height="245" rx="22" fill="#eef4ff" stroke="#7399dc"/><text x="475" y="193" text-anchor="middle" class="h">Dual-write database</text><text x="475" y="235" text-anchor="middle" class="c">old_id UNIQUE</text><text x="475" y="273" text-anchor="middle" class="c">new_id UNIQUE</text><text x="475" y="315" text-anchor="middle" class="b">backfill stable mapping</text><text x="475" y="355" text-anchor="middle" class="b">foreign keys move deliberately</text><path d="M235 272H320" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><g><rect x="730" y="80" width="390" height="95" rx="16" fill="#edf8f6" stroke="#5ab5a4"/><rect x="730" y="205" width="390" height="95" rx="16" fill="#edf8f6" stroke="#5ab5a4"/><rect x="730" y="330" width="390" height="95" rx="16" fill="#edf8f6" stroke="#5ab5a4"/><rect x="730" y="455" width="390" height="95" rx="16" fill="#edf8f6" stroke="#5ab5a4"/></g><text x="925" y="135" text-anchor="middle" class="c">events carry old + new</text><text x="925" y="260" text-anchor="middle" class="c">cache keys understand both</text><text x="925" y="385" text-anchor="middle" class="c">APIs retain old aliases</text><text x="925" y="510" text-anchor="middle" class="c">clients use exact new type</text><path d="M630 210L730 127M630 250L730 252M630 295L730 377M630 335L730 502" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><text x="475" y="475" text-anchor="middle" class="h">Cut over producers last</text><text x="475" y="510" text-anchor="middle" class="b">after every consumer can parse both</text></svg>
