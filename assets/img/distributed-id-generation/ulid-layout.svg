<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" role="img"><title>ULID timestamp and randomness layout</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">ULID encodes 128 bits as 26 sortable Base32 characters</text><rect x="70" y="125" width="1060" height="155" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="70" y="125" width="400" height="155" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="270" y="180" text-anchor="middle" class="h">Timestamp</text><text x="270" y="220" text-anchor="middle" class="c">48 bits · Unix milliseconds</text><text x="800" y="180" text-anchor="middle" class="h">Randomness</text><text x="800" y="220" text-anchor="middle" class="c">80 bits</text><text x="270" y="325" text-anchor="middle" class="c">10 characters</text><text x="800" y="325" text-anchor="middle" class="c">16 characters</text><rect x="170" y="375" width="860" height="70" rx="16" fill="#17324d"/><text x="600" y="419" text-anchor="middle" font-family="monospace" font-size="17" fill="#fff">01ARZ3NDEKTSV4RRFFQ69G5FAV</text><text x="600" y="485" text-anchor="middle" class="b">Canonical byte order makes the time prefix sort first.</text></svg>
