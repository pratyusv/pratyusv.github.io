<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" role="img"><title>End-to-end order creation with UUIDv7, idempotency, and commit order</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 15px sans-serif;fill:#17324d}.b{font:12px sans-serif;fill:#45627d}.c{font:11px monospace;fill:#17324d}</style><rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="43" text-anchor="middle" class="t">Identity, retry deduplication, and event order stay separate</text><g><rect x="35" y="150" width="155" height="105" rx="16" fill="#fff" stroke="#b9c9d8"/><rect x="230" y="150" width="180" height="105" rx="16" fill="#eef4ff" stroke="#7399dc"/><rect x="450" y="150" width="180" height="105" rx="16" fill="#edf8f6" stroke="#5ab5a4"/><rect x="670" y="150" width="190" height="105" rx="16" fill="#fff8e7" stroke="#d6a63f"/><rect x="900" y="150" width="255" height="105" rx="16" fill="#17324d"/></g><text x="112" y="190" text-anchor="middle" class="h">Client</text><text x="112" y="225" text-anchor="middle" class="c">checkout-9f2</text><text x="320" y="190" text-anchor="middle" class="h">Deduplicate</text><text x="320" y="225" text-anchor="middle" class="c">stable request key</text><text x="540" y="190" text-anchor="middle" class="h">Generate UUIDv7</text><text x="540" y="225" text-anchor="middle" class="c">object identity</text><text x="765" y="190" text-anchor="middle" class="h">DB transaction</text><text x="765" y="225" text-anchor="middle" class="c">order + mapping</text><text x="1027" y="190" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#fff">Unique constraint</text><text x="1027" y="225" text-anchor="middle" font-family="monospace" font-size="11" fill="#a9eadc">final collision defense</text><g stroke="#55728f" stroke-width="3" marker-end="url(#a)"><path d="M190 202H230"/><path d="M410 202H450"/><path d="M630 202H670"/><path d="M860 202H900"/></g><rect x="300" y="405" width="260" height="130" rx="20" fill="#eef4ff" stroke="#7399dc"/><text x="430" y="447" text-anchor="middle" class="h">Object identity</text><text x="430" y="485" text-anchor="middle" class="c">UUIDv7</text><text x="430" y="515" text-anchor="middle" class="b">lookup + references</text><rect x="640" y="405" width="260" height="130" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="770" y="447" text-anchor="middle" class="h">Event order</text><text x="770" y="485" text-anchor="middle" class="c">outbox log position</text><text x="770" y="515" text-anchor="middle" class="b">stream ordering</text><path d="M765 255L500 405M765 255V345L770 405" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="250" y="590" width="700" height="55" rx="14" fill="#17324d"/><text x="600" y="625" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fff">The UUID identifies the order; it does not define commit or causal order.</text></svg>
