<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" role="img"><title>Clock rollback enters a timestamp range already used by a generator</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="550" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">A backward wall clock revisits previously used tuples</text><line x1="100" y1="300" x2="1100" y2="300" stroke="#b9c9d8" stroke-width="5"/><path d="M150 300L820 300L610 170" stroke="#7399dc" stroke-width="6" fill="none"/><circle cx="820" cy="300" r="15" fill="#5ab5a4"/><text x="820" y="345" text-anchor="middle" class="c">last = 12,500</text><circle cx="610" cy="170" r="15" fill="#d97979"/><text x="610" y="135" text-anchor="middle" class="c">next clock = 12,497</text><rect x="875" y="105" width="270" height="170" rx="20" fill="#fff0f0" stroke="#d97979"/><text x="1010" y="148" text-anchor="middle" class="h">Unsafe response</text><text x="1010" y="188" text-anchor="middle" class="c">sequence = 0</text><text x="1010" y="225" text-anchor="middle" class="b">may repeat old tuple</text><rect x="280" y="400" width="640" height="80" rx="17" fill="#17324d"/><text x="600" y="435" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">Refuse · wait with bound · pin logical time · persist generation</text><text x="600" y="463" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffcf99">large rollback is an alertable safety event</text></svg>
