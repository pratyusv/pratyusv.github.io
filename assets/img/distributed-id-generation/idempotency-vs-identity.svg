<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" role="img"><title>Object ID, idempotency key, and business number roles</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:14px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="540" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">One checkout carries several kinds of identity</text><rect x="55" y="190" width="220" height="125" rx="18" fill="#fff" stroke="#b9c9d8"/><text x="165" y="232" text-anchor="middle" class="h">Client retry</text><text x="165" y="270" text-anchor="middle" class="c">checkout-9f2</text><path d="M275 252H390" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><rect x="390" y="160" width="300" height="185" rx="20" fill="#eef4ff" stroke="#7399dc"/><text x="540" y="205" text-anchor="middle" class="h">Idempotency record</text><text x="540" y="245" text-anchor="middle" class="c">request key → one result</text><text x="540" y="288" text-anchor="middle" class="b">prevents duplicate creation</text><path d="M690 252H805" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><rect x="805" y="95" width="340" height="105" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><text x="975" y="135" text-anchor="middle" class="h">Order ID</text><text x="975" y="172" text-anchor="middle" class="c">identity of stored object</text><rect x="805" y="305" width="340" height="105" rx="18" fill="#fff8e7" stroke="#d6a63f"/><text x="975" y="345" text-anchor="middle" class="h">Invoice number</text><text x="975" y="382" text-anchor="middle" class="c">committed business sequence</text><path d="M690 235L805 155M690 270L805 355" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><text x="600" y="480" text-anchor="middle" class="b">A new unique ID on every retry still creates duplicate business objects.</text></svg>
