<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" role="img"><title>Classic Snowflake 64-bit field layout</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="500" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">A classic Snowflake divides one positive signed integer</text><rect x="55" y="155" width="1090" height="150" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="55" y="155" width="35" height="150" rx="15" fill="#fff" stroke="#b9c9d8"/><rect x="90" y="155" width="695" height="150" fill="#edf8f6" stroke="#5ab5a4"/><rect x="785" y="155" width="170" height="150" fill="#fff8e7" stroke="#d6a63f"/><text x="72" y="215" text-anchor="middle" class="h">0</text><text x="72" y="255" text-anchor="middle" class="c">1</text><text x="437" y="210" text-anchor="middle" class="h">Timestamp since custom epoch</text><text x="437" y="253" text-anchor="middle" class="c">41 bits · millisecond resolution</text><text x="870" y="210" text-anchor="middle" class="h">Worker</text><text x="870" y="253" text-anchor="middle" class="c">10 bits</text><text x="1050" y="210" text-anchor="middle" class="h">Sequence</text><text x="1050" y="253" text-anchor="middle" class="c">12 bits</text><rect x="265" y="380" width="670" height="60" rx="15" fill="#17324d"/><text x="600" y="418" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff">1 + 41 + 10 + 12 = 64 bits</text></svg>
