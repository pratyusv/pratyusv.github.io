<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" role="img"><title>Sequence allocation order differs from transaction commit order</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="540" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Allocation order is not visibility order</text><text x="95" y="155" class="h">T1</text><text x="95" y="315" class="h">T2</text><g stroke="#b9c9d8" stroke-width="3"><line x1="160" y1="150" x2="1110" y2="150"/><line x1="160" y1="310" x2="1110" y2="310"/></g><circle cx="260" cy="150" r="13" fill="#7399dc"/><text x="260" y="125" text-anchor="middle" class="c">nextval → 101</text><rect x="330" y="115" width="490" height="70" rx="14" fill="#eef4ff" stroke="#7399dc"/><text x="575" y="158" text-anchor="middle" class="b">slow validation and writes</text><circle cx="930" cy="150" r="15" fill="#5ab5a4"/><text x="930" y="125" text-anchor="middle" class="c">commit 101</text><circle cx="430" cy="310" r="13" fill="#7399dc"/><text x="430" y="285" text-anchor="middle" class="c">nextval → 102</text><circle cx="650" cy="310" r="15" fill="#5ab5a4"/><text x="650" y="285" text-anchor="middle" class="c">commit 102</text><line x1="650" y1="365" x2="930" y2="365" stroke="#d97979" stroke-width="4"/><text x="790" y="400" text-anchor="middle" class="h">102 becomes visible before 101</text><rect x="300" y="445" width="600" height="55" rx="14" fill="#17324d"/><text x="600" y="480" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff">issue order ≠ commit order</text></svg>
