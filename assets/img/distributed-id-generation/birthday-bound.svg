<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" role="img"><title>Birthday-bound collision probability</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="550" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Collision risk grows with the square of generated IDs</text><line x1="100" y1="420" x2="1100" y2="420" stroke="#55728f" stroke-width="3"/><line x1="100" y1="420" x2="100" y2="105" stroke="#55728f" stroke-width="3"/><path d="M105 415C430 410 710 350 1080 120" stroke="#7399dc" stroke-width="6" fill="none"/><text x="1120" y="445" text-anchor="end" class="b">number generated n</text><text x="125" y="100" class="b">collision probability</text><circle cx="835" cy="280" r="13" fill="#d97979"/><path d="M835 280H1030" stroke="#d97979" stroke-width="2" stroke-dasharray="7 5"/><rect x="710" y="165" width="375" height="85" rx="16" fill="#fff0f0" stroke="#d97979"/><text x="897" y="198" text-anchor="middle" class="c">p ≈ n(n−1) / 2N</text><text x="897" y="227" text-anchor="middle" class="b">uniform, independent values</text><rect x="190" y="175" width="340" height="120" rx="18" fill="#eef4ff" stroke="#7399dc"/><text x="360" y="215" text-anchor="middle" class="h">UUIDv4 at n = 10¹²</text><text x="360" y="255" text-anchor="middle" class="c">p ≈ 9.4 × 10⁻¹⁴</text><text x="600" y="495" text-anchor="middle" class="b">A broken random source invalidates the probability model.</text></svg>
