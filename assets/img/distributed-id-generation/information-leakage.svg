<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" role="img"><title>Metadata exposed by several ID formats</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="570" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">An identifier can become an unintended telemetry channel</text><g><rect x="45" y="95" width="250" height="330" rx="20" fill="#fff8e7" stroke="#d6a63f"/><rect x="330" y="95" width="250" height="330" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="615" y="95" width="250" height="330" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><rect x="900" y="95" width="255" height="330" rx="20" fill="#fff" stroke="#b9c9d8"/></g><text x="170" y="140" text-anchor="middle" class="h">Sequence</text><text x="170" y="190" text-anchor="middle" class="c">object count</text><text x="170" y="230" text-anchor="middle" class="c">relative order</text><text x="170" y="270" text-anchor="middle" class="c">enumeration</text><text x="455" y="140" text-anchor="middle" class="h">Snowflake</text><text x="455" y="190" text-anchor="middle" class="c">timestamp</text><text x="455" y="230" text-anchor="middle" class="c">worker bits</text><text x="455" y="270" text-anchor="middle" class="c">burst sequence</text><text x="740" y="140" text-anchor="middle" class="h">UUIDv7 / ULID</text><text x="740" y="190" text-anchor="middle" class="c">timestamp</text><text x="740" y="230" text-anchor="middle" class="c">random suffix</text><text x="1027" y="140" text-anchor="middle" class="h">UUIDv4</text><text x="1027" y="190" text-anchor="middle" class="c">random value</text><text x="1027" y="230" text-anchor="middle" class="b">high opacity</text><text x="1027" y="270" text-anchor="middle" class="b">still not authorization</text><rect x="260" y="465" width="680" height="60" rx="15" fill="#17324d"/><text x="600" y="503" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">Use a separate opaque public token when metadata leakage matters.</text></svg>
