<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img"><title>Consistency-preserving partition behavior</title><defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="540" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">Preserve one authority by making the minority unavailable</text><rect x="65" y="105" width="480" height="330" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="305" y="150" text-anchor="middle" class="h">Quorum side</text><text x="305" y="215" text-anchor="middle" class="b">reserve(A1)</text><rect x="175" y="255" width="260" height="80" rx="14" fill="#fff" stroke="#5ab5a4"/><text x="305" y="290" text-anchor="middle" class="h">SUCCESS · A1 → B1</text><text x="305" y="317" text-anchor="middle" class="b">one-copy order preserved</text><rect x="655" y="105" width="480" height="330" rx="20" fill="#fff1f2" stroke="#d96b79"/><text x="895" y="150" text-anchor="middle" class="h">Minority side</text><text x="895" y="215" text-anchor="middle" class="b">reserve(A1)</text><rect x="765" y="255" width="260" height="80" rx="14" fill="#fff" stroke="#d96b79"/><text x="895" y="290" text-anchor="middle" class="h">UNAVAILABLE</text><text x="895" y="317" text-anchor="middle" class="b">cannot prove authority</text><text x="600" y="490" text-anchor="middle" class="b">Consistency is retained because not every reachable replica completes the request.</text></svg>
