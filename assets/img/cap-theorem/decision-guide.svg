<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img">
  <title>CAP decision procedure</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#55728f"/>
    </marker>
    <style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 15px sans-serif;fill:#17324d}.b{font:12px sans-serif;fill:#45627d}</style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#f7fafc"/>
  <text x="600" y="46" text-anchor="middle" class="t">Turn a CAP label into a testable operation contract</text>
  <g>
    <rect x="70" y="115" width="230" height="105" rx="16" fill="#edf8f6" stroke="#5ab5a4"/>
    <text x="185" y="153" text-anchor="middle" class="h">1 &#xB7; State invariant</text>
    <text x="185" y="182" text-anchor="middle" class="b">what must never happen?</text>
    <rect x="360" y="115" width="230" height="105" rx="16" fill="#edf8f6" stroke="#5ab5a4"/>
    <text x="475" y="153" text-anchor="middle" class="h">2 &#xB7; Find authority</text>
    <text x="475" y="182" text-anchor="middle" class="b">which messages are required?</text>
    <rect x="650" y="115" width="230" height="105" rx="16" fill="#fff8e8" stroke="#e4b85b"/>
    <text x="765" y="153" text-anchor="middle" class="h">3 &#xB7; Partition it</text>
    <text x="765" y="182" text-anchor="middle" class="b">what completes on each side?</text>
    <rect x="940" y="115" width="190" height="105" rx="16" fill="#fff8e8" stroke="#e4b85b"/>
    <text x="1035" y="153" text-anchor="middle" class="h">4 &#xB7; Bound client</text>
    <text x="1035" y="182" text-anchor="middle" class="b">deadline and retry</text>
    <path d="M300 167H360M590 167H650M880 167H940" stroke="#55728f" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <rect x="220" y="350" width="300" height="115" rx="16" fill="#f3effb" stroke="#9377c6"/>
    <text x="370" y="390" text-anchor="middle" class="h">5 &#xB7; Define recovery</text>
    <text x="370" y="420" text-anchor="middle" class="b">catch up, merge, or compensate</text>
    <rect x="680" y="350" width="300" height="115" rx="16" fill="#f3effb" stroke="#9377c6"/>
    <text x="830" y="390" text-anchor="middle" class="h">6 &#xB7; Observe completion</text>
    <text x="830" y="420" text-anchor="middle" class="b">prove the system converged safely</text>
    <path d="M1035 220V290H370V350" stroke="#55728f" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <path d="M520 407H680" stroke="#55728f" stroke-width="3" fill="none" marker-end="url(#a)"/>
  </g>
  <text x="600" y="560" text-anchor="middle" class="b">The failure response and the recovery algorithm are one design.</text>
</svg>
