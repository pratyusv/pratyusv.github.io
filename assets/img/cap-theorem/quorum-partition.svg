<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img"><title>Majority quorum during a partition</title><defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="540" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">A majority quorum gives authority to only one side</text><rect x="55" y="100" width="650" height="330" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="380" y="145" text-anchor="middle" class="h">Partition A · two of three replicas</text><circle cx="270" cy="245" r="70" fill="#fff" stroke="#5ab5a4"/><text x="270" y="240" text-anchor="middle" class="h">L1</text><text x="270" y="267" text-anchor="middle" class="b">vote</text><circle cx="490" cy="245" r="70" fill="#fff" stroke="#5ab5a4"/><text x="490" y="240" text-anchor="middle" class="h">L2</text><text x="490" y="267" text-anchor="middle" class="b">vote</text><text x="380" y="375" text-anchor="middle" class="h">2 votes → operation may complete</text><rect x="795" y="100" width="350" height="330" rx="20" fill="#fff1f2" stroke="#d96b79"/><text x="970" y="145" text-anchor="middle" class="h">Partition B · one replica</text><circle cx="970" cy="245" r="70" fill="#fff" stroke="#d96b79"/><text x="970" y="240" text-anchor="middle" class="h">D1</text><text x="970" y="267" text-anchor="middle" class="b">vote</text><text x="970" y="375" text-anchor="middle" class="h">1 vote → unavailable</text><text x="600" y="495" text-anchor="middle" class="b">The safety overlap exists because the minority is intentionally denied authority.</text></svg>
