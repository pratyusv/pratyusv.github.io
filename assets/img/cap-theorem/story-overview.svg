<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img"><title>Two ticket replicas separated by a network partition</title><defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="600" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">One seat, two reachable replicas, no communication</text><rect x="80" y="120" width="360" height="310" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="260" y="162" text-anchor="middle" class="h">London</text><text x="260" y="208" text-anchor="middle" class="b">seat A1 · remaining = 1</text><rect x="135" y="265" width="250" height="80" rx="14" fill="#fff" stroke="#b7c8d8"/><text x="260" y="298" text-anchor="middle" class="h">Buyer B1</text><text x="260" y="324" text-anchor="middle" class="b">reserve(A1)</text><rect x="760" y="120" width="360" height="310" rx="20" fill="#fff8e8" stroke="#e4b85b"/><text x="940" y="162" text-anchor="middle" class="h">Dublin</text><text x="940" y="208" text-anchor="middle" class="b">seat A1 · remaining = 1</text><rect x="815" y="265" width="250" height="80" rx="14" fill="#fff" stroke="#b7c8d8"/><text x="940" y="298" text-anchor="middle" class="h">Buyer B2</text><text x="940" y="324" text-anchor="middle" class="b">reserve(A1)</text><path d="M440 245H555M645 245H760" stroke="#d96b79" stroke-width="5" stroke-dasharray="12 8"/><path d="M565 205L635 285M635 205L565 285" stroke="#d96b79" stroke-width="8"/><text x="600" y="340" text-anchor="middle" class="h">partition</text><rect x="220" y="490" width="760" height="48" rx="10" fill="#17324d"/><text x="600" y="520" text-anchor="middle" style="font:700 14px sans-serif;fill:#fff">Both regions can answer clients; neither can know the other's concurrent state.</text></svg>
