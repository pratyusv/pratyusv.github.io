<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"><title>CAP as a conditional branch rather than a triangle</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">CAP is a failure-time branch, not a product menu</text><rect x="390" y="95" width="420" height="90" rx="16" fill="#17324d"/><text x="600" y="132" text-anchor="middle" style="font:700 17px sans-serif;fill:#fff">Required replicas cannot communicate</text><text x="600" y="160" text-anchor="middle" style="font:12px sans-serif;fill:#dce8f2">partition condition</text><path d="M500 185L310 290M700 185L890 290" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="90" y="290" width="420" height="160" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><text x="300" y="335" text-anchor="middle" class="h">Preserve linearizability</text><text x="300" y="380" text-anchor="middle" class="b">some requests cannot complete</text><text x="300" y="410" text-anchor="middle" class="b">during the partition</text><rect x="690" y="290" width="420" height="160" rx="18" fill="#fff8e8" stroke="#e4b85b"/><text x="900" y="335" text-anchor="middle" class="h">Preserve response availability</text><text x="900" y="380" text-anchor="middle" class="b">completed operations may diverge</text><text x="900" y="410" text-anchor="middle" class="b">and require reconciliation</text><text x="600" y="515" text-anchor="middle" class="b">When communication is healthy, both properties may be provided together.</text></svg>
