<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img"><title>Availability-preserving partition behavior</title><defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="540" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">Answer on both sides and carry divergence into recovery</text><rect x="65" y="105" width="480" height="310" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="305" y="150" text-anchor="middle" class="h">London</text><text x="305" y="210" text-anchor="middle" class="b">local state: A1 available</text><rect x="175" y="250" width="260" height="80" rx="14" fill="#fff" stroke="#5ab5a4"/><text x="305" y="285" text-anchor="middle" class="h">SUCCESS · A1 → B1</text><text x="305" y="312" text-anchor="middle" class="b">respond from local copy</text><rect x="655" y="105" width="480" height="310" rx="20" fill="#fff8e8" stroke="#e4b85b"/><text x="895" y="150" text-anchor="middle" class="h">Dublin</text><text x="895" y="210" text-anchor="middle" class="b">local state: A1 available</text><rect x="765" y="250" width="260" height="80" rx="14" fill="#fff" stroke="#e4b85b"/><text x="895" y="285" text-anchor="middle" class="h">SUCCESS · A1 → B2</text><text x="895" y="312" text-anchor="middle" class="b">respond from local copy</text><rect x="310" y="455" width="580" height="42" rx="9" fill="#17324d"/><text x="600" y="482" text-anchor="middle" style="font:700 14px sans-serif;fill:#fff">Availability is retained; merge or compensation must resolve the conflict.</text></svg>
