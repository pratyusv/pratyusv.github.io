<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img"><title>Linearizability respects real-time order</title><defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="500" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">A later read cannot forget a completed write</text><line x1="100" y1="230" x2="1100" y2="230" stroke="#b7c8d8" stroke-width="3"/><rect x="170" y="165" width="330" height="90" rx="15" fill="#edf8f6" stroke="#5ab5a4"/><text x="335" y="201" text-anchor="middle" class="h">write remaining = 0</text><text x="335" y="229" text-anchor="middle" class="b">response completes here</text><circle cx="500" cy="230" r="8" fill="#3b9f8a"/><rect x="700" y="165" width="300" height="90" rx="15" fill="#fff8e8" stroke="#e4b85b"/><text x="850" y="201" text-anchor="middle" class="h">read remaining</text><text x="850" y="229" text-anchor="middle" class="b">must return 0, not 1</text><circle cx="700" cy="230" r="8" fill="#e4b85b"/><path d="M520 320H680" stroke="#55728f" stroke-width="4"/><text x="600" y="355" text-anchor="middle" class="b">real-time precedence</text><text x="100" y="260" class="b">earlier</text><text x="1050" y="260" class="b">later</text></svg>
