<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img"><title>CAP choices scoped by operation</title><defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="620" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">One product can choose differently for different invariants</text><rect x="65" y="95" width="1070" height="440" rx="20" fill="#fff" stroke="#b7c8d8"/><rect x="65" y="95" width="1070" height="58" rx="20" fill="#17324d"/><g style="font:700 14px sans-serif;fill:#fff"><text x="115" y="132">Operation</text><text x="520" y="132">Partition response</text><text x="900" y="132">Reason</text></g><g class="b"><text x="115" y="205">reserve unique seat</text><text x="520" y="205">require authority</text><text x="900" y="205">exclusive ownership</text><text x="115" y="275">read event text</text><text x="520" y="275">serve stale copy</text><text x="900" y="275">bounded staleness acceptable</text><text x="115" y="345">count page view</text><text x="520" y="345">accept and merge</text><text x="900" y="345">commutative accumulation</text><text x="115" y="415">update payment</text><text x="520" y="415">require authority</text><text x="900" y="415">money invariant</text><text x="115" y="485">recommend items</text><text x="520" y="485">degrade locally</text><text x="900" y="485">best-effort result</text></g><text x="600" y="580" text-anchor="middle" class="b">A database label cannot replace an operation-level contract.</text></svg>
