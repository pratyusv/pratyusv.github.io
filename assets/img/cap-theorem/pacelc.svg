<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img"><title>PACELC decision branches</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="530" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">PACELC adds the ordinary healthy-network tradeoff</text><rect x="430" y="90" width="340" height="75" rx="15" fill="#17324d"/><text x="600" y="136" text-anchor="middle" style="font:700 17px sans-serif;fill:#fff">Can required nodes communicate?</text><path d="M500 165L300 260M700 165L900 260" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="80" y="260" width="440" height="165" rx="18" fill="#fff1f2" stroke="#d96b79"/><text x="300" y="305" text-anchor="middle" class="h">Partition: no</text><text x="300" y="350" text-anchor="middle" class="b">availability of responses</text><text x="300" y="380" text-anchor="middle" class="b">versus linearizable consistency</text><rect x="680" y="260" width="440" height="165" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><text x="900" y="305" text-anchor="middle" class="h">Else: yes</text><text x="900" y="350" text-anchor="middle" class="b">lower coordination latency</text><text x="900" y="380" text-anchor="middle" class="b">versus stronger consistency</text><text x="600" y="490" text-anchor="middle" class="b">Latency, durability, and consistency still require explicit definitions on both branches.</text></svg>
