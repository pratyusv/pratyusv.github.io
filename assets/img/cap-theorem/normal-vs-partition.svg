<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img"><title>Normal and partitioned operation</title><defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="540" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">The same system has a normal path and a partition path</text><rect x="55" y="100" width="520" height="340" rx="20" fill="#fff" stroke="#5ab5a4"/><text x="315" y="145" text-anchor="middle" class="h">Communication healthy</text><text x="315" y="210" text-anchor="middle" class="b">replicas exchange writes and acknowledgements</text><text x="315" y="255" text-anchor="middle" class="b">strong responses can still be available</text><text x="315" y="300" text-anchor="middle" class="b">latency depends on coordination distance</text><text x="315" y="345" text-anchor="middle" class="b">durability depends on acknowledgement policy</text><rect x="625" y="100" width="520" height="340" rx="20" fill="#fff" stroke="#d96b79"/><text x="885" y="145" text-anchor="middle" class="h">Communication partitioned</text><text x="885" y="210" text-anchor="middle" class="b">required acknowledgements cannot arrive</text><text x="885" y="255" text-anchor="middle" class="b">wait/reject to preserve one-copy order</text><text x="885" y="300" text-anchor="middle" class="b">or answer locally and permit divergence</text><text x="885" y="345" text-anchor="middle" class="b">recovery must match the chosen contract</text><text x="600" y="500" text-anchor="middle" class="b">CAP constrains the right-hand path; it does not describe every normal-operation tradeoff.</text></svg>
