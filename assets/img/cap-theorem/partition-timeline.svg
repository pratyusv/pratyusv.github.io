<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img"><title>Missing messages create indistinguishable remote states</title><defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="600" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">A timeout does not reveal the remote world</text><rect x="70" y="105" width="270" height="380" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="205" y="145" text-anchor="middle" class="h">London observes</text><text x="205" y="205" text-anchor="middle" class="b">request arrived</text><text x="205" y="250" text-anchor="middle" class="b">message sent to Dublin</text><text x="205" y="295" text-anchor="middle" class="b">no reply before deadline</text><rect x="420" y="95" width="700" height="400" rx="20" fill="#fff" stroke="#b7c8d8"/><text x="770" y="135" text-anchor="middle" class="h">All of these are compatible with the observation</text><g class="b"><text x="475" y="205">1. Dublin crashed before receiving the message</text><text x="475" y="260">2. the network dropped the request</text><text x="475" y="315">3. Dublin committed a concurrent reservation</text><text x="475" y="370">4. Dublin's successful reply is only delayed</text><text x="475" y="425">5. the link will recover one millisecond after timeout</text></g><rect x="275" y="530" width="650" height="42" rx="9" fill="#17324d"/><text x="600" y="557" text-anchor="middle" style="font:700 14px sans-serif;fill:#fff">Waiting changes policy; it does not manufacture information.</text></svg>
