<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"><title>Precise CAP definitions</title><defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 28px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">CAP uses precise system-model definitions</text><rect x="55" y="105" width="340" height="340" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="225" y="165" text-anchor="middle" class="h">C</text><text x="225" y="205" text-anchor="middle" style="font:700 17px sans-serif;fill:#17324d">Linearizability</text><text x="225" y="260" text-anchor="middle" class="b">Completed operations appear in</text><text x="225" y="285" text-anchor="middle" class="b">one order that respects real time.</text><rect x="430" y="105" width="340" height="340" rx="20" fill="#fff8e8" stroke="#e4b85b"/><text x="600" y="165" text-anchor="middle" class="h">A</text><text x="600" y="205" text-anchor="middle" style="font:700 17px sans-serif;fill:#17324d">Availability</text><text x="600" y="260" text-anchor="middle" class="b">Every request received by a</text><text x="600" y="285" text-anchor="middle" class="b">non-failing node eventually responds.</text><rect x="805" y="105" width="340" height="340" rx="20" fill="#fff1f2" stroke="#d96b79"/><text x="975" y="165" text-anchor="middle" class="h">P</text><text x="975" y="205" text-anchor="middle" style="font:700 17px sans-serif;fill:#17324d">Partition</text><text x="975" y="260" text-anchor="middle" class="b">Required messages are lost or</text><text x="975" y="285" text-anchor="middle" class="b">delayed without a usable bound.</text><text x="600" y="510" text-anchor="middle" class="b">The theorem asks which guarantees remain possible when the third condition occurs.</text></svg>
