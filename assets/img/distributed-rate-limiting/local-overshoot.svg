<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" role="img"><title>Independent gateway buckets multiply global burst capacity</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="550" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Local correctness can violate the global contract</text><g><rect x="55" y="110" width="300" height="120" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="450" y="110" width="300" height="120" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="845" y="110" width="300" height="120" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="55" y="290" width="300" height="120" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="450" y="290" width="300" height="120" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="845" y="290" width="300" height="120" rx="18" fill="#edf8f6" stroke="#5ab5a4"/></g><g class="h"><text x="205" y="153" text-anchor="middle">Gateway G1</text><text x="600" y="153" text-anchor="middle">Gateway G2</text><text x="995" y="153" text-anchor="middle">Gateway G3</text><text x="205" y="333" text-anchor="middle">Gateway G4</text><text x="600" y="333" text-anchor="middle">Gateway G5</text><text x="995" y="333" text-anchor="middle">Gateway G6</text></g><g class="c"><text x="205" y="195" text-anchor="middle">40 local tokens</text><text x="600" y="195" text-anchor="middle">40 local tokens</text><text x="995" y="195" text-anchor="middle">40 local tokens</text><text x="205" y="375" text-anchor="middle">40 local tokens</text><text x="600" y="375" text-anchor="middle">40 local tokens</text><text x="995" y="375" text-anchor="middle">40 local tokens</text></g><rect x="355" y="450" width="490" height="65" rx="15" fill="#17324d"/><text x="600" y="490" text-anchor="middle" font-family="monospace" font-size="15" fill="#ffcf99">global immediate admission = 6 × 40 = 240</text></svg>
