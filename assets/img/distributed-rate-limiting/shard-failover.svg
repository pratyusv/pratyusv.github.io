<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Rate-limit shard failover with an uncertain response</title><desc id="desc">A decision commits on a quorum, its response is lost, the leader fails, a new term is elected, and retrying the same decision ID returns the stored result without spending twice.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.title{font:700 26px system-ui;fill:#17324d}.head{font:700 16px system-ui;fill:#17324d}.body{font:13px system-ui;fill:#45627d}.white{font:700 14px system-ui;fill:#fff}</style></defs><rect width="1200" height="620" rx="26" fill="#f7fafc"/><text x="600" y="50" text-anchor="middle" class="title">Failover must resolve “committed, but the reply was lost”</text><line x1="105" y1="295" x2="1090" y2="295" stroke="#9bb0c2" stroke-width="4" marker-end="url(#arrow)"/><rect x="45" y="125" width="190" height="125" rx="15" fill="#edf8f6" stroke="#5ab5a4"/><text x="140" y="160" text-anchor="middle" class="head">1 · Send decision</text><text x="140" y="190" text-anchor="middle" class="body">ID D-91</text><text x="140" y="214" text-anchor="middle" class="body">shard epoch 83</text><circle cx="140" cy="295" r="10" fill="#5ab5a4"/><rect x="275" y="340" width="190" height="125" rx="15" fill="#edf8f6" stroke="#5ab5a4"/><text x="370" y="375" text-anchor="middle" class="head">2 · Quorum commit</text><text x="370" y="405" text-anchor="middle" class="body">ALLOW stored for D-91</text><text x="370" y="429" text-anchor="middle" class="body">tokens 18 → 15</text><circle cx="370" cy="295" r="10" fill="#5ab5a4"/><rect x="505" y="125" width="190" height="125" rx="15" fill="#fff0f0" stroke="#d86969"/><text x="600" y="160" text-anchor="middle" class="head">3 · Reply lost</text><text x="600" y="190" text-anchor="middle" class="body">gateway sees timeout</text><text x="600" y="214" text-anchor="middle" class="body">outcome is unknown</text><circle cx="600" cy="295" r="10" fill="#d86969"/><rect x="735" y="340" width="190" height="125" rx="15" fill="#fff8e8" stroke="#e4b85b"/><text x="830" y="375" text-anchor="middle" class="head">4 · Promote replica</text><text x="830" y="405" text-anchor="middle" class="body">term 43 · epoch 84</text><text x="830" y="429" text-anchor="middle" class="body">old leader fenced</text><circle cx="830" cy="295" r="10" fill="#e4b85b"/><rect x="965" y="125" width="190" height="125" rx="15" fill="#f3effb" stroke="#9377c6"/><text x="1060" y="160" text-anchor="middle" class="head">5 · Retry D-91</text><text x="1060" y="190" text-anchor="middle" class="body">return stored ALLOW</text><text x="1060" y="214" text-anchor="middle" class="body">do not deduct again</text><circle cx="1060" cy="295" r="10" fill="#9377c6"/><rect x="175" y="520" width="850" height="55" rx="13" fill="#17324d"/><text x="600" y="553" text-anchor="middle" class="white">A decision ID closes the retry ambiguity only if its outcome survives leader failover.</text></svg>
