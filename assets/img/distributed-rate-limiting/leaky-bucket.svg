<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" role="img"><title>Leaky bucket smooths bursty arrivals through a bounded queue</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="550" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">A bounded queue converts bursty arrival into steady departure</text><rect x="55" y="145" width="235" height="130" rx="18" fill="#fff8e7" stroke="#d6a63f"/><text x="172" y="185" text-anchor="middle" class="h">Bursty arrivals</text><text x="172" y="220" text-anchor="middle" class="c">12 · 0 · 8 · 1</text><text x="172" y="250" text-anchor="middle" class="b">requests per tick</text><path d="M290 210H405" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><rect x="405" y="110" width="390" height="260" rx="22" fill="#eef4ff" stroke="#7399dc"/><text x="600" y="150" text-anchor="middle" class="h">Bounded queue</text><g><rect x="455" y="200" width="55" height="70" rx="8" fill="#7399dc"/><rect x="520" y="200" width="55" height="70" rx="8" fill="#7399dc"/><rect x="585" y="200" width="55" height="70" rx="8" fill="#7399dc"/><rect x="650" y="200" width="55" height="70" rx="8" fill="#7399dc"/><rect x="715" y="200" width="35" height="70" rx="8" fill="#fff" stroke="#b9c9d8"/></g><text x="600" y="320" text-anchor="middle" class="b">delay rises until capacity is full</text><path d="M795 240H910" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><rect x="910" y="175" width="235" height="130" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><text x="1027" y="215" text-anchor="middle" class="h">Steady drain</text><text x="1027" y="250" text-anchor="middle" class="c">5 requests / tick</text><text x="1027" y="280" text-anchor="middle" class="b">smoothed output</text><path d="M600 370V455" stroke="#d97979" stroke-width="3" marker-end="url(#a)"/><text x="615" y="420" class="b">full queue → reject</text></svg>
