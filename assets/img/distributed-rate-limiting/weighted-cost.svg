<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" role="img"><title>Weighted requests consume different quota costs</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="550" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Request count is not always resource cost</text><g><rect x="55" y="95" width="270" height="80" rx="15" fill="#fff" stroke="#b9c9d8"/><rect x="55" y="205" width="270" height="80" rx="15" fill="#eef4ff" stroke="#7399dc"/><rect x="55" y="315" width="270" height="80" rx="15" fill="#edf8f6" stroke="#5ab5a4"/><rect x="55" y="425" width="270" height="80" rx="15" fill="#fff8e7" stroke="#d6a63f"/></g><text x="190" y="143" text-anchor="middle" class="c">metadata lookup · 1</text><text x="190" y="253" text-anchor="middle" class="c">full-text search · 3</text><text x="190" y="363" text-anchor="middle" class="c">vector rerank · 10</text><text x="190" y="473" text-anchor="middle" class="c">export job · 100</text><path d="M325 135L485 245M325 245H485M325 355L485 285M325 465L485 305" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="485" y="175" width="310" height="190" rx="22" fill="#17324d"/><text x="640" y="217" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">Weighted bucket</text><text x="640" y="260" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff">available = 75 units</text><text x="640" y="305" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#a9eadc">deduct known cost</text><text x="640" y="337" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffcf99">or reserve maximum</text><path d="M795 270H900" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><rect x="900" y="195" width="250" height="150" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="1025" y="235" text-anchor="middle" class="h">Settlement</text><text x="1025" y="275" text-anchor="middle" class="c">actual cost by request ID</text><text x="1025" y="313" text-anchor="middle" class="b">return unused reserve</text></svg>
