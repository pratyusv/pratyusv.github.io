<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" role="img"><title>Global rate-limit service in the synchronous request path</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Strict global decisions add a dependency to every request</text><g><rect x="45" y="185" width="150" height="90" rx="16" fill="#fff" stroke="#b9c9d8"/><rect x="270" y="185" width="170" height="90" rx="16" fill="#eef4ff" stroke="#7399dc"/><rect x="515" y="155" width="210" height="150" rx="18" fill="#fff8e7" stroke="#d6a63f"/><rect x="800" y="185" width="165" height="90" rx="16" fill="#eef4ff" stroke="#7399dc"/><rect x="1040" y="185" width="115" height="90" rx="16" fill="#edf8f6" stroke="#5ab5a4"/></g><text x="120" y="237" text-anchor="middle" class="h">Client</text><text x="355" y="237" text-anchor="middle" class="h">Gateway</text><text x="620" y="200" text-anchor="middle" class="h">Global limiter</text><text x="620" y="235" text-anchor="middle" class="c">RPC per request</text><text x="620" y="270" text-anchor="middle" class="b">timeout + failure policy</text><text x="882" y="220" text-anchor="middle" class="h">State shard</text><text x="882" y="250" text-anchor="middle" class="c">atomic key</text><text x="1097" y="237" text-anchor="middle" class="h">API</text><g stroke="#55728f" stroke-width="3" marker-end="url(#a)"><path d="M195 230H270"/><path d="M440 230H515"/><path d="M725 230H800"/><path d="M965 230H1040"/></g><path d="M620 305V410H355V275" stroke="#d97979" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#a)"/><text x="500" y="395" text-anchor="middle" class="b">deny or unavailable</text></svg>
