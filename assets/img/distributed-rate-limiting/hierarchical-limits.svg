<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" role="img"><title>One request consumes several hierarchical rate limits</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="580" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Admission can require several independent budgets</text><rect x="45" y="225" width="190" height="110" rx="18" fill="#fff" stroke="#b9c9d8"/><text x="140" y="265" text-anchor="middle" class="h">Acme search</text><text x="140" y="300" text-anchor="middle" class="c">cost = 3 units</text><path d="M235 280H345" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><g><rect x="345" y="75" width="390" height="75" rx="15" fill="#eef4ff" stroke="#7399dc"/><rect x="345" y="165" width="390" height="75" rx="15" fill="#edf8f6" stroke="#5ab5a4"/><rect x="345" y="255" width="390" height="75" rx="15" fill="#fff8e7" stroke="#d6a63f"/><rect x="345" y="345" width="390" height="75" rx="15" fill="#eef4ff" stroke="#7399dc"/><rect x="345" y="435" width="390" height="75" rx="15" fill="#edf8f6" stroke="#5ab5a4"/></g><text x="540" y="120" text-anchor="middle" class="c">source network: spend 1 request</text><text x="540" y="210" text-anchor="middle" class="c">tenant search: spend 3 units</text><text x="540" y="300" text-anchor="middle" class="c">tenant aggregate: spend 3 units</text><text x="540" y="390" text-anchor="middle" class="c">search cluster: spend 1 request</text><text x="540" y="480" text-anchor="middle" class="c">monthly quota: spend 3 units</text><path d="M735 112L870 240M735 202L870 260M735 292H870M735 382L870 310M735 472L870 330" stroke="#55728f" stroke-width="2" marker-end="url(#a)"/><rect x="870" y="220" width="275" height="140" rx="20" fill="#17324d"/><text x="1007" y="265" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">Final decision</text><text x="1007" y="305" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffcf99">deny if any hard limit</text><text x="1007" y="335" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffcf99">cannot admit</text></svg>
