<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" role="img"><title>A global rate-limit key becomes a single-shard hotspot</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="550" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">A global counter cannot be scaled by hashing the same key</text><g><circle cx="115" cy="145" r="42" fill="#eef4ff" stroke="#7399dc"/><circle cx="115" cy="270" r="42" fill="#eef4ff" stroke="#7399dc"/><circle cx="115" cy="395" r="42" fill="#eef4ff" stroke="#7399dc"/></g><text x="115" y="151" text-anchor="middle" class="c">G1</text><text x="115" y="276" text-anchor="middle" class="c">G2</text><text x="115" y="401" text-anchor="middle" class="c">G3</text><path d="M157 145L475 250M157 270H475M157 395L475 290" stroke="#d97979" stroke-width="4" marker-end="url(#a)"/><rect x="475" y="175" width="315" height="190" rx="22" fill="#fff0f0" stroke="#d97979"/><text x="632" y="220" text-anchor="middle" class="h">Hot key on shard 12</text><text x="632" y="260" text-anchor="middle" class="c">destination=search</text><text x="632" y="300" text-anchor="middle" class="b">every request mutates</text><text x="632" y="330" text-anchor="middle" class="b">one serialized state record</text><g><rect x="900" y="100" width="230" height="90" rx="16" fill="#fff" stroke="#b9c9d8"/><rect x="900" y="230" width="230" height="90" rx="16" fill="#fff" stroke="#b9c9d8"/><rect x="900" y="360" width="230" height="90" rx="16" fill="#fff" stroke="#b9c9d8"/></g><text x="1015" y="152" text-anchor="middle" class="c">idle shard 11</text><text x="1015" y="282" text-anchor="middle" class="c">idle shard 13</text><text x="1015" y="412" text-anchor="middle" class="c">idle shard 14</text></svg>
