<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" role="img"><title>Token bucket refill, burst, and rejection</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Tokens accumulate slowly and may be spent in a burst</text><rect x="75" y="130" width="230" height="95" rx="17" fill="#eef4ff" stroke="#7399dc"/><text x="190" y="167" text-anchor="middle" class="h">Continuous refill</text><text x="190" y="198" text-anchor="middle" class="c">r = 10 tokens/s</text><path d="M305 178H485" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><path d="M485 125V400Q485 445 530 445H740Q785 445 785 400V125" fill="#edf8f6" stroke="#5ab5a4" stroke-width="4"/><line x1="500" y1="315" x2="770" y2="315" stroke="#5ab5a4" stroke-width="5"/><g fill="#5ab5a4"><circle cx="535" cy="370" r="13"/><circle cx="585" cy="370" r="13"/><circle cx="635" cy="370" r="13"/><circle cx="685" cy="370" r="13"/><circle cx="735" cy="370" r="13"/></g><text x="635" y="280" text-anchor="middle" class="h">capacity B = 40</text><text x="635" y="415" text-anchor="middle" class="c">available T = 5</text><path d="M785 355H930" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><rect x="930" y="300" width="220" height="110" rx="18" fill="#fff8e7" stroke="#d6a63f"/><text x="1040" y="340" text-anchor="middle" class="h">Request cost c</text><text x="1040" y="375" text-anchor="middle" class="c">spend if T ≥ c</text><text x="600" y="510" text-anchor="middle" class="b">An idle bucket can release at most B immediately; afterward admission follows r.</text></svg>
