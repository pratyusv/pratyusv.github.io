<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" role="img"><title>Global allocator leases token batches to regional gateways</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="580" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">The allocator bounds live spendable entitlement</text><rect x="425" y="85" width="350" height="145" rx="22" fill="#17324d"/><text x="600" y="127" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">Global quota allocator</text><text x="600" y="166" text-anchor="middle" font-family="monospace" font-size="13" fill="#fff">issue · renew · rebalance</text><text x="600" y="201" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dce5ed">never exceed risk budget</text><g><rect x="55" y="340" width="310" height="155" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="445" y="340" width="310" height="155" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><rect x="835" y="340" width="310" height="155" rx="20" fill="#fff8e7" stroke="#d6a63f"/></g><text x="210" y="380" text-anchor="middle" class="h">eu-west</text><text x="210" y="417" text-anchor="middle" class="c">A-71 · 300 tokens</text><text x="210" y="452" text-anchor="middle" class="b">spend locally</text><text x="600" y="380" text-anchor="middle" class="h">us-east</text><text x="600" y="417" text-anchor="middle" class="c">A-72 · 200 tokens</text><text x="600" y="452" text-anchor="middle" class="b">report cumulative use</text><text x="990" y="380" text-anchor="middle" class="h">ap-south</text><text x="990" y="417" text-anchor="middle" class="c">A-73 · 50 tokens</text><text x="990" y="452" text-anchor="middle" class="b">expires at epoch end</text><path d="M490 230L270 340M600 230V340M710 230L930 340" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><text x="600" y="545" text-anchor="middle" class="c">unobserved spend ≤ sum of outstanding allocations</text></svg>
