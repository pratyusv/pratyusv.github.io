<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" role="img"><title>Rate-limit failure policies by purpose</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="580" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Failure policy follows the consequence of excess traffic</text><rect x="390" y="85" width="420" height="95" rx="18" fill="#fff0f0" stroke="#d97979"/><text x="600" y="125" text-anchor="middle" class="h">Global limiter unavailable</text><text x="600" y="155" text-anchor="middle" class="c">timeout · shard error · stale allocation</text><g><rect x="45" y="265" width="335" height="210" rx="20" fill="#fff0f0" stroke="#d97979"/><rect x="432" y="265" width="335" height="210" rx="20" fill="#fff8e7" stroke="#d6a63f"/><rect x="820" y="265" width="335" height="210" rx="20" fill="#edf8f6" stroke="#5ab5a4"/></g><text x="212" y="310" text-anchor="middle" class="h">Fail closed</text><text x="212" y="350" text-anchor="middle" class="c">deny without global proof</text><text x="212" y="390" text-anchor="middle" class="b">hard quota · fragile resource</text><text x="212" y="430" text-anchor="middle" class="b">availability cost is explicit</text><text x="599" y="310" text-anchor="middle" class="h">Bounded fallback</text><text x="599" y="350" text-anchor="middle" class="c">spend local emergency bucket</text><text x="599" y="390" text-anchor="middle" class="b">limited autonomy</text><text x="599" y="430" text-anchor="middle" class="b">reconcile after recovery</text><text x="987" y="310" text-anchor="middle" class="h">Fail open</text><text x="987" y="350" text-anchor="middle" class="c">allow + emit telemetry</text><text x="987" y="390" text-anchor="middle" class="b">only when overlap is cheap</text><text x="987" y="430" text-anchor="middle" class="b">still cap abusive traffic</text><path d="M520 180L260 265M600 180V265M680 180L940 265" stroke="#55728f" stroke-width="3"/></svg>
