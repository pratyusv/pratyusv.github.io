<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" role="img"><title>Rate limiter admission decision before downstream work</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="500" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Admission happens before scarce work begins</text><g><rect x="45" y="180" width="175" height="100" rx="17" fill="#fff" stroke="#b9c9d8"/><rect x="285" y="180" width="190" height="100" rx="17" fill="#eef4ff" stroke="#7399dc"/><rect x="540" y="180" width="190" height="100" rx="17" fill="#fff8e7" stroke="#d6a63f"/><rect x="795" y="180" width="160" height="100" rx="17" fill="#edf8f6" stroke="#5ab5a4"/><rect x="1020" y="180" width="135" height="100" rx="17" fill="#fff" stroke="#b9c9d8"/></g><text x="132" y="237" text-anchor="middle" class="h">Request</text><text x="380" y="220" text-anchor="middle" class="h">Identity</text><text x="380" y="250" text-anchor="middle" class="b">auth + policy key</text><text x="635" y="220" text-anchor="middle" class="h">Rate limiter</text><text x="635" y="250" text-anchor="middle" class="c">allow / deny</text><text x="875" y="220" text-anchor="middle" class="h">Queue</text><text x="875" y="250" text-anchor="middle" class="b">bounded</text><text x="1087" y="220" text-anchor="middle" class="h">Search</text><text x="1087" y="250" text-anchor="middle" class="b">scarce</text><g stroke="#55728f" stroke-width="3" marker-end="url(#a)"><path d="M220 230H285"/><path d="M475 230H540"/><path d="M730 230H795"/><path d="M955 230H1020"/></g><path d="M635 280V385H460" stroke="#d97979" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="255" y="340" width="205" height="90" rx="16" fill="#fff0f0" stroke="#d97979"/><text x="357" y="377" text-anchor="middle" class="h">Reject</text><text x="357" y="407" text-anchor="middle" class="c">429 + retry timing</text></svg>
