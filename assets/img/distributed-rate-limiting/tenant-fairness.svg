<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" role="img"><title>Per-tenant rate admission and fair work scheduling</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="570" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Admission entitlement does not determine execution order</text><g><rect x="45" y="100" width="245" height="115" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="45" y="325" width="245" height="115" rx="18" fill="#edf8f6" stroke="#5ab5a4"/></g><text x="167" y="140" text-anchor="middle" class="h">Tenant Acme</text><text x="167" y="175" text-anchor="middle" class="c">10/s · cost weight 3</text><text x="167" y="365" text-anchor="middle" class="h">Tenant Birch</text><text x="167" y="400" text-anchor="middle" class="c">10/s · cost weight 1</text><path d="M290 157L410 230M290 382L410 310" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="410" y="180" width="260" height="180" rx="20" fill="#fff8e7" stroke="#d6a63f"/><text x="540" y="222" text-anchor="middle" class="h">Per-tenant buckets</text><text x="540" y="262" text-anchor="middle" class="c">enforce entitlement</text><text x="540" y="305" text-anchor="middle" class="b">both may admit together</text><path d="M670 270H790" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><rect x="790" y="150" width="350" height="240" rx="22" fill="#17324d"/><text x="965" y="195" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">Fair scheduler</text><text x="965" y="238" text-anchor="middle" font-family="monospace" font-size="13" fill="#fff">weighted queues + concurrency</text><text x="965" y="283" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#a9eadc">interleave tenants</text><text x="965" y="318" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#a9eadc">respect cost and weights</text><text x="965" y="353" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffcf99">protect shared workers</text><text x="600" y="510" text-anchor="middle" class="b">Limiter: may it enter? Scheduler: which admitted work runs next?</text></svg>
