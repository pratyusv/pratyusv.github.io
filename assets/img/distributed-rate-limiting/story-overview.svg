<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" role="img"><title>One tenant sends requests through six gateways in two regions</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:14px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="570" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">One quota is consumed at many enforcement points</text><rect x="45" y="200" width="210" height="130" rx="20" fill="#fff8e7" stroke="#d6a63f"/><text x="150" y="243" text-anchor="middle" class="h">Tenant Acme</text><text x="150" y="280" text-anchor="middle" class="c">80-request burst</text><text x="150" y="310" text-anchor="middle" class="b">one API key</text><g><rect x="385" y="90" width="310" height="180" rx="22" fill="#eef4ff" stroke="#7399dc"/><rect x="385" y="320" width="310" height="180" rx="22" fill="#edf8f6" stroke="#5ab5a4"/></g><text x="540" y="130" text-anchor="middle" class="h">eu-west</text><text x="540" y="165" text-anchor="middle" class="c">G1 · G2 · G3</text><text x="540" y="205" text-anchor="middle" class="b">three local decisions</text><text x="540" y="360" text-anchor="middle" class="h">us-east</text><text x="540" y="395" text-anchor="middle" class="c">G4 · G5 · G6</text><text x="540" y="435" text-anchor="middle" class="b">three local decisions</text><path d="M255 260L385 180M255 270L385 410" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="825" y="150" width="330" height="250" rx="22" fill="#17324d"/><text x="990" y="195" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">Global contract</text><text x="990" y="238" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff">10 requests / second</text><text x="990" y="278" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff">burst capacity 40</text><text x="990" y="325" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffcf99">six full local buckets</text><text x="990" y="356" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffb3b3">can admit 6 × 40</text><path d="M695 180L825 240M695 410L825 320" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/></svg>
