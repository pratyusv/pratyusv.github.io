<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" role="img"><title>Components of distributed rate-limit overshoot</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Approximation needs a numeric overshoot budget</text><rect x="65" y="105" width="1070" height="95" rx="17" fill="#17324d"/><text x="600" y="145" text-anchor="middle" font-family="monospace" font-size="15" fill="#fff">global intended limit L</text><text x="600" y="177" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dce5ed">the contract before distributed uncertainty</text><g><rect x="65" y="265" width="315" height="160" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="442" y="265" width="315" height="160" rx="20" fill="#fff8e7" stroke="#d6a63f"/><rect x="820" y="265" width="315" height="160" rx="20" fill="#fff0f0" stroke="#d97979"/></g><text x="222" y="305" text-anchor="middle" class="h">Outstanding batches</text><text x="222" y="350" text-anchor="middle" class="c">Σ qᵢ</text><text x="222" y="390" text-anchor="middle" class="b">issued but unreported</text><text x="599" y="305" text-anchor="middle" class="h">Propagation delay</text><text x="599" y="350" text-anchor="middle" class="c">Σ rᵢ × Δ</text><text x="599" y="390" text-anchor="middle" class="b">decisions before new state arrives</text><text x="977" y="305" text-anchor="middle" class="h">In-flight decisions</text><text x="977" y="350" text-anchor="middle" class="c">requests already admitted</text><text x="977" y="390" text-anchor="middle" class="b">plus replay/failover risk</text><rect x="260" y="470" width="680" height="55" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="600" y="505" text-anchor="middle" class="c">worst case = L + all bounded uncertainty terms</text></svg>
