<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" role="img"><title>Static regional quota allocation</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="550" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Static shares preserve the cap and may strand capacity</text><rect x="70" y="105" width="1060" height="70" rx="16" fill="#17324d"/><text x="600" y="149" text-anchor="middle" font-family="monospace" font-size="15" fill="#fff">global limit = 1,000 requests / second</text><g><rect x="70" y="225" width="450" height="170" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="555" y="225" width="345" height="170" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><rect x="935" y="225" width="195" height="170" rx="20" fill="#fff8e7" stroke="#d6a63f"/></g><text x="295" y="267" text-anchor="middle" class="h">eu-west</text><text x="295" y="307" text-anchor="middle" class="c">share 500/s</text><text x="295" y="347" text-anchor="middle" class="c">demand 650/s</text><text x="295" y="375" text-anchor="middle" class="b">reject 150/s</text><text x="727" y="267" text-anchor="middle" class="h">us-east</text><text x="727" y="307" text-anchor="middle" class="c">share 400/s</text><text x="727" y="347" text-anchor="middle" class="c">demand 350/s</text><text x="1032" y="267" text-anchor="middle" class="h">ap-south</text><text x="1032" y="307" text-anchor="middle" class="c">share 100/s</text><text x="1032" y="347" text-anchor="middle" class="c">demand 0/s</text><text x="1032" y="375" text-anchor="middle" class="b">100/s unused</text><text x="600" y="470" text-anchor="middle" class="b">Independent enforcement prevents cross-region overshoot during a partition.</text></svg>
