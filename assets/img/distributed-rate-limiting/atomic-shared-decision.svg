<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" role="img"><title>Shared atomic rate-limit decision</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="550" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">One key owner serializes refill, check, and deduction</text><g><rect x="45" y="100" width="190" height="80" rx="15" fill="#fff" stroke="#b9c9d8"/><rect x="45" y="235" width="190" height="80" rx="15" fill="#fff" stroke="#b9c9d8"/><rect x="45" y="370" width="190" height="80" rx="15" fill="#fff" stroke="#b9c9d8"/></g><text x="140" y="148" text-anchor="middle" class="h">Gateway G1</text><text x="140" y="283" text-anchor="middle" class="h">Gateway G2</text><text x="140" y="418" text-anchor="middle" class="h">Gateway G3</text><path d="M235 140L405 235M235 275H405M235 410L405 315" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="405" y="165" width="735" height="215" rx="22" fill="#17324d"/><text x="772" y="205" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">Atomic operation for acme|search|v7</text><g><rect x="455" y="245" width="175" height="75" rx="12" fill="#fff"/><rect x="685" y="245" width="175" height="75" rx="12" fill="#fff8e7"/><rect x="915" y="245" width="175" height="75" rx="12" fill="#edf8f6"/></g><text x="542" y="275" text-anchor="middle" class="h">Refill</text><text x="542" y="301" text-anchor="middle" class="c">elapsed × rate</text><text x="772" y="275" text-anchor="middle" class="h">Decide</text><text x="772" y="301" text-anchor="middle" class="c">tokens ≥ cost</text><text x="1002" y="275" text-anchor="middle" class="h">Persist</text><text x="1002" y="301" text-anchor="middle" class="c">tokens − cost</text><text x="600" y="480" text-anchor="middle" class="b">No two requests can spend the same token on this owner.</text></svg>
