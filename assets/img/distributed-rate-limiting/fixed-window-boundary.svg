<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" role="img"><title>Fixed-window boundary burst</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Two valid windows can create one concentrated burst</text><rect x="90" y="140" width="510" height="220" fill="#eef4ff" stroke="#7399dc"/><rect x="600" y="140" width="510" height="220" fill="#edf8f6" stroke="#5ab5a4"/><text x="345" y="175" text-anchor="middle" class="h">Window 09:00:00</text><text x="855" y="175" text-anchor="middle" class="h">Window 09:00:01</text><line x1="600" y1="115" x2="600" y2="400" stroke="#d97979" stroke-width="4"/><text x="600" y="105" text-anchor="middle" class="c">reset boundary</text><g fill="#7399dc"><circle cx="500" cy="275" r="13"/><circle cx="520" cy="275" r="13"/><circle cx="540" cy="275" r="13"/><circle cx="560" cy="275" r="13"/><circle cx="580" cy="275" r="13"/><circle cx="500" cy="315" r="13"/><circle cx="520" cy="315" r="13"/><circle cx="540" cy="315" r="13"/><circle cx="560" cy="315" r="13"/><circle cx="580" cy="315" r="13"/></g><g fill="#5ab5a4"><circle cx="620" cy="275" r="13"/><circle cx="640" cy="275" r="13"/><circle cx="660" cy="275" r="13"/><circle cx="680" cy="275" r="13"/><circle cx="700" cy="275" r="13"/><circle cx="620" cy="315" r="13"/><circle cx="640" cy="315" r="13"/><circle cx="660" cy="315" r="13"/><circle cx="680" cy="315" r="13"/><circle cx="700" cy="315" r="13"/></g><text x="540" y="235" text-anchor="middle" class="c">10 allowed</text><text x="660" y="235" text-anchor="middle" class="c">10 allowed</text><text x="600" y="445" text-anchor="middle" class="h">20 requests inside 150 ms</text><text x="600" y="478" text-anchor="middle" class="b">Each fixed window still contains no more than its limit of 10.</text></svg>
