<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" role="img"><title>End-to-end distributed rate-limit request path</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 15px sans-serif;fill:#17324d}.b{font:12px sans-serif;fill:#45627d}.c{font:11px monospace;fill:#17324d}</style><rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="43" text-anchor="middle" class="t">One request crosses local, regional, and global controls</text><g><rect x="35" y="165" width="145" height="95" rx="16" fill="#fff" stroke="#b9c9d8"/><rect x="220" y="165" width="160" height="95" rx="16" fill="#eef4ff" stroke="#7399dc"/><rect x="420" y="165" width="170" height="95" rx="16" fill="#fff8e7" stroke="#d6a63f"/><rect x="630" y="165" width="180" height="95" rx="16" fill="#edf8f6" stroke="#5ab5a4"/><rect x="850" y="165" width="145" height="95" rx="16" fill="#eef4ff" stroke="#7399dc"/><rect x="1035" y="165" width="130" height="95" rx="16" fill="#edf8f6" stroke="#5ab5a4"/></g><text x="107" y="220" text-anchor="middle" class="h">Request</text><text x="300" y="202" text-anchor="middle" class="h">Edge fuse</text><text x="300" y="232" text-anchor="middle" class="c">IP bucket</text><text x="505" y="202" text-anchor="middle" class="h">Identity</text><text x="505" y="232" text-anchor="middle" class="c">acme|search|v7</text><text x="720" y="202" text-anchor="middle" class="h">Regional quota</text><text x="720" y="232" text-anchor="middle" class="c">A-71: 18 → 15</text><text x="922" y="202" text-anchor="middle" class="h">Concurrency</text><text x="922" y="232" text-anchor="middle" class="c">reserve slot</text><text x="1100" y="202" text-anchor="middle" class="h">Search</text><text x="1100" y="232" text-anchor="middle" class="c">execute</text><g stroke="#55728f" stroke-width="3" marker-end="url(#a)"><path d="M180 212H220"/><path d="M380 212H420"/><path d="M590 212H630"/><path d="M810 212H850"/><path d="M995 212H1035"/></g><rect x="440" y="400" width="320" height="140" rx="22" fill="#17324d"/><text x="600" y="440" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">Global allocator</text><text x="600" y="477" text-anchor="middle" font-family="monospace" font-size="12" fill="#fff">report A-71 cumulative spend</text><text x="600" y="510" text-anchor="middle" font-family="monospace" font-size="12" fill="#a9eadc">replenish in next epoch</text><path d="M720 260V350H650V400" stroke="#55728f" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#a)"/><path d="M550 400V350H680V260" stroke="#5ab5a4" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="600" y="335" text-anchor="middle" class="b">asynchronous control loop</text><rect x="250" y="590" width="700" height="55" rx="14" fill="#fff" stroke="#b9c9d8"/><text x="600" y="625" text-anchor="middle" class="b">common path stays regional; global state bounds issued entitlement</text></svg>
