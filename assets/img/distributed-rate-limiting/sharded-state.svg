<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" role="img"><title>Rate-limit key routing through a versioned shard map</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="550" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">The complete descriptor chooses one atomic state owner</text><rect x="55" y="190" width="250" height="125" rx="18" fill="#fff" stroke="#b9c9d8"/><text x="180" y="230" text-anchor="middle" class="h">Canonical key</text><text x="180" y="268" text-anchor="middle" class="c">acme|search|v7</text><path d="M305 252H430" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="430" y="160" width="260" height="185" rx="20" fill="#eef4ff" stroke="#7399dc"/><text x="560" y="203" text-anchor="middle" class="h">Shard map epoch 18</text><text x="560" y="245" text-anchor="middle" class="c">hash(key) → slot 2841</text><text x="560" y="288" text-anchor="middle" class="c">slot 2841 → shard 12</text><path d="M690 252H815" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><g><rect x="815" y="80" width="300" height="95" rx="16" fill="#fff" stroke="#b9c9d8"/><rect x="815" y="205" width="300" height="95" rx="16" fill="#edf8f6" stroke="#5ab5a4"/><rect x="815" y="330" width="300" height="95" rx="16" fill="#fff" stroke="#b9c9d8"/></g><text x="965" y="135" text-anchor="middle" class="c">shard 11</text><text x="965" y="245" text-anchor="middle" class="h">shard 12 owns key</text><text x="965" y="275" text-anchor="middle" class="c">tokens + updated_at</text><text x="965" y="385" text-anchor="middle" class="c">shard 13</text><text x="600" y="490" text-anchor="middle" class="b">A move must not leave old and new owners independently deducting quota.</text></svg>
