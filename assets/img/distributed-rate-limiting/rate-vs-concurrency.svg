<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" role="img"><title>Rate and concurrency limits protect different dimensions</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:14px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Arrival rate and accumulated work are different risks</text><rect x="55" y="100" width="520" height="355" rx="22" fill="#eef4ff" stroke="#7399dc"/><text x="315" y="145" text-anchor="middle" class="h">Rate limit</text><text x="315" y="185" text-anchor="middle" class="c">λ ≤ 10 requests/s</text><g fill="#7399dc"><circle cx="155" cy="260" r="15"/><circle cx="215" cy="260" r="15"/><circle cx="275" cy="260" r="15"/><circle cx="335" cy="260" r="15"/><circle cx="395" cy="260" r="15"/><circle cx="455" cy="260" r="15"/></g><path d="M125 315H505" stroke="#55728f" stroke-width="4"/><text x="315" y="355" text-anchor="middle" class="b">controls how quickly work enters</text><text x="315" y="405" text-anchor="middle" class="c">does not bound slow work already inside</text><rect x="625" y="100" width="520" height="355" rx="22" fill="#edf8f6" stroke="#5ab5a4"/><text x="885" y="145" text-anchor="middle" class="h">Concurrency limit</text><text x="885" y="185" text-anchor="middle" class="c">in_flight ≤ 50</text><g><rect x="715" y="230" width="80" height="80" rx="12" fill="#5ab5a4"/><rect x="805" y="230" width="80" height="80" rx="12" fill="#5ab5a4"/><rect x="895" y="230" width="80" height="80" rx="12" fill="#5ab5a4"/><rect x="985" y="230" width="80" height="80" rx="12" fill="#5ab5a4"/></g><text x="885" y="355" text-anchor="middle" class="b">controls accumulated resource occupancy</text><text x="885" y="405" text-anchor="middle" class="c">L = λW</text><rect x="330" y="485" width="540" height="50" rx="13" fill="#17324d"/><text x="600" y="517" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fff">Use both when request latency can change.</text></svg>
