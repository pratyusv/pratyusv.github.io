<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" role="img"><title>Local and global two-stage rate limiting</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">A local fuse shields the precise global decision path</text><rect x="45" y="180" width="180" height="110" rx="18" fill="#fff" stroke="#b9c9d8"/><text x="135" y="223" text-anchor="middle" class="h">Request</text><text x="135" y="260" text-anchor="middle" class="c">acme|search</text><path d="M225 235H330" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><rect x="330" y="145" width="270" height="180" rx="20" fill="#eef4ff" stroke="#7399dc"/><text x="465" y="190" text-anchor="middle" class="h">Stage 1: local fuse</text><text x="465" y="230" text-anchor="middle" class="c">loose token bucket</text><text x="465" y="270" text-anchor="middle" class="b">reject obvious flood</text><path d="M600 235H705" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><rect x="705" y="145" width="290" height="180" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="850" y="190" text-anchor="middle" class="h">Stage 2: global policy</text><text x="850" y="230" text-anchor="middle" class="c">tenant-wide state</text><text x="850" y="270" text-anchor="middle" class="b">fine decision</text><path d="M995 235H1135" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><text x="1070" y="218" text-anchor="middle" class="b">allow</text><path d="M465 325V415" stroke="#d97979" stroke-width="3" marker-end="url(#a)"/><path d="M850 325V415" stroke="#d97979" stroke-width="3" marker-end="url(#a)"/><text x="465" y="455" text-anchor="middle" class="c">local 429</text><text x="850" y="455" text-anchor="middle" class="c">global 429</text></svg>
