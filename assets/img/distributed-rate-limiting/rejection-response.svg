<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" role="img"><title>Rate-limit rejection with HTTP 429 and retry timing</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">A denial should tell a cooperative client when to retry</text><rect x="55" y="170" width="230" height="135" rx="18" fill="#eef4ff" stroke="#7399dc"/><text x="170" y="213" text-anchor="middle" class="h">Token decision</text><text x="170" y="250" text-anchor="middle" class="c">available 1 · cost 3</text><text x="170" y="280" text-anchor="middle" class="b">deficit = 2</text><path d="M285 237H410" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><rect x="410" y="125" width="365" height="225" rx="22" fill="#17324d"/><text x="592" y="168" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">HTTP response</text><text x="592" y="210" text-anchor="middle" font-family="monospace" font-size="14" fill="#ffcf99">429 Too Many Requests</text><text x="592" y="250" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff">Retry-After: 2</text><text x="592" y="290" text-anchor="middle" font-family="monospace" font-size="12" fill="#dce5ed">policy: acme-search-v7</text><path d="M775 237H900" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><rect x="900" y="160" width="250" height="155" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="1025" y="200" text-anchor="middle" class="h">Client behavior</text><text x="1025" y="238" text-anchor="middle" class="c">wait + random jitter</text><text x="1025" y="275" text-anchor="middle" class="b">avoid reset herd</text><text x="600" y="420" text-anchor="middle" class="c">retry_after = deficit / refill_rate</text><text x="600" y="460" text-anchor="middle" class="b">Remaining quota is only a snapshot under concurrent traffic.</text></svg>
