<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Highly available distributed rate limiter topology</title><desc id="desc">Multiple gateways call replicated stateless rate-limit services, which use a versioned shard map to route one key to a replicated state shard with one fenced leader.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.title{font:700 26px system-ui;fill:#17324d}.head{font:700 17px system-ui;fill:#17324d}.body{font:14px system-ui;fill:#45627d}.small{font:12px system-ui;fill:#45627d}.white{font:700 15px system-ui;fill:#fff}</style></defs><rect width="1200" height="700" rx="26" fill="#f7fafc"/><text x="600" y="48" text-anchor="middle" class="title">One logical authority, replicated across physical failure domains</text><rect x="45" y="105" width="235" height="430" rx="20" fill="#fff8e8" stroke="#e4b85b"/><text x="162" y="140" text-anchor="middle" class="head">API gateways</text><rect x="80" y="180" width="165" height="65" rx="12" fill="#fff" stroke="#d9c083"/><text x="162" y="208" text-anchor="middle" class="head">Gateway G1</text><text x="162" y="228" text-anchor="middle" class="small">same decision protocol</text><rect x="80" y="280" width="165" height="65" rx="12" fill="#fff" stroke="#d9c083"/><text x="162" y="308" text-anchor="middle" class="head">Gateway G2</text><text x="162" y="328" text-anchor="middle" class="small">same key encoding</text><rect x="80" y="380" width="165" height="65" rx="12" fill="#fff" stroke="#d9c083"/><text x="162" y="408" text-anchor="middle" class="head">Gateway G3</text><text x="162" y="428" text-anchor="middle" class="small">same retry ID</text><text x="162" y="492" text-anchor="middle" class="body">Any gateway can call</text><text x="162" y="513" text-anchor="middle" class="body">any healthy service replica</text><rect x="345" y="105" width="260" height="430" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="475" y="140" text-anchor="middle" class="head">Rate-limit service</text><rect x="385" y="180" width="180" height="65" rx="12" fill="#fff" stroke="#8fcabb"/><text x="475" y="208" text-anchor="middle" class="head">Service R1</text><text x="475" y="228" text-anchor="middle" class="small">stateless</text><rect x="385" y="280" width="180" height="65" rx="12" fill="#fff" stroke="#8fcabb"/><text x="475" y="308" text-anchor="middle" class="head">Service R2</text><text x="475" y="328" text-anchor="middle" class="small">stateless</text><rect x="385" y="380" width="180" height="65" rx="12" fill="#fff" stroke="#8fcabb"/><text x="475" y="408" text-anchor="middle" class="head">Service R3</text><text x="475" y="428" text-anchor="middle" class="small">stateless</text><rect x="390" y="473" width="170" height="42" rx="10" fill="#17324d"/><text x="475" y="499" text-anchor="middle" class="white">shard map · epoch 83</text><path d="M280 320H345" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="312" y="304" text-anchor="middle" class="small">retry</text><rect x="675" y="105" width="480" height="430" rx="20" fill="#f3effb" stroke="#9377c6"/><text x="915" y="140" text-anchor="middle" class="head">State shard 12 · replicated</text><rect x="720" y="185" width="175" height="105" rx="14" fill="#17324d"/><text x="807" y="220" text-anchor="middle" class="white">Leader S1</text><text x="807" y="245" text-anchor="middle" class="small" fill="#fff">term 42 · writes</text><text x="807" y="267" text-anchor="middle" class="small" fill="#fff">acme|search|v7</text><rect x="945" y="175" width="165" height="82" rx="14" fill="#fff" stroke="#9377c6"/><text x="1027" y="208" text-anchor="middle" class="head">Follower S2</text><text x="1027" y="232" text-anchor="middle" class="small">failure domain B</text><rect x="945" y="305" width="165" height="82" rx="14" fill="#fff" stroke="#9377c6"/><text x="1027" y="338" text-anchor="middle" class="head">Follower S3</text><text x="1027" y="362" text-anchor="middle" class="small">failure domain C</text><path d="M895 215H945M895 260L945 335" stroke="#55728f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="915" y="425" text-anchor="middle" class="body">Only the current leader deducts tokens.</text><text x="915" y="451" text-anchor="middle" class="body">Followers preserve committed state for failover.</text><text x="915" y="477" text-anchor="middle" class="body">Terms fence a stale leader after promotion.</text><path d="M605 320H675" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="640" y="300" text-anchor="middle" class="small">route key</text><rect x="165" y="590" width="870" height="62" rx="14" fill="#17324d"/><text x="600" y="616" text-anchor="middle" class="white">Replication removes the physical singleton; leadership preserves one logical mutation order.</text><text x="600" y="638" text-anchor="middle" class="small" fill="#fff">If the shard cannot prove one current authority, strict decisions pause instead of creating extra quota.</text></svg>
