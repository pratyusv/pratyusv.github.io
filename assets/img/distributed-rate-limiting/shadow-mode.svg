<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" role="img"><title>Shadow-mode rate-limit policy evaluation</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="530" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Shadow mode measures impact before enforcement</text><rect x="45" y="185" width="195" height="105" rx="18" fill="#fff" stroke="#b9c9d8"/><text x="142" y="225" text-anchor="middle" class="h">Live request</text><text x="142" y="260" text-anchor="middle" class="c">acme · search</text><path d="M240 237H365" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><g><rect x="365" y="95" width="340" height="140" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><rect x="365" y="300" width="340" height="140" rx="20" fill="#eef4ff" stroke="#7399dc"/></g><text x="535" y="137" text-anchor="middle" class="h">Enforced policy v7</text><text x="535" y="177" text-anchor="middle" class="c">ALLOW → forward request</text><text x="535" y="342" text-anchor="middle" class="h">Proposed policy v8</text><text x="535" y="382" text-anchor="middle" class="c">would DENY → observe only</text><path d="M240 237L365 165M240 237L365 370" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="840" y="180" width="315" height="150" rx="20" fill="#17324d"/><text x="997" y="220" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">Telemetry</text><text x="997" y="260" text-anchor="middle" font-family="monospace" font-size="13" fill="#fff">shadow_denied += 1</text><text x="997" y="297" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dce5ed">no client impact</text><path d="M705 370L840 285" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/></svg>
