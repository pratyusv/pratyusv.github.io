<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" role="img"><title>Sliding log expires exact timestamps outside the active window</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">A sliding log keeps the literal recent history</text><line x1="90" y1="280" x2="1110" y2="280" stroke="#b9c9d8" stroke-width="5"/><rect x="450" y="175" width="610" height="180" rx="18" fill="#edf8f6" fill-opacity=".55" stroke="#5ab5a4"/><text x="755" y="205" text-anchor="middle" class="h">active interval (now − 1 s, now]</text><g><circle cx="190" cy="280" r="14" fill="#d97979"/><circle cx="330" cy="280" r="14" fill="#d97979"/><circle cx="500" cy="280" r="14" fill="#5ab5a4"/><circle cx="610" cy="280" r="14" fill="#5ab5a4"/><circle cx="760" cy="280" r="14" fill="#5ab5a4"/><circle cx="920" cy="280" r="14" fill="#5ab5a4"/><circle cx="1040" cy="280" r="14" fill="#7399dc"/></g><text x="260" y="335" text-anchor="middle" class="b">remove expired timestamps</text><text x="725" y="335" text-anchor="middle" class="b">count retained admissions</text><text x="1040" y="250" text-anchor="middle" class="c">new request</text><path d="M450 155V375" stroke="#55728f" stroke-width="3" stroke-dasharray="7 5"/><text x="450" y="415" text-anchor="middle" class="c">now − window</text><text x="1060" y="415" text-anchor="middle" class="c">now</text></svg>
