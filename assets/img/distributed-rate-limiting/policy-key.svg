<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" role="img"><title>Request attributes normalized into a canonical rate-limit key</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="540" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Normalize identity before creating limiter state</text><g><rect x="55" y="100" width="225" height="85" rx="15" fill="#fff" stroke="#b9c9d8"/><rect x="55" y="215" width="225" height="85" rx="15" fill="#fff" stroke="#b9c9d8"/><rect x="55" y="330" width="225" height="85" rx="15" fill="#fff" stroke="#b9c9d8"/></g><text x="167" y="135" text-anchor="middle" class="h">Authenticated tenant</text><text x="167" y="163" text-anchor="middle" class="c">acme</text><text x="167" y="250" text-anchor="middle" class="h">Normalized route</text><text x="167" y="278" text-anchor="middle" class="c">POST /search</text><text x="167" y="365" text-anchor="middle" class="h">Policy snapshot</text><text x="167" y="393" text-anchor="middle" class="c">plan v7</text><path d="M280 142L475 242M280 257H475M280 372L475 272" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="475" y="185" width="270" height="135" rx="20" fill="#eef4ff" stroke="#7399dc"/><text x="610" y="225" text-anchor="middle" class="h">Canonical descriptor</text><text x="610" y="262" text-anchor="middle" class="c">acme | search | v7</text><text x="610" y="293" text-anchor="middle" class="b">bounded fields only</text><path d="M745 252H840" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="840" y="185" width="305" height="135" rx="20" fill="#17324d"/><text x="992" y="225" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">State key</text><text x="992" y="263" text-anchor="middle" font-family="monospace" font-size="13" fill="#fff">rl:{hash}:bucket</text><text x="992" y="295" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dce5ed">stable routing + finite cardinality</text><text x="600" y="470" text-anchor="middle" class="b">Raw URLs and arbitrary headers do not belong in the key space.</text></svg>
