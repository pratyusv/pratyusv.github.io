<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" role="img"><title>GCRA virtual schedule and burst tolerance</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">GCRA stores a virtual next-arrival schedule</text><line x1="100" y1="280" x2="1100" y2="280" stroke="#b9c9d8" stroke-width="5"/><rect x="350" y="190" width="410" height="180" rx="18" fill="#edf8f6" fill-opacity=".6" stroke="#5ab5a4"/><text x="555" y="220" text-anchor="middle" class="h">conforming region</text><line x1="510" y1="150" x2="510" y2="395" stroke="#d6a63f" stroke-width="3" stroke-dasharray="8 6"/><line x1="760" y1="150" x2="760" y2="395" stroke="#7399dc" stroke-width="3"/><text x="510" y="425" text-anchor="middle" class="c">TAT − τ</text><text x="760" y="425" text-anchor="middle" class="c">TAT</text><circle cx="620" cy="280" r="17" fill="#5ab5a4"/><text x="620" y="260" text-anchor="middle" class="c">arrival t</text><circle cx="250" cy="280" r="17" fill="#d97979"/><text x="250" y="260" text-anchor="middle" class="c">too early</text><text x="600" y="475" text-anchor="middle" class="b">Admit when t ≥ TAT − τ; then advance TAT by cost × emission interval.</text></svg>
