<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Highly available global quota allocator</title><desc id="desc">A quorum-backed allocator leader records grants before sending expiring allocations to regions, which can continue spending bounded quota during allocator failover.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.title{font:700 26px system-ui;fill:#17324d}.head{font:700 17px system-ui;fill:#17324d}.body{font:14px system-ui;fill:#45627d}.small{font:12px system-ui;fill:#45627d}.white{font:700 15px system-ui;fill:#fff}</style></defs><rect width="1200" height="700" rx="26" fill="#f7fafc"/><text x="600" y="48" text-anchor="middle" class="title">The quota allocator is replicated because grants create spendable capacity</text><rect x="50" y="105" width="330" height="435" rx="20" fill="#f3effb" stroke="#9377c6"/><text x="215" y="140" text-anchor="middle" class="head">Allocator replicas</text><rect x="90" y="185" width="250" height="78" rx="13" fill="#17324d"/><text x="215" y="216" text-anchor="middle" class="white">Allocator A1 · leader</text><text x="215" y="241" text-anchor="middle" class="small" fill="#fff">term 42 · may issue grants</text><rect x="90" y="300" width="250" height="70" rx="13" fill="#fff" stroke="#9377c6"/><text x="215" y="330" text-anchor="middle" class="head">Allocator A2</text><text x="215" y="352" text-anchor="middle" class="small">follower · failure domain B</text><rect x="90" y="405" width="250" height="70" rx="13" fill="#fff" stroke="#9377c6"/><text x="215" y="435" text-anchor="middle" class="head">Allocator A3</text><text x="215" y="457" text-anchor="middle" class="small">follower · failure domain C</text><path d="M215 263V300M215 370V405" stroke="#55728f" stroke-width="3" stroke-dasharray="7 6" fill="none" marker-end="url(#arrow)"/><rect x="455" y="185" width="285" height="250" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="597" y="220" text-anchor="middle" class="head">Committed grant log</text><rect x="490" y="255" width="215" height="120" rx="13" fill="#fff" stroke="#8fcabb"/><text x="597" y="282" text-anchor="middle" class="head">Allocation A-71</text><text x="597" y="307" text-anchor="middle" class="body">eu-west · 300 tokens</text><text x="597" y="331" text-anchor="middle" class="body">term 42 · epoch 108</text><text x="597" y="355" text-anchor="middle" class="body">expires 09:00:05</text><text x="597" y="405" text-anchor="middle" class="small">Record on quorum before reply</text><path d="M380 310H455" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="815" y="105" width="335" height="435" rx="20" fill="#fff8e8" stroke="#e4b85b"/><text x="982" y="140" text-anchor="middle" class="head">Regional enforcement</text><rect x="860" y="190" width="245" height="105" rx="14" fill="#fff" stroke="#d9c083"/><text x="982" y="222" text-anchor="middle" class="head">eu-west</text><text x="982" y="249" text-anchor="middle" class="body">spend allocation A-71 locally</text><text x="982" y="272" text-anchor="middle" class="small">valid only until expiry</text><rect x="860" y="345" width="245" height="105" rx="14" fill="#fff" stroke="#d9c083"/><text x="982" y="377" text-anchor="middle" class="head">us-east</text><text x="982" y="404" text-anchor="middle" class="body">spend allocation A-72 locally</text><text x="982" y="427" text-anchor="middle" class="small">valid only until expiry</text><path d="M740 280H815" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="777" y="260" text-anchor="middle" class="small">grant</text><rect x="120" y="585" width="960" height="70" rx="14" fill="#17324d"/><text x="600" y="613" text-anchor="middle" class="white">Allocator unavailable: regions may spend existing leases, but nobody may create replacement quota.</text><text x="600" y="638" text-anchor="middle" class="small" fill="#fff">A new leader first recovers every live grant; unreachable capacity returns only after acknowledgement or expiry.</text></svg>
