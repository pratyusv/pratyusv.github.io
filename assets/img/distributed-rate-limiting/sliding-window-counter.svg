<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" role="img"><title>Sliding-window counter weights the previous fixed bucket</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:14px monospace;fill:#17324d}</style><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Two counters approximate a rolling window</text><rect x="90" y="150" width="460" height="220" fill="#eef4ff" stroke="#7399dc"/><rect x="550" y="150" width="560" height="220" fill="#edf8f6" stroke="#5ab5a4"/><text x="320" y="190" text-anchor="middle" class="h">Previous window</text><text x="320" y="240" text-anchor="middle" class="c">count = 8</text><text x="320" y="290" text-anchor="middle" class="c">weight = 0.75</text><text x="830" y="190" text-anchor="middle" class="h">Current window: 25% elapsed</text><text x="830" y="240" text-anchor="middle" class="c">count = 3</text><line x1="690" y1="135" x2="690" y2="385" stroke="#d97979" stroke-width="3" stroke-dasharray="7 5"/><text x="690" y="415" text-anchor="middle" class="b">now</text><rect x="325" y="430" width="550" height="60" rx="14" fill="#17324d"/><text x="600" y="468" text-anchor="middle" font-family="monospace" font-size="15" fill="#fff">estimate = 3 + 8 × 0.75 = 9</text></svg>
