<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" role="img"><title>Versioned rate-limit policy rollout</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="550" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Every decision is attributable to one immutable policy version</text><rect x="45" y="175" width="240" height="150" rx="20" fill="#17324d"/><text x="165" y="215" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">Policy control plane</text><text x="165" y="255" text-anchor="middle" font-family="monospace" font-size="13" fill="#fff">publish v8</text><text x="165" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dce5ed">validated snapshot</text><path d="M285 250H405" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><g><rect x="405" y="95" width="315" height="130" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="405" y="300" width="315" height="130" rx="18" fill="#fff8e7" stroke="#d6a63f"/></g><text x="562" y="135" text-anchor="middle" class="h">Gateway G1</text><text x="562" y="172" text-anchor="middle" class="c">active v8 · capacity 30</text><text x="562" y="340" text-anchor="middle" class="h">Gateway G2</text><text x="562" y="377" text-anchor="middle" class="c">active v7 · capacity 40</text><path d="M720 160H840M720 365H840" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="840" y="175" width="315" height="150" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="997" y="215" text-anchor="middle" class="h">Decision log</text><text x="997" y="253" text-anchor="middle" class="c">allowed · policy_version</text><text x="997" y="288" text-anchor="middle" class="b">detect skew and rollback</text><text x="600" y="500" text-anchor="middle" class="b">Capacity, refill, and key-shape transitions require explicit state rules.</text></svg>
