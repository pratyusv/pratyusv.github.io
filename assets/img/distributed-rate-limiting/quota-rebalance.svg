<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" role="img"><title>Safe regional quota rebalancing across epochs</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Quota moves after the old allocation is closed or bounded</text><g><rect x="45" y="190" width="200" height="115" rx="18" fill="#fff8e7" stroke="#d6a63f"/><rect x="320" y="190" width="200" height="115" rx="18" fill="#fff0f0" stroke="#d97979"/><rect x="595" y="190" width="200" height="115" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="870" y="190" width="285" height="115" rx="18" fill="#edf8f6" stroke="#5ab5a4"/></g><text x="145" y="227" text-anchor="middle" class="h">Asia allocation</text><text x="145" y="262" text-anchor="middle" class="c">A-73 · 80 unused</text><text x="420" y="227" text-anchor="middle" class="h">Close old grant</text><text x="420" y="262" text-anchor="middle" class="c">revoke or expire</text><text x="695" y="227" text-anchor="middle" class="h">Final accounting</text><text x="695" y="262" text-anchor="middle" class="c">return 80</text><text x="1012" y="227" text-anchor="middle" class="h">Europe allocation</text><text x="1012" y="262" text-anchor="middle" class="c">new epoch · +80 tokens</text><g stroke="#55728f" stroke-width="3" marker-end="url(#a)"><path d="M245 247H320"/><path d="M520 247H595"/><path d="M795 247H870"/></g><line x1="545" y1="120" x2="545" y2="380" stroke="#d97979" stroke-width="3" stroke-dasharray="8 6"/><text x="545" y="105" text-anchor="middle" class="c">handoff boundary</text><rect x="280" y="395" width="640" height="90" rx="17" fill="#17324d"/><text x="600" y="432" text-anchor="middle" font-family="monospace" font-size="13" fill="#fff">never let old 80 and new 80 remain spendable together</text><text x="600" y="462" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dce5ed">allocation identity + epoch reject delayed usage reports</text></svg>
