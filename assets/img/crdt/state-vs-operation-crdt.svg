<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">State-based versus operation-based CRDT synchronization</title>
  <desc id="desc">State-based CRDTs exchange mergeable state while operation-based CRDTs exchange uniquely identified updates.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#355070"/>
    </marker>
    <style>
      .bg { fill: #f8f7f1; }
      .panel { fill: #ffffff; stroke: #d6d3c8; stroke-width: 2; rx: 16; }
      .state { fill: #e6f0ee; stroke: #2f6f73; stroke-width: 2; rx: 14; }
      .op { fill: #fff1df; stroke: #bb7a28; stroke-width: 2; rx: 14; }
      .text { font-family: Arial, sans-serif; fill: #25313c; font-size: 24px; }
      .small { font-family: Arial, sans-serif; fill: #44515d; font-size: 18px; }
      .tiny { font-family: Arial, sans-serif; fill: #53616d; font-size: 15px; }
      .label { font-family: Arial, sans-serif; fill: #25313c; font-size: 20px; font-weight: 700; }
      .mono { font-family: Menlo, Consolas, monospace; fill: #25313c; font-size: 18px; }
      .arrow { stroke: #355070; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="620"/>
  <text x="70" y="58" class="text" font-weight="700">Two ways to synchronize CRDT replicas</text>
  <text x="70" y="90" class="small">Production systems often combine both with logs, deltas, and snapshots.</text>

  <rect x="70" y="135" width="500" height="390" class="panel"/>
  <text x="105" y="180" class="label">State-based CRDT</text>
  <rect x="115" y="225" width="150" height="82" class="state"/>
  <text x="145" y="258" class="small" font-weight="700">Replica A</text>
  <text x="145" y="286" class="mono">state</text>
  <rect x="375" y="225" width="150" height="82" class="state"/>
  <text x="405" y="258" class="small" font-weight="700">Replica B</text>
  <text x="405" y="286" class="mono">state</text>
  <path d="M 265 266 L 365 266" class="arrow"/>
  <text x="288" y="246" class="tiny">send state</text>
  <rect x="135" y="365" width="370" height="88" class="state"/>
  <text x="162" y="400" class="small">Receiver merges using a deterministic join.</text>
  <text x="162" y="430" class="mono">local = merge(local, remote)</text>

  <rect x="630" y="135" width="500" height="390" class="panel"/>
  <text x="665" y="180" class="label">Operation-based CRDT</text>
  <rect x="675" y="225" width="150" height="82" class="op"/>
  <text x="705" y="258" class="small" font-weight="700">Replica A</text>
  <text x="705" y="286" class="mono">op A:7</text>
  <rect x="935" y="225" width="150" height="82" class="op"/>
  <text x="965" y="258" class="small" font-weight="700">Replica B</text>
  <text x="965" y="286" class="mono">apply op</text>
  <path d="M 825 266 L 925 266" class="arrow"/>
  <text x="844" y="246" class="tiny">send update</text>
  <rect x="695" y="365" width="370" height="88" class="op"/>
  <text x="722" y="400" class="small">Transport must handle identity and delivery.</text>
  <text x="722" y="430" class="mono">dedupe(op_id), then apply</text>
</svg>
