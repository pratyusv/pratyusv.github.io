<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Sequence CRDT for text</title>
  <desc id="desc">A sequence CRDT inserts text between stable identifiers so replicas can merge concurrent text edits without relying only on array indexes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#355070"/>
    </marker>
    <style>
      .bg { fill: #f8f7f1; }
      .panel { fill: #ffffff; stroke: #d6d3c8; stroke-width: 2; rx: 16; }
      .char { fill: #e6f0ee; stroke: #2f6f73; stroke-width: 2; rx: 12; }
      .newa { fill: #fff1df; stroke: #bb7a28; stroke-width: 2; rx: 12; }
      .newb { fill: #eef0fb; stroke: #5967a8; stroke-width: 2; rx: 12; }
      .hidden { fill: #f2f2f2; stroke: #9aa3aa; stroke-width: 2; rx: 12; }
      .text { font-family: Arial, sans-serif; fill: #25313c; font-size: 24px; }
      .small { font-family: Arial, sans-serif; fill: #44515d; font-size: 18px; }
      .tiny { font-family: Arial, sans-serif; fill: #53616d; font-size: 14px; }
      .label { font-family: Arial, sans-serif; fill: #25313c; font-size: 20px; font-weight: 700; }
      .mono { font-family: Menlo, Consolas, monospace; fill: #25313c; font-size: 21px; }
      .arrow { stroke: #355070; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="620"/>
  <text x="70" y="58" class="text" font-weight="700">Sequence CRDT: order by stable identifiers</text>
  <text x="70" y="90" class="small">Concurrent inserts at the same logical place get deterministic order on every replica.</text>

  <rect x="70" y="135" width="1060" height="145" class="panel"/>
  <text x="105" y="178" class="label">Visible text before concurrent edits</text>
  <rect x="260" y="205" width="90" height="52" class="char"/>
  <text x="292" y="238" class="mono">M</text>
  <text x="276" y="275" class="tiny">id m1</text>
  <rect x="370" y="205" width="90" height="52" class="char"/>
  <text x="402" y="238" class="mono">e</text>
  <text x="386" y="275" class="tiny">id e1</text>
  <rect x="480" y="205" width="90" height="52" class="char"/>
  <text x="512" y="238" class="mono">e</text>
  <text x="496" y="275" class="tiny">id e2</text>
  <rect x="590" y="205" width="90" height="52" class="char"/>
  <text x="622" y="238" class="mono">t</text>
  <text x="606" y="275" class="tiny">id t1</text>

  <rect x="70" y="335" width="1060" height="190" class="panel"/>
  <text x="105" y="378" class="label">Concurrent inserts after id t1</text>
  <rect x="230" y="420" width="150" height="65" class="newa"/>
  <text x="260" y="448" class="small" font-weight="700">Alice</text>
  <text x="260" y="474" class="tiny">insert " at 10" id A:8</text>
  <rect x="820" y="420" width="150" height="65" class="newb"/>
  <text x="850" y="448" class="small" font-weight="700">Bob</text>
  <text x="850" y="474" class="tiny">insert " now" id B:4</text>
  <path d="M 386 452 L 530 452" class="arrow"/>
  <path d="M 814 452 L 670 452" class="arrow"/>
  <rect x="535" y="402" width="130" height="42" class="newa"/>
  <text x="558" y="429" class="tiny">A:8 wins tie</text>
  <rect x="535" y="462" width="130" height="42" class="newb"/>
  <text x="558" y="489" class="tiny">B:4 next</text>

  <text x="105" y="575" class="small">The exact ordering rule varies by CRDT, but every replica must compute the same order from the same IDs.</text>
</svg>
