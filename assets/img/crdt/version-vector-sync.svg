<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Version vector synchronization</title>
  <desc id="desc">Two replicas compare version vectors to determine which operations each side is missing.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#355070"/>
    </marker>
    <style>
      .bg { fill: #f8f7f1; }
      .box { fill: #ffffff; stroke: #d6d3c8; stroke-width: 2; rx: 16; }
      .a { fill: #e6f0ee; stroke: #2f6f73; stroke-width: 2; rx: 14; }
      .b { fill: #eef0fb; stroke: #5967a8; stroke-width: 2; rx: 14; }
      .text { font-family: Arial, sans-serif; fill: #25313c; font-size: 24px; }
      .small { font-family: Arial, sans-serif; fill: #44515d; font-size: 18px; }
      .label { font-family: Arial, sans-serif; fill: #25313c; font-size: 20px; font-weight: 700; }
      .mono { font-family: Menlo, Consolas, monospace; fill: #25313c; font-size: 20px; }
      .arrow { stroke: #355070; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="560"/>
  <text x="70" y="58" class="text" font-weight="700">Version vectors describe what each replica has seen</text>
  <text x="70" y="90" class="small">Sync compares logical progress, not wall-clock time.</text>

  <rect x="95" y="155" width="360" height="180" class="a"/>
  <text x="130" y="198" class="label">Replica A</text>
  <text x="130" y="245" class="mono">seen: { A:7, B:3, C:0 }</text>
  <text x="130" y="290" class="small">needs B:4.. and C:1..</text>

  <rect x="745" y="155" width="360" height="180" class="b"/>
  <text x="780" y="198" class="label">Replica B</text>
  <text x="780" y="245" class="mono">seen: { A:5, B:4, C:2 }</text>
  <text x="780" y="290" class="small">needs A:6..7</text>

  <path d="M 460 220 L 735 220" class="arrow"/>
  <text x="522" y="196" class="small">send local vector</text>
  <path d="M 740 275 L 465 275" class="arrow"/>
  <text x="500" y="315" class="small">return missing operations</text>

  <rect x="260" y="395" width="680" height="75" class="box"/>
  <text x="295" y="427" class="small">A vector is compact when actor count is bounded.</text>
  <text x="295" y="454" class="small">Large or long-lived actor sets need retirement, epochs, or compaction.</text>
</svg>
