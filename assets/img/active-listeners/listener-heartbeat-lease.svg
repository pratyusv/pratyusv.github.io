<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="title description">
<title id="title">Heartbeats renew a listener’s lease</title><desc id="description">A heartbeat at 10:00:15 sets expiry at 10:01:00. A newer heartbeat at 10:00:30 moves expiry to 10:01:15. The old timer checks the saved heartbeat version and does nothing. If no further heartbeat or stop arrives, the new timer removes one contribution at its deadline.</desc>
<defs><marker id="normal" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8b9bb0"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c74747"/></marker></defs>
<rect width="1000" height="790" rx="20" fill="#f8fafc"/>
<path d="M465 222H535" fill="none" stroke="#8b9bb0" stroke-width="2.5" marker-end="url(#normal)"/>
<path d="M252 300V400" fill="none" stroke="#8b9bb0" stroke-width="2.5" marker-end="url(#normal)"/>
<path d="M748 300V400" fill="none" stroke="#8b9bb0" stroke-width="2.5" marker-end="url(#normal)"/>
<text x="40" y="48" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#172b4d">Heartbeats renew a listener’s lease</text>
<text x="40" y="84" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#52647b">Illustration: heartbeat interval 15 seconds; lease timeout 45 seconds.</text>
<rect x="40" y="145" width="425" height="155" rx="14" fill="#eaf2ff" stroke="#d2dce8" stroke-width="1.5"/>
<text x="60" y="182" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Heartbeat at 10:00:15</text>
<text x="60" y="221" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Save its version and timestamp</text>
<text x="60" y="253" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Expiry deadline: 10:01:00</text>
<rect x="535" y="145" width="425" height="155" rx="14" fill="#e5f6f0" stroke="#d2dce8" stroke-width="1.5"/>
<text x="555" y="182" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Heartbeat at 10:00:30</text>
<text x="555" y="221" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">A newer version replaces the lease</text>
<text x="555" y="253" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">New deadline: 10:01:15</text>
<rect x="40" y="400" width="425" height="155" rx="14" fill="#edf1f6" stroke="#d2dce8" stroke-width="1.5"/>
<text x="60" y="437" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Old timer at 10:01:00</text>
<text x="60" y="476" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Stored version has advanced</text>
<text x="60" y="508" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Ignore this obsolete timer</text>
<rect x="535" y="400" width="425" height="155" rx="14" fill="#fff4d9" stroke="#d2dce8" stroke-width="1.5"/>
<text x="555" y="437" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Current timer at 10:01:15</text>
<text x="555" y="476" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#172b4d">If no newer update: clear counted state</text>
<text x="555" y="508" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Emit one listener decrement</text>
<rect x="40" y="615" width="920" height="58" rx="14" fill="#eaf2ff" stroke="#d2dce8" stroke-width="1.5"/>
<text x="500" y="651" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#172b4d">Check the session generation, heartbeat version, and deadline before expiring a user.</text>
<text x="40" y="766" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#52647b">A silent disconnect can remain visible for the lease timeout plus pipeline delay.</text>
</svg>
