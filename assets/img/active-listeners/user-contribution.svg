<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="960" viewBox="0 0 1000 960" role="img" aria-labelledby="title description">
<title id="title">Add user state to enforce one contribution per user</title><desc id="description">User_36 is counted against playback_901 for song_101 at authorized version 42. Starting playback_902 for song_202 at version 43 causes one Redis operation to close the old playback, decrement song_101, start the new playback, increment song_202, and replace the user record. A late stop for playback_901 then changes nothing.</desc>
<defs><marker id="normal" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8b9bb0"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c74747"/></marker></defs>
<rect width="1000" height="960" rx="20" fill="#f8fafc"/>
<path d="M252 290V330H500V385" fill="none" stroke="#8b9bb0" stroke-width="2.5" marker-end="url(#normal)"/>
<path d="M747 290V330H500V385" fill="none" stroke="#8b9bb0" stroke-width="2.5" marker-end="url(#normal)"/>
<path d="M500 570V610H252V660" fill="none" stroke="#8b9bb0" stroke-width="2.5" marker-end="url(#normal)"/>
<path d="M500 610H747V660" fill="none" stroke="#8b9bb0" stroke-width="2.5" marker-end="url(#normal)"/>
<text x="40" y="48" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#172b4d">Add user state to enforce one contribution per user</text>
<text x="40" y="84" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#52647b">Trigger: a new playback starts before the previous stop arrives.</text>
<rect x="40" y="135" width="425" height="155" rx="14" fill="#eaf2ff" stroke="#d2dce8" stroke-width="1.5"/>
<g data-component-icon="users" aria-hidden="true" transform="translate(54 148)"><rect width="38" height="38" rx="9" fill="#ffffff" fill-opacity="0.9"/><g transform="translate(4 4) scale(0.9375)" fill="none" stroke="#52647b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="5"/><path d="M3 28v-3a9 9 0 0 1 18 0v3M23 6a5 5 0 0 1 0 9M25 19a8 8 0 0 1 5 7v2"/></g></g>
<text x="106" y="171" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#172b4d">User record: before</text>
<text x="60" y="211" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#172b4d">user_36 → playback_901</text>
<text x="60" y="239" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#172b4d">song_101, version 42</text>
<rect x="535" y="135" width="425" height="155" rx="14" fill="#fff4d9" stroke="#d2dce8" stroke-width="1.5"/>
<text x="555" y="172" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">New authorized START</text>
<text x="555" y="211" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">playback_902 → song_202</text>
<text x="555" y="243" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">version 43</text>
<rect x="150" y="385" width="700" height="185" rx="14" fill="#f0eaff" stroke="#d2dce8" stroke-width="1.5"/>
<g data-component-icon="database" aria-hidden="true" transform="translate(164 398)"><rect width="38" height="38" rx="9" fill="#ffffff" fill-opacity="0.9"/><g transform="translate(4 4) scale(0.9375)" fill="none" stroke="#7650ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="16" cy="7" rx="12" ry="4"/><path d="M4 7v18c0 5.5 24 5.5 24 0V7M4 16c0 5.5 24 5.5 24 0"/></g></g>
<text x="216" y="421" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#172b4d">Redis: one complete change</text>
<text x="170" y="461" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#172b4d">Close playback_901; subtract one from song_101.</text>
<text x="170" y="489" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#172b4d">Start playback_902; add one to song_202.</text>
<text x="170" y="517" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#172b4d">Save user_36 → playback_902, version 43.</text>
<rect x="40" y="660" width="425" height="155" rx="14" fill="#e5f6f0" stroke="#d2dce8" stroke-width="1.5"/>
<g data-component-icon="users" aria-hidden="true" transform="translate(54 673)"><rect width="38" height="38" rx="9" fill="#ffffff" fill-opacity="0.9"/><g transform="translate(4 4) scale(0.9375)" fill="none" stroke="#52647b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="5"/><path d="M3 28v-3a9 9 0 0 1 18 0v3M23 6a5 5 0 0 1 0 9M25 19a8 8 0 0 1 5 7v2"/></g></g>
<text x="106" y="696" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#172b4d">User record: after</text>
<text x="60" y="736" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#172b4d">user_36 → playback_902</text>
<text x="60" y="764" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#172b4d">song_202, version 43</text>
<rect x="535" y="660" width="425" height="155" rx="14" fill="#edf1f6" stroke="#d2dce8" stroke-width="1.5"/>
<text x="555" y="697" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Delayed STOP for playback_901</text>
<text x="555" y="736" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Old playback is already CLOSED.</text>
<text x="555" y="768" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Count change: 0</text>
<rect x="40" y="855" width="920" height="58" rx="14" fill="#eaf2ff" stroke="#d2dce8" stroke-width="1.5"/>
<text x="500" y="891" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#172b4d">The processor learns the previous song from its saved user record.</text>
<text x="40" y="936" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#52647b">A playback counter uses playback records; a unique-user counter also uses current-user records.</text>
</svg>
