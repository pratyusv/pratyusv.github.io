<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title description">
<title id="title">A playback changes the count once in each direction</title><desc id="description">An unseen playback becomes playing on its first start and adds one listener. A playing playback becomes closed on stop and removes one. A stop arriving before start saves closed without subtracting, and late starts for a closed playback are ignored.</desc>
<defs><marker id="normal" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8b9bb0"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c74747"/></marker></defs>
<rect width="1000" height="760" rx="20" fill="#f8fafc"/>
<path d="M300 225H370" fill="none" stroke="#8b9bb0" stroke-width="2.5" marker-end="url(#normal)"/>
<path d="M630 225H700" fill="none" stroke="#8b9bb0" stroke-width="2.5" marker-end="url(#normal)"/>
<path d="M170 295V405H830V295" fill="none" stroke="#8b9bb0" stroke-width="2.5" marker-end="url(#normal)"/>
<text x="40" y="48" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#172b4d">A playback changes the count once in each direction</text>
<text x="40" y="84" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#52647b">A new listening attempt always gets a new playback ID.</text>
<rect x="40" y="155" width="260" height="140" rx="14" fill="#edf1f6" stroke="#d2dce8" stroke-width="1.5"/>
<text x="60" y="192" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#172b4d">No playback record</text>
<text x="60" y="231" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">No contribution yet</text>
<rect x="370" y="155" width="260" height="140" rx="14" fill="#e5f6f0" stroke="#d2dce8" stroke-width="1.5"/>
<text x="390" y="192" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">PLAYING</text>
<text x="390" y="231" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">One contribution</text>
<rect x="700" y="155" width="260" height="140" rx="14" fill="#eaf2ff" stroke="#d2dce8" stroke-width="1.5"/>
<text x="720" y="192" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#172b4d">CLOSED</text>
<text x="720" y="231" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#172b4d">Zero contribution</text>
<text x="335" y="135" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#172b4d">START: +1</text>
<text x="665" y="135" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#172b4d">STOP: −1</text>
<text x="500" y="443" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#172b4d">STOP arrives first: save CLOSED, change count by 0</text>
<rect x="40" y="510" width="920" height="58" rx="14" fill="#e5f6f0" stroke="#d2dce8" stroke-width="1.5"/>
<text x="500" y="546" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#172b4d">Repeated START while PLAYING: keep the count unchanged.</text>
<rect x="40" y="595" width="920" height="58" rx="14" fill="#eaf2ff" stroke="#d2dce8" stroke-width="1.5"/>
<text x="500" y="631" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#172b4d">Any later START or STOP for a CLOSED playback: keep it closed.</text>
<text x="40" y="736" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#52647b">Validate that every event for a playback identifies the same user and song.</text>
</svg>
