<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1110" viewBox="0 0 1000 1110" role="img" aria-labelledby="title description">
<title id="title">Distribute song counters after one shard reaches capacity</title><desc id="description">Kafka input grouped by user feeds user workers that decide one contribution per user. They save accepted count changes to Kafka. Song workers consume changes grouped by song, maintain complete song totals, and send local Top-K lists through a summary topic. A merger chooses the global Top K and Redis serves the completed result.</desc>
