<text x="106" y="951" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#172b4d">Checkpoint store</text>
<text x="60" y="991" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#172b4d">Save worker-local records, counters, input positions, and pending output.</text>
<text x="60" y="1019" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#172b4d">Replacements restore matching state and replay retained Kafka input.</text>
<text x="40" y="1086" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#52647b">The user worker keeps the user record. Count changes travel to the workers handling each song.</text>
