<rect width="1000" height="1050" rx="20" fill="#f8fafc"/>
<path d="M257 535V575H500V620" fill="none" stroke="#8b9bb0" stroke-width="2.5" marker-end="url(#normal)"/>
<path d="M742 535V575H500V620" fill="none" stroke="#8b9bb0" stroke-width="2.5" marker-end="url(#normal)"/>
