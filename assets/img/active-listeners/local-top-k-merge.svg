<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050" role="img" aria-labelledby="title description">
<title id="title">Merge complete song counts into the Top K</title><desc id="description">Song partition 3 sends song_101=120000, song_303=90000, song_505=70000, song_707=30000, and song_909=10000, omitting its sixth song_111=1000. Partition 9 sends song_202=100000, song_404=80000, song_606=40000, song_808=20000, and song_1010=5000, omitting song_1212=500. The global winners are song_101, song_202, song_303, song_404, and song_505.</desc>
