<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1110" viewBox="0 0 1000 1110" role="img" aria-labelledby="title description">
<title id="title">Top K active songs with a Redis leaderboard</title><desc id="description">Session updates flow from the playback service through ingestion and Kafka to session workers. The workers keep each user current song and playback version and save accepted count changes to Kafka. A leaderboard writer applies complete transitions once to a Redis sorted set, publishes completed Top-K objects, and serves them through the Query API. Checkpoints and retained events support recovery.</desc>
