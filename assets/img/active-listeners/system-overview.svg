<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1230" viewBox="0 0 1000 1230" role="img" aria-labelledby="title description">
<title id="title">Distributed song counting after Redis reaches capacity</title><desc id="description">The playback service authorizes one session per user. An ingestion API writes session records to Kafka. Session workers decide each user contribution and publish durable transitions. Song workers apply signed changes, publish local Top-K lists to a summary topic, and a merger writes complete snapshots to Redis. The Query API serves readers. Checkpoints and a coordinator support recovery.</desc>
