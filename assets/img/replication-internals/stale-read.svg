<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"><title>Stale follower read after acknowledged write</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">A committed leader write can outrun follower visibility</text><rect x="70" y="105" width="260" height="110" rx="16" fill="#edf8f6" stroke="#5ab5a4"/><text x="200" y="145" text-anchor="middle" class="h">1 · Write to leader</text><text x="200" y="175" text-anchor="middle" class="b">A7 becomes £400</text><rect x="470" y="105" width="260" height="110" rx="16" fill="#edf8f6" stroke="#5ab5a4"/><text x="600" y="145" text-anchor="middle" class="h">2 · Success</text><text x="600" y="175" text-anchor="middle" class="b">commit position 841</text><rect x="870" y="105" width="260" height="110" rx="16" fill="#fff1f2" stroke="#d96b79"/><text x="1000" y="145" text-anchor="middle" class="h">3 · Read follower</text><text x="1000" y="175" text-anchor="middle" class="b">applied 840 → returns £500</text><path d="M330 160H470M730 160H870" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="250" y="330" width="700" height="100" rx="16" fill="#fff8e8" stroke="#e4b85b"/><text x="600" y="370" text-anchor="middle" class="h">Read-your-writes option</text><text x="600" y="400" text-anchor="middle" class="b">wait or route until serving replica applied position ≥ 841</text><text x="600" y="500" text-anchor="middle" class="b">A read replica needs a stated visibility contract, not only a health check.</text></svg>
