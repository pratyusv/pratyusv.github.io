<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img"><title>Leader follower replication</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="550" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">One leader assigns the write order</text><rect x="55" y="205" width="200" height="100" rx="15" fill="#fff" stroke="#b7c8d8"/><text x="155" y="245" text-anchor="middle" class="h">Client</text><text x="155" y="275" text-anchor="middle" class="b">withdraw A7</text><rect x="390" y="170" width="250" height="170" rx="17" fill="#fff8e8" stroke="#e4b85b"/><text x="515" y="213" text-anchor="middle" class="h">R1 · leader</text><text x="515" y="250" text-anchor="middle" class="b">validate and assign position</text><text x="515" y="280" text-anchor="middle" class="b">841: withdraw £100</text><rect x="845" y="110" width="240" height="110" rx="16" fill="#edf8f6" stroke="#5ab5a4"/><text x="965" y="150" text-anchor="middle" class="h">R2 · follower</text><text x="965" y="180" text-anchor="middle" class="b">persist and apply 841</text><rect x="845" y="330" width="240" height="110" rx="16" fill="#edf8f6" stroke="#5ab5a4"/><text x="965" y="370" text-anchor="middle" class="h">R3 · follower</text><text x="965" y="400" text-anchor="middle" class="b">persist and apply 841</text><path d="M255 255H390M640 225L845 165M640 285L845 385" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="745" y="245" text-anchor="middle" class="b">ordered log</text><text x="600" y="500" text-anchor="middle" class="b">Followers reproduce one history; they may persist or apply it at different times.</text></svg>
