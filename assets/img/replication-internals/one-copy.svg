<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img"><title>One durable database copy</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">One copy gives simple authority and one failure boundary</text><rect x="95" y="185" width="220" height="105" rx="16" fill="#fff" stroke="#b7c8d8"/><text x="205" y="225" text-anchor="middle" class="h">Client</text><text x="205" y="255" text-anchor="middle" class="b">withdraw £100</text><rect x="490" y="145" width="280" height="185" rx="18" fill="#fff8e8" stroke="#e4b85b"/><text x="630" y="190" text-anchor="middle" class="h">Database server</text><text x="630" y="230" text-anchor="middle" class="b">one authority</text><text x="630" y="260" text-anchor="middle" class="b">one commit order</text><text x="630" y="290" text-anchor="middle" class="b">balance A7 = £400</text><rect x="925" y="185" width="190" height="105" rx="16" fill="#fff1f2" stroke="#d96b79"/><text x="1020" y="225" text-anchor="middle" class="h">Failure</text><text x="1020" y="255" text-anchor="middle" class="b">service/data risk</text><path d="M315 237H490M770 237H925" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="600" y="430" text-anchor="middle" class="b">Replication is justified only when this failure, locality, or maintenance boundary is insufficient.</text></svg>
