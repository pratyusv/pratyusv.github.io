<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"><title>Read and write quorum overlap</title><defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">R + W &gt; N guarantees set overlap—not a complete protocol</text><circle cx="465" cy="270" r="180" fill="#edf8f6" fill-opacity=".8" stroke="#5ab5a4" stroke-width="3"/><circle cx="735" cy="270" r="180" fill="#fff8e8" fill-opacity=".8" stroke="#e4b85b" stroke-width="3"/><text x="360" y="175" text-anchor="middle" class="h">Write quorum W = 2</text><text x="840" y="175" text-anchor="middle" class="h">Read quorum R = 2</text><circle cx="355" cy="285" r="48" fill="#fff" stroke="#5ab5a4"/><text x="355" y="291" text-anchor="middle" class="h">R1</text><circle cx="600" cy="285" r="48" fill="#17324d"/><text x="600" y="291" text-anchor="middle" style="font:700 17px sans-serif;fill:#fff">R2</text><circle cx="845" cy="285" r="48" fill="#fff" stroke="#e4b85b"/><text x="845" y="291" text-anchor="middle" class="h">R3</text><text x="600" y="375" text-anchor="middle" class="b">overlap replica</text><text x="600" y="490" text-anchor="middle" class="b">Reads must still identify the valid newest version under concurrency and failure.</text></svg>
