<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img"><title>Replication acknowledgement boundaries</title><defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="590" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">The success reply chooses a latency and loss window</text><rect x="55" y="95" width="340" height="390" rx="20" fill="#fff" stroke="#d96b79"/><text x="225" y="140" text-anchor="middle" class="h">Leader only</text><text x="225" y="200" text-anchor="middle" class="b">R1 durable ✓</text><text x="225" y="240" text-anchor="middle" class="b">R2 pending</text><text x="225" y="280" text-anchor="middle" class="b">R3 pending</text><rect x="115" y="330" width="220" height="65" rx="12" fill="#fff1f2" stroke="#d96b79"/><text x="225" y="370" text-anchor="middle" class="h">reply now</text><text x="225" y="440" text-anchor="middle" class="b">fast; latest write may be lost</text><rect x="430" y="95" width="340" height="390" rx="20" fill="#fff" stroke="#e4b85b"/><text x="600" y="140" text-anchor="middle" class="h">Leader + one follower</text><text x="600" y="200" text-anchor="middle" class="b">R1 durable ✓</text><text x="600" y="240" text-anchor="middle" class="b">R2 durable ✓</text><text x="600" y="280" text-anchor="middle" class="b">R3 pending</text><rect x="490" y="330" width="220" height="65" rx="12" fill="#fff8e8" stroke="#e4b85b"/><text x="600" y="370" text-anchor="middle" class="h">reply now</text><text x="600" y="440" text-anchor="middle" class="b">survives one qualifying loss</text><rect x="805" y="95" width="340" height="390" rx="20" fill="#fff" stroke="#5ab5a4"/><text x="975" y="140" text-anchor="middle" class="h">Every follower</text><text x="975" y="200" text-anchor="middle" class="b">R1 durable ✓</text><text x="975" y="240" text-anchor="middle" class="b">R2 durable ✓</text><text x="975" y="280" text-anchor="middle" class="b">R3 durable ✓</text><rect x="865" y="330" width="220" height="65" rx="12" fill="#edf8f6" stroke="#5ab5a4"/><text x="975" y="370" text-anchor="middle" class="h">reply now</text><text x="975" y="440" text-anchor="middle" class="b">slowest replica gates writes</text><text x="600" y="545" text-anchor="middle" class="b">Name the exact durable event and replicas required before success.</text></svg>
