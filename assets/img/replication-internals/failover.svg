<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img"><title>Safe replica failover sequence</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 14px sans-serif;fill:#17324d}.b{font:11px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="590" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Failover changes authority only after proving history</text><g><rect x="45" y="185" width="180" height="100" rx="14" fill="#fff1f2" stroke="#d96b79"/><text x="135" y="222" text-anchor="middle" class="h">DETECT</text><text x="135" y="250" text-anchor="middle" class="b">leader unreachable</text><rect x="275" y="185" width="180" height="100" rx="14" fill="#fff8e8" stroke="#e4b85b"/><text x="365" y="222" text-anchor="middle" class="h">COMPARE</text><text x="365" y="250" text-anchor="middle" class="b">terms + positions</text><rect x="505" y="185" width="180" height="100" rx="14" fill="#f3effb" stroke="#9377c6"/><text x="595" y="222" text-anchor="middle" class="h">AUTHORIZE</text><text x="595" y="250" text-anchor="middle" class="b">quorum generation</text><rect x="735" y="185" width="180" height="100" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="825" y="222" text-anchor="middle" class="h">FENCE</text><text x="825" y="250" text-anchor="middle" class="b">old authority</text><rect x="965" y="185" width="190" height="100" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="1060" y="222" text-anchor="middle" class="h">ROUTE</text><text x="1060" y="250" text-anchor="middle" class="b">new leader</text></g><path d="M225 235H275M455 235H505M685 235H735M915 235H965" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="230" y="375" width="740" height="85" rx="16" fill="#17324d"/><text x="600" y="410" text-anchor="middle" style="font:700 14px sans-serif;fill:#fff">Safety condition</text><text x="600" y="438" text-anchor="middle" style="font:12px sans-serif;fill:#dce8f2">new authority contains every committed entry and old authority cannot commit</text><text x="600" y="525" text-anchor="middle" class="b">Promotion speed is only useful after the data-safety conditions hold.</text></svg>
