<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"><title>Hints and anti-entropy repair</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Recent delivery and complete convergence need different mechanisms</text><rect x="55" y="105" width="520" height="350" rx="20" fill="#fff8e8" stroke="#e4b85b"/><text x="315" y="150" text-anchor="middle" class="h">Hinted handoff</text><text x="315" y="215" text-anchor="middle" class="b">R3 misses write V42</text><rect x="155" y="255" width="320" height="85" rx="14" fill="#fff" stroke="#e4b85b"/><text x="315" y="288" text-anchor="middle" class="h">store temporary delivery hint</text><text x="315" y="315" text-anchor="middle" class="b">replay when R3 returns</text><text x="315" y="405" text-anchor="middle" class="b">fast path for a bounded recent outage</text><rect x="625" y="105" width="520" height="350" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="885" y="150" text-anchor="middle" class="h">Anti-entropy repair</text><text x="885" y="215" text-anchor="middle" class="b">compare complete key ranges</text><rect x="725" y="255" width="320" height="85" rx="14" fill="#fff" stroke="#5ab5a4"/><text x="885" y="288" text-anchor="middle" class="h">find divergent or missing versions</text><text x="885" y="315" text-anchor="middle" class="b">stream authoritative differences</text><text x="885" y="405" text-anchor="middle" class="b">covers cold keys and expired hints</text><text x="600" y="515" text-anchor="middle" class="b">Hints reduce lag; scheduled repair proves coverage.</text></svg>
