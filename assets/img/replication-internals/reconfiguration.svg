<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img"><title>Safe replica reconfiguration</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 14px sans-serif;fill:#17324d}.b{font:11px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="570" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Reconfiguration catches up before moving authority</text><g><rect x="45" y="180" width="190" height="105" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="140" y="218" text-anchor="middle" class="h">OLD CONFIG</text><text x="140" y="247" text-anchor="middle" class="b">R1 R2 R3</text><rect x="290" y="180" width="190" height="105" rx="14" fill="#fff8e8" stroke="#e4b85b"/><text x="385" y="218" text-anchor="middle" class="h">ADD LEARNER</text><text x="385" y="247" text-anchor="middle" class="b">R4 no authority</text><rect x="535" y="180" width="190" height="105" rx="14" fill="#fff8e8" stroke="#e4b85b"/><text x="630" y="218" text-anchor="middle" class="h">CATCH UP</text><text x="630" y="247" text-anchor="middle" class="b">through committed position</text><rect x="780" y="180" width="190" height="105" rx="14" fill="#f3effb" stroke="#9377c6"/><text x="875" y="218" text-anchor="middle" class="h">OVERLAP</text><text x="875" y="247" text-anchor="middle" class="b">transition authority</text><rect x="1025" y="180" width="140" height="105" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="1095" y="218" text-anchor="middle" class="h">NEW</text><text x="1095" y="247" text-anchor="middle" class="b">R2 R3 R4</text></g><path d="M235 232H290M480 232H535M725 232H780M970 232H1025" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="250" y="375" width="700" height="90" rx="16" fill="#17324d"/><text x="600" y="410" text-anchor="middle" style="font:700 14px sans-serif;fill:#fff">Invariant</text><text x="600" y="440" text-anchor="middle" style="font:12px sans-serif;fill:#dce8f2">old and new configurations cannot independently authorize conflicting histories</text></svg>
