<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"><title>Split-brain replication histories</title><defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Two write authorities create histories that cannot both be canonical</text><rect x="65" y="105" width="470" height="330" rx="20" fill="#fff1f2" stroke="#d96b79"/><text x="300" y="148" text-anchor="middle" class="h">Old leader R1 · isolated</text><text x="300" y="210" text-anchor="middle" class="b">841 · committed prefix</text><text x="300" y="255" text-anchor="middle" class="b">842 · committed prefix</text><rect x="170" y="300" width="260" height="75" rx="14" fill="#fff" stroke="#d96b79"/><text x="300" y="333" text-anchor="middle" class="h">843a · accepts write</text><text x="300" y="358" text-anchor="middle" class="b">old generation</text><rect x="665" y="105" width="470" height="330" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="900" y="148" text-anchor="middle" class="h">Promoted R2 · quorum side</text><text x="900" y="210" text-anchor="middle" class="b">841 · committed prefix</text><text x="900" y="255" text-anchor="middle" class="b">842 · committed prefix</text><rect x="770" y="300" width="260" height="75" rx="14" fill="#fff" stroke="#5ab5a4"/><text x="900" y="333" text-anchor="middle" class="h">843b, 844b · new writes</text><text x="900" y="358" text-anchor="middle" class="b">new generation</text><path d="M550 175L650 365M650 175L550 365" stroke="#d96b79" stroke-width="8"/><text x="600" y="500" text-anchor="middle" class="b">Routing clients away from R1 is not enough; the storage authority must reject generation 843a.</text></svg>
