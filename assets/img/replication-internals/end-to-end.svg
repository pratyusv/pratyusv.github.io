<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"><title>End-to-end replicated write and failover</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 13px sans-serif;fill:#17324d}.b{font:10px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="640" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">One write crosses durability, visibility, and authority boundaries</text><g><rect x="35" y="150" width="150" height="90" rx="13" fill="#fff" stroke="#b7c8d8"/><text x="110" y="185" text-anchor="middle" class="h">REQUEST</text><text x="110" y="212" text-anchor="middle" class="b">id req-91</text><rect x="225" y="150" width="150" height="90" rx="13" fill="#fff8e8" stroke="#e4b85b"/><text x="300" y="185" text-anchor="middle" class="h">ORDER</text><text x="300" y="212" text-anchor="middle" class="b">position 841</text><rect x="415" y="150" width="150" height="90" rx="13" fill="#edf8f6" stroke="#5ab5a4"/><text x="490" y="185" text-anchor="middle" class="h">REPLICATE</text><text x="490" y="212" text-anchor="middle" class="b">durable quorum</text><rect x="605" y="150" width="150" height="90" rx="13" fill="#edf8f6" stroke="#5ab5a4"/><text x="680" y="185" text-anchor="middle" class="h">ACK</text><text x="680" y="212" text-anchor="middle" class="b">commit 841</text><rect x="795" y="150" width="150" height="90" rx="13" fill="#f3effb" stroke="#9377c6"/><text x="870" y="185" text-anchor="middle" class="h">READ</text><text x="870" y="212" text-anchor="middle" class="b">applied ≥ 841</text><rect x="985" y="150" width="180" height="90" rx="13" fill="#fff1f2" stroke="#d96b79"/><text x="1075" y="185" text-anchor="middle" class="h">LEADER LOST</text><text x="1075" y="212" text-anchor="middle" class="b">start failover</text></g><path d="M185 195H225M375 195H415M565 195H605M755 195H795M945 195H985" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><g><rect x="225" y="380" width="190" height="95" rx="14" fill="#f3effb" stroke="#9377c6"/><text x="320" y="417" text-anchor="middle" class="h">ELECT</text><text x="320" y="445" text-anchor="middle" class="b">higher generation</text><rect x="505" y="380" width="190" height="95" rx="14" fill="#fff8e8" stroke="#e4b85b"/><text x="600" y="417" text-anchor="middle" class="h">FENCE + ROUTE</text><text x="600" y="445" text-anchor="middle" class="b">one new authority</text><rect x="785" y="380" width="190" height="95" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="880" y="417" text-anchor="middle" class="h">CATCH UP</text><text x="880" y="445" text-anchor="middle" class="b">old replica rejoins</text></g><path d="M1075 240V330H320V380M415 427H505M695 427H785" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="600" y="570" text-anchor="middle" class="b">The client-visible success boundary constrains every later promotion and read.</text></svg>
