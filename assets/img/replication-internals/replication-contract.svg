<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img"><title>Replication protocol contract</title><defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 15px sans-serif;fill:#17324d}.b{font:12px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="570" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">A replica count is not a replication contract</text><g><rect x="65" y="105" width="300" height="130" rx="16" fill="#edf8f6" stroke="#5ab5a4"/><text x="215" y="145" text-anchor="middle" class="h">Write authority</text><text x="215" y="177" text-anchor="middle" class="b">leader, quorum, or any replica?</text><text x="215" y="205" text-anchor="middle" class="b">how are conflicts ordered?</text><rect x="450" y="105" width="300" height="130" rx="16" fill="#fff8e8" stroke="#e4b85b"/><text x="600" y="145" text-anchor="middle" class="h">Acknowledgement</text><text x="600" y="177" text-anchor="middle" class="b">which durable copies complete?</text><text x="600" y="205" text-anchor="middle" class="b">what loss remains possible?</text><rect x="835" y="105" width="300" height="130" rx="16" fill="#f3effb" stroke="#9377c6"/><text x="985" y="145" text-anchor="middle" class="h">Read visibility</text><text x="985" y="177" text-anchor="middle" class="b">latest, bounded, or eventual?</text><text x="985" y="205" text-anchor="middle" class="b">which replica may answer?</text><rect x="255" y="315" width="300" height="130" rx="16" fill="#fff1f2" stroke="#d96b79"/><text x="405" y="355" text-anchor="middle" class="h">Failover authority</text><text x="405" y="387" text-anchor="middle" class="b">which history may be promoted?</text><text x="405" y="415" text-anchor="middle" class="b">how is the old owner fenced?</text><rect x="645" y="315" width="300" height="130" rx="16" fill="#edf8f6" stroke="#5ab5a4"/><text x="795" y="355" text-anchor="middle" class="h">Convergence</text><text x="795" y="387" text-anchor="middle" class="b">catch-up, repair, and merge</text><text x="795" y="415" text-anchor="middle" class="b">membership transition</text></g><text x="600" y="520" text-anchor="middle" class="b">Every claimed guarantee depends on answers to all five questions.</text></svg>
