<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"><title>Replica durable and applied log positions</title><defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Replica progress has more than one position</text><g class="h"><text x="90" y="155">R1 leader</text><text x="90" y="270">R2 follower</text><text x="90" y="385">R3 follower</text></g><g><rect x="245" y="115" width="800" height="58" rx="12" fill="#edf8f6" stroke="#5ab5a4"/><rect x="245" y="230" width="760" height="58" rx="12" fill="#fff8e8" stroke="#e4b85b"/><rect x="245" y="345" width="600" height="58" rx="12" fill="#fff1f2" stroke="#d96b79"/></g><g class="b"><text x="1060" y="151">durable 850 · applied 850</text><text x="1020" y="266">durable 850 · applied 848</text><text x="860" y="381">durable 844 · applied 844</text></g><line x1="1045" y1="95" x2="1045" y2="430" stroke="#55728f" stroke-width="3" stroke-dasharray="8 6"/><text x="1045" y="465" text-anchor="middle" class="b">leader durable frontier</text><text x="600" y="515" text-anchor="middle" class="b">A persisted entry can survive restart before it becomes visible to reads.</text></svg>
