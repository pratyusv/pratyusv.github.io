<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img"><title>Snapshot and log catch-up</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="540" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">A lagging replica installs a base before replaying the tail</text><rect x="65" y="170" width="250" height="150" rx="17" fill="#fff1f2" stroke="#d96b79"/><text x="190" y="210" text-anchor="middle" class="h">Lagging replica</text><text x="190" y="250" text-anchor="middle" class="b">applied 7,100</text><text x="190" y="280" text-anchor="middle" class="b">old logs unavailable</text><rect x="470" y="145" width="260" height="200" rx="17" fill="#f3effb" stroke="#9377c6"/><text x="600" y="188" text-anchor="middle" class="h">Install snapshot</text><text x="600" y="230" text-anchor="middle" class="b">state through 10,000</text><text x="600" y="265" text-anchor="middle" class="b">verify integrity</text><text x="600" y="300" text-anchor="middle" class="b">atomic activation</text><rect x="885" y="170" width="250" height="150" rx="17" fill="#edf8f6" stroke="#5ab5a4"/><text x="1010" y="210" text-anchor="middle" class="h">Replay log tail</text><text x="1010" y="250" text-anchor="middle" class="b">10,001 ... current</text><text x="1010" y="280" text-anchor="middle" class="b">then become eligible</text><path d="M315 245H470M730 245H885" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="600" y="460" text-anchor="middle" class="b">A snapshot without its exact included position is not a safe replication boundary.</text></svg>
