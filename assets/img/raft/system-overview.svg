<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1260" viewBox="0 0 1200 1260" role="img" aria-labelledby="title desc">
<title id="title">Raft system overview and revision guide</title>
<desc id="desc">Three database nodes each contain a Raft log, deterministic state machine, and local storage engine. The leader accepts writes, replicates durable log entries, commits a current-term entry with a majority, applies it, and responds. Followers apply after learning commitment. Notes summarize log positions, elections, snapshots, and linearizable reads.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#17324d}.title{font-size:28px;font-weight:700}.head{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:16px;fill:#45627d}.label{font-size:16px;font-weight:700}.mono{font-family:monospace;font-size:17px}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#45627d" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="1260" rx="22" fill="#f7fafc"/>

<text x="600" y="45" class="title" text-anchor="middle">Raft: system overview</text>
<text x="600" y="75" class="small" text-anchor="middle">One Raft group · three database nodes · crash-fault model</text>
<rect x="30" y="98" width="1140" height="76" rx="10" fill="#fff" stroke="#bdcddc"/>
<text x="600" y="126" class="label" text-anchor="middle">1 Request  →  2 Append log  →  3 Replicate  →  4 Commit on a durable majority</text>
<text x="600" y="153" class="label" text-anchor="middle">5 Apply on leader  →  6 Respond · 7 Followers apply after learning commitment</text>
<rect x="490" y="194" width="220" height="42" rx="10" fill="#fff" stroke="#bdcddc"/>
<text x="600" y="222" class="label" text-anchor="middle">Client · SET x = 10</text>
<path d="M550 236 V279" fill="none" stroke="#45627d" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="538" y="262" class="label" text-anchor="end">1</text>
<path d="M650 279 V236" fill="none" stroke="#45627d" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="668" y="262" class="label" text-anchor="start">6 Result</text>
<rect x="30" y="280" width="340" height="436" rx="10" fill="#fff" stroke="#bdcddc"/>
<text x="200" y="311" class="head" text-anchor="middle">Follower B</text>
<text x="200" y="336" class="small" text-anchor="middle">Raft + application + storage</text>
<rect x="50" y="354" width="300" height="66" rx="10" fill="#eaf1fa" stroke="#91afd1"/>
<text x="200" y="380" class="label" text-anchor="middle">Persist replicated Raft log</text>
<text x="200" y="406" class="mono" text-anchor="middle">101 · term 7 · SET x = 10</text>
<rect x="50" y="449" width="300" height="62" rx="10" fill="#fff3d8" stroke="#cba655"/>
<text x="200" y="475" class="label" text-anchor="middle">Learn leaderCommit = 101</text>
<text x="200" y="498" class="small" text-anchor="middle">Apply only matching committed entries</text>
<path d="M200 420 V449" fill="none" stroke="#45627d" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M200 511 V540" fill="none" stroke="#45627d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50" y="540" width="300" height="58" rx="10" fill="#e7f4ee" stroke="#75ac94"/>
<text x="200" y="565" class="label" text-anchor="middle">7 State machine applies</text>
<text x="200" y="587" class="small" text-anchor="middle">Committed commands, in order</text>
<path d="M200 598 V624" fill="none" stroke="#45627d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50" y="624" width="300" height="68" rx="10" fill="#e7f4ee" stroke="#75ac94"/>
<text x="200" y="650" class="label" text-anchor="middle">Local storage engine · x = 10</text>
<text x="200" y="676" class="small" text-anchor="middle">User data · indexes · cache · files</text>
<rect x="430" y="280" width="340" height="436" rx="10" fill="#fff" stroke="#bdcddc"/>
<text x="600" y="311" class="head" text-anchor="middle">Leader A</text>
<text x="600" y="336" class="small" text-anchor="middle">Raft + application + storage</text>
<rect x="450" y="354" width="300" height="66" rx="10" fill="#eaf1fa" stroke="#91afd1"/>
<text x="600" y="380" class="label" text-anchor="middle">2 Append Raft log</text>
<text x="600" y="406" class="mono" text-anchor="middle">101 · term 7 · SET x = 10</text>
<rect x="450" y="449" width="300" height="62" rx="10" fill="#fff3d8" stroke="#cba655"/>
<text x="600" y="475" class="label" text-anchor="middle">4 Commit current-term entry</text>
<text x="600" y="498" class="small" text-anchor="middle">A + B or A + C = majority</text>
<path d="M600 420 V449" fill="none" stroke="#45627d" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M600 511 V540" fill="none" stroke="#45627d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="450" y="540" width="300" height="58" rx="10" fill="#e7f4ee" stroke="#75ac94"/>
<text x="600" y="565" class="label" text-anchor="middle">5 State machine applies</text>
<text x="600" y="587" class="small" text-anchor="middle">Committed commands, in order</text>
<path d="M600 598 V624" fill="none" stroke="#45627d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="450" y="624" width="300" height="68" rx="10" fill="#e7f4ee" stroke="#75ac94"/>
<text x="600" y="650" class="label" text-anchor="middle">Local storage engine · x = 10</text>
<text x="600" y="676" class="small" text-anchor="middle">User data · indexes · cache · files</text>
<rect x="830" y="280" width="340" height="436" rx="10" fill="#fff" stroke="#bdcddc"/>
<text x="1000" y="311" class="head" text-anchor="middle">Follower C</text>
<text x="1000" y="336" class="small" text-anchor="middle">Raft + application + storage</text>
<rect x="850" y="354" width="300" height="66" rx="10" fill="#eaf1fa" stroke="#91afd1"/>
<text x="1000" y="380" class="label" text-anchor="middle">Persist replicated Raft log</text>
<text x="1000" y="406" class="mono" text-anchor="middle">101 · term 7 · SET x = 10</text>
<rect x="850" y="449" width="300" height="62" rx="10" fill="#fff3d8" stroke="#cba655"/>
<text x="1000" y="475" class="label" text-anchor="middle">Learn leaderCommit = 101</text>
<text x="1000" y="498" class="small" text-anchor="middle">Apply only matching committed entries</text>
<path d="M1000 420 V449" fill="none" stroke="#45627d" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M1000 511 V540" fill="none" stroke="#45627d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="850" y="540" width="300" height="58" rx="10" fill="#e7f4ee" stroke="#75ac94"/>
<text x="1000" y="565" class="label" text-anchor="middle">7 State machine applies</text>
<text x="1000" y="587" class="small" text-anchor="middle">Committed commands, in order</text>
<path d="M1000 598 V624" fill="none" stroke="#45627d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="850" y="624" width="300" height="68" rx="10" fill="#e7f4ee" stroke="#75ac94"/>
<text x="1000" y="650" class="label" text-anchor="middle">Local storage engine · x = 10</text>
<text x="1000" y="676" class="small" text-anchor="middle">User data · indexes · cache · files</text>
<path d="M450 367 H350" fill="none" stroke="#45627d" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="400" y="356" class="label" text-anchor="middle">3</text>
<path d="M750 367 H850" fill="none" stroke="#45627d" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="800" y="356" class="label" text-anchor="middle">3</text>
<path d="M350 410 H450" fill="none" stroke="#45627d" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 5"/>
<text x="400" y="435" class="small" text-anchor="middle">ACK</text>
<path d="M850 410 H750" fill="none" stroke="#45627d" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 5"/>
<text x="800" y="435" class="small" text-anchor="middle">ACK</text>
<path d="M450 480 H350" fill="none" stroke="#45627d" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M750 480 H850" fill="none" stroke="#45627d" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600" y="741" class="small" text-anchor="middle">Solid arrows between nodes: log replication and commit updates. Dashed ACKs: durable log storage.</text>
<rect x="30" y="766" width="1140" height="155" rx="10" fill="#fff" stroke="#bdcddc"/>
<text x="55" y="795" class="head" text-anchor="start">Three positions on every replica</text>
<text x="55" y="824" class="mono" text-anchor="start">last log index</text>
<text x="300" y="824" class="body" text-anchor="start">Highest stored entry; it may still be uncommitted.</text>
<text x="55" y="853" class="mono" text-anchor="start">commitIndex</text>
<text x="300" y="853" class="body" text-anchor="start">Highest entry known to be committed; application may lag.</text>
<text x="55" y="882" class="mono" text-anchor="start">lastApplied</text>
<text x="300" y="882" class="body" text-anchor="start">Highest entry already reflected in local application state.</text>
<text x="600" y="907" class="mono" text-anchor="middle">lastApplied ≤ commitIndex ≤ last log index</text>
<rect x="30" y="944" width="360" height="165" rx="10" fill="#fff" stroke="#bdcddc"/>
<text x="50" y="974" class="head" text-anchor="start">Election</text>
<text x="50" y="1004" class="small" text-anchor="start">Timeout → new term → request votes.</text>
<text x="50" y="1029" class="small" text-anchor="start">One durable vote per node per term.</text>
<text x="50" y="1054" class="small" text-anchor="start">A majority elects a leader; log freshness</text>
<text x="50" y="1079" class="small" text-anchor="start">is checked by last term, then index.</text>
<rect x="420" y="944" width="360" height="165" rx="10" fill="#fff" stroke="#bdcddc"/>
<text x="440" y="974" class="head" text-anchor="start">Recovery</text>
<text x="440" y="1004" class="small" text-anchor="start">Retry log replication from a matching</text>
<text x="440" y="1029" class="small" text-anchor="start">prefix. If required entries were compacted,</text>
<text x="440" y="1054" class="small" text-anchor="start">install a snapshot and replay the suffix.</text>
<text x="440" y="1079" class="small" text-anchor="start">Committed history survives leader changes.</text>
<rect x="810" y="944" width="360" height="165" rx="10" fill="#fff" stroke="#bdcddc"/>
<text x="830" y="974" class="head" text-anchor="start">Reads</text>
<text x="830" y="1004" class="small" text-anchor="start">Query the local applied state.</text>
<text x="830" y="1029" class="small" text-anchor="start">Linearizable reads need a safe leadership</text>
<text x="830" y="1054" class="small" text-anchor="start">check and application through the read</text>
<text x="830" y="1079" class="small" text-anchor="start">index; follower reads may be stale.</text>
<rect x="30" y="1130" width="1140" height="100" rx="10" fill="#edf2f7" stroke="#bdcddc"/>
<text x="600" y="1160" class="label" text-anchor="middle">Commitment does not wait for every follower to apply.</text>
<text x="600" y="1188" class="small" text-anchor="middle">Nodes converge on logical state; their cache contents and physical files may differ.</text>
<text x="600" y="1214" class="small" text-anchor="middle">The local storage engine holds the data. There is no subsequent transfer to a separate database.</text>
</svg>
