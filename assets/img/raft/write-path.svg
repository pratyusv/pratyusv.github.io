<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1010" viewBox="0 0 1120 1010" role="img" aria-labelledby="title desc">
<title id="title">Raft write: replication, commitment, and application</title>
<desc id="desc">Leader A persists entry 101 and replicates it. B persists and acknowledges while C is delayed. A commits with a majority, applies, and responds. B learns the commit index and applies. C later receives the entry and applies it.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#17324d}.title{font-size:25px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#45627d}.event{font-size:15px;font-weight:600}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#45627d" stroke-width="1.3"/></marker></defs>
<rect width="1120" height="1010" rx="20" fill="#f7fafc"/>

<text x="560" y="42" class="title" text-anchor="middle">Raft write: from log entry to database state</text>
<text x="560" y="71" class="small" text-anchor="middle">Entry 101 · term 7 · SET x = 10 · initially applied through index 100</text>
<rect x="15" y="100" width="170" height="42" rx="9" fill="#fff" stroke="#bdcddc"/>
<text x="100" y="127" class="head" text-anchor="middle">Client</text>
<path d="M100 148 V918" stroke="#bdcddc" stroke-dasharray="5 6"/>
<rect x="300" y="100" width="170" height="42" rx="9" fill="#fff" stroke="#bdcddc"/>
<text x="385" y="127" class="head" text-anchor="middle">Leader A</text>
<path d="M385 148 V918" stroke="#bdcddc" stroke-dasharray="5 6"/>
<rect x="600" y="100" width="170" height="42" rx="9" fill="#fff" stroke="#bdcddc"/>
<text x="685" y="127" class="head" text-anchor="middle">Follower B</text>
<path d="M685 148 V918" stroke="#bdcddc" stroke-dasharray="5 6"/>
<rect x="900" y="100" width="170" height="42" rx="9" fill="#fff" stroke="#bdcddc"/>
<text x="985" y="127" class="head" text-anchor="middle">Follower C</text>
<path d="M985 148 V918" stroke="#bdcddc" stroke-dasharray="5 6"/>
<path d="M100 187 H385" fill="none" stroke="#45627d" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="242.5" y="177" class="small" text-anchor="middle">SET x = 10</text>
<rect x="270" y="211" width="230" height="32" rx="9" fill="#eaf1fa" stroke="#91afd1"/>
<text x="385" y="232" class="event" text-anchor="middle">Persist log entry 101</text>
<path d="M385 283 H685" fill="none" stroke="#45627d" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="535.0" y="273" class="small" text-anchor="middle">AppendEntries · commit = 100</text>
<path d="M385 326 H985" fill="none" stroke="#45627d" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="685.0" y="316" class="small" text-anchor="middle">AppendEntries to C delayed in transit</text>
<rect x="570" y="346" width="230" height="54" rx="9" fill="#eaf1fa" stroke="#91afd1"/>
<text x="685" y="367" class="event" text-anchor="middle">Persist log entry 101</text>
<text x="685" y="389" class="event" text-anchor="middle">State still at index 100</text>
<path d="M685 437 H385" fill="none" stroke="#45627d" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="535.0" y="427" class="small" text-anchor="middle">ACK · replicated through 101</text>
<rect x="270" y="461" width="230" height="54" rx="9" fill="#fff3d8" stroke="#cba655"/>
<text x="385" y="482" class="event" text-anchor="middle">Commit index = 101</text>
<text x="385" y="504" class="event" text-anchor="middle">A + B: majority of 3</text>
<rect x="270" y="536" width="230" height="32" rx="9" fill="#e7f4ee" stroke="#75ac94"/>
<text x="385" y="557" class="event" text-anchor="middle">Apply locally: x = 10</text>
<path d="M385 612 H100" fill="none" stroke="#45627d" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="242.5" y="602" class="small" text-anchor="middle">Success</text>
<path d="M385 663 H685" fill="none" stroke="#45627d" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="535.0" y="653" class="small" text-anchor="middle">AppendEntries · commit = 101</text>
<rect x="570" y="685" width="230" height="32" rx="9" fill="#e7f4ee" stroke="#75ac94"/>
<text x="685" y="706" class="event" text-anchor="middle">Apply locally: x = 10</text>
<path d="M385 767 H985" fill="none" stroke="#45627d" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="685.0" y="757" class="small" text-anchor="middle">Later: entry 101 + commit index 101</text>
<rect x="870" y="789" width="230" height="32" rx="9" fill="#eaf1fa" stroke="#91afd1"/>
<text x="985" y="810" class="event" text-anchor="middle">Persist log entry 101</text>
<rect x="870" y="847" width="230" height="32" rx="9" fill="#e7f4ee" stroke="#75ac94"/>
<text x="985" y="868" class="event" text-anchor="middle">Apply locally: x = 10</text>
<text x="560" y="949" class="small" text-anchor="middle">Blue: durable log append · Amber: commitment · Green: application state updated</text>
<text x="560" y="979" class="small" text-anchor="middle">One valid schedule; follower application and the client response can occur in either order.</text>
</svg>