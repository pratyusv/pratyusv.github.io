<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">WebSocket broker and replay architecture</title><desc id="d">A producer commits a durable event, a replicated broker routes it to the current gateway, and the client cursor determines replay after failure.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 26px system-ui;fill:#17324d}.h{font:700 16px system-ui;fill:#17324d}.b{font:13px system-ui;fill:#45627d}.s{font:12px system-ui;fill:#45627d}.w{font:700 14px system-ui;fill:#fff}</style></defs><rect width="1200" height="680" rx="26" fill="#f7fafc"/><text x="600" y="48" text-anchor="middle" class="t">Routing, transport, socket delivery, and replay are different boundaries</text><rect x="35" y="190" width="180" height="115" rx="15" fill="#fff8e8" stroke="#e4b85b"/><text x="125" y="227" text-anchor="middle" class="h">Order service</text><text x="125" y="255" text-anchor="middle" class="b">commit event 1843</text><text x="125" y="280" text-anchor="middle" class="s">stable event ID</text><rect x="285" y="110" width="250" height="275" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="410" y="148" text-anchor="middle" class="h">Durable broker partition</text><rect x="325" y="185" width="170" height="65" rx="12" fill="#17324d"/><text x="410" y="224" text-anchor="middle" class="w">leader · append 1843</text><rect x="325" y="280" width="170" height="62" rx="12" fill="#fff" stroke="#8fcabb"/><text x="410" y="317" text-anchor="middle" class="b">replicated followers</text><path d="M215 247H285" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="600" y="110" width="250" height="275" rx="20" fill="#f3effb" stroke="#9377c6"/><text x="725" y="148" text-anchor="middle" class="h">Gateway eu-17</text><rect x="640" y="185" width="170" height="65" rx="12" fill="#fff" stroke="#9377c6"/><text x="725" y="213" text-anchor="middle" class="h">consumer offset</text><text x="725" y="235" text-anchor="middle" class="s">event 1843 received</text><rect x="640" y="280" width="170" height="62" rx="12" fill="#fff" stroke="#9377c6"/><text x="725" y="306" text-anchor="middle" class="h">socket queue</text><text x="725" y="328" text-anchor="middle" class="s">ephemeral bytes</text><path d="M535 247H600" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="915" y="190" width="250" height="115" rx="15" fill="#fff8e8" stroke="#e4b85b"/><text x="1040" y="227" text-anchor="middle" class="h">Client application</text><text x="1040" y="255" text-anchor="middle" class="b">lastApplied = 1843</text><text x="1040" y="280" text-anchor="middle" class="s">durable replay cursor</text><path d="M850 247H915" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="275" y="455" width="650" height="90" rx="16" fill="#fff" stroke="#9bb0c2"/><text x="600" y="487" text-anchor="middle" class="h">After gateway or network failure</text><text x="600" y="516" text-anchor="middle" class="b">new gateway reads lastApplied and replays 1844…N; duplicates are rejected by event ID or sequence</text><rect x="135" y="590" width="930" height="56" rx="14" fill="#17324d"/><text x="600" y="624" text-anchor="middle" class="w">A broker acknowledgement, a socket write, and client processing are three different facts.</text></svg>
