<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">WebSocket connection lifecycle</title>
  <desc id="desc">A server-side connection moves from accepted through optional TLS, the opening handshake, WebSocket protocol open, application ready, closing, and closed states. Invalid input, denial, timeout, or transport errors terminate the connection.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#55728f"/>
    </marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c86464"/>
    </marker>
    <style>
      .title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324d; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324d; }
      .body { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #45627d; }
      .small { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #45627d; }
      .error-text { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9f4444; }
      .arrow { stroke: #55728f; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .error { stroke: #c86464; stroke-width: 2.5; fill: none; marker-end: url(#error-arrow); }
      .error-rail { stroke: #c86464; stroke-width: 2.5; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="820" rx="24" fill="#f7fafc"/>
  <text x="600" y="46" text-anchor="middle" class="title">A connection advances only when the current phase succeeds</text>

  <text x="410" y="81" text-anchor="middle" class="body">Normal lifecycle</text>
  <text x="957" y="81" text-anchor="middle" class="body">Failure exits</text>

  <rect x="250" y="96" width="320" height="66" rx="16" fill="#ffffff" stroke="#7399dc" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="137" text-anchor="middle" class="label">Accepted</text>
  <path d="M410 162V187" class="arrow"/>

  <rect x="250" y="190" width="320" height="72" rx="16" fill="#eef4ff" stroke="#7399dc" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="220" text-anchor="middle" class="label">Optional TLS handshake</text>
  <text x="410" y="245" text-anchor="middle" class="small">advance without blocking</text>
  <path d="M410 262V287" class="arrow"/>

  <rect x="250" y="290" width="320" height="72" rx="16" fill="#eef4ff" stroke="#7399dc" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="320" text-anchor="middle" class="label">Opening handshake</text>
  <text x="410" y="345" text-anchor="middle" class="small">validate headers, origin, auth</text>
  <path d="M410 362V387" class="arrow"/>

  <rect x="250" y="390" width="320" height="72" rx="16" fill="#eef4ff" stroke="#7399dc" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="420" text-anchor="middle" class="label">WebSocket protocol open</text>
  <text x="410" y="445" text-anchor="middle" class="small">send 101 · browser fires open</text>
  <path d="M410 462V487" class="arrow"/>

  <rect x="210" y="490" width="400" height="112" rx="20" fill="#edf8f6" stroke="#5ab5a4" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="525" text-anchor="middle" class="label">Application ready</text>
  <text x="410" y="554" text-anchor="middle" class="body">authenticated · subscriptions allowed</text>
  <path d="M285 573C230 632 590 632 535 573" class="arrow"/>
  <text x="410" y="626" text-anchor="middle" class="small">handle bounded work, then wait again</text>

  <path d="M410 602V659" class="arrow"/>
  <text x="430" y="646" class="body">close requested or peer closes</text>
  <rect x="250" y="662" width="320" height="66" rx="16" fill="#fff8eb" stroke="#e2a63b" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="703" text-anchor="middle" class="label">Closing</text>
  <path d="M410 728V753" class="arrow"/>

  <rect x="250" y="756" width="320" height="50" rx="16" fill="#e8edf2" stroke="#89a0b5" stroke-width="2"/>
  <text x="410" y="788" text-anchor="middle" class="label">Closed</text>

  <path d="M570 226H918" class="error"/>
  <text x="604" y="215" class="error-text">TLS failure or timeout</text>
  <path d="M570 326H918" class="error"/>
  <text x="604" y="315" class="error-text">invalid, denied, or oversized upgrade</text>
  <path d="M570 426H918" class="error"/>
  <text x="604" y="415" class="error-text">first-message authentication fails</text>
  <path d="M610 546H918" class="error"/>
  <text x="644" y="535" class="error-text">protocol or transport error</text>
  <path d="M570 695H918" class="error"/>
  <text x="604" y="684" class="error-text">flush deadline expires</text>
  <path d="M922 226V781" class="error-rail"/>
  <path d="M922 781H570" class="error"/>

  <rect x="958" y="170" width="196" height="462" rx="18" fill="#fff3f3" stroke="#d88a8a"/>
  <text x="1056" y="208" text-anchor="middle" class="label">Reject or abort</text>
  <text x="1056" y="249" text-anchor="middle" class="body">Remove epoll interest</text>
  <text x="1056" y="283" text-anchor="middle" class="body">Unregister identity</text>
  <text x="1056" y="317" text-anchor="middle" class="body">Release buffers</text>
  <text x="1056" y="351" text-anchor="middle" class="body">Close descriptor</text>
  <path d="M982 386H1130" stroke="#d88a8a" stroke-width="1.5"/>
  <text x="1056" y="424" text-anchor="middle" class="small">cleanup is idempotent</text>
  <text x="1056" y="454" text-anchor="middle" class="small">and may be deferred</text>
  <text x="1056" y="504" text-anchor="middle" class="body">Every phase has:</text>
  <text x="1056" y="538" text-anchor="middle" class="small">a byte/work bound</text>
  <text x="1056" y="568" text-anchor="middle" class="small">a deadline</text>
  <text x="1056" y="598" text-anchor="middle" class="small">one cleanup path</text>
</svg>
