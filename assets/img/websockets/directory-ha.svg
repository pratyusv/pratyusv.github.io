<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Highly available WebSocket connection directory</title><desc id="d">Gateways own sockets locally while a replicated directory shard stores versioned routing claims for application event producers.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 26px system-ui;fill:#17324d}.h{font:700 17px system-ui;fill:#17324d}.b{font:14px system-ui;fill:#45627d}.s{font:12px system-ui;fill:#45627d}.w{font:700 15px system-ui;fill:#fff}</style></defs><rect width="1200" height="680" rx="26" fill="#f7fafc"/><text x="600" y="48" text-anchor="middle" class="t">The gateway owns the socket; the directory owns a routing claim</text><rect x="45" y="155" width="235" height="330" rx="20" fill="#fff8e8" stroke="#e4b85b"/><text x="162" y="192" text-anchor="middle" class="h">Gateway eu-17</text><rect x="80" y="230" width="165" height="92" rx="13" fill="#fff" stroke="#d9c083"/><text x="162" y="264" text-anchor="middle" class="h">Event loop 2</text><text x="162" y="289" text-anchor="middle" class="s">owns socket fd 96</text><rect x="80" y="360" width="165" height="78" rx="13" fill="#fff" stroke="#d9c083"/><text x="162" y="391" text-anchor="middle" class="h">Local registry</text><text x="162" y="416" text-anchor="middle" class="s">user 42 → conn 1041</text><rect x="360" y="95" width="510" height="450" rx="22" fill="#f3effb" stroke="#9377c6"/><text x="615" y="132" text-anchor="middle" class="h">Directory shard for user 42</text><rect x="405" y="180" width="180" height="100" rx="14" fill="#17324d"/><text x="495" y="215" text-anchor="middle" class="w">D1 · leader</text><text x="495" y="241" text-anchor="middle" class="s" fill="#fff">term 12 · writes</text><rect x="650" y="170" width="170" height="80" rx="14" fill="#fff" stroke="#9377c6"/><text x="735" y="202" text-anchor="middle" class="h">D2 · follower</text><text x="735" y="225" text-anchor="middle" class="s">failure domain B</text><rect x="650" y="315" width="170" height="80" rx="14" fill="#fff" stroke="#9377c6"/><text x="735" y="347" text-anchor="middle" class="h">D3 · follower</text><text x="735" y="370" text-anchor="middle" class="s">failure domain C</text><path d="M585 215H650M585 255L650 342" stroke="#55728f" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="405" y="430" width="415" height="72" rx="13" fill="#edf8f6" stroke="#5ab5a4"/><text x="612" y="459" text-anchor="middle" class="h">Committed route generation 73</text><text x="612" y="482" text-anchor="middle" class="b">user 42 → eu-17 · tab-8 · lease L9</text><path d="M280 320H360" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="320" y="302" text-anchor="middle" class="s">register</text><rect x="950" y="210" width="205" height="120" rx="15" fill="#edf8f6" stroke="#5ab5a4"/><text x="1052" y="247" text-anchor="middle" class="h">Event router</text><text x="1052" y="276" text-anchor="middle" class="b">reads generation 73</text><text x="1052" y="301" text-anchor="middle" class="s">sends toward eu-17</text><path d="M870 270H950" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="135" y="585" width="930" height="58" rx="14" fill="#17324d"/><text x="600" y="620" text-anchor="middle" class="w">A directory entry can survive gateway loss; it is evidence to validate, not the socket itself.</text></svg>
