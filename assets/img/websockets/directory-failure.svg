<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">WebSocket directory outage behavior</title><desc id="d">A live connection can remain usable locally while a directory quorum outage prevents global routing registration.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 26px system-ui;fill:#17324d}.h{font:700 17px system-ui;fill:#17324d}.b{font:14px system-ui;fill:#45627d}.s{font:12px system-ui;fill:#45627d}.w{font:700 15px system-ui;fill:#fff}</style></defs><rect width="1200" height="620" rx="26" fill="#f7fafc"/><text x="600" y="48" text-anchor="middle" class="t">A connected socket is not necessarily globally discoverable</text><rect x="60" y="135" width="300" height="290" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="210" y="175" text-anchor="middle" class="h">Gateway eu-17</text><rect x="105" y="215" width="210" height="90" rx="14" fill="#fff" stroke="#8fcabb"/><text x="210" y="249" text-anchor="middle" class="h">Socket is alive</text><text x="210" y="277" text-anchor="middle" class="b">local frames still flow</text><text x="210" y="350" text-anchor="middle" class="b">registration cannot commit</text><text x="210" y="377" text-anchor="middle" class="s">mark session LOCAL_ONLY</text><rect x="450" y="135" width="300" height="290" rx="20" fill="#fff0f0" stroke="#d86969"/><text x="600" y="175" text-anchor="middle" class="h">Directory shard</text><rect x="495" y="215" width="210" height="90" rx="14" fill="#fff" stroke="#d86969"/><text x="600" y="249" text-anchor="middle" class="h">Quorum unavailable</text><text x="600" y="277" text-anchor="middle" class="b">no new route authority</text><text x="600" y="350" text-anchor="middle" class="b">cached routes may be stale</text><text x="600" y="377" text-anchor="middle" class="s">do not invent success</text><path d="M360 280H450" stroke="#d86969" stroke-width="4" stroke-dasharray="9 7" fill="none"/><rect x="840" y="135" width="300" height="290" rx="20" fill="#fff8e8" stroke="#e4b85b"/><text x="990" y="175" text-anchor="middle" class="h">External event router</text><rect x="885" y="215" width="210" height="90" rx="14" fill="#fff" stroke="#d9c083"/><text x="990" y="249" text-anchor="middle" class="h">Route is unknown</text><text x="990" y="277" text-anchor="middle" class="b">queue, retry, or reject</text><text x="990" y="350" text-anchor="middle" class="b">never claim delivery</text><text x="990" y="377" text-anchor="middle" class="s">until directory recovers</text><path d="M750 280H840" stroke="#d86969" stroke-width="4" stroke-dasharray="9 7" fill="none"/><rect x="160" y="500" width="880" height="62" rx="14" fill="#17324d"/><text x="600" y="527" text-anchor="middle" class="w">Directory recovery establishes one history, then gateways retry registration by session generation.</text><text x="600" y="550" text-anchor="middle" class="s" fill="#fff">Connection availability and routability are separate contracts.</text></svg>
