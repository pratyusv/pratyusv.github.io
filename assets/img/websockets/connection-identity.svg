<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">How several applications share one server port</title>
  <desc id="desc">Three client sockets use ephemeral ports. A NAT translates them to public ports. One server listener on port 443 accepts three separate connected sockets with different file descriptors.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55728f"/>
    </marker>
    <style>
      .title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324d; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324d; }
      .body { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #45627d; }
      .small { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #45627d; }
      .flow { stroke: #55728f; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #89a0b5; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="660" rx="24" fill="#f7fafc"/>
  <text x="600" y="46" text-anchor="middle" class="title">One destination port, many distinct TCP connections</text>

  <rect x="35" y="85" width="360" height="500" rx="22" fill="#eef4ff" stroke="#7399dc" stroke-width="2" filter="url(#shadow)"/>
  <text x="215" y="125" text-anchor="middle" class="label">Laptop · private IP 10.0.0.7</text>

  <rect x="65" y="155" width="135" height="78" rx="12" fill="#ffffff" stroke="#7399dc"/>
  <text x="132" y="184" text-anchor="middle" class="label">Browser</text>
  <text x="132" y="211" text-anchor="middle" class="small">socket fd 14</text>
  <rect x="65" y="252" width="135" height="78" rx="12" fill="#ffffff" stroke="#7399dc"/>
  <text x="132" y="281" text-anchor="middle" class="label">Market app</text>
  <text x="132" y="308" text-anchor="middle" class="small">socket fd 8</text>
  <rect x="65" y="349" width="135" height="78" rx="12" fill="#ffffff" stroke="#7399dc"/>
  <text x="132" y="378" text-anchor="middle" class="label">Market app</text>
  <text x="132" y="405" text-anchor="middle" class="small">socket fd 9</text>

  <rect x="225" y="155" width="140" height="272" rx="14" fill="#ffffff" stroke="#7399dc"/>
  <text x="295" y="186" text-anchor="middle" class="label">Client kernel</text>
  <text x="295" y="229" text-anchor="middle" class="small">:53001 → :443</text>
  <text x="295" y="326" text-anchor="middle" class="small">:53002 → :443</text>
  <text x="295" y="405" text-anchor="middle" class="small">:53003 → :443</text>
  <path d="M200 194 H225" class="flow"/>
  <path d="M200 291 H225" class="flow"/>
  <path d="M200 388 H225" class="flow"/>
  <text x="215" y="475" text-anchor="middle" class="body">The OS chooses ephemeral source ports</text>
  <text x="215" y="505" text-anchor="middle" class="body">and maps each socket to its process</text>
  <text x="215" y="548" text-anchor="middle" class="small">No application listens on these ports</text>

  <path d="M395 285 H475" class="flow"/>

  <rect x="478" y="150" width="245" height="305" rx="22" fill="#edf8f6" stroke="#5ab5a4" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="190" text-anchor="middle" class="label">NAT / router</text>
  <text x="600" y="224" text-anchor="middle" class="body">public IP 198.51.100.8</text>
  <rect x="505" y="255" width="190" height="145" rx="13" fill="#ffffff" stroke="#74b9ac"/>
  <text x="600" y="286" text-anchor="middle" class="small">53001 ↔ 62001</text>
  <text x="600" y="326" text-anchor="middle" class="small">53002 ↔ 62002</text>
  <text x="600" y="366" text-anchor="middle" class="small">53003 ↔ 62003</text>
  <text x="600" y="429" text-anchor="middle" class="body">Translation table returns replies</text>
  <text x="600" y="475" text-anchor="middle" class="small">public endpoint differs from client view</text>

  <path d="M723 285 H795" class="flow"/>

  <rect x="798" y="85" width="367" height="500" rx="22" fill="#fff8eb" stroke="#e2a63b" stroke-width="2" filter="url(#shadow)"/>
  <text x="981" y="125" text-anchor="middle" class="label">TCP-terminating server · 203.0.113.40</text>
  <rect x="838" y="155" width="287" height="83" rx="13" fill="#ffffff" stroke="#e2a63b"/>
  <text x="981" y="186" text-anchor="middle" class="label">Listening socket · :443</text>
  <text x="981" y="214" text-anchor="middle" class="body">accepts new connection attempts</text>
  <path d="M981 238 V275" class="flow"/>
  <rect x="838" y="280" width="287" height="160" rx="13" fill="#ffffff" stroke="#e2a63b"/>
  <text x="981" y="313" text-anchor="middle" class="label">Accepted sockets</text>
  <text x="981" y="348" text-anchor="middle" class="small">fd 96 · peer :62001</text>
  <text x="981" y="383" text-anchor="middle" class="small">fd 97 · peer :62002</text>
  <text x="981" y="418" text-anchor="middle" class="small">fd 98 · peer :62003</text>
  <text x="981" y="480" text-anchor="middle" class="body">Same local port; different endpoint pairs</text>
  <text x="981" y="514" text-anchor="middle" class="body">and separate process-local handles</text>

  <path d="M68 615 H1132" class="dash"/>
  <text x="600" y="642" text-anchor="middle" class="small">TCP demultiplexes by endpoint pair · the application authenticates the user separately</text>
</svg>
