<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Linux epoll reactor</title>
  <desc id="desc">Sockets registered in an epoll interest set become ready. Epoll wait wakes one event loop which dispatches short non-blocking callbacks to connection objects.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity="0.13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker>
    <style>
      .title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324d; }
      .label { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324d; }
      .body { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #45627d; }
      .code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #45627d; }
      .arrow { stroke: #55728f; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="650" rx="24" fill="#f7fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">One event loop reacts to readiness across many sockets</text>

  <text x="136" y="92" text-anchor="middle" class="label">File descriptors</text>
  <g filter="url(#shadow)">
    <rect x="52" y="120" width="168" height="68" rx="13" fill="#ffffff" stroke="#7399dc"/>
    <rect x="52" y="208" width="168" height="68" rx="13" fill="#ffffff" stroke="#7399dc"/>
    <rect x="52" y="296" width="168" height="68" rx="13" fill="#fff4dd" stroke="#e2a63b" stroke-width="2"/>
    <rect x="52" y="384" width="168" height="68" rx="13" fill="#ffffff" stroke="#7399dc"/>
    <rect x="52" y="472" width="168" height="68" rx="13" fill="#ffffff" stroke="#7399dc"/>
  </g>
  <text x="136" y="151" text-anchor="middle" class="label">listen fd</text><text x="136" y="174" text-anchor="middle" class="code">new connection</text>
  <text x="136" y="239" text-anchor="middle" class="label">client fd 41</text><text x="136" y="262" text-anchor="middle" class="code">idle</text>
  <text x="136" y="327" text-anchor="middle" class="label">client fd 96</text><text x="136" y="350" text-anchor="middle" class="code">readable</text>
  <text x="136" y="415" text-anchor="middle" class="label">client fd 118</text><text x="136" y="438" text-anchor="middle" class="code">idle</text>
  <text x="136" y="503" text-anchor="middle" class="label">eventfd</text><text x="136" y="526" text-anchor="middle" class="code">command queued</text>

  <path d="M220 154H348" class="arrow"/><path d="M220 242H348" class="arrow"/><path d="M220 330H348" class="arrow"/><path d="M220 418H348" class="arrow"/><path d="M220 506H348" class="arrow"/>

  <rect x="352" y="110" width="262" height="430" rx="20" fill="#edf8f6" stroke="#5ab5a4" stroke-width="2" filter="url(#shadow)"/>
  <text x="483" y="148" text-anchor="middle" class="label">Kernel epoll instance</text>
  <rect x="385" y="180" width="196" height="115" rx="14" fill="#ffffff" stroke="#74b9ac"/>
  <text x="483" y="214" text-anchor="middle" class="label">Interest set</text>
  <text x="483" y="245" text-anchor="middle" class="code">listen · 41 · 96</text>
  <text x="483" y="270" text-anchor="middle" class="code">118 · eventfd</text>
  <rect x="385" y="335" width="196" height="115" rx="14" fill="#ffffff" stroke="#e2a63b" stroke-width="2"/>
  <text x="483" y="369" text-anchor="middle" class="label">Ready set</text>
  <text x="483" y="400" text-anchor="middle" class="code">listen · 96</text>
  <text x="483" y="425" text-anchor="middle" class="code">eventfd</text>
  <text x="483" y="500" text-anchor="middle" class="body">Maintained by the kernel</text>

  <path d="M614 326H734" class="arrow"/>
  <text x="674" y="304" text-anchor="middle" class="code">epoll_wait()</text>

  <rect x="738" y="110" width="410" height="430" rx="20" fill="#eef4ff" stroke="#7399dc" stroke-width="2" filter="url(#shadow)"/>
  <text x="943" y="148" text-anchor="middle" class="label">Event-loop thread</text>
  <rect x="776" y="180" width="334" height="72" rx="13" fill="#ffffff" stroke="#7399dc"/>
  <text x="943" y="210" text-anchor="middle" class="label">acceptReadyConnections()</text>
  <text x="943" y="234" text-anchor="middle" class="body">accept until EAGAIN</text>
  <rect x="776" y="278" width="334" height="72" rx="13" fill="#fff4dd" stroke="#e2a63b" stroke-width="2"/>
  <text x="943" y="308" text-anchor="middle" class="label">connection[1041].onReadable()</text>
  <text x="943" y="332" text-anchor="middle" class="body">recv until EAGAIN or work budget</text>
  <rect x="776" y="376" width="334" height="72" rx="13" fill="#ffffff" stroke="#7399dc"/>
  <text x="943" y="406" text-anchor="middle" class="label">drainCommandQueue()</text>
  <text x="943" y="430" text-anchor="middle" class="body">deliver work posted by other threads</text>
  <text x="943" y="494" text-anchor="middle" class="body">Handlers return quickly; then wait again</text>

  <rect x="269" y="584" width="662" height="40" rx="20" fill="#17324d"/>
  <text x="600" y="610" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#fff">epoll reports readiness; application code performs the actual I/O</text>
</svg>
