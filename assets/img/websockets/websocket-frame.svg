<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">The fields of a WebSocket frame</title>
  <desc id="desc">A two-byte base header contains FIN, reserved bits, opcode, mask, and a seven-bit length marker. Optional extended length, a required client masking key, and payload data follow.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity="0.13"/>
    </filter>
    <style>
      .title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324d; }
      .label { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324d; }
      .body { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #45627d; }
      .mono { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #45627d; }
      .bit { font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #17324d; }
      .light { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .line { stroke: #8aa2b8; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="560" rx="24" fill="#f7fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">A WebSocket frame gives structure to part of TCP's byte stream</text>

  <g filter="url(#shadow)">
    <rect x="55" y="105" width="68" height="95" rx="10" fill="#eef4ff" stroke="#7399dc" stroke-width="2"/>
    <rect x="123" y="105" width="66" height="95" rx="10" fill="#eef4ff" stroke="#7399dc" stroke-width="2"/>
    <rect x="189" y="105" width="160" height="95" rx="10" fill="#dfeaff" stroke="#7399dc" stroke-width="2"/>
    <rect x="349" y="105" width="78" height="95" rx="10" fill="#edf8f6" stroke="#5ab5a4" stroke-width="2"/>
    <rect x="427" y="105" width="190" height="95" rx="10" fill="#ddf2ee" stroke="#5ab5a4" stroke-width="2"/>
    <rect x="617" y="105" width="190" height="95" rx="10" fill="#fff8eb" stroke="#e2a63b" stroke-width="2"/>
    <rect x="807" y="105" width="170" height="95" rx="10" fill="#fdf0dc" stroke="#e2a63b" stroke-width="2"/>
    <rect x="977" y="105" width="168" height="95" rx="10" fill="#ffffff" stroke="#8aa2b8" stroke-width="2"/>
  </g>

  <text x="89" y="136" text-anchor="middle" class="bit">FIN</text>
  <text x="89" y="163" text-anchor="middle" class="mono">1 bit</text>
  <text x="89" y="184" text-anchor="middle" class="body">final?</text>

  <text x="156" y="136" text-anchor="middle" class="bit">RSV</text>
  <text x="156" y="163" text-anchor="middle" class="mono">3 bits</text>
  <text x="156" y="184" text-anchor="middle" class="body">extensions</text>

  <text x="269" y="136" text-anchor="middle" class="bit">OPCODE</text>
  <text x="269" y="163" text-anchor="middle" class="mono">4 bits</text>
  <text x="269" y="184" text-anchor="middle" class="body">text, binary, control</text>

  <text x="388" y="136" text-anchor="middle" class="bit">MASK</text>
  <text x="388" y="163" text-anchor="middle" class="mono">1 bit</text>
  <text x="388" y="184" text-anchor="middle" class="body">key follows?</text>

  <text x="522" y="136" text-anchor="middle" class="bit">LENGTH MARKER</text>
  <text x="522" y="163" text-anchor="middle" class="mono">7 bits</text>
  <text x="522" y="184" text-anchor="middle" class="body">0–125, 126, or 127</text>

  <text x="712" y="136" text-anchor="middle" class="bit">EXTENDED LENGTH</text>
  <text x="712" y="163" text-anchor="middle" class="mono">0, 2, or 8 bytes</text>
  <text x="712" y="184" text-anchor="middle" class="body">only for larger payloads</text>

  <text x="892" y="136" text-anchor="middle" class="bit">MASKING KEY</text>
  <text x="892" y="163" text-anchor="middle" class="mono">4 bytes</text>
  <text x="892" y="184" text-anchor="middle" class="body">client frames only</text>

  <text x="1061" y="136" text-anchor="middle" class="bit">PAYLOAD</text>
  <text x="1061" y="163" text-anchor="middle" class="mono">length bytes</text>
  <text x="1061" y="184" text-anchor="middle" class="body">data or control body</text>

  <path d="M55 228H617" class="line"/>
  <path d="M55 220V236M617 220V236" class="line"/>
  <text x="336" y="258" text-anchor="middle" class="label">Two-byte base header</text>
  <text x="336" y="282" text-anchor="middle" class="body">Always present; larger lengths and masking add more header bytes.</text>

  <rect x="55" y="332" width="505" height="146" rx="18" fill="#17324d"/>
  <text x="84" y="366" class="light" font-weight="700">Example: one masked text message containing “Hi”</text>
  <text x="84" y="403" class="light" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FIN=1 · opcode=0x1 · MASK=1 · length=2</text>
  <text x="84" y="432" class="light" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4-byte key · 2 masked payload bytes</text>
  <text x="84" y="459" class="light">The receiver unmasks two bytes and emits one complete text message.</text>

  <rect x="590" y="332" width="555" height="146" rx="18" fill="#ffffff" stroke="#b9c9d8" stroke-width="2"/>
  <text x="618" y="366" class="label">Boundaries the program must not confuse</text>
  <text x="618" y="401" class="mono">recv() result ≠ one frame</text>
  <text x="618" y="429" class="mono">one frame      ≠ always one message</text>
  <text x="618" y="457" class="mono">one message    ≠ one application event type</text>

  <text x="600" y="526" text-anchor="middle" class="body">Client-to-server frames are masked. Server-to-client frames are not. TLS, not masking, provides secrecy.</text>
</svg>
