<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Vertical Line Normalization: dx == 0 &amp;&amp; dy &lt; 0</text>

  <!-- LEFT CARD: BEFORE -->
  <g transform="translate(40, 50)">
    <!-- Card Container -->
    <rect width="310" height="270" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Card Header -->
    <path d="M 0 10 Q 0 0 10 0 L 300 0 Q 310 0 310 10 L 310 38 L 0 38 Z" fill="#FEF2F2" />
    <line x1="0" y1="38" x2="310" y2="38" stroke="#FCA5A5" stroke-width="1" />
    <text x="155" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">1. BEFORE NORMALIZATION</text>

    <!-- Axes Grid -->
    <line x1="155" y1="55" x2="155" y2="205" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="75" y1="130" x2="235" y2="130" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Anchor Point (2,2) -->
    <circle cx="155" cy="90" r="5" fill="#2563EB" />
    <text x="167" y="94" font-size="12" font-weight="600" fill="#1E40AF">Anchor (2,2)</text>

    <!-- Target Point (2,0) -->
    <circle cx="155" cy="170" r="5" fill="#EF4444" />
    <text x="167" y="174" font-size="12" font-weight="600" fill="#991B1B">Point (2,0)</text>

    <!-- Downward Vector Arrow -->
    <line x1="155" y1="98" x2="155" y2="160" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arrow-red)" />

    <!-- Map Key Badge -->
    <rect x="80" y="220" width="150" height="32" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" />
    <text x="155" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">Raw Key: (0, -1)</text>
  </g>

  <!-- MIDDLE: LOGIC FLIP -->
  <g transform="translate(365, 140)">
    <!-- Logic Box -->
    <rect x="-5" y="-25" width="80" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="35" y="-7" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#334155">dx == 0</text>
    <text x="35" y="8" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#2563EB">dy = -dy</text>
    
    <!-- Connection Arrow -->
    <line x1="-5" y1="35" x2="70" y2="35" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)" />
  </g>

  <!-- RIGHT CARD: AFTER -->
  <g transform="translate(450, 50)">
    <!-- Card Container -->
    <rect width="310" height="270" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Card Header -->
    <path d="M 0 10 Q 0 0 10 0 L 300 0 Q 310 0 310 10 L 310 38 L 0 38 Z" fill="#F0FDF4" />
    <line x1="0" y1="38" x2="310" y2="38" stroke="#86EFAC" stroke-width="1" />
    <text x="155" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">2. AFTER NORMALIZATION</text>

    <!-- Axes Grid -->
    <line x1="155" y1="55" x2="155" y2="205" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="75" y1="130" x2="235" y2="130" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Anchor Point (2,2) -->
    <circle cx="155" cy="130" r="5" fill="#2563EB" />
    <text x="167" y="134" font-size="12" font-weight="600" fill="#1E40AF">Anchor (2,2)</text>

    <!-- Target Point (2,0) -->
    <circle cx="155" cy="190" r="5" fill="#10B981" />
    <text x="167" y="194" font-size="12" font-weight="600" fill="#15803D">Point (2,0)</text>

    <!-- Upward Flipped Vector Arrow -->
    <line x1="155" y1="122" x2="155" y2="70" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)" />

    <!-- Map Key Badge -->
    <rect x="70" y="220" width="170" height="32" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" />
    <text x="155" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#15803D">Normalized Key: (0, 1)</text>
  </g>
</svg>
