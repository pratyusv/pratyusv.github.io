<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Highly available load-balancer topologies</title>
  <desc id="desc">Active passive uses virtual IP failover, active active uses ECMP across instances, and anycast advertises one address from multiple regions.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker>
    <style>.title{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.label{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#45627d}.arrow{stroke:#55728f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="690" rx="24" fill="#f7fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">Reachability failover and connection preservation are different guarantees</text>
  <g filter="url(#shadow)">
    <rect x="35" y="95" width="350" height="475" rx="20" fill="#fff" stroke="#b9c9d8"/>
    <rect x="425" y="95" width="350" height="475" rx="20" fill="#fff" stroke="#b9c9d8"/>
    <rect x="815" y="95" width="350" height="475" rx="20" fill="#fff" stroke="#b9c9d8"/>
  </g>
  <text x="210" y="135" text-anchor="middle" class="label">Active / passive</text><text x="600" y="135" text-anchor="middle" class="label">Active / active</text><text x="990" y="135" text-anchor="middle" class="label">Anycast regions</text>
  <rect x="135" y="165" width="150" height="52" rx="11" fill="#eef4ff" stroke="#7399dc"/><text x="210" y="198" text-anchor="middle" class="code">VIP 198.51.100.10</text>
  <rect x="70" y="285" width="120" height="70" rx="12" fill="#edf8f6" stroke="#5ab5a4"/><text x="130" y="316" text-anchor="middle" class="label">LB-A</text><text x="130" y="340" text-anchor="middle" class="body">owns VIP</text>
  <rect x="230" y="285" width="120" height="70" rx="12" fill="#fff4dd" stroke="#e2a63b"/><text x="290" y="316" text-anchor="middle" class="label">LB-B</text><text x="290" y="340" text-anchor="middle" class="body">standby</text>
  <path d="M210 217V250H130V277" class="arrow"/><path d="M190 320H222" stroke="#55728f" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="210" y="415" text-anchor="middle" class="body">VIP ownership moves</text><text x="210" y="445" text-anchor="middle" class="code">new flows recover</text><text x="210" y="475" text-anchor="middle" class="code">old sockets usually do not</text>
  <rect x="525" y="165" width="150" height="52" rx="11" fill="#eef4ff" stroke="#7399dc"/><text x="600" y="198" text-anchor="middle" class="label">ECMP router</text>
  <rect x="450" y="285" width="100" height="65" rx="11" fill="#edf8f6" stroke="#5ab5a4"/><text x="500" y="324" text-anchor="middle" class="label">LB-1</text><rect x="550" y="285" width="100" height="65" rx="11" fill="#edf8f6" stroke="#5ab5a4"/><text x="600" y="324" text-anchor="middle" class="label">LB-2</text><rect x="650" y="285" width="100" height="65" rx="11" fill="#edf8f6" stroke="#5ab5a4"/><text x="700" y="324" text-anchor="middle" class="label">LB-3</text>
  <path d="M600 217V250H500V277M600 250V277M600 250H700V277" class="arrow"/>
  <text x="600" y="415" text-anchor="middle" class="body">flows hash across instances</text><text x="600" y="445" text-anchor="middle" class="code">all instances carry traffic</text><text x="600" y="475" text-anchor="middle" class="code">path change can move a flow</text>
  <rect x="915" y="165" width="150" height="52" rx="11" fill="#eef4ff" stroke="#7399dc"/><text x="990" y="198" text-anchor="middle" class="code">one anycast address</text>
  <rect x="850" y="285" width="120" height="70" rx="12" fill="#edf8f6" stroke="#5ab5a4"/><text x="910" y="316" text-anchor="middle" class="label">Region A</text><text x="910" y="340" text-anchor="middle" class="body">advertises VIP</text>
  <rect x="1010" y="285" width="120" height="70" rx="12" fill="#edf8f6" stroke="#5ab5a4"/><text x="1070" y="316" text-anchor="middle" class="label">Region B</text><text x="1070" y="340" text-anchor="middle" class="body">advertises VIP</text>
  <path d="M990 217V250H910V277M990 250H1070V277" class="arrow"/>
  <text x="990" y="415" text-anchor="middle" class="body">routing chooses a site</text><text x="990" y="445" text-anchor="middle" class="code">regional reachability</text><text x="990" y="475" text-anchor="middle" class="code">route changes are not sessions</text>
  <rect x="238" y="610" width="724" height="42" rx="21" fill="#17324d"/>
  <text x="600" y="636" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="600" fill="#fff">Always state whether HA protects the VIP, new flows, or existing connections</text>
</svg>
