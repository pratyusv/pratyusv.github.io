<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">State inside a full TCP proxy</title>
  <desc id="desc">The client and backend each have TCP state in their kernels. The load balancer has two sockets joined by one userspace proxy connection object.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker>
    <style>.title{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.label{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#45627d}.arrow{stroke:#55728f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#f7fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">A full proxy joins two independent TCP connections</text>
  <g filter="url(#shadow)">
    <rect x="40" y="110" width="220" height="370" rx="20" fill="#fff" stroke="#b9c9d8"/>
    <rect x="320" y="80" width="560" height="430" rx="22" fill="#eef4ff" stroke="#7399dc" stroke-width="2"/>
    <rect x="940" y="110" width="220" height="370" rx="20" fill="#fff" stroke="#b9c9d8"/>
  </g>
  <text x="150" y="150" text-anchor="middle" class="label">Client host</text>
  <rect x="75" y="185" width="150" height="115" rx="14" fill="#edf8f6" stroke="#5ab5a4"/>
  <text x="150" y="220" text-anchor="middle" class="label">TCP socket</text><text x="150" y="251" text-anchor="middle" class="code">seq · ack · buffers</text><text x="150" y="278" text-anchor="middle" class="code">ESTABLISHED</text>
  <text x="150" y="350" text-anchor="middle" class="body">Client believes the</text><text x="150" y="373" text-anchor="middle" class="body">VIP is its peer</text>
  <text x="600" y="120" text-anchor="middle" class="label">Load-balancer process and kernel</text>
  <rect x="360" y="155" width="200" height="130" rx="14" fill="#fff" stroke="#7399dc"/>
  <text x="460" y="190" text-anchor="middle" class="label">Client-side socket</text><text x="460" y="222" text-anchor="middle" class="code">fd 41 · input A</text><text x="460" y="251" text-anchor="middle" class="code">output A</text>
  <rect x="640" y="155" width="200" height="130" rx="14" fill="#fff" stroke="#7399dc"/>
  <text x="740" y="190" text-anchor="middle" class="label">Backend socket</text><text x="740" y="222" text-anchor="middle" class="code">fd 96 · input B</text><text x="740" y="251" text-anchor="middle" class="code">output B</text>
  <rect x="420" y="335" width="360" height="120" rx="16" fill="#fff4dd" stroke="#e2a63b" stroke-width="2"/>
  <text x="600" y="370" text-anchor="middle" class="label">ProxiedConnection 1041</text>
  <text x="600" y="402" text-anchor="middle" class="code">backend=B2 · phase=FORWARDING</text>
  <text x="600" y="430" text-anchor="middle" class="code">buffers · deadlines · counters</text>
  <path d="M460 285V326H535" class="arrow"/><path d="M740 285V326H665" class="arrow"/>
  <text x="1050" y="150" text-anchor="middle" class="label">Backend host</text>
  <rect x="975" y="185" width="150" height="115" rx="14" fill="#edf8f6" stroke="#5ab5a4"/>
  <text x="1050" y="220" text-anchor="middle" class="label">TCP socket</text><text x="1050" y="251" text-anchor="middle" class="code">seq · ack · buffers</text><text x="1050" y="278" text-anchor="middle" class="code">ESTABLISHED</text>
  <text x="1050" y="350" text-anchor="middle" class="body">Backend sees the</text><text x="1050" y="373" text-anchor="middle" class="body">proxy as its peer</text>
  <path d="M260 220H352" class="arrow"/><path d="M848 220H932" class="arrow"/>
  <text x="306" y="199" text-anchor="middle" class="code">TCP A</text><text x="890" y="199" text-anchor="middle" class="code">TCP B</text>
  <rect x="267" y="550" width="666" height="42" rx="21" fill="#17324d"/>
  <text x="600" y="576" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="600" fill="#fff">A crash loses local sockets; selecting a new backend cannot recreate them</text>
</svg>
