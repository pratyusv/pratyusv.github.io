<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">NAT packet translation</title>
  <desc id="desc">A client packet to a virtual IP is translated to a private backend address, and the backend response is translated back to the virtual service identity.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker>
    <style>.title{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.label{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#45627d}.arrow{stroke:#55728f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="650" rx="24" fill="#f7fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">NAT preserves one logical flow through reversible translation</text>
  <g filter="url(#shadow)">
    <rect x="60" y="95" width="275" height="175" rx="18" fill="#eef4ff" stroke="#7399dc"/>
    <rect x="462" y="80" width="275" height="460" rx="20" fill="#fff4dd" stroke="#e2a63b" stroke-width="2"/>
    <rect x="865" y="95" width="275" height="175" rx="18" fill="#edf8f6" stroke="#5ab5a4"/>
  </g>
  <text x="197" y="135" text-anchor="middle" class="label">Client packet</text><text x="197" y="180" text-anchor="middle" class="code">src 203.0.113.8:51024</text><text x="197" y="213" text-anchor="middle" class="code">dst 198.51.100.10:443</text><text x="197" y="247" text-anchor="middle" class="body">destination is the VIP</text>
  <text x="1002" y="135" text-anchor="middle" class="label">Translated packet</text><text x="1002" y="180" text-anchor="middle" class="code">src 10.0.0.5:43001</text><text x="1002" y="213" text-anchor="middle" class="code">dst 10.0.1.17:8443</text><text x="1002" y="247" text-anchor="middle" class="body">destination is backend B2</text>
  <text x="600" y="125" text-anchor="middle" class="label">Load balancer</text>
  <rect x="500" y="165" width="200" height="92" rx="14" fill="#fff" stroke="#e2a63b"/><text x="600" y="198" text-anchor="middle" class="label">Connection map</text><text x="600" y="229" text-anchor="middle" class="code">client flow -> B2</text>
  <rect x="500" y="300" width="200" height="92" rx="14" fill="#fff" stroke="#e2a63b"/><text x="600" y="333" text-anchor="middle" class="label">Forward rewrite</text><text x="600" y="364" text-anchor="middle" class="code">SNAT + DNAT</text>
  <rect x="500" y="435" width="200" height="72" rx="14" fill="#fff" stroke="#e2a63b"/><text x="600" y="468" text-anchor="middle" class="label">Reverse rewrite</text><text x="600" y="491" text-anchor="middle" class="code">inverse mapping</text>
  <path d="M335 182H454" class="arrow"/><path d="M745 182H857" class="arrow"/>
  <rect x="865" y="355" width="275" height="150" rx="18" fill="#edf8f6" stroke="#5ab5a4" filter="url(#shadow)"/>
  <text x="1002" y="394" text-anchor="middle" class="label">Backend response</text><text x="1002" y="435" text-anchor="middle" class="code">src 10.0.1.17:8443</text><text x="1002" y="468" text-anchor="middle" class="code">dst 10.0.0.5:43001</text>
  <rect x="60" y="355" width="275" height="150" rx="18" fill="#eef4ff" stroke="#7399dc" filter="url(#shadow)"/>
  <text x="197" y="394" text-anchor="middle" class="label">Restored service identity</text><text x="197" y="435" text-anchor="middle" class="code">src 198.51.100.10:443</text><text x="197" y="468" text-anchor="middle" class="code">dst 203.0.113.8:51024</text>
  <path d="M865 430H745" class="arrow"/><path d="M462 430H343" class="arrow"/>
  <rect x="238" y="572" width="724" height="42" rx="21" fill="#17324d"/>
  <text x="600" y="598" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="600" fill="#fff">If the mapping disappears, later packets cannot be translated consistently</text>
</svg>
