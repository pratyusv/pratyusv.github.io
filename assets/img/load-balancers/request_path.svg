<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Load balancing across the request path</title>
  <desc id="desc">A client reaches global traffic steering, a regional Layer 4 load balancer, a Layer 7 reverse proxy, and an application backend pool.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker>
    <style>.title{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.label{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#45627d}.arrow{stroke:#55728f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#f7fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">One request can cross several independent selection layers</text>
  <g filter="url(#shadow)">
    <rect x="38" y="150" width="170" height="210" rx="18" fill="#fff" stroke="#b9c9d8"/>
    <rect x="260" y="115" width="190" height="280" rx="18" fill="#fff4dd" stroke="#e2a63b"/>
    <rect x="502" y="115" width="190" height="280" rx="18" fill="#edf8f6" stroke="#5ab5a4"/>
    <rect x="744" y="115" width="190" height="280" rx="18" fill="#eef4ff" stroke="#7399dc"/>
    <rect x="986" y="92" width="176" height="326" rx="18" fill="#fff" stroke="#b9c9d8"/>
  </g>
  <text x="123" y="205" text-anchor="middle" class="label">Client</text>
  <text x="123" y="245" text-anchor="middle" class="code">api.example.com</text>
  <text x="123" y="283" text-anchor="middle" class="body">opens a connection</text>
  <text x="355" y="165" text-anchor="middle" class="label">Global steering</text>
  <text x="355" y="205" text-anchor="middle" class="body">DNS or anycast</text>
  <text x="355" y="248" text-anchor="middle" class="code">select region</text>
  <text x="355" y="290" text-anchor="middle" class="body">coarse failover</text>
  <text x="355" y="325" text-anchor="middle" class="body">geographic policy</text>
  <text x="597" y="165" text-anchor="middle" class="label">L4 balancer</text>
  <text x="597" y="205" text-anchor="middle" class="body">TCP / UDP flow</text>
  <text x="597" y="248" text-anchor="middle" class="code">select connection</text>
  <text x="597" y="290" text-anchor="middle" class="body">five-tuple</text>
  <text x="597" y="325" text-anchor="middle" class="body">packet forwarding</text>
  <text x="839" y="165" text-anchor="middle" class="label">L7 proxy</text>
  <text x="839" y="205" text-anchor="middle" class="body">HTTP / gRPC</text>
  <text x="839" y="248" text-anchor="middle" class="code">select request</text>
  <text x="839" y="290" text-anchor="middle" class="body">route and policy</text>
  <text x="839" y="325" text-anchor="middle" class="body">TLS termination</text>
  <text x="1074" y="135" text-anchor="middle" class="label">Backend pool</text>
  <rect x="1018" y="170" width="112" height="52" rx="10" fill="#edf8f6" stroke="#5ab5a4"/><text x="1074" y="202" text-anchor="middle" class="code">B1 healthy</text>
  <rect x="1018" y="242" width="112" height="52" rx="10" fill="#edf8f6" stroke="#5ab5a4"/><text x="1074" y="274" text-anchor="middle" class="code">B2 healthy</text>
  <rect x="1018" y="314" width="112" height="52" rx="10" fill="#fcebea" stroke="#d96b63"/><text x="1074" y="346" text-anchor="middle" class="code">B3 ejected</text>
  <path d="M208 255H252" class="arrow"/><path d="M450 255H494" class="arrow"/><path d="M692 255H736" class="arrow"/><path d="M934 255H978" class="arrow"/>
  <rect x="270" y="470" width="660" height="42" rx="21" fill="#17324d"/>
  <text x="600" y="496" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="600" fill="#fff">Each layer chooses a different unit and owns different failure state</text>
</svg>
