<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">The load-balancer selection and memory lifecycle</title>
  <desc id="desc">The control plane supplies known backends, eligibility filtering removes an unavailable server, the scheduler selects backend B2, and connection or request state preserves that choice. A second client connection can reach another load-balancer instance and another backend.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#55728f"/>
    </marker>
    <style>
      .title{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}
      .label{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}
      .body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}
      .small{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}
      .code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#45627d}
      .arrow{stroke:#55728f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="650" rx="24" fill="#f7fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">Selection happens once; stored state handles related traffic</text>

  <g filter="url(#shadow)">
    <rect x="35" y="105" width="190" height="205" rx="18" fill="#fff4dd" stroke="#e2a63b"/>
    <rect x="270" y="105" width="190" height="205" rx="18" fill="#edf8f6" stroke="#5ab5a4"/>
    <rect x="505" y="105" width="190" height="205" rx="18" fill="#eef4ff" stroke="#7399dc"/>
    <rect x="740" y="105" width="190" height="205" rx="18" fill="#fff" stroke="#b9c9d8"/>
    <rect x="975" y="105" width="190" height="205" rx="18" fill="#edf8f6" stroke="#5ab5a4"/>
  </g>

  <text x="130" y="145" text-anchor="middle" class="label">1. Learn</text>
  <text x="130" y="178" text-anchor="middle" class="body">control-plane snapshot</text>
  <text x="130" y="221" text-anchor="middle" class="code">B1 healthy</text>
  <text x="130" y="249" text-anchor="middle" class="code">B2 healthy</text>
  <text x="130" y="277" text-anchor="middle" class="code">B3 unhealthy</text>

  <text x="365" y="145" text-anchor="middle" class="label">2. Filter</text>
  <text x="365" y="178" text-anchor="middle" class="body">who may take new work?</text>
  <rect x="310" y="207" width="110" height="38" rx="9" fill="#fff" stroke="#5ab5a4"/>
  <text x="365" y="231" text-anchor="middle" class="code">B1, B2</text>
  <text x="365" y="273" text-anchor="middle" class="small">eligible pool</text>

  <text x="600" y="145" text-anchor="middle" class="label">3. Select</text>
  <text x="600" y="178" text-anchor="middle" class="body">new flow or request</text>
  <text x="600" y="215" text-anchor="middle" class="code">schedule(B1, B2)</text>
  <rect x="545" y="238" width="110" height="42" rx="9" fill="#fff" stroke="#7399dc"/>
  <text x="600" y="265" text-anchor="middle" class="code">choose B2</text>

  <text x="835" y="145" text-anchor="middle" class="label">4. Remember</text>
  <text x="835" y="178" text-anchor="middle" class="body">state owns the choice</text>
  <text x="835" y="218" text-anchor="middle" class="code">flow -&gt; B2</text>
  <text x="835" y="246" text-anchor="middle" class="code">request -&gt; B2</text>
  <text x="835" y="280" text-anchor="middle" class="small">until its lifetime ends</text>

  <text x="1070" y="145" text-anchor="middle" class="label">5. Reuse</text>
  <text x="1070" y="178" text-anchor="middle" class="body">related traffic looks up</text>
  <text x="1070" y="218" text-anchor="middle" class="code">later packets</text>
  <text x="1070" y="246" text-anchor="middle" class="code">same flow -&gt; B2</text>
  <text x="1070" y="280" text-anchor="middle" class="small">no new scheduling</text>

  <path d="M225 208H262" class="arrow"/>
  <path d="M460 208H497" class="arrow"/>
  <path d="M695 208H732" class="arrow"/>
  <path d="M930 208H967" class="arrow"/>

  <text x="600" y="365" text-anchor="middle" class="label">A later connection is a new decision at both layers</text>

  <g filter="url(#shadow)">
    <rect x="50" y="405" width="170" height="150" rx="16" fill="#fff" stroke="#b9c9d8"/>
    <rect x="285" y="390" width="350" height="180" rx="18" fill="#eef4ff" stroke="#7399dc"/>
    <rect x="700" y="390" width="450" height="180" rx="18" fill="#fff4dd" stroke="#e2a63b"/>
  </g>

  <text x="135" y="448" text-anchor="middle" class="label">Same laptop</text>
  <text x="135" y="482" text-anchor="middle" class="body">Alice opens two</text>
  <text x="135" y="505" text-anchor="middle" class="body">TCP connections</text>
  <text x="135" y="535" text-anchor="middle" class="code">new source ports</text>

  <text x="460" y="427" text-anchor="middle" class="label">Connection 1</text>
  <text x="460" y="467" text-anchor="middle" class="code">Alice:51024 -&gt; LB-A -&gt; B2</text>
  <text x="460" y="505" text-anchor="middle" class="body">all packets reuse this flow mapping</text>
  <text x="460" y="535" text-anchor="middle" class="small">connection correctness requires stability</text>

  <text x="925" y="427" text-anchor="middle" class="label">Connection 2</text>
  <text x="925" y="467" text-anchor="middle" class="code">Alice:51091 -&gt; LB-B -&gt; B1</text>
  <text x="925" y="505" text-anchor="middle" class="body">new flow key, new balancer, new backend</text>
  <text x="925" y="535" text-anchor="middle" class="small">same backend only if affinity policy requires it</text>

  <path d="M220 475H277" class="arrow"/>
  <path d="M635 480H692" class="arrow"/>

  <rect x="260" y="598" width="680" height="36" rx="18" fill="#17324d"/>
  <text x="600" y="621" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#fff">Connection affinity is automatic; cross-connection session affinity is explicit policy</text>
</svg>
