<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>Origin traffic with and without a CDN</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.big{font:700 29px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.s{font:12px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="650" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Reuse changes how many bytes cross the origin boundary</text><rect x="55" y="90" width="510" height="465" rx="20" fill="#fff" stroke="#d96b79"/><text x="310" y="132" text-anchor="middle" class="h">Origin-only delivery</text><rect x="105" y="175" width="165" height="90" rx="15" fill="#fff1f2" stroke="#d96b79"/><text x="187" y="210" text-anchor="middle" class="h">100,000 readers</text><text x="187" y="237" text-anchor="middle" class="b">request 2.4 MiB each</text><rect x="365" y="175" width="150" height="90" rx="15" fill="#f3effb" stroke="#9377c6"/><text x="440" y="210" text-anchor="middle" class="h">US origin</text><text x="440" y="237" text-anchor="middle" class="b">serves every copy</text><path d="M270 220H365" stroke="#d96b79" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="310" y="335" text-anchor="middle" class="big">≈ 234 GiB</text><text x="310" y="367" text-anchor="middle" class="b">sent across the origin boundary</text><text x="310" y="435" text-anchor="middle" class="b">100,000 × 2.4 MiB</text><text x="310" y="485" text-anchor="middle" class="s">Every reader consumes origin bandwidth, storage I/O,</text><text x="310" y="506" text-anchor="middle" class="s">connections, and the long client-to-origin path.</text><rect x="635" y="90" width="510" height="465" rx="20" fill="#fff" stroke="#5ab5a4"/><text x="890" y="132" text-anchor="middle" class="h">Simplified warm-CDN delivery</text><rect x="675" y="175" width="150" height="90" rx="15" fill="#f3effb" stroke="#9377c6"/><text x="750" y="210" text-anchor="middle" class="h">US origin</text><text x="750" y="237" text-anchor="middle" class="b">one cache fill</text><rect x="955" y="175" width="150" height="90" rx="15" fill="#edf8f6" stroke="#5ab5a4"/><text x="1030" y="210" text-anchor="middle" class="h">London edge</text><text x="1030" y="237" text-anchor="middle" class="b">reuses the copy</text><path d="M825 220H955" stroke="#3b9f8a" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="890" y="335" text-anchor="middle" class="big">≈ 2.4 MiB</text><text x="890" y="367" text-anchor="middle" class="b">sent across the origin boundary</text><text x="890" y="435" text-anchor="middle" class="b">1 fill × 2.4 MiB</text><text x="890" y="485" text-anchor="middle" class="s">The edge still sends bytes to readers, but repeated delivery</text><text x="890" y="506" text-anchor="middle" class="s">stays near them and does not repeatedly reach the origin.</text><rect x="185" y="580" width="830" height="44" rx="10" fill="#17324d"/><text x="600" y="608" text-anchor="middle" style="font:700 14px sans-serif;fill:#fff">Illustrative ideal: real origin traffic depends on PoPs, misses, eviction, revalidation, and shielding.</text></svg>
