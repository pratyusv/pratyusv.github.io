<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">CDN point of presence during control-plane isolation</title><desc id="d">A disconnected point of presence applies different bounded behavior for immutable cache data, ordinary configuration, certificates, and security purges.</desc><style>.t{font:700 26px system-ui;fill:#17324d}.h{font:700 17px system-ui;fill:#17324d}.b{font:14px system-ui;fill:#45627d}.s{font:12px system-ui;fill:#45627d}.w{font:700 14px system-ui;fill:#fff}</style><rect width="1200" height="650" rx="26" fill="#f7fafc"/><text x="600" y="48" text-anchor="middle" class="t">A disconnected PoP applies policy-specific leases</text><rect x="55" y="105" width="1090" height="380" rx="22" fill="#fff" stroke="#9bb0c2"/><text x="600" y="140" text-anchor="middle" class="h">London PoP · control stream disconnected</text><rect x="90" y="185" width="235" height="225" rx="17" fill="#edf8f6" stroke="#5ab5a4"/><text x="207" y="222" text-anchor="middle" class="h">Immutable public object</text><text x="207" y="262" text-anchor="middle" class="b">validated cached bytes</text><text x="207" y="289" text-anchor="middle" class="b">long-lived configuration</text><rect x="127" y="330" width="160" height="45" rx="11" fill="#2f8f72"/><text x="207" y="358" text-anchor="middle" class="w">CONTINUE</text><rect x="350" y="185" width="235" height="225" rx="17" fill="#fff8e8" stroke="#e4b85b"/><text x="467" y="222" text-anchor="middle" class="h">Ordinary tenant config</text><text x="467" y="262" text-anchor="middle" class="b">last-known-good snapshot</text><text x="467" y="289" text-anchor="middle" class="b">bounded control lease</text><rect x="387" y="330" width="160" height="45" rx="11" fill="#c28b35"/><text x="467" y="358" text-anchor="middle" class="w">SERVE UNTIL LEASE</text><rect x="610" y="185" width="235" height="225" rx="17" fill="#fff0f0" stroke="#d86969"/><text x="727" y="222" text-anchor="middle" class="h">Certificate expires</text><text x="727" y="262" text-anchor="middle" class="b">no valid local identity</text><text x="727" y="289" text-anchor="middle" class="b">cannot extend locally</text><rect x="647" y="330" width="160" height="45" rx="11" fill="#bd4f4f"/><text x="727" y="358" text-anchor="middle" class="w">STOP TENANT TLS</text><rect x="870" y="185" width="235" height="225" rx="17" fill="#fff0f0" stroke="#d86969"/><text x="987" y="222" text-anchor="middle" class="h">Security purge stream</text><text x="987" y="262" text-anchor="middle" class="b">freshness no longer proven</text><text x="987" y="289" text-anchor="middle" class="b">short safety lease expires</text><rect x="907" y="330" width="160" height="45" rx="11" fill="#bd4f4f"/><text x="987" y="358" text-anchor="middle" class="w">FAIL CLOSED</text><rect x="145" y="535" width="910" height="62" rx="14" fill="#17324d"/><text x="600" y="562" text-anchor="middle" class="w">Isolation does not produce one universal fail-open rule.</text><text x="600" y="584" text-anchor="middle" class="s" fill="#fff">Every class of cached control state has its own freshness, security, and withdrawal contract.</text></svg>
