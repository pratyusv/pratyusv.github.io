<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>CDN cache key construction</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 15px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style></defs><rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">The cache key is the CDN's definition of identity</text><rect x="55" y="95" width="500" height="430" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="305" y="135" text-anchor="middle" class="h">Included · changes representation or authority</text><g class="c"><text x="95" y="190">tenant      atlas</text><text x="95" y="235">authority   media.atlas.example</text><text x="95" y="280">path        /eclipse/hero</text><text x="95" y="325">query       w=1200</text><text x="95" y="370">method      GET</text><text x="95" y="415">variant     accept-format=avif</text></g><rect x="645" y="95" width="500" height="430" rx="20" fill="#fceff1" stroke="#d96b79"/><text x="895" y="135" text-anchor="middle" class="h">Excluded only by audited policy</text><g class="c"><text x="685" y="190">utm_source=newsletter</text><text x="685" y="235">request_id=r-8f3a</text><text x="685" y="280">header ordering</text></g><text x="895" y="340" text-anchor="middle" class="h">Never drop blindly</text><g class="b"><text x="685" y="385">signature or authorization token</text><text x="685" y="420">origin-routing parameter</text><text x="685" y="455">content-affecting experiment</text></g><path d="M305 525V575" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="210" y="575" width="780" height="55" rx="14" fill="#17324d"/><text x="600" y="608" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff">atlas|media.atlas.example|/eclipse/hero|w=1200|GET|avif</text><text x="600" y="660" text-anchor="middle" class="b">Too few fields returns wrong bytes · too many fields destroys reuse</text></svg>
