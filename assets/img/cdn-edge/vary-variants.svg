<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>HTTP Vary representation variants</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style></defs><rect width="1200" height="650" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">One URI can have several reusable representations</text><rect x="375" y="90" width="450" height="125" rx="20" fill="#eef4ff" stroke="#7399dc"/><text x="600" y="130" text-anchor="middle" class="h">Primary cache key</text><text x="600" y="165" text-anchor="middle" class="c">/eclipse/hero?w=1200</text><text x="600" y="195" text-anchor="middle" class="c">Vary: Accept</text><g><rect x="55" y="355" width="300" height="150" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><rect x="450" y="355" width="300" height="150" rx="20" fill="#fff8e7" stroke="#d6a63f"/><rect x="845" y="355" width="300" height="150" rx="20" fill="#f1f4f7" stroke="#8296a8"/></g><text x="205" y="395" text-anchor="middle" class="h">AVIF variant</text><text x="205" y="430" text-anchor="middle" class="c">Accept → image/avif</text><text x="205" y="465" text-anchor="middle" class="c">ETag hero-v7-avif</text><text x="600" y="395" text-anchor="middle" class="h">WebP variant</text><text x="600" y="430" text-anchor="middle" class="c">Accept → image/webp</text><text x="600" y="465" text-anchor="middle" class="c">ETag hero-v7-webp</text><text x="995" y="395" text-anchor="middle" class="h">JPEG variant</text><text x="995" y="430" text-anchor="middle" class="c">Accept → image/jpeg</text><text x="995" y="465" text-anchor="middle" class="c">ETag hero-v7-jpeg</text><path d="M500 215L205 355M600 215V355M700 215L995 355" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="285" y="560" width="630" height="45" rx="12" fill="#17324d"/><text x="600" y="589" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">Reuse only when the request's named Vary fields match</text><text x="600" y="635" text-anchor="middle" class="b">Vary: * never matches · unbounded Vary dimensions fragment the cache</text></svg>
