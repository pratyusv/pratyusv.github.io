<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>CDN cache hierarchy</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style></defs><rect width="1200" height="650" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">A miss travels only as far as necessary</text><g><rect x="40" y="180" width="190" height="150" rx="20" fill="#fff" stroke="#b9c9d8"/><rect x="275" y="180" width="190" height="150" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><rect x="510" y="180" width="190" height="150" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="745" y="180" width="190" height="150" rx="20" fill="#fff8e7" stroke="#d6a63f"/><rect x="980" y="180" width="180" height="150" rx="20" fill="#f3effb" stroke="#9377c6"/></g><g text-anchor="middle"><text x="135" y="220" class="h">Reader R1</text><text x="135" y="255" class="c">GET hero</text><text x="135" y="290" class="b">London</text><text x="370" y="220" class="h">Process memory</text><text x="370" y="255" class="c">hot · tiny · fast</text><text x="370" y="290" class="b">E3 worker</text><text x="605" y="220" class="h">PoP disk</text><text x="605" y="255" class="c">larger working set</text><text x="605" y="290" class="b">London edge</text><text x="840" y="220" class="h">Shield S-LON</text><text x="840" y="255" class="c">cross-PoP reuse</text><text x="840" y="290" class="b">origin protection</text><text x="1070" y="220" class="h">Origin</text><text x="1070" y="255" class="c">authority</text><text x="1070" y="290" class="b">US region</text></g><path d="M230 255H275M465 255H510M700 255H745M935 255H980" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><g class="b" text-anchor="middle"><text x="370" y="390">memory hit: stop</text><text x="605" y="425">disk hit: stop + promote</text><text x="840" y="460">shield hit: stop + fill edge</text><text x="1070" y="495">origin only on full miss/revalidation</text></g><path d="M370 330V370M605 330V405M840 330V440M1070 330V475" stroke="#3b9f8a" stroke-width="3" marker-end="url(#a)"/><text x="600" y="600" text-anchor="middle" class="b">Every additional layer trades another lookup/hop for greater reuse and isolation</text></svg>
