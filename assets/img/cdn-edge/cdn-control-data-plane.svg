<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img">
  <title>CDN control plane and data plane</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker>
    <style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.s{font:12px sans-serif;fill:#45627d}</style>
  </defs>
  <rect width="1200" height="700" rx="24" fill="#f7fafc"/>
  <text x="600" y="44" text-anchor="middle" class="t">The control plane coordinates; the data plane serves</text>
  <rect x="55" y="80" width="1090" height="245" rx="20" fill="#fff" stroke="#9377c6"/>
  <text x="85" y="116" class="h">Control plane · low request volume, fleet-wide decisions</text>
  <g>
    <rect x="95" y="160" width="180" height="85" rx="14" fill="#f3effb" stroke="#9377c6"/><text x="185" y="194" text-anchor="middle" class="h">Traffic map</text><text x="185" y="220" text-anchor="middle" class="s">healthy capacity per network</text>
    <rect x="325" y="160" width="180" height="85" rx="14" fill="#f3effb" stroke="#9377c6"/><text x="415" y="194" text-anchor="middle" class="h">Content policy</text><text x="415" y="220" text-anchor="middle" class="s">fill, TTL, placement</text>
    <rect x="555" y="160" width="180" height="85" rx="14" fill="#f3effb" stroke="#9377c6"/><text x="645" y="194" text-anchor="middle" class="h">Configuration</text><text x="645" y="220" text-anchor="middle" class="s">tenants, TLS, security</text>
    <rect x="785" y="160" width="180" height="85" rx="14" fill="#f3effb" stroke="#9377c6"/><text x="875" y="194" text-anchor="middle" class="h">Invalidation</text><text x="875" y="220" text-anchor="middle" class="s">purges and generations</text>
  </g>
  <path d="M185 245V285H1010M415 245V285M645 245V285M875 245V285" stroke="#9377c6" stroke-width="3" fill="none"/>
  <rect x="965" y="245" width="135" height="75" rx="13" fill="#17324d"/>
  <text x="1032" y="277" text-anchor="middle" style="font:700 14px sans-serif;fill:#fff">PoP agents</text><text x="1032" y="299" text-anchor="middle" style="font:11px sans-serif;fill:#dce8f2">apply + report</text>
  <rect x="55" y="365" width="1090" height="265" rx="20" fill="#fff" stroke="#5ab5a4"/>
  <text x="85" y="401" class="h">Data plane · every request and every delivered byte</text>
  <rect x="95" y="455" width="170" height="90" rx="15" fill="#fff" stroke="#b7c8d8"/><text x="180" y="492" text-anchor="middle" class="h">Reader</text><text x="180" y="520" text-anchor="middle" class="b">HTTP request</text>
  <rect x="355" y="440" width="305" height="120" rx="16" fill="#edf8f6" stroke="#5ab5a4"/><text x="507" y="477" text-anchor="middle" class="h">Edge request pipeline</text><text x="507" y="507" text-anchor="middle" class="b">TLS · security · key · lookup</text><text x="507" y="534" text-anchor="middle" class="b">HIT: serve bytes locally</text>
  <rect x="845" y="455" width="230" height="90" rx="15" fill="#fff8e8" stroke="#e4b85b"/><text x="960" y="492" text-anchor="middle" class="h">Shield / origin</text><text x="960" y="520" text-anchor="middle" class="b">MISS: fetch upstream</text>
  <path d="M265 485H355M355 525H265M660 500H845" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <text x="752" y="483" text-anchor="middle" class="s">only when needed</text>
  <text x="600" y="670" text-anchor="middle" class="b">A fast server is one component; coordinated policy and routing make the fleet dependable.</text>
</svg>
