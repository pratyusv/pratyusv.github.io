dle" class="c">one 200 body</text><text x="1020" y="375" text-anchor="middle" class="b">shared result</text><path d="M265 140L410 235M265 260L410 285M265 380L410 365M265 500L410 415" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><path d="M740 275H895" stroke="#3b9f8a" stroke-width="5" marker-end="url(#a)"/><path d="M895 360H740" stroke="#3b9f8a" stroke-width="5" marker-end="url(#a)"/><text x="600" y="600" text-anchor="middle" class="b">Collapse only equivalent keys/variants; bound deadlines, followers, retries, and publish generation</text></svg>
