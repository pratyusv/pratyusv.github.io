<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>CDN negative caching</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style></defs><rect width="1200" height="650" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Cache a known absence briefly to stop repeated origin work</text><g fill="#fff" stroke="#b9c9d8"><rect x="45" y="130" width="230" height="80" rx="15"/><rect x="45" y="250" width="230" height="80" rx="15"/><rect x="45" y="370" width="230" height="80" rx="15"/></g><text x="160" y="178" text-anchor="middle" class="c">R1 caption.vtt</text><text x="160" y="298" text-anchor="middle" class="c">R2 caption.vtt</text><text x="160" y="418" text-anchor="middle" class="c">... R10000</text><rect x="430" y="165" width="320" height="260" rx="22" fill="#fff8e7" stroke="#d6a63f"/><text x="590" y="205" text-anchor="middle" class="h">Edge negative entry</text><rect x="480" y="245" width="220" height="100" rx="15" fill="#fff" stroke="#d6a63f"/><text x="590" y="280" text-anchor="middle" class="c">404 Not Found</text><text x="590" y="315" text-anchor="middle" class="c">s-maxage=15</text><text x="590" y="390" text-anchor="middle" class="b">followers receive cached 404</text><rect x="900" y="215" width="245" height="150" rx="20" fill="#f3effb" stroke="#9377c6"/><text x="1022" y="255" text-anchor="middle" class="h">Origin</text><text x="1022" y="292" text-anchor="middle" class="c">one 404</text><text x="1022" y="328" text-anchor="middle" class="b">not 10,000 requests</text><path d="M275 170L430 235M275 290L430 290M275 410L430 350M750 290H900" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="230" y="520" width="740" height="58" rx="15" fill="#17324d"/><text x="600" y="546" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">Short TTL limits how long creation remains hidden</text><text x="600" y="568" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dce5ed">publication can purge the negative key immediately</text><text x="600" y="620" text-anchor="middle" class="b">Apply the same tenant, authorization, and variant boundaries as successful content</text></svg>
