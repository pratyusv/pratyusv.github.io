<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>Anycast failover from London to Amsterdam</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style></defs><rect width="1200" height="650" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Route withdrawal moves new connections—not live application state</text><rect x="55" y="250" width="230" height="125" rx="18" fill="#fff" stroke="#b9c9d8"/><text x="170" y="292" text-anchor="middle" class="h">Reader R1</text><text x="170" y="325" text-anchor="middle" class="c">203.0.113.80</text><rect x="455" y="90" width="290" height="150" rx="20" fill="#fceff1" stroke="#d96b79"/><text x="600" y="130" text-anchor="middle" class="h">London PoP</text><text x="600" y="165" text-anchor="middle" class="b">health fails · route withdrawn</text><text x="600" y="200" text-anchor="middle" class="c">old TCP flow may break</text><rect x="455" y="410" width="290" height="150" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="600" y="450" text-anchor="middle" class="h">Amsterdam PoP</text><text x="600" y="485" text-anchor="middle" class="b">route now preferred</text><text x="600" y="520" text-anchor="middle" class="c">new connection succeeds</text><rect x="900" y="250" width="245" height="125" rx="18" fill="#fff8e7" stroke="#d6a63f"/><text x="1022" y="292" text-anchor="middle" class="h">Routing system</text><text x="1022" y="325" text-anchor="middle" class="b">converges over time</text><path d="M285 285C360 245 390 175 455 165" fill="none" stroke="#d96b79" stroke-width="4" stroke-dasharray="8 6"/><path d="M285 340C350 390 390 470 455 485" fill="none" stroke="#3b9f8a" stroke-width="5" marker-end="url(#a)"/><path d="M900 290L745 190M900 340L745 470" fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="320" y="590" width="560" height="42" rx="12" fill="#17324d"/><text x="600" y="617" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">Client reconnect + alternate PoP capacity completes failover</text></svg>
