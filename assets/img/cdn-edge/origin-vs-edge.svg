<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>Origin delivery compared with edge delivery</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="650" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Move reusable bytes away from the origin path</text><rect x="55" y="100" width="1090" height="190" rx="20" fill="#fff" stroke="#d96b79"/><text x="90" y="135" class="h">Without CDN</text><g class="h" text-anchor="middle"><text x="170" y="210">London readers</text><text x="520" y="210">wide-area Internet</text><text x="990" y="210">US origin</text></g><path d="M270 200H430M620 200H870" stroke="#d96b79" stroke-width="5" marker-end="url(#a)"/><text x="600" y="260" text-anchor="middle" class="b">every request pays distance, egress, storage I/O, and origin concurrency</text><rect x="55" y="345" width="1090" height="210" rx="20" fill="#fff" stroke="#5ab5a4"/><text x="90" y="382" class="h">With CDN</text><text x="170" y="465" text-anchor="middle" class="h">London readers</text><rect x="370" y="410" width="260" height="105" rx="17" fill="#edf8f6" stroke="#5ab5a4"/><text x="500" y="445" text-anchor="middle" class="h">London edge cache</text><text x="500" y="478" text-anchor="middle" class="b">fresh hit: return locally</text><rect x="850" y="410" width="250" height="105" rx="17" fill="#f3effb" stroke="#9377c6"/><text x="975" y="445" text-anchor="middle" class="h">Origin</text><text x="975" y="478" text-anchor="middle" class="b">miss/revalidate only</text><path d="M270 455H370" stroke="#3b9f8a" stroke-width="5" marker-end="url(#a)"/><path d="M630 462H850" stroke="#55728f" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="740" y="445" text-anchor="middle" class="b">rare upstream path</text><text x="600" y="610" text-anchor="middle" class="b">Latency and origin load fall only for correctly identified, reusable responses</text></svg>
