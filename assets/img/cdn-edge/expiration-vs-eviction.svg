<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img"><title>Cache freshness versus storage residency</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="670" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Expiration is about permission; eviction is about space</text><text x="130" y="330" transform="rotate(-90 130 330)" text-anchor="middle" class="h">Storage residency</text><text x="650" y="625" text-anchor="middle" class="h">HTTP freshness</text><line x1="245" y1="550" x2="1080" y2="550" stroke="#17324d" stroke-width="3"/><line x1="245" y1="550" x2="245" y2="105" stroke="#17324d" stroke-width="3"/><rect x="270" y="120" width="350" height="185" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><rect x="680" y="120" width="350" height="185" rx="20" fill="#fff8e7" stroke="#d6a63f"/><rect x="270" y="350" width="350" height="165" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="680" y="350" width="350" height="165" rx="20" fill="#f1f4f7" stroke="#8296a8"/><text x="445" y="160" text-anchor="middle" class="h">Resident + fresh</text><text x="445" y="200" text-anchor="middle" class="c">ordinary HIT</text><text x="445" y="240" text-anchor="middle" class="b">reuse immediately</text><text x="855" y="160" text-anchor="middle" class="h">Resident + stale</text><text x="855" y="200" text-anchor="middle" class="c">bytes exist</text><text x="855" y="240" text-anchor="middle" class="b">validate or stale permission</text><text x="445" y="390" text-anchor="middle" class="h">Evicted while fresh</text><text x="445" y="430" text-anchor="middle" class="c">local MISS</text><text x="445" y="470" text-anchor="middle" class="b">refill from upstream</text><text x="855" y="390" text-anchor="middle" class="h">Evicted + stale</text><text x="855" y="430" text-anchor="middle" class="c">no local bytes</text><text x="855" y="470" text-anchor="middle" class="b">full fetch required</text><text x="290" y="585" class="b">fresh</text><text x="985" y="585" class="b">stale</text><text x="210" y="145" text-anchor="end" class="b">resident</text><text x="210" y="505" text-anchor="end" class="b">evicted</text></svg>
