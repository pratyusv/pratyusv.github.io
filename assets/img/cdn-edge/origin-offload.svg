<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>CDN origin offload equation</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style></defs><rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Hits and collapsing shrink demand at each layer</text><g><rect x="45" y="145" width="235" height="170" rx="20" fill="#fff" stroke="#b9c9d8"/><rect x="350" y="145" width="235" height="170" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="655" y="145" width="235" height="170" rx="20" fill="#fff8e7" stroke="#d6a63f"/><rect x="960" y="145" width="195" height="170" rx="20" fill="#f3effb" stroke="#9377c6"/></g><text x="162" y="185" text-anchor="middle" class="h">Cacheable demand</text><text x="162" y="228" text-anchor="middle" class="c">Q = 100k req/s</text><text x="162" y="270" text-anchor="middle" class="b">reader requests</text><text x="467" y="185" text-anchor="middle" class="h">Edge</text><text x="467" y="228" text-anchor="middle" class="c">H = 90% hits</text><text x="467" y="270" text-anchor="middle" class="c">C = 10 collapse</text><text x="772" y="185" text-anchor="middle" class="h">Shield</text><text x="772" y="228" text-anchor="middle" class="c">1k req/s</text><text x="772" y="270" text-anchor="middle" class="c">S = 95% hits</text><text x="1057" y="185" text-anchor="middle" class="h">Origin</text><text x="1057" y="228" text-anchor="middle" class="c">~50 req/s</text><text x="1057" y="270" text-anchor="middle" class="b">idealized</text><path d="M280 230H350M585 230H655M890 230H960" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><rect x="145" y="405" width="910" height="120" rx="20" fill="#17324d"/><text x="600" y="442" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff">shield Q ≈ Q × (1-H) / C</text><text x="600" y="477" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff">origin Q ≈ Q × (1-H) × (1-S) / C</text><text x="600" y="507" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dce5ed">planning model, not a correctness invariant</text><text x="600" y="590" text-anchor="middle" class="h">Track request hit ratio and byte hit ratio</text><text x="600" y="625" text-anchor="middle" class="b">one uncached large object can dominate bandwidth despite many tiny hits</text></svg>
