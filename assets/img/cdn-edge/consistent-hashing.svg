<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>Consistent hashing inside a CDN point of presence</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style></defs><rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Stable placement preserves cache locality during membership change</text><circle cx="420" cy="335" r="205" fill="none" stroke="#b9c9d8" stroke-width="24"/><g fill="#eef4ff" stroke="#7399dc"><circle cx="420" cy="130" r="35"/><circle cx="605" cy="245" r="35"/><circle cx="535" cy="500" r="35"/><circle cx="245" cy="475" r="35"/><circle cx="225" cy="220" r="35"/></g><g class="h" text-anchor="middle"><text x="420" y="136">E1</text><text x="605" y="251">E2</text><text x="535" y="506">E4</text><text x="245" y="481">E5</text><text x="225" y="226">E6</text></g><circle cx="612" cy="365" r="35" fill="#fceff1" stroke="#d96b79" stroke-width="3"/><text x="612" y="371" text-anchor="middle" class="h">E3</text><circle cx="550" cy="330" r="15" fill="#3b9f8a"/><text x="420" y="330" text-anchor="middle" class="c">hash(hero|avif)</text><text x="420" y="358" text-anchor="middle" class="b">clockwise owner → E3</text><path d="M550 330L585 350" stroke="#3b9f8a" stroke-width="4" marker-end="url(#a)"/><rect x="760" y="145" width="370" height="160" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="945" y="185" text-anchor="middle" class="h">Healthy ring</text><text x="945" y="223" text-anchor="middle" class="c">hero-v7-avif → E3</text><text x="945" y="260" text-anchor="middle" class="b">one owner maximizes reuse</text><rect x="760" y="380" width="370" height="160" rx="20" fill="#fff8e7" stroke="#d6a63f"/><text x="945" y="420" text-anchor="middle" class="h">After E3 fails</text><text x="945" y="458" text-anchor="middle" class="c">only E3 range → E4</text><text x="945" y="495" text-anchor="middle" class="b">other keys keep their owners</text><path d="M650 365H760" stroke="#d96b79" stroke-width="3" stroke-dasharray="7 6"/><text x="600" y="635" text-anchor="middle" class="b">Cached state is replaceable; stable mapping prevents whole-cluster coldness</text></svg>
