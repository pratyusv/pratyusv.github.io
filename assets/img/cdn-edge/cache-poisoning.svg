<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img"><title>Cache poisoning from omitted key input</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style></defs><rect width="1200" height="670" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">If input changes output, omitting it from identity poisons reuse</text><rect x="55" y="105" width="300" height="170" rx="20" fill="#fceff1" stroke="#d96b79"/><text x="205" y="145" text-anchor="middle" class="h">1 · Attacker request</text><text x="205" y="183" text-anchor="middle" class="c">Host: media.atlas</text><text x="205" y="215" text-anchor="middle" class="c">X-Theme: attacker</text><text x="205" y="248" text-anchor="middle" class="b">origin output changes</text><rect x="455" y="105" width="290" height="170" rx="20" fill="#fff8e7" stroke="#d6a63f"/><text x="600" y="145" text-anchor="middle" class="h">2 · Incorrect cache key</text><text x="600" y="187" text-anchor="middle" class="c">media.atlas|/hero</text><text x="600" y="228" text-anchor="middle" class="b">X-Theme omitted</text><rect x="845" y="105" width="300" height="170" rx="20" fill="#fceff1" stroke="#d96b79"/><text x="995" y="145" text-anchor="middle" class="h">3 · Stored response</text><text x="995" y="187" text-anchor="middle" class="c">attacker-influenced body</text><text x="995" y="228" text-anchor="middle" class="b">under shared victim key</text><path d="M355 190H455M745 190H845" stroke="#d96b79" stroke-width="4" marker-end="url(#a)"/><rect x="55" y="405" width="300" height="145" rx="20" fill="#fff" stroke="#b9c9d8"/><text x="205" y="445" text-anchor="middle" class="h">4 · Victim request</text><text x="205" y="485" text-anchor="middle" class="c">GET /hero</text><text x="205" y="520" text-anchor="middle" class="b">no attacker header</text><rect x="845" y="405" width="300" height="145" rx="20" fill="#fceff1" stroke="#d96b79"/><text x="995" y="445" text-anchor="middle" class="h">5 · Wrong HIT</text><text x="995" y="485" text-anchor="middle" class="c">attacker body returned</text><text x="995" y="520" text-anchor="middle" class="b">fast but unsafe</text><path d="M355 475C520 365 690 365 845 475" fill="none" stroke="#d96b79" stroke-width="5" marker-end="url(#a)"/><rect x="300" y="600" width="600" height="45" rx="12" fill="#17324d"/><text x="600" y="628" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">Normalize once · cache only audited routes · bound every variant</text></svg>
