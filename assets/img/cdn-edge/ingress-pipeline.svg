<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>CDN edge ingress pipeline</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 15px sans-serif;fill:#17324d}.b{font:12px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style></defs><rect width="1200" height="650" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Establish one request interpretation before cache lookup</text><g stroke="#b9c9d8"><rect x="35" y="160" width="160" height="135" rx="17" fill="#fff"/><rect x="230" y="160" width="160" height="135" rx="17" fill="#fff8e7"/><rect x="425" y="160" width="160" height="135" rx="17" fill="#eef4ff"/><rect x="620" y="160" width="160" height="135" rx="17" fill="#fceff1"/><rect x="815" y="160" width="160" height="135" rx="17" fill="#eef4ff"/><rect x="1010" y="160" width="160" height="135" rx="17" fill="#edf8f6"/></g><g text-anchor="middle"><text x="115" y="198" class="h">1 · Connection</text><text x="115" y="230" class="c">TCP / QUIC</text><text x="115" y="263" class="b">PoP ingress</text><text x="310" y="198" class="h">2 · TLS</text><text x="310" y="230" class="c">SNI: media.atlas</text><text x="310" y="263" class="b">cert + tenant</text><text x="505" y="198" class="h">3 · Authority</text><text x="505" y="230" class="c">Host matches</text><text x="505" y="263" class="b">route config</text><text x="700" y="198" class="h">4 · Security</text><text x="700" y="230" class="c">WAF · rate limit</text><text x="700" y="263" class="b">reject ambiguity</text><text x="895" y="198" class="h">5 · Normalize</text><text x="895" y="230" class="c">path + query</text><text x="895" y="263" class="b">canonical form</text><text x="1090" y="198" class="h">6 · Cache</text><text x="1090" y="230" class="c">key → E3</text><text x="1090" y="263" class="b">lookup policy</text></g><path d="M195 227H230M390 227H425M585 227H620M780 227H815M975 227H1010" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="160" y="390" width="880" height="120" rx="20" fill="#17324d"/><text x="600" y="425" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">Canonical request</text><text x="600" y="458" text-anchor="middle" font-family="monospace" font-size="13" fill="#fff">atlas | https | media.atlas.example | /eclipse/hero | w=1200 | GET</text><text x="600" y="487" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dce5ed">same meaning for lookup · origin forwarding · logging · purge</text><path d="M895 295V390" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><text x="600" y="585" text-anchor="middle" class="b">Different path interpretations across layers create poisoning and authorization failures</text></svg>
