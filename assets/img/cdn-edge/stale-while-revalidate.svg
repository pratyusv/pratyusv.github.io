<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img"><title>stale-while-revalidate behavior at a CDN edge</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style></defs><rect width="1200" height="670" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Serve immediately while one refresh runs in the background</text><rect x="55" y="220" width="250" height="130" rx="20" fill="#fff" stroke="#b9c9d8"/><text x="180" y="260" text-anchor="middle" class="h">Readers R1...Rn</text><text x="180" y="295" text-anchor="middle" class="c">age = 601</text><text x="180" y="325" text-anchor="middle" class="b">inside 30s SWR window</text><rect x="450" y="145" width="300" height="280" rx="22" fill="#fff8e7" stroke="#d6a63f"/><text x="600" y="185" text-anchor="middle" class="h">Edge E3</text><rect x="495" y="225" width="210" height="75" rx="14" fill="#fff" stroke="#d6a63f"/><text x="600" y="255" text-anchor="middle" class="c">serve stale v7 now</text><text x="600" y="282" text-anchor="middle" class="b">low reader latency</text><rect x="495" y="325" width="210" height="65" rx="14" fill="#eef4ff" stroke="#7399dc"/><text x="600" y="352" text-anchor="middle" class="c">one refresh leader</text><text x="600" y="376" text-anchor="middle" class="b">followers collapse</text><rect x="900" y="220" width="245" height="130" rx="20" fill="#f3effb" stroke="#9377c6"/><text x="1022" y="260" text-anchor="middle" class="h">Origin</text><text x="1022" y="295" text-anchor="middle" class="c">304 or new 200</text><text x="1022" y="325" text-anchor="middle" class="b">refresh result</text><path d="M305 260H450" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><path d="M450 305H305" stroke="#3b9f8a" stroke-width="5" marker-end="url(#a)"/><path d="M750 355H900" stroke="#2f6fdd" stroke-width="4" marker-end="url(#a)"/><path d="M900 285H750" stroke="#2f6fdd" stroke-width="4" marker-end="url(#a)"/><rect x="250" y="530" width="700" height="65" rx="15" fill="#17324d"/><text x="600" y="557" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">Latency trade: some readers accept bounded staleness</text><text x="600" y="580" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dce5ed">emergency purge overrides stale permission</text><text x="600" y="635" text-anchor="middle" class="b">Use only where the application's correctness window permits old content</text></svg>
