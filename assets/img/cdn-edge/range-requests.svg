<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img"><title>CDN byte range caching</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style></defs><rect width="1200" height="670" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Partial bytes are safe to combine only within one representation</text><rect x="55" y="110" width="330" height="160" rx="20" fill="#fff" stroke="#b9c9d8"/><text x="220" y="150" text-anchor="middle" class="h">Reader seek</text><text x="220" y="190" text-anchor="middle" class="c">Range: bytes=1MiB-2MiB</text><text x="220" y="230" text-anchor="middle" class="b">requests one segment</text><rect x="815" y="110" width="330" height="160" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="980" y="150" text-anchor="middle" class="h">206 Partial Content</text><text x="980" y="188" text-anchor="middle" class="c">Content-Range: 1MiB-2MiB/480MiB</text><text x="980" y="225" text-anchor="middle" class="c">ETag: "film-v3"</text><path d="M385 190H815" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><text x="600" y="325" text-anchor="middle" class="h">Segment cache for film-v3</text><rect x="100" y="365" width="1000" height="95" rx="16" fill="#f1f4f7" stroke="#8296a8"/><rect x="100" y="365" width="200" height="95" rx="16" fill="#eef4ff" stroke="#7399dc"/><rect x="300" y="365" width="200" height="95" fill="#edf8f6" stroke="#5ab5a4"/><rect x="700" y="365" width="200" height="95" fill="#fff8e7" stroke="#d6a63f"/><text x="200" y="405" text-anchor="middle" class="c">0–1MiB</text><text x="200" y="435" text-anchor="middle" class="b">cached</text><text x="400" y="405" text-anchor="middle" class="c">1–2MiB</text><text x="400" y="435" text-anchor="middle" class="b">new segment</text><text x="600" y="418" text-anchor="middle" class="b">gap</text><text x="800" y="405" text-anchor="middle" class="c">3–4MiB</text><text x="800" y="435" text-anchor="middle" class="b">cached</text><text x="1000" y="418" text-anchor="middle" class="b">...</text><rect x="230" y="535" width="740" height="55" rx="14" fill="#17324d"/><text x="600" y="568" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">Never join film-v2 and film-v3 segments · require one strong validator</text><text x="600" y="630" text-anchor="middle" class="b">Segment size trades hit ratio, disk metadata, fetch amplification, and seek latency</text></svg>
