<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>Cold CDN cache fill</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style></defs><rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Request goes inward; bytes stream outward</text><g><rect x="45" y="120" width="220" height="125" rx="18" fill="#fff" stroke="#b9c9d8"/><rect x="345" y="120" width="220" height="125" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="645" y="120" width="220" height="125" rx="18" fill="#fff8e7" stroke="#d6a63f"/><rect x="945" y="120" width="210" height="125" rx="18" fill="#f3effb" stroke="#9377c6"/></g><text x="155" y="160" text-anchor="middle" class="h">Reader R1</text><text x="155" y="195" text-anchor="middle" class="c">GET hero|avif</text><text x="455" y="160" text-anchor="middle" class="h">Edge E3</text><text x="455" y="195" text-anchor="middle" class="c">memory MISS · disk MISS</text><text x="755" y="160" text-anchor="middle" class="h">Shield S-LON</text><text x="755" y="195" text-anchor="middle" class="c">MISS</text><text x="1050" y="160" text-anchor="middle" class="h">Atlas origin</text><text x="1050" y="195" text-anchor="middle" class="c">200 hero-v7-avif</text><path d="M265 175H345M565 175H645M865 175H945" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><path d="M945 330H865M645 330H565M345 330H265" stroke="#3b9f8a" stroke-width="6" marker-end="url(#a)"/><text x="1050" y="335" text-anchor="middle" class="h">stream body chunks</text><rect x="630" y="385" width="250" height="105" rx="16" fill="#fff8e7" stroke="#d6a63f"/><rect x="330" y="385" width="250" height="105" rx="16" fill="#edf8f6" stroke="#5ab5a4"/><text x="755" y="425" text-anchor="middle" class="h">Shield stores complete body</text><text x="755" y="458" text-anchor="middle" class="b">then publishes reusable entry</text><text x="455" y="425" text-anchor="middle" class="h">E3 stores disk + memory</text><text x="455" y="458" text-anchor="middle" class="b">reader need not wait for full fill</text><path d="M755 350V385M455 350V385" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="260" y="560" width="680" height="50" rx="14" fill="#17324d"/><text x="600" y="591" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">Publish only after length, integrity, headers, and purge generation remain valid</text></svg>
