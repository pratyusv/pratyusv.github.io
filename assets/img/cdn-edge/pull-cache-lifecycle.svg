<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>Cold miss and warm hit in a pull CDN</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.n{font:700 13px sans-serif;fill:#fff}</style></defs><rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">A pull CDN learns on demand</text><rect x="50" y="85" width="1100" height="245" rx="20" fill="#fff" stroke="#e4b85b"/><text x="82" y="122" class="h">Request 1 · cold miss</text><circle cx="105" cy="210" r="25" fill="#55728f"/><text x="105" y="215" text-anchor="middle" class="n">1</text><text x="105" y="278" text-anchor="middle" class="b">reader</text><rect x="310" y="155" width="250" height="110" rx="17" fill="#fff8e8" stroke="#e4b85b"/><text x="435" y="194" text-anchor="middle" class="h">London edge</text><text x="435" y="225" text-anchor="middle" class="b">MISS · no stored copy</text><rect x="845" y="155" width="250" height="110" rx="17" fill="#f3effb" stroke="#9377c6"/><text x="970" y="194" text-anchor="middle" class="h">US origin</text><text x="970" y="225" text-anchor="middle" class="b">authoritative response</text><path d="M130 195H310M560 190H845" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M845 235H560M310 240H130" stroke="#3b9f8a" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="220" y="180" text-anchor="middle" class="b">request</text><text x="220" y="262" text-anchor="middle" class="b">stream to reader</text><text x="702" y="174" text-anchor="middle" class="b">fetch upstream</text><text x="702" y="260" text-anchor="middle" class="b">stream response + store copy</text><rect x="50" y="365" width="1100" height="245" rx="20" fill="#fff" stroke="#5ab5a4"/><text x="82" y="402" class="h">Request 2 · warm hit</text><circle cx="105" cy="490" r="25" fill="#55728f"/><text x="105" y="495" text-anchor="middle" class="n">2</text><text x="105" y="540" text-anchor="middle" class="b">reader</text><rect x="310" y="435" width="250" height="110" rx="17" fill="#edf8f6" stroke="#5ab5a4"/><text x="435" y="474" text-anchor="middle" class="h">London edge</text><text x="435" y="505" text-anchor="middle" class="b">HIT · fresh stored copy</text><rect x="845" y="435" width="250" height="110" rx="17" fill="#f3effb" stroke="#9377c6"/><text x="970" y="474" text-anchor="middle" class="h">US origin</text><text x="970" y="505" text-anchor="middle" class="b">not contacted</text><path d="M130 470H310" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M310 515H130" stroke="#3b9f8a" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M560 490H845" stroke="#c8d3dd" stroke-width="3" stroke-dasharray="9 7" fill="none"/><text x="702" y="474" text-anchor="middle" class="b">no upstream request</text><text x="600" y="650" text-anchor="middle" class="b">Expiration, eviction, purge, or a different cache key can make a later request miss again.</text></svg>
