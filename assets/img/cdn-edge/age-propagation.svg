<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>HTTP Age propagation across cache layers</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style></defs><rect width="1200" height="650" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">A downstream cache inherits age; it does not reset time</text><g><rect x="55" y="160" width="240" height="160" rx="20" fill="#f3effb" stroke="#9377c6"/><rect x="355" y="160" width="240" height="160" rx="20" fill="#fff8e7" stroke="#d6a63f"/><rect x="655" y="160" width="240" height="160" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="955" y="160" width="190" height="160" rx="20" fill="#fff" stroke="#b9c9d8"/></g><text x="175" y="200" text-anchor="middle" class="h">Origin validates</text><text x="175" y="240" text-anchor="middle" class="c">age ≈ 0</text><text x="175" y="278" text-anchor="middle" class="b">Date + response time</text><text x="475" y="200" text-anchor="middle" class="h">Shield residence</text><text x="475" y="240" text-anchor="middle" class="c">Age: 300</text><text x="475" y="278" text-anchor="middle" class="b">stores for 300s</text><text x="775" y="200" text-anchor="middle" class="h">Edge residence</text><text x="775" y="240" text-anchor="middle" class="c">Age: 420</text><text x="775" y="278" text-anchor="middle" class="b">another 120s</text><text x="1050" y="200" text-anchor="middle" class="h">R1 receives</text><text x="1050" y="240" text-anchor="middle" class="c">Age: 420</text><text x="1050" y="278" text-anchor="middle" class="b">TTL: 180s</text><path d="M295 240H355M595 240H655M895 240H955" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><rect x="220" y="410" width="760" height="85" rx="18" fill="#17324d"/><text x="600" y="445" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff">current_age = corrected_initial_age + resident_time</text><text x="600" y="475" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dce5ed">includes upstream Age and transit timing</text><text x="600" y="575" text-anchor="middle" class="b">Age estimates time since origin generation or validation—not time since local storage</text></svg>
