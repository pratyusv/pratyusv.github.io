<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>stale-if-error origin failure fallback</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style></defs><rect width="1200" height="650" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Previously valid bytes can buffer an eligible origin failure</text><rect x="55" y="210" width="250" height="140" rx="20" fill="#fff" stroke="#b9c9d8"/><text x="180" y="250" text-anchor="middle" class="h">Reader R1</text><text x="180" y="285" text-anchor="middle" class="c">GET hero|avif</text><rect x="450" y="145" width="300" height="270" rx="22" fill="#fff8e7" stroke="#d6a63f"/><text x="600" y="185" text-anchor="middle" class="h">Edge E3</text><text x="600" y="225" text-anchor="middle" class="c">stale body exists</text><text x="600" y="260" text-anchor="middle" class="c">SIE remaining: 8h</text><rect x="500" y="300" width="200" height="75" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="600" y="330" text-anchor="middle" class="h">fallback v7</text><text x="600" y="355" text-anchor="middle" class="b">bounded + observable</text><rect x="900" y="210" width="245" height="140" rx="20" fill="#fceff1" stroke="#d96b79"/><text x="1022" y="250" text-anchor="middle" class="h">Origin</text><text x="1022" y="285" text-anchor="middle" class="c">503 / timeout</text><text x="1022" y="320" text-anchor="middle" class="b">eligible failure</text><path d="M305 280H450M750 235H900" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><path d="M900 320H750" stroke="#d96b79" stroke-width="4" marker-end="url(#a)"/><path d="M450 350H305" stroke="#3b9f8a" stroke-width="5" marker-end="url(#a)"/><rect x="220" y="500" width="760" height="60" rx="15" fill="#17324d"/><text x="600" y="526" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">Works only when a usable copy already exists and policy permits stale</text><text x="600" y="549" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dce5ed">purged, private, or never-cached content still fails</text><text x="600" y="610" text-anchor="middle" class="b">A finite stale window protects availability without hiding failure forever</text></svg>
