<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Highly available CDN control plane</title><desc id="d">Replicated configuration and purge authorities commit versioned state before regional fanout distributes immutable snapshots to independent points of presence.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 26px system-ui;fill:#17324d}.h{font:700 16px system-ui;fill:#17324d}.b{font:13px system-ui;fill:#45627d}.s{font:12px system-ui;fill:#45627d}.w{font:700 14px system-ui;fill:#fff}</style></defs><rect width="1200" height="700" rx="26" fill="#f7fafc"/><text x="600" y="48" text-anchor="middle" class="t">Commit globally, fan out regionally, serve from validated local state</text><rect x="35" y="225" width="180" height="110" rx="15" fill="#fff8e8" stroke="#e4b85b"/><text x="125" y="263" text-anchor="middle" class="h">Publishing API</text><text x="125" y="291" text-anchor="middle" class="b">config v418</text><text x="125" y="315" text-anchor="middle" class="s">operation cfg-91</text><rect x="285" y="90" width="350" height="430" rx="22" fill="#f3effb" stroke="#9377c6"/><text x="460" y="128" text-anchor="middle" class="h">Replicated authority</text><rect x="325" y="180" width="145" height="90" rx="13" fill="#17324d"/><text x="397" y="213" text-anchor="middle" class="w">C1 · leader</text><text x="397" y="239" text-anchor="middle" class="s" fill="#fff">term 52 · commits</text><rect x="505" y="170" width="95" height="70" rx="12" fill="#fff" stroke="#9377c6"/><text x="552" y="199" text-anchor="middle" class="h">C2</text><text x="552" y="221" text-anchor="middle" class="s">replica</text><rect x="505" y="295" width="95" height="70" rx="12" fill="#fff" stroke="#9377c6"/><text x="552" y="324" text-anchor="middle" class="h">C3</text><text x="552" y="346" text-anchor="middle" class="s">replica</text><path d="M470 210H505M470 248L505 320" stroke="#55728f" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="325" y="405" width="275" height="72" rx="13" fill="#edf8f6" stroke="#5ab5a4"/><text x="462" y="434" text-anchor="middle" class="h">Committed immutable state</text><text x="462" y="458" text-anchor="middle" class="b">config 418 · purge 991 · cert 73</text><path d="M215 280H285" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="705" y="155" width="180" height="110" rx="15" fill="#edf8f6" stroke="#5ab5a4"/><text x="795" y="193" text-anchor="middle" class="h">Regional fanout</text><text x="795" y="221" text-anchor="middle" class="b">resume by version</text><text x="795" y="245" text-anchor="middle" class="s">snapshot or log tail</text><path d="M635 280H670V210H705" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="970" y="85" width="185" height="115" rx="15" fill="#fff8e8" stroke="#e4b85b"/><text x="1062" y="123" text-anchor="middle" class="h">London PoP</text><text x="1062" y="151" text-anchor="middle" class="b">active config 418</text><text x="1062" y="176" text-anchor="middle" class="s">local data plane</text><rect x="970" y="250" width="185" height="115" rx="15" fill="#fff8e8" stroke="#e4b85b"/><text x="1062" y="288" text-anchor="middle" class="h">Mumbai PoP</text><text x="1062" y="316" text-anchor="middle" class="b">active config 418</text><text x="1062" y="341" text-anchor="middle" class="s">local data plane</text><rect x="970" y="415" width="185" height="115" rx="15" fill="#fff8e8" stroke="#e4b85b"/><text x="1062" y="453" text-anchor="middle" class="h">Tokyo PoP</text><text x="1062" y="481" text-anchor="middle" class="b">active config 418</text><text x="1062" y="506" text-anchor="middle" class="s">local data plane</text><path d="M885 210H930V142H970M930 210V307H970M930 307V472H970" stroke="#55728f" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="130" y="595" width="940" height="58" rx="14" fill="#17324d"/><text x="600" y="630" text-anchor="middle" class="w">The authority is replicated; PoPs serve requests without a synchronous global control-plane lookup.</text></svg>
