<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>HTTP cache revalidation with ETag</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style></defs><rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Revalidation asks whether stored bytes still represent the resource</text><rect x="55" y="105" width="330" height="190" rx="20" fill="#eef4ff" stroke="#7399dc"/><text x="220" y="145" text-anchor="middle" class="h">Stale edge entry</text><text x="220" y="182" text-anchor="middle" class="c">body: hero-v7-avif</text><text x="220" y="216" text-anchor="middle" class="c">ETag: "hero-v7-avif"</text><text x="220" y="252" text-anchor="middle" class="b">body remains stored</text><rect x="815" y="105" width="330" height="190" rx="20" fill="#f3effb" stroke="#9377c6"/><text x="980" y="145" text-anchor="middle" class="h">Origin</text><text x="980" y="188" text-anchor="middle" class="c">If-None-Match:</text><text x="980" y="218" text-anchor="middle" class="c">"hero-v7-avif"</text><path d="M385 180H815" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><g><rect x="80" y="405" width="480" height="150" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><rect x="640" y="405" width="480" height="150" rx="20" fill="#fff8e7" stroke="#d6a63f"/></g><text x="320" y="445" text-anchor="middle" class="h">Unchanged → 304 Not Modified</text><text x="320" y="482" text-anchor="middle" class="c">metadata only · no image body</text><text x="320" y="518" text-anchor="middle" class="b">refresh policy + keep 2.4 MiB body</text><text x="880" y="445" text-anchor="middle" class="h">Changed → 200 OK</text><text x="880" y="482" text-anchor="middle" class="c">ETag: "hero-v8-avif"</text><text x="880" y="518" text-anchor="middle" class="b">store new body, then publish</text><path d="M930 295L400 405M1030 295L880 405" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><text x="600" y="620" text-anchor="middle" class="b">Strong validators prove byte identity; weak validators only prove semantic equivalence</text></svg>
