<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>CDN freshness and stale windows</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="650" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Presence on disk is not permission to reuse</text><line x1="95" y1="290" x2="1100" y2="290" stroke="#17324d" stroke-width="4"/><rect x="95" y="205" width="500" height="70" rx="12" fill="#edf8f6" stroke="#5ab5a4"/><rect x="595" y="205" width="100" height="70" fill="#fff8e7" stroke="#d6a63f"/><rect x="695" y="205" width="360" height="70" rx="12" fill="#fceff1" stroke="#d96b79"/><text x="345" y="247" text-anchor="middle" class="h">Fresh shared-cache window</text><text x="645" y="235" text-anchor="middle" class="h">SWR</text><text x="645" y="258" text-anchor="middle" class="b">serve + refresh</text><text x="875" y="235" text-anchor="middle" class="h">stale-if-error only</text><text x="875" y="258" text-anchor="middle" class="b">bounded failure fallback</text><g class="c" text-anchor="middle"><text x="95" y="330">age 0</text><text x="595" y="330">600s</text><text x="695" y="330">630s</text><text x="1055" y="330">87000s</text></g><rect x="110" y="405" width="980" height="110" rx="18" fill="#fff" stroke="#b9c9d8"/><text x="600" y="442" text-anchor="middle" class="c">public, max-age=60, s-maxage=600,</text><text x="600" y="472" text-anchor="middle" class="c">stale-while-revalidate=30, stale-if-error=86400</text><text x="600" y="500" text-anchor="middle" class="b">browser freshness = 60s · CDN freshness = 600s</text><text x="600" y="585" text-anchor="middle" class="b">After freshness: validate, use an explicit stale permission, or do not reuse</text></svg>
