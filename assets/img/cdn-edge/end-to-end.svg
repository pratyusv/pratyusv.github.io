<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>Complete CDN image lifecycle</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 14px sans-serif;fill:#17324d}.b{font:12px sans-serif;fill:#45627d}.c{font:11px monospace;fill:#17324d}</style></defs><rect width="1200" height="760" rx="24" fill="#f7fafc"/><text x="600" y="43" text-anchor="middle" class="t">The complete life of hero-v7-avif at the edge</text><g stroke="#b9c9d8"><rect x="30" y="90" width="200" height="115" rx="17" fill="#fff"/><rect x="265" y="90" width="200" height="115" rx="17" fill="#eef4ff"/><rect x="500" y="90" width="200" height="115" rx="17" fill="#eef4ff"/><rect x="735" y="90" width="200" height="115" rx="17" fill="#edf8f6"/><rect x="970" y="90" width="200" height="115" rx="17" fill="#f3effb"/><rect x="970" y="390" width="200" height="115" rx="17" fill="#fff8e7"/><rect x="735" y="390" width="200" height="115" rx="17" fill="#edf8f6"/><rect x="500" y="390" width="200" height="115" rx="17" fill="#fceff1"/><rect x="265" y="390" width="200" height="115" rx="17" fill="#eef4ff"/><rect x="30" y="390" width="200" height="115" rx="17" fill="#fff"/></g><g text-anchor="middle"><text x="130" y="122" class="h">1 · Route R1</text><text x="130" y="153" class="c">Anycast → London</text><text x="130" y="181" class="b">new connection</text><text x="365" y="122" class="h">2 · Canonical key</text><text x="365" y="153" class="c">hero|1200|avif</text><text x="365" y="181" class="b">tenant isolated</text><text x="600" y="122" class="h">3 · Place</text><text x="600" y="153" class="c">hash → E3</text><text x="600" y="181" class="b">memory + disk miss</text><text x="835" y="122" class="h">4 · Collapse</text><text x="835" y="153" class="c">1 leader + waiters</text><text x="835" y="181" class="b">shield miss</text><text x="1070" y="122" class="h">5 · Fill v7</text><text x="1070" y="153" class="c">origin 200</text><text x="1070" y="181" class="b">stream + store</text><text x="1070" y="422" class="h">6 · Fresh hits</text><text x="1070" y="453" class="c">Age &lt; 600</text><text x="1070" y="481" class="b">origin bypassed</text><text x="835" y="422" class="h">7 · Revalidate</text><text x="835" y="453" class="c">ETag → 304</text><text x="835" y="481" class="b">reuse old body</text><text x="600" y="422" class="h">8 · Purge 9821</text><text x="600" y="453" class="c">v7 unusable</text><text x="600" y="481" class="b">block old fill</text><text x="365" y="422" class="h">9 · Fetch v8</text><text x="365" y="453" class="c">new 200 + ETag</text><text x="365" y="481" class="b">publish corrected</text><text x="130" y="422" class="h">10 · Fail over</text><text x="130" y="453" class="c">E3 / London fail</text><text x="130" y="481" class="b">remap + reconnect</text></g><path d="M230 147H265M465 147H500M700 147H735M935 147H970M1070 205V390M970 447H935M735 447H700M500 447H465M265 447H230" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="90" y="575" width="1020" height="110" rx="20" fill="#17324d"/><text x="600" y="608" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#fff">Routing → identity → placement → hierarchy → time → invalidation → failure</text><text x="600" y="642" text-anchor="middle" font-family="monospace" font-size="13" fill="#fff">the right byte · nearby · reused only while policy permits</text><text x="600" y="670" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dce5ed">every transition is observable and bounded</text><text x="600" y="725" text-anchor="middle" class="b">The origin sees only misses, replacements, and validation—not reader-scale demand</text></svg>
