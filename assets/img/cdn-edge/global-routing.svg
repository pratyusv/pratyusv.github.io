<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>DNS and Anycast CDN routing</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style></defs><rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">DNS chooses an address; routing chooses a reachable PoP</text><rect x="55" y="100" width="245" height="135" rx="18" fill="#fff" stroke="#b9c9d8"/><text x="177" y="140" text-anchor="middle" class="h">Reader R1</text><text x="177" y="174" text-anchor="middle" class="c">media.atlas.example</text><text x="177" y="205" text-anchor="middle" class="b">London network</text><rect x="450" y="90" width="300" height="155" rx="18" fill="#fff8e7" stroke="#d6a63f"/><text x="600" y="130" text-anchor="middle" class="h">Authoritative DNS policy</text><text x="600" y="164" text-anchor="middle" class="b">health · capacity · resolver region</text><text x="600" y="200" text-anchor="middle" class="c">203.0.113.80 · TTL 60</text><path d="M300 150H450" stroke="#2f6fdd" stroke-width="3" marker-end="url(#a)"/><path d="M450 210H300" stroke="#2f6fdd" stroke-width="3" marker-end="url(#a)"/><text x="600" y="305" text-anchor="middle" class="h">Same service address advertised from three sites</text><g><rect x="75" y="390" width="280" height="145" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><rect x="460" y="390" width="280" height="145" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="845" y="390" width="280" height="145" rx="20" fill="#eef4ff" stroke="#7399dc"/></g><text x="215" y="430" text-anchor="middle" class="h">London PoP</text><text x="215" y="465" text-anchor="middle" class="c">route preferred</text><text x="215" y="500" text-anchor="middle" class="b">selected by topology/policy</text><text x="600" y="430" text-anchor="middle" class="h">Amsterdam PoP</text><text x="600" y="465" text-anchor="middle" class="c">same IP</text><text x="600" y="500" text-anchor="middle" class="b">standby route for R1</text><text x="985" y="430" text-anchor="middle" class="h">Paris PoP</text><text x="985" y="465" text-anchor="middle" class="c">same IP</text><text x="985" y="500" text-anchor="middle" class="b">another valid route</text><path d="M177 235C177 315 215 330 215 390" stroke="#3b9f8a" stroke-width="5" marker-end="url(#a)"/><text x="600" y="605" text-anchor="middle" class="b">Routing nearness is not guaranteed to equal geographic or latency nearness</text></svg>
