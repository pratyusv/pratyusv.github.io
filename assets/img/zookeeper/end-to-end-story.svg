<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
  <title id="title">Complete Orchard ZooKeeper coordination story</title><desc id="desc">A worker opens a session, registers, triggers discovery, becomes controller, loses its session, is replaced, and has a stale command rejected by fencing.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.n{font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#fff}</style></defs>
  <rect width="1200" height="730" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">The story is one chain of ordered ownership transitions</text>
  <g fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"><path d="M205 150H275"/><path d="M500 150H570"/><path d="M795 150H865"/><path d="M975 210V285"/><path d="M865 350H795"/><path d="M570 350H500"/><path d="M275 350H205"/><path d="M130 415V495"/><path d="M205 560H275"/><path d="M500 560H570"/><path d="M795 560H865"/></g>
  <g filter="url(#s)"><rect x="40" y="95" width="165" height="110" rx="18" fill="#fff" stroke="#b9c9d8"/><rect x="275" y="95" width="225" height="110" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="570" y="95" width="225" height="110" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="865" y="95" width="220" height="115" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="865" y="285" width="220" height="130" rx="18" fill="#fff4dd" stroke="#e2a63b"/><rect x="570" y="295" width="225" height="110" rx="18" fill="#fff" stroke="#b9c9d8"/><rect x="275" y="295" width="225" height="110" rx="18" fill="#fff" stroke="#b9c9d8"/><rect x="40" y="295" width="165" height="120" rx="18" fill="#fdf3f2" stroke="#d96b63"/><rect x="40" y="495" width="165" height="130" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="275" y="505" width="225" height="110" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="570" y="505" width="225" height="110" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="865" y="505" width="220" height="110" rx="18" fill="#17324d"/></g>
  <g text-anchor="middle"><text x="122" y="129" class="h">1 · Session</text><text x="122" y="158" class="b">session 61 via Z4</text><text x="122" y="183" class="b">payments-3</text><text x="387" y="129" class="h">2 · Register</text><text x="387" y="158" class="b">ephemeral sequential</text><text x="387" y="183" class="b">worker-...42</text><text x="682" y="129" class="h">3 · Zab commit</text><text x="682" y="158" class="b">zxid (7,42)</text><text x="682" y="183" class="b">durable quorum</text><text x="975" y="129" class="h">4 · Watch + refresh</text><text x="975" y="158" class="b">checkout learns worker</text><text x="975" y="183" class="b">re-arms watch</text><text x="975" y="320" class="h">5 · Election</text><text x="975" y="349" class="b">candidate-...17 smallest</text><text x="975" y="375" class="b">controller token 87</text><text x="682" y="329" class="h">6 · Partition</text><text x="682" y="358" class="b">client DISCONNECTED</text><text x="682" y="383" class="b">old process still runs</text><text x="387" y="329" class="h">7 · Expiration</text><text x="387" y="358" class="b">session 61 invalid</text><text x="387" y="383" class="b">ephemerals deleted</text><text x="122" y="329" class="h">8 · Successor wakes</text><text x="122" y="358" class="b">candidate 18 rechecks</text><text x="122" y="383" class="b">becomes controller</text><text x="122" y="529" class="h">9 · New token</text><text x="122" y="558" class="b">controller token 92</text><text x="122" y="583" class="b">established at ledger</text><text x="387" y="539" class="h">10 · Delayed old work</text><text x="387" y="568" class="b">token 87 reaches ledger</text><text x="682" y="539" class="h">11 · Fence</text><text x="682" y="568" class="b">87 &lt; 92 → reject</text></g>
  <text x="975" y="543" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fff">12 · Rejoin safely</text><text x="975" y="573" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#dce5ed">new session · new claims</text>
  <rect x="255" y="665" width="690" height="42" rx="18" fill="#17324d"/><text x="600" y="692" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fff">Ordered metadata becomes safe ownership only when the resource checks the order</text>
