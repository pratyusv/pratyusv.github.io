<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">ZooKeeper predecessor-watch leader election</title><desc id="desc">Four ephemeral sequential candidates are ordered by suffix. The smallest is leader, and every later candidate watches only its immediate predecessor to avoid the herd effect.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs>
  <rect width="1200" height="670" rx="24" fill="#f7fafc"/><text x="600" y="47" text-anchor="middle" class="t">One predecessor wakes per departure</text>
  <text x="600" y="97" text-anchor="middle" class="c">/orchard/election</text><path d="M600 112V165" stroke="#b9c9d8" stroke-width="3"/>
  <g filter="url(#s)"><rect x="55" y="190" width="240" height="135" rx="20" fill="#17324d"/><rect x="340" y="190" width="240" height="135" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="625" y="190" width="240" height="135" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="910" y="190" width="240" height="135" rx="20" fill="#eef4ff" stroke="#7399dc"/></g>
  <text x="175" y="230" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" fill="#fff">candidate-...17</text><text x="175" y="260" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fff">CONTROLLER</text><text x="175" y="290" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#dce5ed">payments-3</text>
  <g text-anchor="middle"><text x="460" y="230" class="c">candidate-...18</text><text x="460" y="260" class="h">payments-7</text><text x="460" y="290" class="b">watches 17</text><text x="745" y="230" class="c">candidate-...19</text><text x="745" y="260" class="h">payments-9</text><text x="745" y="290" class="b">watches 18</text><text x="1030" y="230" class="c">candidate-...20</text><text x="1030" y="260" class="h">payments-12</text><text x="1030" y="290" class="b">watches 19</text></g>
  <g fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"><path d="M340 350H295V310"/><path d="M625 380H580V310"/><path d="M910 410H865V310"/></g>
  <path d="M175 325V450" stroke="#d96b63" stroke-width="3" stroke-dasharray="8 6"/><rect x="70" y="450" width="210" height="80" rx="17" fill="#fdf3f2" stroke="#d96b63"/><text x="175" y="483" text-anchor="middle" class="h">session 61 expires</text><text x="175" y="509" text-anchor="middle" class="b">candidate 17 deleted</text>
  <path d="M280 490H430" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="430" y="450" width="330" height="80" rx="17" fill="#edf8f6" stroke="#5ab5a4"/><text x="595" y="482" text-anchor="middle" class="h">Only candidate 18 wakes</text><text x="595" y="509" text-anchor="middle" class="b">re-list → verify smallest → lead</text>
  <rect x="230" y="580" width="740" height="53" rx="18" fill="#17324d"/><text x="600" y="613" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#fff">Watching the leader wakes everyone; watching predecessors avoids the herd</text>
</svg>
