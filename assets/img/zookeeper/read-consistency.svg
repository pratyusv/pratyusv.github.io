<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">ZooKeeper locally served reads and staleness</title><desc id="desc">A write is committed at zxid 42. One follower has applied it and returns the new worker list while a lagging follower still returns state through zxid 41 before catching up.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs>
  <rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="47" text-anchor="middle" class="t">Linearizable writes do not make every local read linearizable</text>
  <rect x="390" y="90" width="420" height="85" rx="19" fill="#17324d" filter="url(#s)"/><text x="600" y="123" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" fill="#fff">zxid (7,42) committed</text><text x="600" y="150" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#dce5ed">payments-3 registration is globally ordered</text>
  <g filter="url(#s)"><rect x="80" y="270" width="310" height="170" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><rect x="810" y="270" width="310" height="170" rx="20" fill="#fff4dd" stroke="#e2a63b"/></g>
  <g text-anchor="middle"><text x="235" y="309" class="h">Follower Z1</text><text x="235" y="339" class="c">applied through (7,42)</text><text x="235" y="376" class="b">local read returns</text><text x="235" y="404" class="c">[worker-41, 42, 43]</text><text x="965" y="309" class="h">Follower Z5</text><text x="965" y="339" class="c">applied through (7,41)</text><text x="965" y="376" class="b">local read can briefly return</text><text x="965" y="404" class="c">[worker-41, 43]</text></g>
  <g stroke="#55728f" stroke-width="3" marker-end="url(#a)"><path d="M500 175L300 270"/><path d="M700 175L900 270" stroke-dasharray="8 6"/></g>
  <path d="M810 475H390" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><text x="600" y="463" text-anchor="middle" class="b">Z5 later applies (7,42) in the same global order</text>
  <rect x="215" y="545" width="770" height="77" rx="20" fill="#17324d"/><text x="600" y="576" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#fff">Clients preserve program order; different clients may briefly see different prefixes</text><text x="600" y="603" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#dce5ed">reads are sequentially consistent and may be stale</text>
</svg>
