<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">ZooKeeper election with external fencing</title><desc id="desc">An old controller is partitioned from ZooKeeper but can still reach the ledger. A new controller establishes a larger fencing token, so the ledger rejects the old controller's delayed request.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs>
  <rect width="1200" height="690" rx="24" fill="#f7fafc"/><text x="600" y="47" text-anchor="middle" class="t">Election changes ownership; fencing stops the old owner</text>
  <rect x="65" y="135" width="280" height="170" rx="21" fill="#fdf3f2" stroke="#d96b63" stroke-width="2" filter="url(#s)"/><text x="205" y="176" text-anchor="middle" class="h">payments-3 · old controller</text><text x="205" y="209" text-anchor="middle" class="b">partitioned from ZooKeeper</text><text x="205" y="238" text-anchor="middle" class="b">still running delayed work</text><rect x="125" y="260" width="160" height="33" rx="9" fill="#fff"/><text x="205" y="282" text-anchor="middle" class="c">token = 87</text>
  <rect x="65" y="405" width="280" height="170" rx="21" fill="#edf8f6" stroke="#5ab5a4" stroke-width="2" filter="url(#s)"/><text x="205" y="446" text-anchor="middle" class="h">payments-7 · new controller</text><text x="205" y="479" text-anchor="middle" class="b">predecessor disappeared</text><text x="205" y="508" text-anchor="middle" class="b">rechecked election order</text><rect x="125" y="530" width="160" height="33" rx="9" fill="#fff"/><text x="205" y="552" text-anchor="middle" class="c">token = 92</text>
  <rect x="455" y="210" width="280" height="285" rx="22" fill="#eef4ff" stroke="#7399dc" stroke-width="2" filter="url(#s)"/><text x="595" y="250" text-anchor="middle" class="h">ZooKeeper ensemble</text><text x="595" y="292" text-anchor="middle" class="b">expire session 61</text><text x="595" y="326" text-anchor="middle" class="b">delete candidate 17</text><text x="595" y="360" text-anchor="middle" class="b">candidate 18 becomes smallest</text><text x="595" y="407" text-anchor="middle" class="c">czxid → ordered token</text>
  <path d="M345 450L455 395" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><path d="M455 270L345 245" stroke="#d96b63" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="855" y="235" width="290" height="235" rx="22" fill="#fff" stroke="#b9c9d8" filter="url(#s)"/><text x="1000" y="275" text-anchor="middle" class="h">Ledger fencing gate</text><text x="1000" y="314" text-anchor="middle" class="c">greatestToken = 92</text><rect x="900" y="345" width="200" height="42" rx="10" fill="#edf8f6" stroke="#5ab5a4"/><text x="1000" y="372" text-anchor="middle" class="c">92 → ACCEPT</text><rect x="900" y="405" width="200" height="42" rx="10" fill="#fdf3f2" stroke="#d96b63"/><text x="1000" y="432" text-anchor="middle" class="c">87 → REJECT</text>
  <path d="M345 500C560 610 780 570 900 447" fill="none" stroke="#3b9f8a" stroke-width="3" marker-end="url(#a)"/><path d="M345 205C560 90 780 130 900 345" fill="none" stroke="#d96b63" stroke-width="3" marker-end="url(#a)"/>
  <rect x="275" y="620" width="650" height="46" rx="18" fill="#17324d"/><text x="600" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#fff">The protected resource—not ZooKeeper—enforces the token</text>
</svg>
