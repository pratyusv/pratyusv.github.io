<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ZooKeeper failure boundaries and outcomes</title><desc id="desc">Four panels distinguish server connection loss, client session expiration, ensemble minority isolation, and a stale application controller reaching an external resource.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs>
  <rect width="1200" height="700" rx="24" fill="#f7fafc"/><text x="600" y="47" text-anchor="middle" class="t">Different failures cross different correctness boundaries</text>
  <g filter="url(#s)"><rect x="55" y="100" width="520" height="235" rx="22" fill="#fff" stroke="#b9c9d8"/><rect x="625" y="100" width="520" height="235" rx="22" fill="#fff" stroke="#b9c9d8"/><rect x="55" y="385" width="520" height="235" rx="22" fill="#fff" stroke="#b9c9d8"/><rect x="625" y="385" width="520" height="235" rx="22" fill="#fff" stroke="#b9c9d8"/></g>
  <circle cx="120" cy="170" r="32" fill="#e2a63b"/><text x="120" y="176" text-anchor="middle" class="c">1</text><text x="175" y="155" class="h">Connected server fails</text><text x="175" y="184" class="b">client reconnects the same session</text><text x="95" y="237" class="c">ephemerals survive</text><text x="95" y="270" class="c">re-read after reconnect</text><rect x="95" y="295" width="240" height="25" rx="12" fill="#edf8f6"/><text x="215" y="312" text-anchor="middle" class="b">recoverable connection event</text>
  <circle cx="690" cy="170" r="32" fill="#d96b63"/><text x="690" y="176" text-anchor="middle" class="c">2</text><text x="745" y="155" class="h">Client session expires</text><text x="745" y="184" class="b">ensemble deletes ephemerals</text><text x="665" y="237" class="c">old session cannot return</text><text x="665" y="270" class="c">create new session + state</text><rect x="665" y="295" width="240" height="25" rx="12" fill="#fdf3f2"/><text x="785" y="312" text-anchor="middle" class="b">ownership is lost</text>
  <circle cx="120" cy="455" r="32" fill="#2f6fdd"/><text x="120" y="461" text-anchor="middle" class="c">3</text><text x="175" y="440" class="h">Two of five voters isolated</text><text x="175" y="469" class="b">minority cannot elect or commit</text><text x="95" y="522" class="c">majority side continues</text><text x="95" y="555" class="c">histories cannot fork</text><rect x="95" y="580" width="240" height="25" rx="12" fill="#eef4ff"/><text x="215" y="597" text-anchor="middle" class="b">quorum boundary</text>
  <circle cx="690" cy="455" r="32" fill="#3b9f8a"/><text x="690" y="461" text-anchor="middle" class="c">4</text><text x="745" y="440" class="h">Old controller reaches ledger</text><text x="745" y="469" class="b">process outlives election claim</text><text x="665" y="522" class="c">old token 87 rejected</text><text x="665" y="555" class="c">new token 92 accepted</text><rect x="665" y="580" width="240" height="25" rx="12" fill="#edf8f6"/><text x="785" y="597" text-anchor="middle" class="b">external fencing boundary</text>
  <rect x="270" y="648" width="660" height="37" rx="18" fill="#17324d"/><text x="600" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fff">Connection, session, quorum, and resource ownership are not synonyms</text>
</svg>
