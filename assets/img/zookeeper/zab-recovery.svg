<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Zab leader recovery</title><desc id="desc">After a leader fails, the new quorum preserves committed zxid 42, removes uncommitted zxid 43, synchronizes histories, and begins a higher epoch at zxid 8 comma 1.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs>
  <rect width="1200" height="690" rx="24" fill="#f7fafc"/><text x="600" y="47" text-anchor="middle" class="t">A new leader reconciles the stream before proposing again</text>
  <rect x="55" y="100" width="330" height="450" rx="22" fill="#fff" stroke="#b9c9d8" filter="url(#s)"/><text x="220" y="140" text-anchor="middle" class="h">Before Z2 crashes · epoch 7</text>
  <g><rect x="95" y="185" width="250" height="65" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="220" y="212" text-anchor="middle" class="c">(7,41) COMMITTED</text><text x="220" y="234" text-anchor="middle" class="b">applied everywhere</text><rect x="95" y="275" width="250" height="65" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="220" y="302" text-anchor="middle" class="c">(7,42) QUORUM ACK</text><text x="220" y="324" text-anchor="middle" class="b">must be preserved</text><rect x="95" y="365" width="250" height="65" rx="14" fill="#fdf3f2" stroke="#d96b63"/><text x="220" y="392" text-anchor="middle" class="c">(7,43) PARTIAL</text><text x="220" y="414" text-anchor="middle" class="b">unsafe suffix</text></g>
  <path d="M385 325H475" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/>
  <rect x="475" y="165" width="250" height="320" rx="22" fill="#eef4ff" stroke="#7399dc" filter="url(#s)"/><text x="600" y="205" text-anchor="middle" class="h">Leader activation</text><text x="600" y="250" text-anchor="middle" class="b">1 · elect from freshest history</text><text x="600" y="290" text-anchor="middle" class="b">2 · discover committed prefix</text><text x="600" y="330" text-anchor="middle" class="b">3 · sync / truncate followers</text><text x="600" y="370" text-anchor="middle" class="b">4 · establish new epoch</text><text x="600" y="430" text-anchor="middle" class="c">quorum histories agree</text>
  <path d="M725 325H815" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/>
  <rect x="815" y="100" width="330" height="450" rx="22" fill="#fff" stroke="#b9c9d8" filter="url(#s)"/><text x="980" y="140" text-anchor="middle" class="h">New leader active · epoch 8</text><rect x="855" y="190" width="250" height="65" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="980" y="217" text-anchor="middle" class="c">(7,41) COMMITTED</text><text x="980" y="239" text-anchor="middle" class="b">common prefix</text><rect x="855" y="280" width="250" height="65" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="980" y="307" text-anchor="middle" class="c">(7,42) COMMITTED</text><text x="980" y="329" text-anchor="middle" class="b">recovered from quorum</text><rect x="855" y="390" width="250" height="65" rx="14" fill="#17324d"/><text x="980" y="417" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#fff">(8,1) NEW WRITE</text><text x="980" y="439" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#dce5ed">higher epoch</text>
  <rect x="240" y="600" width="720" height="55" rx="18" fill="#17324d"/><text x="600" y="634" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#fff">Committed prefix survives · uncommitted suffix does not become history</text>
</svg>
