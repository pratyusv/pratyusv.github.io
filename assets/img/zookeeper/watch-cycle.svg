<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">ZooKeeper watch refresh cycle</title><desc id="desc">A client reads children while installing a one-shot watch. A worker create commits, ZooKeeper sends a notification, and the client reads again while installing the next watch.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs>
  <rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="47" text-anchor="middle" class="t">A watch is a prompt to re-read—not a stream of state</text>
  <circle cx="600" cy="350" r="235" fill="#fff" stroke="#b9c9d8" stroke-width="3" stroke-dasharray="9 7"/>
  <g filter="url(#s)"><rect x="470" y="80" width="260" height="100" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="825" y="280" width="285" height="115" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="455" y="510" width="290" height="110" rx="18" fill="#fff4dd" stroke="#e2a63b"/><rect x="90" y="280" width="275" height="115" rx="18" fill="#fdf3f2" stroke="#d96b63"/></g>
  <g text-anchor="middle"><text x="600" y="116" class="h">1 · Read + install watch</text><text x="600" y="145" class="c">getChildren(/workers, watch)</text><text x="967" y="320" class="h">2 · Mutation commits</text><text x="967" y="349" class="c">create worker-...42</text><text x="967" y="375" class="b">parent child list changes</text><text x="600" y="548" class="h">3 · One notification</text><text x="600" y="577" class="c">NodeChildrenChanged</text><text x="227" y="320" class="h">4 · Re-read + re-arm</text><text x="227" y="349" class="b">replace local snapshot</text><text x="227" y="375" class="b">install next watch</text></g>
  <g fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"><path d="M730 130C900 145 970 205 970 280"/><path d="M967 395C920 490 825 550 745 563"/><path d="M455 565C305 550 225 475 225 395"/><path d="M225 280C260 175 360 130 470 130"/></g>
  <rect x="365" y="300" width="470" height="100" rx="20" fill="#17324d"/><text x="600" y="337" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#fff">Events may coalesce between reads</text><text x="600" y="369" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#dce5ed">state snapshot is authoritative · callback count is not</text>
</svg>
