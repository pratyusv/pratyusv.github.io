<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">ZooKeeper ensemble roles and quorum</title><desc id="desc">Five voting servers include one leader and four followers. Three votes form a quorum. An observer serves clients but does not vote.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.n{font:700 17px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#fff}</style></defs>
  <rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="47" text-anchor="middle" class="t">Five voters require any three—not every server</text>
  <ellipse cx="465" cy="335" rx="385" ry="245" fill="#fff" stroke="#b9c9d8" stroke-width="2" stroke-dasharray="9 7"/><text x="465" y="112" text-anchor="middle" class="h">Voting participants</text>
  <g filter="url(#s)"><rect x="350" y="140" width="230" height="105" rx="19" fill="#17324d"/><rect x="105" y="285" width="210" height="100" rx="19" fill="#eef4ff" stroke="#7399dc"/><rect x="615" y="285" width="210" height="100" rx="19" fill="#eef4ff" stroke="#7399dc"/><rect x="190" y="455" width="210" height="100" rx="19" fill="#eef4ff" stroke="#7399dc"/><rect x="530" y="455" width="210" height="100" rx="19" fill="#eef4ff" stroke="#7399dc"/><rect x="925" y="285" width="220" height="110" rx="19" fill="#edf8f6" stroke="#5ab5a4"/></g>
  <text x="465" y="182" text-anchor="middle" class="n">Z2 · LEADER</text><text x="465" y="214" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#dce5ed">orders writes</text>
  <g text-anchor="middle"><text x="210" y="325" class="h">Z1 · follower</text><text x="210" y="354" class="b">votes + persists</text><text x="720" y="325" class="h">Z3 · follower</text><text x="720" y="354" class="b">votes + persists</text><text x="295" y="495" class="h">Z4 · follower</text><text x="295" y="524" class="b">votes + persists</text><text x="635" y="495" class="h">Z5 · follower</text><text x="635" y="524" class="b">votes + persists</text><text x="1035" y="327" class="h">Observer O1</text><text x="1035" y="356" class="b">replicates + serves reads</text><text x="1035" y="380" class="b">does not vote</text></g>
  <g stroke="#55728f" stroke-width="2"><path d="M400 245L270 285M530 245L660 285M420 245L325 455M510 245L605 455"/></g>
  <rect x="820" y="500" width="325" height="102" rx="18" fill="#17324d"/><text x="982" y="537" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" fill="#fff">quorum(5) = 3</text><text x="982" y="568" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#dce5ed">survives any two voter failures</text>
</svg>
