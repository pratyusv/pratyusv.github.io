<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
  <title id="title">ZooKeeper Zab write path</title><desc id="desc">A client write reaches a follower, is forwarded to the leader, proposed with a zxid, durably acknowledged by a quorum, committed, applied, and returned to the client.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}.lane{stroke:#b9c9d8;stroke-width:2;stroke-dasharray:7 7}.msg{stroke:#55728f;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="730" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">One registration becomes a globally ordered transaction</text>
  <g text-anchor="middle"><text x="105" y="92" class="h">payments-3</text><text x="310" y="92" class="h">Z4 · connected follower</text><text x="585" y="92" class="h">Z2 · leader</text><text x="830" y="92" class="h">Z1 · follower</text><text x="1060" y="92" class="h">Z3 · follower</text></g>
  <g class="lane"><path d="M105 110V665"/><path d="M310 110V665"/><path d="M585 110V665"/><path d="M830 110V665"/><path d="M1060 110V665"/></g>
  <path d="M105 150H310" class="msg"/><text x="207" y="140" text-anchor="middle" class="c">create EPHEMERAL|SEQUENTIAL</text><path d="M310 210H585" class="msg"/><text x="447" y="200" text-anchor="middle" class="b">forward write</text>
  <rect x="500" y="235" width="170" height="62" rx="14" fill="#17324d"/><text x="585" y="260" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#fff">assign zxid (7,42)</text><text x="585" y="280" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#dce5ed">append own log</text>
  <path d="M585 325H310" class="msg"/><path d="M585 345H830" class="msg"/><path d="M585 365H1060" class="msg"/><text x="695" y="319" class="c">PROPOSAL (7,42)</text>
  <rect x="735" y="390" width="190" height="52" rx="13" fill="#fff4dd" stroke="#e2a63b"/><text x="830" y="422" text-anchor="middle" class="c">persist transaction log</text><rect x="965" y="390" width="190" height="52" rx="13" fill="#fff4dd" stroke="#e2a63b"/><text x="1060" y="422" text-anchor="middle" class="c">persist transaction log</text>
  <path d="M830 465H585" class="msg"/><path d="M1060 485H585" class="msg"/><text x="710" y="458" class="c">ACK</text><text x="940" y="479" class="c">ACK</text>
  <rect x="495" y="505" width="180" height="58" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="585" y="530" text-anchor="middle" class="h">quorum reached</text><text x="585" y="551" text-anchor="middle" class="c">COMMIT (7,42)</text>
  <g class="msg"><path d="M585 590H310"/><path d="M585 610H830"/><path d="M585 630H1060"/></g><text x="440" y="583" class="b">commit + ordered apply</text><path d="M310 655H105" class="msg"/><text x="207" y="647" text-anchor="middle" class="c">worker-0000000042</text>
  <rect x="420" y="675" width="360" height="35" rx="17" fill="#17324d"/><text x="600" y="698" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#fff">Observer acknowledgements never count toward quorum</text>
</svg>
