<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">The Orchard system and ZooKeeper coordination plane</title><desc id="desc">Checkout services discover payment workers through ZooKeeper. Workers register, elect a controller, and use fencing tokens when updating the ledger.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}.box{fill:#fff;stroke:#b9c9d8;stroke-width:2}</style></defs>
  <rect width="1200" height="700" rx="24" fill="#f7fafc"/><text x="600" y="47" text-anchor="middle" class="t">One coordination story connects every ZooKeeper primitive</text>
  <rect x="50" y="130" width="245" height="140" rx="20" class="box" filter="url(#s)"/><text x="172" y="170" text-anchor="middle" class="h">Checkout services</text><text x="172" y="202" text-anchor="middle" class="b">discover live workers</text><text x="172" y="230" text-anchor="middle" class="b">watch membership</text>
  <rect x="50" y="395" width="245" height="140" rx="20" class="box" filter="url(#s)"/><text x="172" y="435" text-anchor="middle" class="h">Payment workers</text><text x="172" y="467" text-anchor="middle" class="b">ephemeral registration</text><text x="172" y="495" text-anchor="middle" class="b">controller election</text>
  <rect x="430" y="155" width="340" height="350" rx="25" fill="#eef4ff" stroke="#7399dc" stroke-width="2" filter="url(#s)"/><text x="600" y="197" text-anchor="middle" class="h">ZooKeeper ensemble</text><text x="600" y="230" text-anchor="middle" class="b">replicated coordination namespace</text><rect x="475" y="267" width="250" height="48" rx="10" fill="#fff" stroke="#b9c9d8"/><text x="600" y="297" text-anchor="middle" class="c">/orchard/workers</text><rect x="475" y="330" width="250" height="48" rx="10" fill="#fff" stroke="#b9c9d8"/><text x="600" y="360" text-anchor="middle" class="c">/orchard/election</text><rect x="475" y="393" width="250" height="48" rx="10" fill="#fff" stroke="#b9c9d8"/><text x="600" y="423" text-anchor="middle" class="c">/orchard/config</text><text x="600" y="473" text-anchor="middle" class="b">Zab · sessions · watches · zxids</text>
  <rect x="905" y="240" width="245" height="180" rx="20" fill="#edf8f6" stroke="#5ab5a4" stroke-width="2" filter="url(#s)"/><text x="1027" y="282" text-anchor="middle" class="h">Payment ledger</text><text x="1027" y="318" text-anchor="middle" class="b">accepts newest controller</text><rect x="950" y="348" width="155" height="42" rx="9" fill="#17324d"/><text x="1027" y="375" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#fff">fencing token</text>
  <g fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"><path d="M295 195H430"/><path d="M295 455H430"/><path d="M770 330H905"/></g><text x="362" y="180" text-anchor="middle" class="b">read + watch</text><text x="362" y="440" text-anchor="middle" class="b">create + session</text><text x="837" y="313" text-anchor="middle" class="b">ordered token</text>
  <rect x="220" y="590" width="760" height="62" rx="20" fill="#17324d"/><text x="600" y="617" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#fff">ZooKeeper coordinates metadata; payment traffic never flows through it</text><text x="600" y="640" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#dce5ed">control plane ≠ application data plane</text>
</svg>
