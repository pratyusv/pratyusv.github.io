<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">ZooKeeper session lifecycle</title><desc id="desc">A client connects through one server, disconnects, reconnects the same session through another server before timeout, then later disconnects past timeout and its ephemeral znodes are deleted.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs>
  <rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="47" text-anchor="middle" class="t">A connection can move; an expired session can never return</text>
  <path d="M180 260H390M470 260H680M760 260H970" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="45" y="185" width="180" height="150" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><rect x="300" y="185" width="180" height="150" rx="20" fill="#fff4dd" stroke="#e2a63b"/><rect x="590" y="185" width="180" height="150" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><rect x="880" y="185" width="265" height="150" rx="20" fill="#fdf3f2" stroke="#d96b63"/></g>
  <g text-anchor="middle"><text x="135" y="224" class="h">CONNECTED</text><text x="135" y="255" class="c">session 61 via Z4</text><text x="135" y="284" class="b">ephemeral exists</text><text x="390" y="224" class="h">DISCONNECTED</text><text x="390" y="255" class="b">TCP path lost</text><text x="390" y="284" class="b">session may still live</text><text x="680" y="224" class="h">RECONNECTED</text><text x="680" y="255" class="c">session 61 via Z1</text><text x="680" y="284" class="b">ephemeral survives</text><text x="1012" y="224" class="h">EXPIRED</text><text x="1012" y="255" class="b">ensemble hears nothing past timeout</text><text x="1012" y="284" class="b">session 61 is permanently invalid</text></g>
  <rect x="885" y="400" width="255" height="115" rx="18" fill="#17324d"/><text x="1012" y="437" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#fff">Replicated cleanup</text><text x="1012" y="468" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#dce5ed">delete ephemerals</text><text x="1012" y="493" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#dce5ed">trigger watches</text><path d="M1012 335V400" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/>
  <rect x="80" y="555" width="730" height="65" rx="19" fill="#17324d"/><text x="445" y="583" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#fff">Reconnect before timeout → same logical session</text><text x="445" y="607" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#dce5ed">disconnect is uncertainty, not proof of ownership loss</text>
</svg>
