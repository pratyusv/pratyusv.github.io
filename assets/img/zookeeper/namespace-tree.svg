<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Orchard ZooKeeper namespace</title><desc id="desc">The Orchard root contains persistent config, ephemeral sequential worker registrations, and ephemeral sequential election candidates.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}.box{fill:#fff;stroke:#b9c9d8;stroke-width:2}</style></defs>
  <rect width="1200" height="700" rx="24" fill="#f7fafc"/><text x="600" y="47" text-anchor="middle" class="t">One namespace carries configuration, membership, and election state</text>
  <g stroke="#b9c9d8" stroke-width="3" fill="none"><path d="M600 145V205H215V270M600 205V270M600 205H985V270"/><path d="M215 345V405H110V470M215 405V470M215 405H320V470"/><path d="M985 345V405H880V470M985 405V470M985 405H1090V470"/></g>
  <g filter="url(#s)"><rect x="485" y="85" width="230" height="60" rx="15" fill="#17324d"/><rect x="110" y="270" width="210" height="75" rx="16" class="box"/><rect x="495" y="270" width="210" height="75" rx="16" fill="#eef4ff" stroke="#7399dc"/><rect x="880" y="270" width="210" height="75" rx="16" fill="#fff4dd" stroke="#e2a63b"/><rect x="20" y="470" width="180" height="75" rx="15" class="box"/><rect x="220" y="470" width="180" height="75" rx="15" fill="#edf8f6" stroke="#5ab5a4"/><rect x="420" y="470" width="180" height="75" rx="15" class="box"/><rect x="790" y="470" width="180" height="75" rx="15" fill="#edf8f6" stroke="#5ab5a4"/><rect x="990" y="470" width="180" height="75" rx="15" class="box"/></g>
  <text x="600" y="123" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" fill="#fff">/orchard</text>
  <g text-anchor="middle"><text x="215" y="300" class="h">/workers</text><text x="215" y="326" class="b">persistent parent</text><text x="600" y="300" class="h">/config</text><text x="600" y="326" class="b">persistent data</text><text x="985" y="300" class="h">/election</text><text x="985" y="326" class="b">persistent parent</text><text x="110" y="499" class="c">worker-...41</text><text x="110" y="525" class="b">ephemeral sequential</text><text x="310" y="499" class="c">worker-...42</text><text x="310" y="525" class="b">payments-3</text><text x="510" y="499" class="c">worker-...43</text><text x="510" y="525" class="b">ephemeral sequential</text><text x="880" y="499" class="c">candidate-...17</text><text x="880" y="525" class="b">current controller</text><text x="1080" y="499" class="c">candidate-...18</text><text x="1080" y="525" class="b">watches predecessor</text></g>
  <rect x="250" y="600" width="700" height="58" rx="18" fill="#17324d"/><text x="600" y="635" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#fff">Persistent paths hold intent; ephemeral paths represent session-owned claims</text>
</svg>
