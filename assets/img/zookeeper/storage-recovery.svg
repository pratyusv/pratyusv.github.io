<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">ZooKeeper transaction log, snapshots, and recovery</title><desc id="desc">Committed proposals append to a transaction log and update the in-memory data tree. Periodic snapshots plus later log entries recover a restarted follower, which then catches up from the leader.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs>
  <rect width="1200" height="690" rx="24" fill="#f7fafc"/><text x="600" y="47" text-anchor="middle" class="t">Snapshot establishes a base; transaction replay completes the history</text>
  <rect x="55" y="115" width="205" height="95" rx="18" fill="#eef4ff" stroke="#7399dc" filter="url(#s)"/><text x="157" y="153" text-anchor="middle" class="h">Zab proposal</text><text x="157" y="181" text-anchor="middle" class="c">zxid (7,42)</text>
  <path d="M260 162H365" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><path d="M312 162V365H365" fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/>
  <rect x="365" y="105" width="285" height="120" rx="20" fill="#fff4dd" stroke="#e2a63b" filter="url(#s)"/><text x="507" y="145" text-anchor="middle" class="h">Transaction log</text><text x="507" y="176" text-anchor="middle" class="b">durable ordered proposals</text><text x="507" y="202" text-anchor="middle" class="b">fsync on write path</text>
  <rect x="365" y="315" width="285" height="120" rx="20" fill="#edf8f6" stroke="#5ab5a4" filter="url(#s)"/><text x="507" y="355" text-anchor="middle" class="h">In-memory data tree</text><text x="507" y="386" text-anchor="middle" class="b">apply committed zxids</text><text x="507" y="412" text-anchor="middle" class="b">serves local reads</text>
  <path d="M650 375H760" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><text x="705" y="358" text-anchor="middle" class="b">periodic snapshot</text>
  <rect x="760" y="305" width="330" height="140" rx="20" fill="#fff" stroke="#b9c9d8" filter="url(#s)"/><text x="925" y="345" text-anchor="middle" class="h">Snapshot N</text><text x="925" y="377" text-anchor="middle" class="c">data tree through base zxid</text><text x="925" y="407" text-anchor="middle" class="b">paired with later log entries</text>
  <rect x="155" y="520" width="890" height="100" rx="20" fill="#17324d"/><text x="600" y="554" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#fff">Follower restart</text><text x="600" y="583" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#dce5ed">load snapshot → replay later transaction log → synchronize missing suffix from leader</text><text x="600" y="606" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#dce5ed">then serve and vote normally</text>
</svg>
