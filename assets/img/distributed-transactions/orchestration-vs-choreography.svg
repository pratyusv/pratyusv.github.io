<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540"><title>Saga orchestration and choreography</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="540" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Coordination is centralized in state or distributed through events</text><rect x="55" y="100" width="500" height="360" rx="22" fill="#eef4ff" stroke="#7399dc"/><text x="305" y="140" text-anchor="middle" class="h">Orchestration</text><rect x="190" y="180" width="230" height="90" rx="16" fill="#fff"/><text x="305" y="215" text-anchor="middle" class="h">Saga state machine</text><text x="305" y="245" text-anchor="middle" class="c">step + retry + deadline</text><text x="305" y="330" text-anchor="middle" class="c">commands → services</text><text x="305" y="390" text-anchor="middle" class="b">one inspectable workflow</text><rect x="645" y="100" width="500" height="360" rx="22" fill="#fff8e7" stroke="#d6a63f"/><text x="895" y="140" text-anchor="middle" class="h">Choreography</text><text x="895" y="210" text-anchor="middle" class="c">OrderCreated → Inventory</text><text x="895" y="270" text-anchor="middle" class="c">Reserved → Payment</text><text x="895" y="330" text-anchor="middle" class="c">Authorized → Order</text><text x="895" y="390" text-anchor="middle" class="b">workflow encoded in subscriptions</text><text x="600" y="510" text-anchor="middle" class="b">No central caller does not mean no coordination</text></svg>
