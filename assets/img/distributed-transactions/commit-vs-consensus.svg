<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" role="img"><title>Two-phase commit versus consensus</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="570" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Commit asks permission from all; consensus chooses with a quorum</text><rect x="55" y="100" width="500" height="390" rx="22" fill="#fff8e7" stroke="#d6a63f"/><text x="305" y="145" text-anchor="middle" class="h">Classical 2PC</text><text x="105" y="210" class="c">YES + YES + YES → COMMIT</text><text x="105" y="265" class="c">any NO          → ABORT</text><text x="105" y="320" class="c">coordinator lost → may block</text><text x="305" y="405" text-anchor="middle" class="b">every participant must be able to commit</text><rect x="645" y="100" width="500" height="390" rx="22" fill="#eef4ff" stroke="#7399dc"/><text x="895" y="145" text-anchor="middle" class="h">Consensus</text><text x="695" y="210" class="c">proposals → quorum chooses value</text><text x="695" y="265" class="c">leader can change</text><text x="695" y="320" class="c">progress with configured quorum</text><text x="895" y="405" text-anchor="middle" class="b">can replicate the commit decision</text><rect x="340" y="515" width="520" height="40" rx="12" fill="#17324d"/><text x="600" y="541" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">Consensus does not make an unprepared participant commit-capable</text></svg>
