<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540"><title>Saga compensation path</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 15px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="540" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Failure runs new transactions in reverse dependency order</text><rect x="55" y="115" width="250" height="120" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="365" y="115" width="250" height="120" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="675" y="115" width="250" height="120" rx="18" fill="#fceff1" stroke="#d96b79"/><text x="180" y="155" text-anchor="middle" class="h">Order PENDING</text><text x="180" y="195" text-anchor="middle" class="c">committed</text><text x="490" y="155" text-anchor="middle" class="h">Stock reserved</text><text x="490" y="195" text-anchor="middle" class="c">r-742</text><text x="800" y="155" text-anchor="middle" class="h">Payment FAILED</text><text x="800" y="195" text-anchor="middle" class="c">pivot not crossed</text><path d="M305 175H365M615 175H675" stroke="#55728f" stroke-width="4"/><rect x="365" y="330" width="250" height="120" rx="18" fill="#fff8e7" stroke="#d6a63f"/><rect x="55" y="330" width="250" height="120" rx="18" fill="#fff8e7" stroke="#d6a63f"/><text x="490" y="370" text-anchor="middle" class="h">C2 Release r-742</text><text x="490" y="410" text-anchor="middle" class="b">new local transaction</text><text x="180" y="370" text-anchor="middle" class="h">C1 Cancel order</text><text x="180" y="410" text-anchor="middle" class="b">history remains</text><path d="M800 235L540 330M365 390H305" stroke="#d96b79" stroke-width="4"/><text x="900" y="390" class="b">Compensation is not rollback:</text><text x="900" y="425" class="b">it can fail, retry, and be observed.</text><text x="600" y="510" text-anchor="middle" class="b">Target the exact effect identity; never blindly reverse a counter</text></svg>
