<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" role="img"><title>Local and distributed commit boundaries</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">One database owns one commit; services own separate commits</text><rect x="55" y="100" width="480" height="360" rx="22" fill="#edf8f6" stroke="#5ab5a4"/><text x="295" y="140" text-anchor="middle" class="h">Local transaction</text><rect x="105" y="185" width="380" height="190" rx="18" fill="#fff" stroke="#5ab5a4"/><text x="295" y="225" text-anchor="middle" class="c">Order + Inventory + Payment tables</text><text x="295" y="275" text-anchor="middle" class="c">one WAL · one lock manager</text><text x="295" y="325" text-anchor="middle" class="h">COMMIT</text><text x="295" y="415" text-anchor="middle" class="b">storage engine decides atomically</text><rect x="665" y="100" width="480" height="360" rx="22" fill="#fceff1" stroke="#d96b79"/><text x="905" y="140" text-anchor="middle" class="h">Distributed services</text><g fill="#fff" stroke="#d96b79"><rect x="705" y="185" width="120" height="150" rx="16"/><rect x="845" y="185" width="120" height="150" rx="16"/><rect x="985" y="185" width="120" height="150" rx="16"/></g><text x="765" y="225" text-anchor="middle" class="h">Order</text><text x="765" y="275" text-anchor="middle" class="c">commit A</text><text x="905" y="225" text-anchor="middle" class="h">Stock</text><text x="905" y="275" text-anchor="middle" class="c">commit B</text><text x="1045" y="225" text-anchor="middle" class="h">Pay</text><text x="1045" y="275" text-anchor="middle" class="c">commit C</text><text x="905" y="415" text-anchor="middle" class="b">a protocol must connect the outcomes</text><text x="600" y="520" text-anchor="middle" class="b">Do not distribute a transaction when one database is the simpler correct boundary</text></svg>
