<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" role="img"><title>Two-phase commit abort</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">One NO vote makes global commit impossible</text><g><rect x="55" y="120" width="250" height="130" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="355" y="120" width="250" height="130" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="655" y="120" width="250" height="130" rx="18" fill="#fceff1" stroke="#d96b79"/></g><text x="180" y="160" text-anchor="middle" class="h">OrderDB</text><text x="180" y="205" text-anchor="middle" class="c">YES · prepared</text><text x="480" y="160" text-anchor="middle" class="h">InventoryDB</text><text x="480" y="205" text-anchor="middle" class="c">YES · prepared</text><text x="780" y="160" text-anchor="middle" class="h">PaymentDB</text><text x="780" y="205" text-anchor="middle" class="c">NO · card rejected</text><rect x="955" y="105" width="200" height="160" rx="20" fill="#eef4ff" stroke="#7399dc"/><text x="1055" y="150" text-anchor="middle" class="h">Coordinator</text><text x="1055" y="195" text-anchor="middle" class="c">force ABORT</text><text x="1055" y="230" text-anchor="middle" class="b">one decision</text><path d="M905 185H955" stroke="#d96b79" stroke-width="4"/><rect x="200" y="350" width="800" height="110" rx="20" fill="#fceff1" stroke="#d96b79"/><text x="600" y="390" text-anchor="middle" class="h">ABORT tx-742 to every participant</text><text x="600" y="430" text-anchor="middle" class="c">rollback tentative work · release locks · remember decision</text><path d="M1055 265L820 350M1055 265L600 350M1055 265L380 350" stroke="#d96b79" stroke-width="3"/><text x="600" y="520" text-anchor="middle" class="b">Timeout before successful prepare can lead to abort; timeout cannot reverse durable commit</text></svg>
