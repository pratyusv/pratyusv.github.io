<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" role="img"><title>Checkout invariants</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Protocol choice follows invariant timing</text><g><rect x="55" y="105" width="335" height="360" rx="20" fill="#fceff1" stroke="#d96b79"/><rect x="432" y="105" width="335" height="360" rx="20" fill="#fff8e7" stroke="#d6a63f"/><rect x="810" y="105" width="335" height="360" rx="20" fill="#edf8f6" stroke="#5ab5a4"/></g><text x="222" y="145" text-anchor="middle" class="h">Must never break</text><text x="90" y="205" class="c">stock available ≥ 0</text><text x="90" y="250" class="c">one key → one order</text><text x="90" y="315" class="b">enforce inside local write</text><text x="600" y="145" text-anchor="middle" class="h">May be temporarily pending</text><text x="470" y="205" class="c">order exists</text><text x="470" y="250" class="c">payment not final</text><text x="470" y="315" class="b">do not expose CONFIRMED</text><text x="977" y="145" text-anchor="middle" class="h">Must eventually repair</text><text x="850" y="205" class="c">failed order</text><text x="850" y="250" class="c">reservation released</text><text x="850" y="315" class="b">retry + compensation</text><text x="600" y="520" text-anchor="middle" class="b">Safety, intermediate visibility, and eventual recovery are different requirements</text></svg>
