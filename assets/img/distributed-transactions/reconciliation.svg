<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520"><title>Transaction reconciliation loop</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Reconciliation compares intended and observed truth</text><rect x="55" y="135" width="300" height="230" rx="20" fill="#eef4ff" stroke="#7399dc"/><text x="205" y="175" text-anchor="middle" class="h">Intended state</text><text x="100" y="230" class="c">ord-742 CONFIRMED</text><text x="100" y="280" class="c">pay-88 expected OK</text><text x="100" y="330" class="c">r-742 expected ACTIVE</text><rect x="455" y="105" width="290" height="290" rx="22" fill="#fff8e7" stroke="#d6a63f"/><text x="600" y="150" text-anchor="middle" class="h">Reconciler</text><text x="600" y="210" text-anchor="middle" class="c">query by stable IDs</text><text x="600" y="260" text-anchor="middle" class="c">classify mismatch</text><text x="600" y="310" text-anchor="middle" class="c">repair / compensate</text><text x="600" y="355" text-anchor="middle" class="b">or escalate</text><rect x="845" y="135" width="300" height="230" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="995" y="175" text-anchor="middle" class="h">Observed state</text><text x="890" y="230" class="c">provider pay-88 OK</text><text x="890" y="280" class="c">reservation exists</text><text x="890" y="330" class="c">events consumed</text><path d="M355 250H455M745 250H845" stroke="#55728f" stroke-width="4"/><text x="600" y="465" text-anchor="middle" class="b">External uncertainty becomes durable work, not a second blind side effect</text></svg>
