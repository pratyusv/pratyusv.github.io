<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500"><title>Checkout saga forward path</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 15px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="500" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">A saga exposes durable intermediate states</text><g fill="#edf8f6" stroke="#5ab5a4"><rect x="35" y="170" width="240" height="130" rx="18"/><rect x="330" y="170" width="240" height="130" rx="18"/><rect x="625" y="170" width="240" height="130" rx="18"/><rect x="920" y="170" width="240" height="130" rx="18"/></g><g text-anchor="middle"><text x="155" y="210" class="h">T1 Create order</text><text x="155" y="255" class="c">PENDING</text><text x="450" y="210" class="h">T2 Reserve</text><text x="450" y="255" class="c">r-742 ACTIVE</text><text x="745" y="210" class="h">T3 Authorize</text><text x="745" y="255" class="c">pay-88 OK</text><text x="1040" y="210" class="h">T4 Confirm</text><text x="1040" y="255" class="c">CONFIRMED</text></g><path d="M275 235H330M570 235H625M865 235H920" stroke="#55728f" stroke-width="4"/><text x="600" y="390" text-anchor="middle" class="b">Each box commits locally; failure moves to retry or compensation</text><text x="600" y="445" text-anchor="middle" class="b">PENDING must never be presented as CONFIRMED</text></svg>
