<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" role="img"><title>Database and message double write</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Either ordering leaves a crash gap</text><rect x="55" y="100" width="500" height="370" rx="22" fill="#fceff1" stroke="#d96b79"/><text x="305" y="140" text-anchor="middle" class="h">Database first</text><text x="135" y="220" class="c">1 · COMMIT order</text><text x="135" y="320" class="c">2 · publish event</text><line x1="295" y1="230" x2="295" y2="305" stroke="#d96b79" stroke-width="5" stroke-dasharray="8 6"/><text x="315" y="275" class="h">CRASH</text><text x="305" y="400" text-anchor="middle" class="b">real order · missing event</text><rect x="645" y="100" width="500" height="370" rx="22" fill="#fff8e7" stroke="#d6a63f"/><text x="895" y="140" text-anchor="middle" class="h">Message first</text><text x="725" y="220" class="c">1 · publish event</text><text x="725" y="320" class="c">2 · COMMIT order</text><line x1="885" y1="230" x2="885" y2="305" stroke="#d96b79" stroke-width="5" stroke-dasharray="8 6"/><text x="905" y="275" class="h">CRASH</text><text x="895" y="400" text-anchor="middle" class="b">event visible · order absent</text><rect x="300" y="495" width="600" height="42" rx="12" fill="#17324d"/><text x="600" y="522" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">Retries move the problem to duplicate effects; they do not close the gap</text></svg>
