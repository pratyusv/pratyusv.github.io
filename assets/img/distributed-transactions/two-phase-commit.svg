<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" role="img"><title>Successful two-phase commit</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 15px sans-serif;fill:#17324d}.b{font:12px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="650" rx="24" fill="#f7fafc"/><text x="600" y="42" text-anchor="middle" class="t">All durable YES votes precede one durable COMMIT decision</text><g class="h" text-anchor="middle"><text x="150" y="95">Coordinator</text><text x="450" y="95">OrderDB</text><text x="750" y="95">InventoryDB</text><text x="1050" y="95">PaymentDB</text></g><g stroke="#b9c9d8" stroke-width="2"><line x1="150" y1="115" x2="150" y2="590"/><line x1="450" y1="115" x2="450" y2="590"/><line x1="750" y1="115" x2="750" y2="590"/><line x1="1050" y1="115" x2="1050" y2="590"/></g><text x="40" y="165" class="h">Phase 1</text><path d="M150 150H1050" stroke="#2f6fdd" stroke-width="3"/><text x="600" y="140" text-anchor="middle" class="c">PREPARE tx-742</text><rect x="395" y="190" width="110" height="65" rx="12" fill="#fff8e7"/><rect x="695" y="190" width="110" height="65" rx="12" fill="#fff8e7"/><rect x="995" y="190" width="110" height="65" rx="12" fill="#fff8e7"/><text x="450" y="218" text-anchor="middle" class="c">PREPARED</text><text x="750" y="218" text-anchor="middle" class="c">PREPARED</text><text x="1050" y="218" text-anchor="middle" class="c">PREPARED</text><path d="M450 285H150M750 310H150M1050 335H150" stroke="#3b9f8a" stroke-width="3"/><text x="275" y="275" class="c">YES</text><text x="150" y="390" text-anchor="middle" class="c">force COMMIT log</text><text x="40" y="465" class="h">Phase 2</text><path d="M150 450H1050" stroke="#3b9f8a" stroke-width="4"/><text x="600" y="440" text-anchor="middle" class="c">COMMIT tx-742</text><g class="c" text-anchor="middle"><text x="450" y="510">COMMITTED</text><text x="750" y="510">COMMITTED</text><text x="1050" y="510">COMMITTED</text></g><text x="600" y="620" text-anchor="middle" class="b">Decision delivery can repeat; the durable decision never changes</text></svg>
