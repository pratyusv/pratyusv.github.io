<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500"><title>Outbox relay duplicate race</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="500" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Publish success can be followed by relay failure</text><rect x="55" y="150" width="250" height="140" rx="20" fill="#eef4ff" stroke="#7399dc"/><text x="180" y="190" text-anchor="middle" class="h">Outbox evt-901</text><text x="180" y="235" text-anchor="middle" class="c">unsent</text><rect x="465" y="115" width="270" height="210" rx="20" fill="#fff8e7" stroke="#d6a63f"/><text x="600" y="155" text-anchor="middle" class="h">Relay</text><text x="600" y="205" text-anchor="middle" class="c">1 · publish succeeds</text><text x="600" y="250" text-anchor="middle" class="c">2 · CRASH</text><text x="600" y="292" text-anchor="middle" class="b">progress not recorded</text><rect x="895" y="150" width="250" height="140" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="1020" y="190" text-anchor="middle" class="h">Broker</text><text x="1020" y="235" text-anchor="middle" class="c">evt-901 accepted</text><path d="M305 220H465M735 220H895" stroke="#55728f" stroke-width="4"/><path d="M600 325C600 410 1020 410 1020 290" fill="none" stroke="#d96b79" stroke-width="4"/><text x="810" y="430" text-anchor="middle" class="c">restart → publish evt-901 again</text><text x="600" y="475" text-anchor="middle" class="b">Stable event identity moves correctness to consumer deduplication</text></svg>
