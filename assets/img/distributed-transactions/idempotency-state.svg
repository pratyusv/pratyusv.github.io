<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520"><title>Idempotency state machine</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Concurrent retries share one durable operation record</text><rect x="45" y="170" width="240" height="140" rx="20" fill="#fff" stroke="#b9c9d8"/><text x="165" y="210" text-anchor="middle" class="h">Requests R1, R2, R3</text><text x="165" y="250" text-anchor="middle" class="c">key chk-9f2</text><text x="165" y="285" text-anchor="middle" class="b">same request hash</text><rect x="410" y="115" width="350" height="250" rx="22" fill="#fff8e7" stroke="#d6a63f"/><text x="585" y="155" text-anchor="middle" class="h">Idempotency row</text><text x="455" y="205" class="c">IN_PROGRESS → SUCCEEDED</text><text x="455" y="250" class="c">resource = ord-742</text><text x="455" y="295" class="c">response = HTTP 201</text><text x="585" y="335" text-anchor="middle" class="b">one request owns execution</text><rect x="900" y="170" width="245" height="140" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="1022" y="210" text-anchor="middle" class="h">All retries</text><text x="1022" y="250" text-anchor="middle" class="c">same saved result</text><text x="1022" y="285" text-anchor="middle" class="b">mismatch → conflict</text><path d="M285 240H410M760 240H900" stroke="#55728f" stroke-width="4"/><text x="600" y="465" text-anchor="middle" class="b">Retention must exceed every possible retry horizon</text></svg>
