<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520"><title>Saga concurrency control</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">A late compensation must not overwrite newer work</text><rect x="55" y="130" width="290" height="220" rx="20" fill="#eef4ff" stroke="#7399dc"/><text x="200" y="170" text-anchor="middle" class="h">Saga ord-742</text><text x="200" y="220" text-anchor="middle" class="c">reserve r-742</text><text x="200" y="265" text-anchor="middle" class="c">version 8</text><text x="200" y="310" text-anchor="middle" class="b">later compensates</text><rect x="455" y="130" width="290" height="220" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="600" y="170" text-anchor="middle" class="h">Concurrent workflow</text><text x="600" y="220" text-anchor="middle" class="c">state advances</text><text x="600" y="265" text-anchor="middle" class="c">version 9</text><text x="600" y="310" text-anchor="middle" class="b">newer legitimate state</text><rect x="855" y="130" width="290" height="220" rx="20" fill="#fceff1" stroke="#d96b79"/><text x="1000" y="170" text-anchor="middle" class="h">Stale compensation</text><text x="1000" y="220" text-anchor="middle" class="c">WHERE version = 8</text><text x="1000" y="265" text-anchor="middle" class="c">0 rows updated</text><text x="1000" y="310" text-anchor="middle" class="b">reject + reconcile</text><path d="M345 240H455M745 240H855" stroke="#55728f" stroke-width="4"/><text x="600" y="440" text-anchor="middle" class="b">Use reservation identity, versions, and valid-state transitions</text></svg>
