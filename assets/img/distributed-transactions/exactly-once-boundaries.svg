<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520"><title>Exactly once boundaries</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Exactly once ends where the transactional boundary ends</text><rect x="55" y="105" width="500" height="300" rx="22" fill="#edf8f6" stroke="#5ab5a4"/><text x="305" y="150" text-anchor="middle" class="h">Controlled local boundary</text><text x="105" y="215" class="c">inbox unique event ID</text><text x="105" y="265" class="c">+ business mutation</text><text x="105" y="315" class="c">+ one database COMMIT</text><text x="305" y="370" text-anchor="middle" class="b">one local effect</text><rect x="645" y="105" width="500" height="300" rx="22" fill="#fceff1" stroke="#d96b79"/><text x="895" y="150" text-anchor="middle" class="h">Outside boundary</text><text x="695" y="215" class="c">payment provider</text><text x="695" y="265" class="c">email · shipment</text><text x="695" y="315" class="c">timed-out client</text><text x="895" y="370" text-anchor="middle" class="b">idempotency + reconciliation</text><text x="600" y="470" text-anchor="middle" class="b">Always name the scope, identity retention, and failure assumptions</text></svg>
