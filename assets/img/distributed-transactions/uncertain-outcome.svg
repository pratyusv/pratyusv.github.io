<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" role="img"><title>Uncertain transaction outcome after lost reply</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">A timeout says what the caller knows—not what committed</text><rect x="55" y="190" width="250" height="130" rx="20" fill="#fff" stroke="#b9c9d8"/><text x="180" y="230" text-anchor="middle" class="h">Client C7</text><text x="180" y="270" text-anchor="middle" class="c">POST chk-9f2</text><rect x="465" y="120" width="300" height="270" rx="22" fill="#edf8f6" stroke="#5ab5a4"/><text x="615" y="160" text-anchor="middle" class="h">Checkout committed</text><text x="615" y="210" text-anchor="middle" class="c">ord-742 CONFIRMED</text><text x="615" y="255" text-anchor="middle" class="c">payment authorized</text><text x="615" y="300" text-anchor="middle" class="c">saved response</text><text x="615" y="350" text-anchor="middle" class="b">success is durable</text><path d="M305 250H465" stroke="#3b9f8a" stroke-width="4"/><path d="M465 325H305" stroke="#d96b79" stroke-width="4" stroke-dasharray="8 6"/><text x="385" y="355" text-anchor="middle" class="b">reply lost</text><rect x="900" y="190" width="245" height="130" rx="20" fill="#fff8e7" stroke="#d6a63f"/><text x="1022" y="230" text-anchor="middle" class="h">Client observes</text><text x="1022" y="270" text-anchor="middle" class="c">TIMEOUT</text><text x="1022" y="300" text-anchor="middle" class="b">outcome unknown</text><rect x="280" y="450" width="640" height="55" rx="14" fill="#17324d"/><text x="600" y="483" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">Retry chk-9f2 → return saved outcome; never create a new charge</text></svg>
