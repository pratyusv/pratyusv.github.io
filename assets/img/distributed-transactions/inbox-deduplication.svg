<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520"><title>Inbox consumer deduplication</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Inbox claim and business effect share one local transaction</text><rect x="55" y="175" width="220" height="125" rx="18" fill="#fff8e7" stroke="#d6a63f"/><text x="165" y="215" text-anchor="middle" class="h">Broker delivery</text><text x="165" y="260" text-anchor="middle" class="c">evt-901 × 2</text><rect x="395" y="105" width="500" height="280" rx="22" fill="#eef4ff" stroke="#7399dc"/><text x="645" y="145" text-anchor="middle" class="h">InventoryDB COMMIT</text><text x="445" y="210" class="c">INSERT inbox(evt-901)</text><text x="445" y="255" class="c">INSERT reservation(r-742)</text><text x="445" y="315" class="b">duplicate inbox key → no second effect</text><rect x="980" y="175" width="165" height="125" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><text x="1062" y="215" text-anchor="middle" class="h">ACK</text><text x="1062" y="260" text-anchor="middle" class="b">after commit</text><path d="M275 237H395M895 237H980" stroke="#55728f" stroke-width="4"/><text x="600" y="455" text-anchor="middle" class="b">Crash before ACK causes harmless redelivery; retention must cover replay horizon</text></svg>
