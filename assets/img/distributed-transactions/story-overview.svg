<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" role="img"><title>Distributed checkout overview</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">One checkout crosses three independent commit boundaries</text><rect x="45" y="175" width="220" height="145" rx="20" fill="#fff" stroke="#b9c9d8"/><text x="155" y="215" text-anchor="middle" class="h">Checkout chk-9f2</text><text x="155" y="252" text-anchor="middle" class="c">ord-742 · £899</text><text x="155" y="288" text-anchor="middle" class="b">one business outcome</text><g><rect x="355" y="100" width="250" height="125" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="355" y="265" width="250" height="125" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="355" y="430" width="250" height="105" rx="18" fill="#fff8e7" stroke="#d6a63f"/></g><text x="480" y="140" text-anchor="middle" class="h">OrderDB</text><text x="480" y="178" text-anchor="middle" class="c">create ord-742</text><text x="480" y="305" text-anchor="middle" class="h">InventoryDB</text><text x="480" y="343" text-anchor="middle" class="c">reserve camera-31</text><text x="480" y="468" text-anchor="middle" class="h">PaymentDB</text><text x="480" y="505" text-anchor="middle" class="c">authorize £899</text><rect x="760" y="155" width="390" height="210" rx="22" fill="#17324d"/><text x="955" y="200" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">Two possible contracts</text><text x="955" y="245" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff">2PC: one atomic decision</text><text x="955" y="290" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff">Saga: local commits + compensation</text><text x="955" y="335" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dce5ed">both require durable identity and recovery</text><path d="M265 245L355 160M265 250H355M265 255L355 475M605 245H760" stroke="#55728f" stroke-width="3"/></svg>
