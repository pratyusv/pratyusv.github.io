<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Two-phase commit coordinator failover</title><desc id="d">A new coordinator leader recovers the last committed decision and either aborts an undecided transaction or redelivers the durable decision.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 26px system-ui;fill:#17324d}.h{font:700 16px system-ui;fill:#17324d}.b{font:13px system-ui;fill:#45627d}.w{font:700 14px system-ui;fill:#fff}</style></defs><rect width="1200" height="620" rx="26" fill="#f7fafc"/><text x="600" y="48" text-anchor="middle" class="t">Failover follows the committed log; it never invents an outcome</text><rect x="50" y="115" width="300" height="330" rx="20" fill="#fff8e8" stroke="#e4b85b"/><text x="200" y="153" text-anchor="middle" class="h">Committed prefix A</text><text x="200" y="190" text-anchor="middle" class="b">BEGIN · three YES votes</text><text x="200" y="216" text-anchor="middle" class="b">no durable decision</text><path d="M200 245V295" stroke="#55728f" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="95" y="305" width="210" height="88" rx="13" fill="#fff" stroke="#d9c083"/><text x="200" y="340" text-anchor="middle" class="h">New leader records ABORT</text><text x="200" y="367" text-anchor="middle" class="b">then releases participants</text><rect x="450" y="115" width="300" height="330" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="600" y="153" text-anchor="middle" class="h">Committed prefix B</text><text x="600" y="190" text-anchor="middle" class="b">BEGIN · three YES votes</text><text x="600" y="216" text-anchor="middle" class="b">DECISION COMMIT</text><path d="M600 245V295" stroke="#55728f" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="495" y="305" width="210" height="88" rx="13" fill="#fff" stroke="#8fcabb"/><text x="600" y="340" text-anchor="middle" class="h">Redeliver COMMIT</text><text x="600" y="367" text-anchor="middle" class="b">outcome cannot change</text><rect x="850" y="115" width="300" height="330" rx="20" fill="#fff0f0" stroke="#d86969"/><text x="1000" y="153" text-anchor="middle" class="h">No quorum</text><text x="1000" y="190" text-anchor="middle" class="b">committed prefix unavailable</text><text x="1000" y="216" text-anchor="middle" class="b">participants remain PREPARED</text><path d="M1000 245V295" stroke="#d86969" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="895" y="305" width="210" height="88" rx="13" fill="#fff" stroke="#d86969"/><text x="1000" y="340" text-anchor="middle" class="h">Block safely</text><text x="1000" y="367" text-anchor="middle" class="b">do not guess commit or abort</text><rect x="155" y="510" width="890" height="58" rx="14" fill="#17324d"/><text x="600" y="545" text-anchor="middle" class="w">Replication removes a process failure; quorum loss preserves 2PC's honest blocking boundary.</text></svg>
