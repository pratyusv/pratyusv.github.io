<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" role="img"><title>Two-phase commit coordinator failure</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Prepared participants cannot infer a missing decision</text><rect x="455" y="90" width="290" height="120" rx="20" fill="#fceff1" stroke="#d96b79"/><text x="600" y="130" text-anchor="middle" class="h">Coordinator crashed</text><text x="600" y="170" text-anchor="middle" class="c">decision unavailable</text><g><rect x="55" y="330" width="300" height="145" rx="20" fill="#fff8e7" stroke="#d6a63f"/><rect x="450" y="330" width="300" height="145" rx="20" fill="#fff8e7" stroke="#d6a63f"/><rect x="845" y="330" width="300" height="145" rx="20" fill="#fff8e7" stroke="#d6a63f"/></g><text x="205" y="370" text-anchor="middle" class="h">OrderDB</text><text x="205" y="410" text-anchor="middle" class="c">PREPARED · locks held</text><text x="205" y="445" text-anchor="middle" class="b">commit? abort? unknown</text><text x="600" y="370" text-anchor="middle" class="h">InventoryDB</text><text x="600" y="410" text-anchor="middle" class="c">PREPARED · locks held</text><text x="600" y="445" text-anchor="middle" class="b">must wait/query</text><text x="995" y="370" text-anchor="middle" class="h">PaymentDB</text><text x="995" y="410" text-anchor="middle" class="c">PREPARED · locks held</text><text x="995" y="445" text-anchor="middle" class="b">must not guess</text><path d="M540 210L205 330M600 210V330M660 210L995 330" stroke="#d96b79" stroke-width="3" stroke-dasharray="8 6"/><rect x="330" y="505" width="540" height="40" rx="12" fill="#17324d"/><text x="600" y="531" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">Timeout detects blocking; it does not reveal the outcome</text></svg>
