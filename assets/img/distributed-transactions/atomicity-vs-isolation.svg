<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" role="img"><title>Atomic commit versus isolation</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Atomicity chooses all-or-nothing; isolation controls interleaving</text><rect x="55" y="105" width="500" height="360" rx="22" fill="#eef4ff" stroke="#7399dc"/><text x="305" y="150" text-anchor="middle" class="h">2PC atomic commit</text><text x="100" y="215" class="c">tx-742: Order + Stock + Pay</text><text x="100" y="265" class="c">outcome: all COMMIT or all ABORT</text><text x="305" y="350" text-anchor="middle" class="b">answers one transaction's outcome</text><rect x="645" y="105" width="500" height="360" rx="22" fill="#edf8f6" stroke="#5ab5a4"/><text x="895" y="150" text-anchor="middle" class="h">Concurrency control</text><text x="690" y="215" class="c">tx-742 reads last camera</text><text x="690" y="265" class="c">tx-743 reads last camera</text><text x="690" y="315" class="c">who may reserve it?</text><text x="895" y="390" text-anchor="middle" class="b">locks/version/serializable rule needed</text><text x="600" y="520" text-anchor="middle" class="b">Two phases in 2PC are unrelated to the two phases in two-phase locking</text></svg>
