<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" role="img"><title>Two-phase commit recovery rules</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="600" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Recovery interprets durable records, then repeats safe actions</text><g><rect x="55" y="100" width="520" height="390" rx="22" fill="#eef4ff" stroke="#7399dc"/><rect x="625" y="100" width="520" height="390" rx="22" fill="#fff8e7" stroke="#d6a63f"/></g><text x="315" y="140" text-anchor="middle" class="h">Coordinator recovery</text><text x="95" y="200" class="c">no decision       → record ABORT</text><text x="95" y="255" class="c">COMMIT record     → resend COMMIT</text><text x="95" y="310" class="c">ABORT record      → resend ABORT</text><text x="95" y="385" class="b">retain decision until participants</text><text x="95" y="415" class="b">can recover it safely</text><text x="885" y="140" text-anchor="middle" class="h">Participant recovery</text><text x="665" y="200" class="c">no prepare        → abort local</text><text x="665" y="255" class="c">PREPARED only     → query + wait</text><text x="665" y="310" class="c">COMMIT record     → redo commit</text><text x="665" y="365" class="c">ABORT record      → finish undo</text><text x="665" y="430" class="b">duplicate decisions are idempotent</text><rect x="290" y="525" width="620" height="42" rx="12" fill="#17324d"/><text x="600" y="552" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">Durable log state—not memory or timeout—is recovery evidence</text></svg>
