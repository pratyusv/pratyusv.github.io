<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" role="img"><title>Two-phase commit participant states</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Prepared means durable, locked, and unable to decide alone</text><g><rect x="55" y="205" width="220" height="120" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="395" y="180" width="260" height="170" rx="20" fill="#fff8e7" stroke="#d6a63f"/><rect x="810" y="105" width="250" height="120" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="810" y="340" width="250" height="120" rx="18" fill="#fceff1" stroke="#d96b79"/></g><text x="165" y="250" text-anchor="middle" class="h">ACTIVE</text><text x="165" y="285" text-anchor="middle" class="b">local work tentative</text><text x="525" y="225" text-anchor="middle" class="h">PREPARED</text><text x="525" y="265" text-anchor="middle" class="c">force log + hold locks</text><text x="525" y="305" text-anchor="middle" class="b">promises ability to commit</text><text x="935" y="150" text-anchor="middle" class="h">COMMITTED</text><text x="935" y="185" text-anchor="middle" class="b">make changes final</text><text x="935" y="385" text-anchor="middle" class="h">ABORTED</text><text x="935" y="420" text-anchor="middle" class="b">undo + release</text><path d="M275 265H395M655 225L810 165M655 305L810 400" stroke="#55728f" stroke-width="4"/><text x="335" y="245" class="c">YES</text><text x="720" y="180" class="c">COMMIT</text><text x="720" y="385" class="c">ABORT</text><text x="600" y="520" text-anchor="middle" class="b">A prepared participant survives restart but waits for the global outcome</text></svg>
