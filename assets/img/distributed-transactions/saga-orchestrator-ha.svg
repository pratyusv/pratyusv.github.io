<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d"><title id="t">Highly available saga orchestrator</title><desc id="d">Several saga workers claim versioned workflow state from a replicated store and send idempotent commands to services.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 26px system-ui;fill:#17324d}.h{font:700 16px system-ui;fill:#17324d}.b{font:13px system-ui;fill:#45627d}.s{font:12px system-ui;fill:#45627d}.w{font:700 14px system-ui;fill:#fff}</style></defs><rect width="1200" height="660" rx="26" fill="#f7fafc"/><text x="600" y="48" text-anchor="middle" class="t">Saga workers are replaceable because workflow state is durable and versioned</text><rect x="45" y="140" width="240" height="360" rx="20" fill="#f3effb" stroke="#9377c6"/><text x="165" y="178" text-anchor="middle" class="h">Orchestrator workers</text><rect x="85" y="220" width="160" height="65" rx="12" fill="#17324d"/><text x="165" y="259" text-anchor="middle" class="w">W1 · current claim</text><rect x="85" y="320" width="160" height="65" rx="12" fill="#fff" stroke="#9377c6"/><text x="165" y="359" text-anchor="middle" class="b">W2 · standby</text><rect x="85" y="420" width="160" height="45" rx="10" fill="#fff" stroke="#9377c6"/><text x="165" y="448" text-anchor="middle" class="s">workers are stateless</text><rect x="375" y="140" width="350" height="360" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="550" y="178" text-anchor="middle" class="h">Replicated workflow store</text><rect x="420" y="220" width="260" height="150" rx="14" fill="#fff" stroke="#8fcabb"/><text x="550" y="255" text-anchor="middle" class="h">ord-742 @ version 6</text><text x="550" y="286" text-anchor="middle" class="b">state PAYMENT_PENDING</text><text x="550" y="312" text-anchor="middle" class="b">step ID pay-88</text><text x="550" y="338" text-anchor="middle" class="s">claim W1 · lease/term 19</text><text x="550" y="422" text-anchor="middle" class="b">CAS v6 → v7 allows one advance</text><path d="M285 300H375" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="815" y="140" width="340" height="360" rx="20" fill="#fff8e8" stroke="#e4b85b"/><text x="985" y="178" text-anchor="middle" class="h">Participant services</text><rect x="860" y="220" width="250" height="95" rx="14" fill="#fff" stroke="#d9c083"/><text x="985" y="254" text-anchor="middle" class="h">Payment</text><text x="985" y="282" text-anchor="middle" class="b">deduplicate command pay-88</text><rect x="860" y="355" width="250" height="95" rx="14" fill="#fff" stroke="#d9c083"/><text x="985" y="389" text-anchor="middle" class="h">Inventory</text><text x="985" y="417" text-anchor="middle" class="b">versioned reservation r-742</text><path d="M725 300H815" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="135" y="555" width="930" height="58" rx="14" fill="#17324d"/><text x="600" y="590" text-anchor="middle" class="w">After worker failure, the replacement retries the same step ID from the last committed workflow version.</text></svg>
