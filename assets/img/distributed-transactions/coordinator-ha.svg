<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Highly available two-phase commit coordinator</title><desc id="d">Stateless coordinator APIs route a transaction to one quorum-replicated decision-log shard whose leader drives all participants.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 26px system-ui;fill:#17324d}.h{font:700 17px system-ui;fill:#17324d}.b{font:14px system-ui;fill:#45627d}.s{font:12px system-ui;fill:#45627d}.w{font:700 15px system-ui;fill:#fff}</style></defs><rect width="1200" height="680" rx="26" fill="#f7fafc"/><text x="600" y="48" text-anchor="middle" class="t">One transaction decision, replicated without creating two deciders</text><rect x="40" y="210" width="180" height="105" rx="15" fill="#fff8e8" stroke="#e4b85b"/><text x="130" y="248" text-anchor="middle" class="h">Checkout API</text><text x="130" y="277" text-anchor="middle" class="b">tx-742</text><rect x="280" y="130" width="200" height="270" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="380" y="168" text-anchor="middle" class="h">Coordinator API</text><rect x="320" y="205" width="120" height="50" rx="10" fill="#fff" stroke="#8fcabb"/><text x="380" y="236" text-anchor="middle" class="b">C1 · stateless</text><rect x="320" y="280" width="120" height="50" rx="10" fill="#fff" stroke="#8fcabb"/><text x="380" y="311" text-anchor="middle" class="b">C2 · stateless</text><path d="M220 262H280" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="545" y="90" width="350" height="420" rx="22" fill="#f3effb" stroke="#9377c6"/><text x="720" y="127" text-anchor="middle" class="h">Decision-log shard for tx-742</text><rect x="585" y="175" width="145" height="90" rx="13" fill="#17324d"/><text x="657" y="207" text-anchor="middle" class="w">L1 · leader</text><text x="657" y="233" text-anchor="middle" class="s" fill="#fff">term 31</text><rect x="765" y="165" width="95" height="70" rx="12" fill="#fff" stroke="#9377c6"/><text x="812" y="194" text-anchor="middle" class="h">L2</text><text x="812" y="216" text-anchor="middle" class="s">replica</text><rect x="765" y="285" width="95" height="70" rx="12" fill="#fff" stroke="#9377c6"/><text x="812" y="314" text-anchor="middle" class="h">L3</text><text x="812" y="336" text-anchor="middle" class="s">replica</text><path d="M730 205H765M730 245L765 310" stroke="#55728f" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="585" y="390" width="275" height="78" rx="13" fill="#edf8f6" stroke="#5ab5a4"/><text x="722" y="420" text-anchor="middle" class="h">Committed record</text><text x="722" y="446" text-anchor="middle" class="b">tx-742 → COMMIT</text><path d="M480 262H545" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="960" y="125" width="200" height="330" rx="20" fill="#fff8e8" stroke="#e4b85b"/><text x="1060" y="163" text-anchor="middle" class="h">Participants</text><text x="1060" y="220" text-anchor="middle" class="b">OrderDB</text><text x="1060" y="275" text-anchor="middle" class="b">InventoryDB</text><text x="1060" y="330" text-anchor="middle" class="b">PaymentDB</text><text x="1060" y="395" text-anchor="middle" class="s">repeatable decision delivery</text><path d="M895 262H960" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="130" y="575" width="940" height="60" rx="14" fill="#17324d"/><text x="600" y="601" text-anchor="middle" class="w">Followers preserve the decision; only the current log leader may choose and deliver it.</text><text x="600" y="623" text-anchor="middle" class="s" fill="#fff">No quorum means no new decision—not a second coordinator history.</text></svg>
