<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Bigtable locality groups</title><desc id="desc">Atlas separates contents, anchor, and meta families into different locality-group SSTables so metadata reads avoid HTML and links.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".12"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Store together what the application reads together</text><rect x="55" y="100" width="300" height="460" rx="20" fill="#fff" stroke="#b9c9d8" filter="url(#s)"/><text x="205" y="140" text-anchor="middle" class="h">WebIndex column families</text><rect x="90" y="185" width="230" height="75" rx="14" fill="#eef4ff" stroke="#7399dc"/><rect x="90" y="290" width="230" height="75" rx="14" fill="#fff8e7" stroke="#d6a63f"/><rect x="90" y="395" width="230" height="75" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="205" y="215" text-anchor="middle" class="c">contents:*</text><text x="205" y="239" text-anchor="middle" class="b">large page bodies</text><text x="205" y="320" text-anchor="middle" class="c">anchor:*</text><text x="205" y="344" text-anchor="middle" class="b">many link columns</text><text x="205" y="425" text-anchor="middle" class="c">meta:*</text><text x="205" y="449" text-anchor="middle" class="b">small, frequently read</text>
<g filter="url(#s)"><rect x="505" y="115" width="590" height="120" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="505" y="280" width="590" height="120" rx="20" fill="#fff8e7" stroke="#d6a63f"/><rect x="505" y="445" width="590" height="120" rx="20" fill="#edf8f6" stroke="#5ab5a4"/></g><text x="800" y="150" text-anchor="middle" class="h">Body locality group → body SSTables</text><text x="800" y="181" text-anchor="middle" class="c">contents blocks · high compression</text><text x="800" y="207" text-anchor="middle" class="b">read only for page retrieval</text><text x="800" y="315" text-anchor="middle" class="h">Link locality group → link SSTables</text><text x="800" y="346" text-anchor="middle" class="c">anchor qualifiers · Bloom filter</text><text x="800" y="372" text-anchor="middle" class="b">read for graph processing</text><text x="800" y="480" text-anchor="middle" class="h">Metadata locality group → metadata SSTables</text><text x="800" y="511" text-anchor="middle" class="c">meta:hash · meta:status</text><text x="800" y="537" text-anchor="middle" class="b">small query skips HTML and anchors</text><path d="M320 222H505M320 327H505M320 432C410 432 410 505 505 505" fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="410" y="610" width="380" height="42" rx="12" fill="#17324d"/><text x="600" y="637" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fff">Locality group = separate physical SSTable set</text></svg>
