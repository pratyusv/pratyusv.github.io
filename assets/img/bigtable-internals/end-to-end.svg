<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Complete Bigtable row lifecycle</title><desc id="desc">The Atlas row moves through ordered key design, tablet routing, durable write, merged read, compaction, split, fencing, and recovery on TS8.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#17324d" flood-opacity=".12"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="760" rx="24" fill="#f7fafc"/><text x="600" y="43" text-anchor="middle" class="t">The complete life of com.example.www/guide</text><g filter="url(#s)"><rect x="40" y="85" width="205" height="120" rx="17" fill="#fff" stroke="#b9c9d8"/><rect x="270" y="85" width="205" height="120" rx="17" fill="#eef4ff" stroke="#7399dc"/><rect x="500" y="85" width="205" height="120" rx="17" fill="#eef4ff" stroke="#7399dc"/><rect x="730" y="85" width="205" height="120" rx="17" fill="#f3effb" stroke="#9377c6"/><rect x="960" y="85" width="200" height="120" rx="17" fill="#edf8f6" stroke="#5ab5a4"/><rect x="960" y="370" width="200" height="120" rx="17" fill="#fff8e7" stroke="#d6a63f"/><rect x="730" y="370" width="205" height="120" rx="17" fill="#eef4ff" stroke="#7399dc"/><rect x="500" y="370" width="205" height="120" rx="17" fill="#fceff1" stroke="#d96b79"/><rect x="270" y="370" width="205" height="120" rx="17" fill="#edf8f6" stroke="#5ab5a4"/><rect x="40" y="370" width="205" height="120" rx="17" fill="#fff" stroke="#b9c9d8"/></g>
<text x="142" y="118" text-anchor="middle" class="h">1 · Encode row</text><text x="142" y="148" text-anchor="middle" class="c">com.example.../guide</text><text x="142" y="178" text-anchor="middle" class="b">useful site locality</text><text x="372" y="118" text-anchor="middle" class="h">2 · Find range</text><text x="372" y="148" text-anchor="middle" class="c">row ∈ T18</text><text x="372" y="178" text-anchor="middle" class="b">ordered tablet</text><text x="602" y="118" text-anchor="middle" class="h">3 · Resolve owner</text><text x="602" y="148" text-anchor="middle" class="c">METADATA → TS3</text><text x="602" y="178" text-anchor="middle" class="b">then cache</text><text x="832" y="118" text-anchor="middle" class="h">4 · Commit log</text><text x="832" y="148" text-anchor="middle" class="c">L701 durable in GFS</text><text x="832" y="178" text-anchor="middle" class="b">redo before ack</text><text x="1060" y="118" text-anchor="middle" class="h">5 · Memtable</text><text x="1060" y="148" text-anchor="middle" class="c">hash@t42=91c4...</text><text x="1060" y="178" text-anchor="middle" class="b">immediate visibility</text>
<text x="1060" y="403" text-anchor="middle" class="h">6 · Read + compact</text><text x="1060" y="433" text-anchor="middle" class="c">merge → SSTable D</text><text x="1060" y="463" text-anchor="middle" class="b">bounded storage debt</text><text x="832" y="403" text-anchor="middle" class="h">7 · Split range</text><text x="832" y="433" text-anchor="middle" class="c">T18a + T18b</text><text x="832" y="463" text-anchor="middle" class="b">refresh client cache</text><text x="602" y="403" text-anchor="middle" class="h">8 · Fence TS3</text><text x="602" y="433" text-anchor="middle" class="c">Chubby lock lost</text><text x="602" y="463" text-anchor="middle" class="b">old owner stops</text><text x="372" y="403" text-anchor="middle" class="h">9 · Recover on TS8</text><text x="372" y="433" text-anchor="middle" class="c">SSTables + redo</text><text x="372" y="463" text-anchor="middle" class="b">rebuild memtable</text><text x="142" y="403" text-anchor="middle" class="h">10 · Serve again</text><text x="142" y="433" text-anchor="middle" class="c">hash@t42=91c4...</text><text x="142" y="463" text-anchor="middle" class="b">acknowledged state</text>
<path d="M245 145H270M475 145H500M705 145H730M935 145H960M1060 205V370M960 430H935M730 430H705M500 430H475M270 430H245" fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="100" y="575" width="1000" height="110" rx="20" fill="#17324d"/><text x="600" y="608" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#fff">One logical cell survives many physical representations</text><text x="600" y="641" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#fff">row identity → tablet ownership → redo + memory → immutable files → new owner</text><text x="600" y="669" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#dce5ed">each handoff has a durable or fenced boundary</text><text x="600" y="725" text-anchor="middle" class="b">The master coordinates placement; it never carries the HTML bytes</text></svg>
