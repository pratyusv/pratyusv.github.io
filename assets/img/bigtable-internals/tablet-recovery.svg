<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Bigtable tablet recovery</title><desc id="desc">TS8 reads T18a metadata, opens SSTables containing the t42 hash, replays later commit-log records, reconstructs the memtable, and serves the merged row.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".12"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs>
<rect width="1200" height="700" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Immutable base + committed delta reconstruct the tablet</text>
<g filter="url(#s)"><rect x="55" y="105" width="255" height="165" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="385" y="105" width="350" height="165" rx="20" fill="#f3effb" stroke="#9377c6"/><rect x="810" y="105" width="335" height="165" rx="20" fill="#f3effb" stroke="#9377c6"/><rect x="385" y="390" width="350" height="155" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><rect x="810" y="390" width="335" height="155" rx="20" fill="#edf8f6" stroke="#5ab5a4"/></g>
<text x="182" y="143" text-anchor="middle" class="h">1 · T18a metadata</text><text x="182" y="177" text-anchor="middle" class="c">SSTables: A, C, D</text><text x="182" y="209" text-anchor="middle" class="c">redo point: L741</text><text x="182" y="240" text-anchor="middle" class="b">range boundaries</text>
<text x="560" y="143" text-anchor="middle" class="h">2 · Open immutable SSTables</text><text x="560" y="177" text-anchor="middle" class="c">D: hash@t42 = 91c4...</text><text x="560" y="209" text-anchor="middle" class="b">load block indexes</text><text x="560" y="240" text-anchor="middle" class="b">persistent base in GFS</text>
<text x="977" y="143" text-anchor="middle" class="h">3 · Replay commit log</text><text x="977" y="177" text-anchor="middle" class="c">records ≥ L741</text><text x="977" y="209" text-anchor="middle" class="c">L751 status@t43=indexed</text><text x="977" y="240" text-anchor="middle" class="b">committed delta in GFS</text>
<text x="560" y="428" text-anchor="middle" class="h">4 · Reconstructed memtable</text><text x="560" y="463" text-anchor="middle" class="c">meta:status@t43 = indexed</text><text x="560" y="496" text-anchor="middle" class="b">volatile delta rebuilt</text><text x="977" y="428" text-anchor="middle" class="h">5 · TS8 serves T18a</text><text x="977" y="463" text-anchor="middle" class="c">merged view: t42 + t43</text><text x="977" y="496" text-anchor="middle" class="b">acknowledged state restored</text>
<path d="M310 185H385M735 185H810M977 270C977 330 735 370 660 390M735 467H810" fill="none" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><path d="M560 270V390" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><rect x="240" y="600" width="720" height="54" rx="14" fill="#17324d"/><text x="600" y="633" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fff">Serving machine is replaceable because authoritative bytes live in GFS</text></svg>
