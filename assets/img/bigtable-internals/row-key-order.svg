<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Bigtable row-key ordering</title><desc id="desc">Reversing domain labels clusters example.com pages into one contiguous scan while timestamp-leading keys create a hot edge.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".12"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="650" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">The key decides which rows become neighbours</text><rect x="55" y="95" width="680" height="470" rx="20" fill="#fff" stroke="#b9c9d8" filter="url(#s)"/><text x="395" y="130" text-anchor="middle" class="h">Reversed domains create a useful range</text>
<g class="c"><text x="100" y="190">com.alpha.www/home</text><text x="100" y="240">com.example.docs/api</text><text x="100" y="290">com.example.www/about</text><text x="100" y="340">com.example.www/guide</text><text x="100" y="390">com.google.www/search</text><text x="100" y="440">net.other.www/home</text></g><rect x="80" y="207" width="420" height="157" rx="14" fill="#edf8f6" fill-opacity=".65" stroke="#5ab5a4" stroke-width="2"/><path d="M535 225H665V350H535" fill="none" stroke="#3b9f8a" stroke-width="4"/><text x="595" y="275" text-anchor="middle" class="h">prefix scan</text><text x="595" y="302" text-anchor="middle" class="c">com.example*</text><text x="595" y="329" text-anchor="middle" class="b">three adjacent rows</text>
<rect x="790" y="95" width="355" height="470" rx="20" fill="#fff" stroke="#d96b79" filter="url(#s)"/><text x="968" y="130" text-anchor="middle" class="h">Monotonic prefix creates heat</text><text x="825" y="195" class="c">...104203#W7</text><text x="825" y="245" class="c">...104204#W2</text><text x="825" y="295" class="c">...104205#W9</text><path d="M820 340H1090" stroke="#d96b79" stroke-width="7" marker-end="url(#a)"/><rect x="850" y="380" width="240" height="100" rx="16" fill="#fceff1" stroke="#d96b79"/><text x="970" y="415" text-anchor="middle" class="h">last tablet</text><text x="970" y="445" text-anchor="middle" class="b">all current writes arrive here</text><text x="970" y="470" text-anchor="middle" class="b">until the moving edge splits</text><text x="600" y="610" text-anchor="middle" class="b">Locality and distribution are both consequences of the leading bytes</text></svg>
