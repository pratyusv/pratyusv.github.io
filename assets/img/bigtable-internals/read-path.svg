<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Bigtable merged read path</title><desc id="desc">A reader requests the latest hash, Bloom filters skip irrelevant SSTables, sorted candidates merge, and t42 wins.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".12"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="700" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">One logical read merges several sorted histories</text><rect x="55" y="100" width="250" height="120" rx="18" fill="#fff" stroke="#b9c9d8" filter="url(#s)"/><text x="180" y="138" text-anchor="middle" class="h">Reader R2</text><text x="180" y="170" text-anchor="middle" class="c">latest meta:hash</text><text x="180" y="197" text-anchor="middle" class="b">row com.example.../guide</text><rect x="405" y="85" width="735" height="330" rx="22" fill="#fff" stroke="#b9c9d8" filter="url(#s)"/><text x="772" y="125" text-anchor="middle" class="h">Candidate sorted sources in T18</text><g><rect x="440" y="165" width="200" height="150" rx="15" fill="#edf8f6" stroke="#5ab5a4"/><rect x="665" y="165" width="200" height="150" rx="15" fill="#eef4ff" stroke="#7399dc"/><rect x="890" y="165" width="210" height="150" rx="15" fill="#f1f4f7" stroke="#8296a8"/></g><text x="540" y="198" text-anchor="middle" class="h">Memtable</text><text x="540" y="235" text-anchor="middle" class="c">@t42 = 91c4...</text><text x="540" y="270" text-anchor="middle" class="b">newest candidate</text><text x="765" y="198" text-anchor="middle" class="h">SSTable C</text><text x="765" y="235" text-anchor="middle" class="c">@t39 = 7ab2...</text><text x="765" y="270" text-anchor="middle" class="b">Bloom: maybe</text><text x="995" y="198" text-anchor="middle" class="h">SSTable B</text><text x="995" y="235" text-anchor="middle" class="c">no matching cell</text><text x="995" y="270" text-anchor="middle" class="b">Bloom: definitely no</text><path d="M995 290l25 25m0-25l-25 25" stroke="#d96b79" stroke-width="4"/>
<rect x="400" y="485" width="430" height="135" rx="20" fill="#eef4ff" stroke="#7399dc" filter="url(#s)"/><text x="615" y="523" text-anchor="middle" class="h">Sorted merge + version policy</text><text x="615" y="557" text-anchor="middle" class="c">t42 &gt; t39 → select t42</text><text x="615" y="588" text-anchor="middle" class="b">tombstone could suppress older value</text><rect x="900" y="485" width="245" height="135" rx="20" fill="#edf8f6" stroke="#5ab5a4" filter="url(#s)"/><text x="1022" y="523" text-anchor="middle" class="h">Return</text><text x="1022" y="557" text-anchor="middle" class="c">91c4...</text><text x="1022" y="588" text-anchor="middle" class="b">newest visible value</text><path d="M305 160H405M540 315L540 485M765 315L680 485M830 553H900" fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><text x="600" y="665" text-anchor="middle" class="b">Scan cache stores returned pairs · block cache stores lower-level SSTable blocks</text></svg>
