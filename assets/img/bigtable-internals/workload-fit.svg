<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img"><title>Bigtable workload fit</title><defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="590" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Row-key order must express the access pattern</text><rect x="55" y="90" width="520" height="420" rx="20" fill="#fff" stroke="#5ab5a4"/><text x="315" y="132" text-anchor="middle" class="h">Strong fit</text><g class="b"><text x="105" y="190">✓ point reads by row key</text><text x="105" y="235">✓ contiguous ordered range scans</text><text x="105" y="280">✓ sparse dynamic qualifiers</text><text x="105" y="325">✓ multiple versions per cell</text><text x="105" y="370">✓ very large horizontally split tables</text><text x="105" y="415">✓ invariants local to one row</text></g><rect x="625" y="90" width="520" height="420" rx="20" fill="#fff" stroke="#d96b79"/><text x="885" y="132" text-anchor="middle" class="h">Poor fit</text><g class="b"><text x="675" y="190">× arbitrary relational joins</text><text x="675" y="235">× unpredictable ad hoc predicates</text><text x="675" y="280">× many unrelated secondary indexes</text><text x="675" y="325">× transactions across many rows</text><text x="675" y="370">× one small conventional workload</text><text x="675" y="415">× a row key that creates one permanent hotspot</text></g><text x="600" y="555" text-anchor="middle" class="b">A good Bigtable schema is an access plan encoded into the row key.</text></svg>
