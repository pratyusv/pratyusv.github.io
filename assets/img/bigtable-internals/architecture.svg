<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Original Bigtable architecture</title><desc id="desc">Clients send data directly to tablet servers while the master coordinates assignments, Chubby provides locks, and GFS stores logs and SSTables.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".13"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Control finds the tablet; data bypasses the master</text>
<g filter="url(#s)"><rect x="55" y="110" width="225" height="135" rx="20" fill="#fff" stroke="#b9c9d8"/><rect x="480" y="80" width="240" height="145" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="900" y="110" width="240" height="135" rx="20" fill="#fff8e7" stroke="#d6a63f"/><rect x="380" y="360" width="440" height="170" rx="22" fill="#edf8f6" stroke="#5ab5a4"/><rect x="55" y="430" width="230" height="130" rx="20" fill="#f3effb" stroke="#9377c6"/><rect x="915" y="430" width="225" height="130" rx="20" fill="#f1f4f7" stroke="#8296a8"/></g>
<text x="168" y="150" text-anchor="middle" class="h">Atlas client W7</text><text x="168" y="180" text-anchor="middle" class="b">client library + cache</text><text x="168" y="208" text-anchor="middle" class="c">row mutation</text><text x="600" y="120" text-anchor="middle" class="h">Bigtable master</text><text x="600" y="151" text-anchor="middle" class="b">assignment · balance · schema</text><text x="600" y="182" text-anchor="middle" class="b">not on row data path</text><text x="1020" y="150" text-anchor="middle" class="h">Chubby</text><text x="1020" y="180" text-anchor="middle" class="b">master + server locks</text><text x="1020" y="208" text-anchor="middle" class="b">root-tablet pointer</text><text x="600" y="402" text-anchor="middle" class="h">Tablet server TS3</text><text x="600" y="436" text-anchor="middle" class="c">T18 [com.example, com.google)</text><text x="600" y="468" text-anchor="middle" class="b">reads · writes · compaction · split</text><text x="600" y="498" text-anchor="middle" class="b">many tablets per server</text><text x="170" y="470" text-anchor="middle" class="h">GFS</text><text x="170" y="503" text-anchor="middle" class="b">commit logs + SSTables</text><text x="1028" y="470" text-anchor="middle" class="h">METADATA tablets</text><text x="1028" y="503" text-anchor="middle" class="b">range → tablet server</text>
<path d="M280 180C370 235 370 410 380 430" fill="none" stroke="#3b9f8a" stroke-width="5" marker-end="url(#a)"/><text x="318" y="315" class="h">row data</text><path d="M480 155H280" stroke="#2f6fdd" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#a)"/><path d="M720 145H900" stroke="#2f6fdd" stroke-width="3" marker-end="url(#a)"/><path d="M600 225V360" stroke="#2f6fdd" stroke-width="3" marker-end="url(#a)"/><path d="M380 490H285" stroke="#3b9f8a" stroke-width="4" marker-end="url(#a)"/><path d="M915 490H820" stroke="#55728f" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="600" y="620" text-anchor="middle" class="b">Blue = control · green = row data/storage · purple = durable files · yellow = coordination</text></svg>
