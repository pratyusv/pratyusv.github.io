<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Bigtable tablet partitioning</title><desc id="desc">The ordered WebIndex table is divided into contiguous half-open tablet ranges assigned across tablet servers.</desc><defs><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".12"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="650" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">One sorted table, many movable row-range tablets</text><rect x="65" y="100" width="1070" height="160" rx="20" fill="#fff" stroke="#b9c9d8" filter="url(#s)"/><text x="90" y="135" class="h">WebIndex row-key space</text><rect x="90" y="165" width="300" height="65" rx="10" fill="#eef4ff" stroke="#7399dc"/><rect x="390" y="165" width="380" height="65" fill="#edf8f6" stroke="#5ab5a4" stroke-width="2"/><rect x="770" y="165" width="330" height="65" rx="10" fill="#fff8e7" stroke="#d6a63f"/><text x="240" y="193" text-anchor="middle" class="h">T17</text><text x="240" y="216" text-anchor="middle" class="c">[com.alpha, com.example)</text><text x="580" y="193" text-anchor="middle" class="h">T18 · Atlas row</text><text x="580" y="216" text-anchor="middle" class="c">[com.example, com.google)</text><text x="935" y="193" text-anchor="middle" class="h">T19</text><text x="935" y="216" text-anchor="middle" class="c">[com.google, net)</text>
<g filter="url(#s)"><rect x="90" y="360" width="260" height="150" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="470" y="360" width="260" height="150" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><rect x="850" y="360" width="260" height="150" rx="20" fill="#fff8e7" stroke="#d6a63f"/></g><text x="220" y="400" text-anchor="middle" class="h">Tablet server TS1</text><text x="220" y="437" text-anchor="middle" class="c">T17 · T63 · T88</text><text x="220" y="470" text-anchor="middle" class="b">many independent ranges</text><text x="600" y="400" text-anchor="middle" class="h">Tablet server TS3</text><text x="600" y="437" text-anchor="middle" class="c">T18 · T44 · T91</text><text x="600" y="470" text-anchor="middle" class="b">current owner of Atlas row</text><text x="980" y="400" text-anchor="middle" class="h">Tablet server TS8</text><text x="980" y="437" text-anchor="middle" class="c">T19 · T29</text><text x="980" y="470" text-anchor="middle" class="b">assignment can change</text><path d="M240 230V360M580 230V360M935 230V360" stroke="#55728f" stroke-width="3" stroke-dasharray="7 6"/><text x="600" y="575" text-anchor="middle" class="b">Tablet = logical range and assignment unit · SSTable = immutable physical file</text></svg>
