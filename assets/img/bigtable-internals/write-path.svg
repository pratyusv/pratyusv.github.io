<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">Bigtable write path</title><desc id="desc">TS3 validates an Atlas row mutation, commits redo record L701 in GFS, updates the sorted memtable, and acknowledges W7.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".12"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="690" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Durability before visibility before acknowledgement</text><g filter="url(#s)"><rect x="50" y="130" width="230" height="125" rx="20" fill="#fff" stroke="#b9c9d8"/><rect x="365" y="105" width="250" height="175" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="710" y="95" width="420" height="195" rx="20" fill="#f3effb" stroke="#9377c6"/><rect x="710" y="385" width="420" height="165" rx="20" fill="#edf8f6" stroke="#5ab5a4"/></g>
<text x="165" y="168" text-anchor="middle" class="h">Atlas worker W7</text><text x="165" y="198" text-anchor="middle" class="c">row mutation t42</text><text x="165" y="226" text-anchor="middle" class="b">contents + meta + anchor</text><text x="490" y="145" text-anchor="middle" class="h">Tablet server TS3</text><text x="490" y="178" text-anchor="middle" class="b">1 · validate request</text><text x="490" y="207" text-anchor="middle" class="b">2 · check authorization</text><text x="490" y="238" text-anchor="middle" class="c">owner of T18?</text><text x="920" y="137" text-anchor="middle" class="h">3 · Commit log in GFS</text><rect x="755" y="165" width="330" height="80" rx="14" fill="#fff" stroke="#9377c6"/><text x="920" y="194" text-anchor="middle" class="c">L701 · T18 · row · mutation</text><text x="920" y="222" text-anchor="middle" class="b">durable commit point</text><text x="920" y="425" text-anchor="middle" class="h">4 · Sorted memtable for T18</text><text x="920" y="460" text-anchor="middle" class="c">meta:hash@t42 = 91c4...</text><text x="920" y="493" text-anchor="middle" class="b">visible to merged reads</text>
<path d="M280 192H365" stroke="#3b9f8a" stroke-width="4" marker-end="url(#a)"/><path d="M615 180H710" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><path d="M920 290V385" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><path d="M710 500C530 590 250 570 165 255" fill="none" stroke="#3b9f8a" stroke-width="4" marker-end="url(#a)"/><text x="430" y="565" text-anchor="middle" class="h">5 · acknowledge</text><rect x="260" y="615" width="680" height="45" rx="12" fill="#17324d"/><text x="600" y="643" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fff">Crash after ack: replay L701 · Crash before log commit: no successful ack</text></svg>
