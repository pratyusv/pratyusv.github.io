<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Bigtable tablet location hierarchy</title><desc id="desc">A Chubby pointer locates the root tablet, which locates METADATA tablets, which locate user tablets such as T18 on TS3.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".12"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="700" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Bigtable stores tablet locations in Bigtable</text><g filter="url(#s)"><rect x="450" y="85" width="300" height="100" rx="18" fill="#fff8e7" stroke="#d6a63f"/><rect x="425" y="245" width="350" height="110" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="170" y="425" width="330" height="105" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="700" y="425" width="330" height="105" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="55" y="590" width="275" height="75" rx="16" fill="#edf8f6" stroke="#5ab5a4"/><rect x="375" y="590" width="275" height="75" rx="16" fill="#edf8f6" stroke="#5ab5a4"/><rect x="695" y="590" width="450" height="75" rx="16" fill="#edf8f6" stroke="#5ab5a4"/></g>
<text x="600" y="120" text-anchor="middle" class="h">Level 1 · Chubby file</text><text x="600" y="151" text-anchor="middle" class="c">/bigtable/root → ROOT@TS1</text><text x="600" y="280" text-anchor="middle" class="h">Level 2 · ROOT tablet</text><text x="600" y="310" text-anchor="middle" class="b">first METADATA tablet · never splits</text><text x="600" y="336" text-anchor="middle" class="c">metadata range → location</text><text x="335" y="458" text-anchor="middle" class="h">Level 3 · METADATA M1</text><text x="335" y="489" text-anchor="middle" class="c">table id + end row → server</text><text x="865" y="458" text-anchor="middle" class="h">Level 3 · METADATA M2</text><text x="865" y="489" text-anchor="middle" class="c">WebIndex + com.google → TS3</text><text x="192" y="620" text-anchor="middle" class="h">T17 @ TS1</text><text x="192" y="644" text-anchor="middle" class="c">... &lt; com.example</text><text x="512" y="620" text-anchor="middle" class="h">T18 @ TS3</text><text x="512" y="644" text-anchor="middle" class="c">Atlas row lives here</text><text x="920" y="620" text-anchor="middle" class="h">T19 and later user tablets</text><text x="920" y="644" text-anchor="middle" class="c">com.google ...</text>
<path d="M600 185V245M545 355L335 425M655 355L865 425M270 530L192 590M370 530L512 590M865 530L920 590" fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/></svg>
