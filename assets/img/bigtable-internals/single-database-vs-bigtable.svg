<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img"><title>Single database compared with Bigtable</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.s{font:12px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="690" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">One logical table can have very different physical ownership</text><rect x="55" y="90" width="500" height="500" rx="20" fill="#fff" stroke="#e4b85b"/><text x="305" y="132" text-anchor="middle" class="h">Single database</text><rect x="105" y="180" width="150" height="85" rx="14" fill="#fff" stroke="#b7c8d8"/><text x="180" y="215" text-anchor="middle" class="h">Workers</text><text x="180" y="241" text-anchor="middle" class="b">SQL queries</text><rect x="355" y="165" width="150" height="115" rx="14" fill="#fff8e8" stroke="#e4b85b"/><text x="430" y="202" text-anchor="middle" class="h">Database</text><text x="430" y="230" text-anchor="middle" class="b">rows + indexes</text><text x="430" y="255" text-anchor="middle" class="b">one owner</text><path d="M255 222H355" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="305" y="355" text-anchor="middle" class="b">General query and transaction machinery</text><text x="305" y="390" text-anchor="middle" class="b">Capacity and traffic converge on one system</text><rect x="645" y="90" width="500" height="500" rx="20" fill="#fff" stroke="#5ab5a4"/><text x="895" y="132" text-anchor="middle" class="h">Bigtable</text><rect x="690" y="170" width="140" height="85" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="760" y="204" text-anchor="middle" class="h">Tablet A</text><text x="760" y="230" text-anchor="middle" class="b">a–g rows</text><rect x="825" y="275" width="140" height="85" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="895" y="309" text-anchor="middle" class="h">Tablet B</text><text x="895" y="335" text-anchor="middle" class="b">h–r rows</text><rect x="960" y="170" width="140" height="85" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="1030" y="204" text-anchor="middle" class="h">Tablet C</text><text x="1030" y="230" text-anchor="middle" class="b">s–z rows</text><path d="M760 255L895 275L1030 255" stroke="#55728f" stroke-width="3" stroke-dasharray="7 5" fill="none"/><text x="895" y="415" text-anchor="middle" class="b">Ordered ranges move and split independently</text><text x="895" y="450" text-anchor="middle" class="b">Master coordinates; tablet servers serve data</text><text x="895" y="485" text-anchor="middle" class="b">GFS stores durable files; Chubby fences owners</text><rect x="220" y="615" width="760" height="42" rx="9" fill="#17324d"/><text x="600" y="642" text-anchor="middle" style="font:700 14px sans-serif;fill:#fff">Bigtable trades general relational access for scalable ordered-key ownership.</text></svg>
