<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Bigtable tablet storage</title><desc id="desc">Tablet T18 is a logical merge of a mutable memtable and several immutable SSTables whose blocks and indexes reside in GFS.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".12"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">A tablet is a logical view, not one physical file</text><rect x="55" y="95" width="1090" height="500" rx="22" fill="#fff" stroke="#b9c9d8" filter="url(#s)"/><text x="600" y="133" text-anchor="middle" class="h">T18 · [com.example, com.google)</text><rect x="100" y="175" width="330" height="305" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="265" y="212" text-anchor="middle" class="h">Mutable memtable · RAM</text><g class="c"><text x="130" y="260">meta:hash@t42 = 91c4...</text><text x="130" y="300">anchor:crawler@t42 = start</text><text x="130" y="340">meta:status@t41 = fresh</text></g><text x="265" y="415" text-anchor="middle" class="b">recent acknowledged writes</text><text x="265" y="443" text-anchor="middle" class="b">covered by commit log</text><rect x="505" y="175" width="590" height="305" rx="20" fill="#f3effb" stroke="#9377c6"/><text x="800" y="212" text-anchor="middle" class="h">Immutable SSTables · GFS</text><g><rect x="540" y="250" width="155" height="150" rx="13" fill="#fff" stroke="#9377c6"/><rect x="720" y="250" width="155" height="150" rx="13" fill="#fff" stroke="#9377c6"/><rect x="900" y="250" width="155" height="150" rx="13" fill="#fff" stroke="#9377c6"/></g><text x="617" y="280" text-anchor="middle" class="h">SSTable A</text><text x="617" y="310" text-anchor="middle" class="c">data blocks</text><text x="617" y="345" text-anchor="middle" class="c">block index</text><text x="617" y="378" text-anchor="middle" class="b">old versions</text><text x="797" y="280" text-anchor="middle" class="h">SSTable B</text><text x="797" y="310" text-anchor="middle" class="c">data blocks</text><text x="797" y="345" text-anchor="middle" class="c">block index</text><text x="797" y="378" text-anchor="middle" class="b">tombstones</text><text x="977" y="280" text-anchor="middle" class="h">SSTable C</text><text x="977" y="310" text-anchor="middle" class="c">data blocks</text><text x="977" y="345" text-anchor="middle" class="c">block index</text><text x="977" y="378" text-anchor="middle" class="b">newer flush</text><path d="M430 325H505" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="285" y="520" width="630" height="48" rx="13" fill="#17324d"/><text x="600" y="550" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fff">Logical row = ordered merge(memtable, SSTable A, B, C)</text><text x="600" y="635" text-anchor="middle" class="b">Compaction changes the file set without changing T18's logical range</text></svg>
