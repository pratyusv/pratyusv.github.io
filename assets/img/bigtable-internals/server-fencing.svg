<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Bigtable tablet-server fencing with Chubby</title><desc id="desc">TS3 loses its Chubby session and stops serving; the master acquires the server-file lock, marks T18a unassigned, and assigns it to TS8.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".12"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="700" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Ownership moves only after the old server loses its lock</text><g filter="url(#s)"><rect x="55" y="110" width="290" height="190" rx="20" fill="#fceff1" stroke="#d96b79"/><rect x="455" y="90" width="290" height="230" rx="20" fill="#fff8e7" stroke="#d6a63f"/><rect x="855" y="110" width="290" height="190" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="455" y="440" width="290" height="150" rx="20" fill="#edf8f6" stroke="#5ab5a4"/></g><text x="200" y="150" text-anchor="middle" class="h">1 · Tablet server TS3</text><text x="200" y="184" text-anchor="middle" class="c">serves T18a</text><text x="200" y="218" text-anchor="middle" class="b">network failure</text><text x="200" y="249" text-anchor="middle" class="b">Chubby session expires</text><text x="200" y="280" text-anchor="middle" class="h">must stop serving</text><text x="600" y="130" text-anchor="middle" class="h">2 · Chubby server file</text><rect x="500" y="165" width="200" height="90" rx="14" fill="#fff" stroke="#d6a63f"/><text x="600" y="195" text-anchor="middle" class="c">/servers/TS3</text><text x="600" y="226" text-anchor="middle" class="b">exclusive lock released</text><text x="600" y="287" text-anchor="middle" class="b">coordination truth</text><text x="1000" y="150" text-anchor="middle" class="h">3 · Master</text><text x="1000" y="184" text-anchor="middle" class="b">acquires TS3 file lock</text><text x="1000" y="218" text-anchor="middle" class="b">deletes server file</text><text x="1000" y="249" text-anchor="middle" class="c">T18a → unassigned</text><text x="600" y="478" text-anchor="middle" class="h">4 · Tablet server TS8</text><text x="600" y="514" text-anchor="middle" class="c">new assignment: T18a</text><text x="600" y="548" text-anchor="middle" class="b">loads persistent state from GFS</text><path d="M345 205H455M745 205H855M1000 300C1000 405 780 465 745 500" fill="none" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><path d="M455 250H345" stroke="#d96b79" stroke-width="4" stroke-dasharray="8 6"/><text x="400" y="276" text-anchor="middle" class="b">lock lost</text><rect x="220" y="635" width="760" height="42" rx="12" fill="#17324d"/><text x="600" y="662" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fff">No valid lock → no serving authority, even if TS3 still has stale memory</text></svg>
