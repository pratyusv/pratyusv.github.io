<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Bigtable minor compaction</title><desc id="desc">A full memtable freezes, a new memtable accepts writes, the frozen table becomes an SSTable, and the redo point advances.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".12"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Minor compaction moves a durable prefix out of memory</text><g filter="url(#s)"><rect x="45" y="120" width="245" height="155" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><rect x="360" y="120" width="245" height="155" rx="20" fill="#fff8e7" stroke="#d6a63f"/><rect x="675" y="120" width="245" height="155" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><rect x="675" y="380" width="245" height="155" rx="20" fill="#f3effb" stroke="#9377c6"/><rect x="975" y="380" width="180" height="155" rx="20" fill="#eef4ff" stroke="#7399dc"/></g><text x="167" y="158" text-anchor="middle" class="h">1 · Active memtable</text><text x="167" y="191" text-anchor="middle" class="c">L650 ... L740</text><text x="167" y="224" text-anchor="middle" class="b">reaches size threshold</text><text x="482" y="158" text-anchor="middle" class="h">2 · Frozen memtable</text><text x="482" y="191" text-anchor="middle" class="c">immutable snapshot</text><text x="482" y="224" text-anchor="middle" class="b">still participates in reads</text><text x="797" y="158" text-anchor="middle" class="h">3 · New memtable</text><text x="797" y="191" text-anchor="middle" class="c">L741 ...</text><text x="797" y="224" text-anchor="middle" class="b">new writes continue</text><text x="797" y="418" text-anchor="middle" class="h">4 · New SSTable D</text><text x="797" y="451" text-anchor="middle" class="c">sorted data in GFS</text><text x="797" y="484" text-anchor="middle" class="b">metadata installed safely</text><text x="1065" y="418" text-anchor="middle" class="h">5 · Redo point</text><text x="1065" y="451" text-anchor="middle" class="c">advance to L741</text><text x="1065" y="484" text-anchor="middle" class="b">shorter replay</text><path d="M290 197H360M605 197H675M482 275C482 430 575 457 675 457M920 457H975" fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><path d="M805 120C805 80 1040 80 1040 380" fill="none" stroke="#3b9f8a" stroke-width="3" stroke-dasharray="7 6"/><text x="990" y="90" class="b">foreground writes never wait for full flush</text><rect x="260" y="590" width="680" height="48" rx="13" fill="#17324d"/><text x="600" y="620" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fff">Memory released · recovery log shortened · one more SSTable created</text></svg>
