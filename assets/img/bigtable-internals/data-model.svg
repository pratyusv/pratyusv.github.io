<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Bigtable sparse versioned data model</title><desc id="desc">A WebIndex row has contents, meta and dynamic anchor column families with multiple timestamped versions.</desc><defs><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".12"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="650" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">A cell lives at row × column × timestamp</text><rect x="55" y="100" width="1090" height="450" rx="20" fill="#fff" stroke="#b9c9d8" filter="url(#s)"/><rect x="55" y="100" width="1090" height="68" rx="20" fill="#17324d"/><text x="85" y="142" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" fill="#fff">row: com.example.www/guide</text>
