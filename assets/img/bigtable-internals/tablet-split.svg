<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Bigtable tablet split</title><desc id="desc">Growing tablet T18 splits at com.example.x into T18a and T18b, records both ranges in METADATA, and permits independent assignment.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".12"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs>
<rect width="1200" height="690" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">A split changes range ownership before it changes every file</text>
<rect x="60" y="100" width="1080" height="150" rx="20" fill="#fff8e7" stroke="#d6a63f" filter="url(#s)"/><text x="600" y="135" text-anchor="middle" class="h">Before · T18 on TS3 grows beyond target</text><rect x="115" y="170" width="970" height="52" rx="12" fill="#edf8f6" stroke="#5ab5a4"/><text x="600" y="201" text-anchor="middle" class="c">[com.example, com.google) · shared logical range · ~200 MiB+</text>
<path d="M600 250V315" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><text x="615" y="290" class="b">split key = com.example.x</text>
<g filter="url(#s)"><rect x="60" y="330" width="500" height="165" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="640" y="330" width="500" height="165" rx="20" fill="#edf8f6" stroke="#5ab5a4"/></g>
<text x="310" y="368" text-anchor="middle" class="h">T18a · initially TS3</text><text x="310" y="404" text-anchor="middle" class="c">[com.example, com.example.x)</text><text x="310" y="438" text-anchor="middle" class="b">Atlas /guide remains in this range</text><text x="310" y="466" text-anchor="middle" class="b">reads old SSTables within boundary</text>
<text x="890" y="368" text-anchor="middle" class="h">T18b · independently assignable</text><text x="890" y="404" text-anchor="middle" class="c">[com.example.x, com.google)</text><text x="890" y="438" text-anchor="middle" class="b">may move to TS8 for balance</text><text x="890" y="466" text-anchor="middle" class="b">later compaction makes range files</text>
<rect x="250" y="555" width="700" height="65" rx="15" fill="#17324d"/><text x="600" y="581" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fff">METADATA records the new tablet before master notification</text><text x="600" y="604" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#dce5ed">stale T18 client cache → rejection → metadata refresh</text><text x="600" y="660" text-anchor="middle" class="b">Split adjusts partition granularity · assignment adjusts load placement</text></svg>
