<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Bigtable tombstone lifecycle</title><desc id="desc">A tombstone in a newer source hides an old cell immediately, while major compaction later removes both physical records.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".12"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="660" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Delete now means hide now, reclaim later</text><g filter="url(#s)"><rect x="45" y="120" width="310" height="350" rx="20" fill="#fff" stroke="#b9c9d8"/><rect x="445" y="120" width="310" height="350" rx="20" fill="#fceff1" stroke="#d96b79"/><rect x="845" y="120" width="310" height="350" rx="20" fill="#edf8f6" stroke="#5ab5a4"/></g><text x="200" y="158" text-anchor="middle" class="h">1 · Old immutable value</text><rect x="85" y="205" width="230" height="85" rx="14" fill="#f3effb" stroke="#9377c6"/><text x="200" y="237" text-anchor="middle" class="c">SSTable A</text><text x="200" y="265" text-anchor="middle" class="c">html@t31 = old bytes</text><text x="200" y="345" text-anchor="middle" class="b">cannot edit A in place</text><text x="600" y="158" text-anchor="middle" class="h">2 · Newer tombstone</text><rect x="485" y="205" width="230" height="85" rx="14" fill="#fff" stroke="#d96b79"/><text x="600" y="237" text-anchor="middle" class="c">memtable / newer SSTable</text><text x="600" y="265" text-anchor="middle" class="c">DELETE html@t40</text><text x="600" y="330" text-anchor="middle" class="h">Read result: absent</text><text x="600" y="360" text-anchor="middle" class="b">both records still occupy bytes</text><text x="1000" y="158" text-anchor="middle" class="h">3 · Major compaction</text><rect x="885" y="205" width="230" height="85" rx="14" fill="#fff" stroke="#5ab5a4"/><text x="1000" y="237" text-anchor="middle" class="c">complete history in view</text><text x="1000" y="265" text-anchor="middle" class="c">output: no cell</text><text x="1000" y="330" text-anchor="middle" class="h">Physical bytes reclaimed</text><text x="1000" y="360" text-anchor="middle" class="b">old value + marker removed</text><path d="M355 295H445M755 295H845" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><text x="400" y="275" text-anchor="middle" class="b">delete write</text><text x="800" y="275" text-anchor="middle" class="b">all inputs</text><rect x="210" y="525" width="780" height="55" rx="14" fill="#17324d"/><text x="600" y="559" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fff">Logical visibility changes on the write path · disk usage changes on compaction</text><text x="600" y="620" text-anchor="middle" class="b">Version-expiration policy follows the same asynchronous reclamation pattern</text></svg>
