<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">Bigtable master recovery</title><desc id="desc">A restarting master acquires its Chubby lock, finds live servers, asks their assignments, scans METADATA, and identifies unassigned tablets.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".12"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}.n{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}</style></defs><rect width="1200" height="690" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">The master recovers by reconciling three views</text><rect x="475" y="80" width="250" height="110" rx="20" fill="#eef4ff" stroke="#7399dc" filter="url(#s)"/><text x="600" y="119" text-anchor="middle" class="h">Restarted master</text><text x="600" y="151" text-anchor="middle" class="b">global assignment authority</text><g filter="url(#s)"><rect x="55" y="280" width="300" height="190" rx="20" fill="#fff8e7" stroke="#d6a63f"/><rect x="450" y="280" width="300" height="190" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><rect x="845" y="280" width="300" height="190" rx="20" fill="#f3effb" stroke="#9377c6"/></g><text x="205" y="320" text-anchor="middle" class="h">1 · Chubby</text><text x="205" y="354" text-anchor="middle" class="b">acquire master lock</text><text x="205" y="385" text-anchor="middle" class="b">list live server files</text><text x="205" y="420" text-anchor="middle" class="c">TS1 · TS8 · TS9</text><text x="600" y="320" text-anchor="middle" class="h">2 · Live tablet servers</text><text x="600" y="354" text-anchor="middle" class="b">report current assignments</text><text x="600" y="388" text-anchor="middle" class="c">TS8: T18a, T29</text><text x="600" y="420" text-anchor="middle" class="c">TS1: T17, T63</text><text x="995" y="320" text-anchor="middle" class="h">3 · METADATA</text><text x="995" y="354" text-anchor="middle" class="b">complete tablet set</text><text x="995" y="388" text-anchor="middle" class="c">T17 · T18a · T18b ...</text><text x="995" y="420" text-anchor="middle" class="b">range boundaries + files</text><path d="M530 190L250 280M600 190V280M670 190L950 280" fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="285" y="545" width="630" height="85" rx="18" fill="#17324d"/><text x="600" y="576" text-anchor="middle" class="n">4 · Reconcile</text><text x="600" y="604" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#fff">METADATA tablets − live reports = unassigned tablets</text><path d="M205 470L470 545M600 470V545M995 470L730 545" fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><text x="600" y="665" text-anchor="middle" class="b">Short master outage preserves data; assignment and schema work resume after reconciliation</text></svg>
