<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">The Atlas row journey through Bigtable</title><desc id="desc">One crawl row moves from row-key design through tablet lookup, commit log, memtable, SSTables, compaction, split, and recovery.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".13"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">One crawl result connects the whole Bigtable design</text>
<g filter="url(#s)"><rect x="50" y="105" width="225" height="125" rx="18" fill="#fff" stroke="#b9c9d8"/><rect x="350" y="105" width="225" height="125" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="650" y="105" width="225" height="125" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="950" y="105" width="200" height="125" rx="18" fill="#fff8e7" stroke="#d6a63f"/><rect x="950" y="410" width="200" height="125" rx="18" fill="#fceff1" stroke="#d96b79"/><rect x="650" y="410" width="225" height="125" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="350" y="410" width="225" height="125" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="50" y="410" width="225" height="125" rx="18" fill="#fff" stroke="#b9c9d8"/></g>
<text x="162" y="140" text-anchor="middle" class="h">1 · Ordered row key</text><text x="162" y="172" text-anchor="middle" class="c">com.example.www/guide</text><text x="162" y="202" text-anchor="middle" class="b">application locality</text>
<text x="462" y="140" text-anchor="middle" class="h">2 · Tablet lookup</text><text x="462" y="172" text-anchor="middle" class="c">T18 → TS3</text><text x="462" y="202" text-anchor="middle" class="b">metadata hierarchy + cache</text>
<text x="762" y="140" text-anchor="middle" class="h">3 · Durable write</text><text x="762" y="172" text-anchor="middle" class="c">commit log L701</text><text x="762" y="202" text-anchor="middle" class="b">then memtable, then ack</text>
<text x="1050" y="140" text-anchor="middle" class="h">4 · Sorted read</text><text x="1050" y="172" text-anchor="middle" class="c">mem + SSTables</text><text x="1050" y="202" text-anchor="middle" class="b">merge newest version</text>
<text x="1050" y="445" text-anchor="middle" class="h">5 · Compaction</text><text x="1050" y="477" text-anchor="middle" class="c">flush + merge + GC</text><text x="1050" y="507" text-anchor="middle" class="b">pay storage debt</text>
<text x="762" y="445" text-anchor="middle" class="h">6 · Tablet split</text><text x="762" y="477" text-anchor="middle" class="c">T18 → T18a + T18b</text><text x="762" y="507" text-anchor="middle" class="b">new assignment units</text>
<text x="462" y="445" text-anchor="middle" class="h">7 · Ownership fence</text><text x="462" y="477" text-anchor="middle" class="c">TS3 loses Chubby lock</text><text x="462" y="507" text-anchor="middle" class="b">master reassigns safely</text>
<text x="162" y="445" text-anchor="middle" class="h">8 · Recovery</text><text x="162" y="477" text-anchor="middle" class="c">SSTables + redo → TS8</text><text x="162" y="507" text-anchor="middle" class="b">acknowledged row restored</text>
<path d="M275 167H350M575 167H650M875 167H950M1050 230V410M950 472H875M650 472H575M350 472H275" fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="335" y="585" width="530" height="58" rx="15" fill="#17324d"/><text x="600" y="610" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fff">The same row: meta:hash@t42 = 91c4...</text><text x="600" y="630" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#dce5ed">identity stays constant while its physical representation changes</text></svg>
