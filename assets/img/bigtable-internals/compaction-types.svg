<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Bigtable compaction types</title><desc id="desc">Minor compaction flushes memory, merging compaction reduces some files, and major compaction rewrites all files to reclaim hidden data.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".12"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="700" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Three compactions solve three different debts</text><g filter="url(#s)"><rect x="45" y="100" width="340" height="480" rx="21" fill="#edf8f6" stroke="#5ab5a4"/><rect x="430" y="100" width="340" height="480" rx="21" fill="#eef4ff" stroke="#7399dc"/><rect x="815" y="100" width="340" height="480" rx="21" fill="#fff8e7" stroke="#d6a63f"/></g><text x="215" y="140" text-anchor="middle" class="h">Minor</text><text x="600" y="140" text-anchor="middle" class="h">Merging</text><text x="985" y="140" text-anchor="middle" class="h">Major</text>
<rect x="95" y="185" width="120" height="80" rx="13" fill="#fff" stroke="#5ab5a4"/><text x="155" y="215" text-anchor="middle" class="c">memtable</text><text x="155" y="240" text-anchor="middle" class="b">RAM</text><path d="M225 225H300" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="300" y="185" width="55" height="80" rx="10" fill="#fff" stroke="#9377c6"/><text x="327" y="215" text-anchor="middle" class="c">D</text><text x="327" y="240" text-anchor="middle" class="b">SST</text><text x="215" y="315" text-anchor="middle" class="b">free memory</text><text x="215" y="345" text-anchor="middle" class="b">advance redo point</text><text x="215" y="375" text-anchor="middle" class="b">adds one file</text>
<g><rect x="465" y="185" width="55" height="80" rx="10" fill="#fff" stroke="#9377c6"/><rect x="535" y="185" width="55" height="80" rx="10" fill="#fff" stroke="#9377c6"/><rect x="605" y="185" width="55" height="80" rx="10" fill="#fff" stroke="#9377c6"/></g><text x="492" y="230" text-anchor="middle" class="c">A</text><text x="562" y="230" text-anchor="middle" class="c">B</text><text x="632" y="230" text-anchor="middle" class="c">C</text><path d="M670 225H705" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="705" y="185" width="45" height="80" rx="10" fill="#fff" stroke="#7399dc"/><text x="727" y="230" text-anchor="middle" class="c">M</text><text x="600" y="315" text-anchor="middle" class="b">combine selected inputs</text><text x="600" y="345" text-anchor="middle" class="b">fewer read sources</text><text x="600" y="375" text-anchor="middle" class="b">older files may remain</text>
<g><rect x="840" y="185" width="48" height="80" rx="10" fill="#fff" stroke="#9377c6"/><rect x="898" y="185" width="48" height="80" rx="10" fill="#fff" stroke="#9377c6"/><rect x="956" y="185" width="48" height="80" rx="10" fill="#fff" stroke="#9377c6"/><rect x="1014" y="185" width="48" height="80" rx="10" fill="#fff" stroke="#9377c6"/></g><text x="864" y="230" text-anchor="middle" class="c">A</text><text x="922" y="230" text-anchor="middle" class="c">B</text><text x="980" y="230" text-anchor="middle" class="c">C</text><text x="1038" y="230" text-anchor="middle" class="c">D</text><path d="M1072 225H1100" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="1095" y="185" width="40" height="80" rx="10" fill="#fff" stroke="#d6a63f"/><text x="1115" y="230" text-anchor="middle" class="c">Z</text><text x="985" y="315" text-anchor="middle" class="b">rewrite all SSTables</text><text x="985" y="345" text-anchor="middle" class="b">remove tombstones</text><text x="985" y="375" text-anchor="middle" class="b">reclaim expired versions</text>
<rect x="80" y="455" width="270" height="80" rx="14" fill="#fff"/><rect x="465" y="455" width="270" height="80" rx="14" fill="#fff"/><rect x="850" y="455" width="270" height="80" rx="14" fill="#fff"/><text x="215" y="486" text-anchor="middle" class="h">Memory debt</text><text x="215" y="515" text-anchor="middle" class="b">paid frequently</text><text x="600" y="486" text-anchor="middle" class="h">Read debt</text><text x="600" y="515" text-anchor="middle" class="b">paid incrementally</text><text x="985" y="486" text-anchor="middle" class="h">Space + history debt</text><text x="985" y="515" text-anchor="middle" class="b">most expensive rewrite</text><text x="600" y="640" text-anchor="middle" class="b">Compaction trades background write amplification for bounded read and space amplification</text></svg>
