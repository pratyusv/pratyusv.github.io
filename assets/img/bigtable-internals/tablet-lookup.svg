<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Bigtable cold and warm tablet lookup</title><desc id="desc">A cold client follows Chubby, root and metadata before reaching TS3, then caches T18 to TS3 for direct warm requests.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".12"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}.n{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}</style></defs><rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">The expensive lookup happens on a cold or stale cache</text><g filter="url(#s)"><rect x="45" y="115" width="205" height="120" rx="18" fill="#fff" stroke="#b9c9d8"/><rect x="330" y="115" width="205" height="120" rx="18" fill="#fff8e7" stroke="#d6a63f"/><rect x="615" y="115" width="205" height="120" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="900" y="115" width="245" height="120" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="775" y="410" width="300" height="140" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><rect x="130" y="405" width="390" height="150" rx="20" fill="#17324d"/></g>
<text x="147" y="150" text-anchor="middle" class="h">Client W7</text><text x="147" y="180" text-anchor="middle" class="c">row = com.example...</text><text x="147" y="208" text-anchor="middle" class="b">location cache miss</text><text x="432" y="150" text-anchor="middle" class="h">1 · Chubby</text><text x="432" y="180" text-anchor="middle" class="b">find ROOT location</text><text x="717" y="150" text-anchor="middle" class="h">2 · ROOT</text><text x="717" y="180" text-anchor="middle" class="b">find metadata tablet</text><text x="1022" y="150" text-anchor="middle" class="h">3 · METADATA</text><text x="1022" y="180" text-anchor="middle" class="c">T18 → TS3</text><text x="925" y="448" text-anchor="middle" class="h">4 · Tablet server TS3</text><text x="925" y="481" text-anchor="middle" class="c">serve T18 row directly</text><text x="925" y="515" text-anchor="middle" class="b">master is not consulted</text><text x="325" y="445" text-anchor="middle" class="n">Warm path</text><text x="325" y="480" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#fff">cache: [com.example, com.google) → TS3</text><text x="325" y="518" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#dce5ed">future rows in range skip levels 1–3</text>
<path d="M250 175H330M535 175H615M820 175H900M1022 235C1022 315 950 340 925 410" fill="none" stroke="#2f6fdd" stroke-width="3" marker-end="url(#a)"/><path d="M250 215C320 300 320 355 325 405" fill="none" stroke="#55728f" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#a)"/><path d="M520 500H775" stroke="#3b9f8a" stroke-width="5" marker-end="url(#a)"/><text x="648" y="483" text-anchor="middle" class="h">direct read/write</text><text x="600" y="620" text-anchor="middle" class="b">Rejected request after move or split → invalidate cache → repeat lookup</text></svg>
