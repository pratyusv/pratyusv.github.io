<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img"><title>Instance readiness lifecycle</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 15px sans-serif;fill:#17324d}.b{font:12px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="510" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Process life and traffic eligibility are different states</text><g><rect x="55" y="175" width="190" height="100" rx="15" fill="#fff8e8" stroke="#e4b85b"/><text x="150" y="213" text-anchor="middle" class="h">STARTING</text><text x="150" y="243" text-anchor="middle" class="b">live, not ready</text><rect x="350" y="175" width="190" height="100" rx="15" fill="#edf8f6" stroke="#5ab5a4"/><text x="445" y="213" text-anchor="middle" class="h">READY</text><text x="445" y="243" text-anchor="middle" class="b">eligible for traffic</text><rect x="650" y="175" width="190" height="100" rx="15" fill="#fff8e8" stroke="#e4b85b"/><text x="745" y="213" text-anchor="middle" class="h">DRAINING</text><text x="745" y="243" text-anchor="middle" class="b">finish existing only</text><rect x="955" y="175" width="190" height="100" rx="15" fill="#fff1f2" stroke="#d96b79"/><text x="1050" y="213" text-anchor="middle" class="h">STOPPED</text><text x="1050" y="243" text-anchor="middle" class="b">remove record</text></g><path d="M245 225H350M540 225H650M840 225H955" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="600" y="385" text-anchor="middle" class="b">Publish only after initialization; withdraw before terminating the process.</text></svg>
