<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img"><title>Server-side service discovery</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="540" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">A proxy consumes discovery on behalf of simple clients</text><rect x="55" y="200" width="200" height="100" rx="15" fill="#fff" stroke="#b7c8d8"/><text x="155" y="240" text-anchor="middle" class="h">Checkout</text><text x="155" y="270" text-anchor="middle" class="b">stable address</text><rect x="400" y="175" width="250" height="150" rx="16" fill="#fff8e8" stroke="#e4b85b"/><text x="525" y="217" text-anchor="middle" class="h">Load balancer / proxy</text><text x="525" y="250" text-anchor="middle" class="b">snapshot + selection</text><text x="525" y="278" text-anchor="middle" class="b">retries + observability</text><rect x="445" y="70" width="160" height="70" rx="13" fill="#f3effb" stroke="#9377c6"/><text x="525" y="112" text-anchor="middle" class="h">Registry</text><rect x="870" y="130" width="240" height="90" rx="15" fill="#edf8f6" stroke="#5ab5a4"/><text x="990" y="168" text-anchor="middle" class="h">payments-1</text><rect x="870" y="300" width="240" height="90" rx="15" fill="#edf8f6" stroke="#5ab5a4"/><text x="990" y="338" text-anchor="middle" class="h">payments-2</text><path d="M255 250H400M650 230L870 175M650 270L870 345" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M525 140V175" stroke="#9377c6" stroke-width="3" stroke-dasharray="7 5"/><text x="600" y="475" text-anchor="middle" class="b">Policy is centralized, but the proxy tier becomes part of every request.</text></svg>
