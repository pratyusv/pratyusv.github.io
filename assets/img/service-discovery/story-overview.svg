<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img"><title>A static service address becomes stale</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="580" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">A logical service outlives any one process address</text><rect x="70" y="155" width="230" height="110" rx="16" fill="#fff" stroke="#b7c8d8"/><text x="185" y="195" text-anchor="middle" class="h">Checkout</text><text x="185" y="225" text-anchor="middle" class="b">configured 10.4.7.21</text><rect x="485" y="120" width="235" height="120" rx="16" fill="#fff1f2" stroke="#d96b79"/><text x="602" y="163" text-anchor="middle" class="h">payments-1</text><text x="602" y="193" text-anchor="middle" class="b">10.4.7.21 · stopped</text><rect x="855" y="320" width="235" height="120" rx="16" fill="#edf8f6" stroke="#5ab5a4"/><text x="972" y="363" text-anchor="middle" class="h">payments-2</text><text x="972" y="393" text-anchor="middle" class="b">10.4.9.83 · ready</text><path d="M300 205H485" stroke="#d96b79" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M720 205L855 350" stroke="#b7c8d8" stroke-width="3" stroke-dasharray="9 7" fill="none"/><text x="600" y="500" text-anchor="middle" class="b">The old address remains syntactically valid after its ownership disappeared.</text></svg>
