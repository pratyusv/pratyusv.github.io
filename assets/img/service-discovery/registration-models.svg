<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img"><title>Self and third-party service registration</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="540" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Who is responsible for publishing membership?</text><rect x="55" y="100" width="520" height="345" rx="20" fill="#fff" stroke="#5ab5a4"/><text x="315" y="142" text-anchor="middle" class="h">Self-registration</text><rect x="105" y="205" width="180" height="90" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="195" y="241" text-anchor="middle" class="h">Service process</text><text x="195" y="268" text-anchor="middle" class="b">knows readiness</text><rect x="390" y="205" width="140" height="90" rx="14" fill="#f3effb" stroke="#9377c6"/><text x="460" y="241" text-anchor="middle" class="h">Registry</text><text x="460" y="268" text-anchor="middle" class="b">record</text><path d="M285 250H390" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="315" y="365" text-anchor="middle" class="b">Process owns credentials, renewals, and cleanup.</text><rect x="625" y="100" width="520" height="345" rx="20" fill="#fff" stroke="#e4b85b"/><text x="885" y="142" text-anchor="middle" class="h">Controller registration</text><rect x="665" y="205" width="155" height="90" rx="14" fill="#fff8e8" stroke="#e4b85b"/><text x="742" y="241" text-anchor="middle" class="h">Orchestrator</text><text x="742" y="268" text-anchor="middle" class="b">observes process</text><rect x="955" y="205" width="145" height="90" rx="14" fill="#f3effb" stroke="#9377c6"/><text x="1027" y="241" text-anchor="middle" class="h">Registry</text><text x="1027" y="268" text-anchor="middle" class="b">record</text><path d="M820 250H955" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="885" y="365" text-anchor="middle" class="b">Platform owns identity and lifecycle publication.</text><text x="600" y="500" text-anchor="middle" class="b">Both models need idempotent, generation-aware records.</text></svg>
