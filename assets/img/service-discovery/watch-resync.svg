<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img"><title>Watch notification and snapshot resynchronization</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 15px sans-serif;fill:#17324d}.b{font:12px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="540" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">A notification is a reason to advance a versioned view</text><g><rect x="65" y="185" width="210" height="105" rx="15" fill="#edf8f6" stroke="#5ab5a4"/><text x="170" y="224" text-anchor="middle" class="h">Read snapshot v17</text><text x="170" y="254" text-anchor="middle" class="b">complete initial state</text><rect x="360" y="185" width="210" height="105" rx="15" fill="#fff8e8" stroke="#e4b85b"/><text x="465" y="224" text-anchor="middle" class="h">Watch after v17</text><text x="465" y="254" text-anchor="middle" class="b">stream changes</text><rect x="655" y="185" width="210" height="105" rx="15" fill="#fff1f2" stroke="#d96b79"/><text x="760" y="224" text-anchor="middle" class="h">Gap / disconnect</text><text x="760" y="254" text-anchor="middle" class="b">version uncertain</text><rect x="950" y="185" width="185" height="105" rx="15" fill="#f3effb" stroke="#9377c6"/><text x="1042" y="224" text-anchor="middle" class="h">Re-read latest</text><text x="1042" y="254" text-anchor="middle" class="b">snapshot v21</text></g><path d="M275 237H360M570 237H655M865 237H950" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="600" y="400" text-anchor="middle" class="b">Reconnect with jitter so every client does not resynchronize at once.</text></svg>
