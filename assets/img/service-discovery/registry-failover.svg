<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Service registry leader failover</title><desc id="d">A committed registry update survives leader failure while watchers reconnect by version and resynchronize missed changes.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 26px system-ui;fill:#17324d}.h{font:700 15px system-ui;fill:#17324d}.b{font:13px system-ui;fill:#45627d}.w{font:700 14px system-ui;fill:#fff}</style></defs><rect width="1200" height="620" rx="26" fill="#f7fafc"/><text x="600" y="48" text-anchor="middle" class="t">Registry failover preserves history, not notification delivery</text><line x1="90" y1="300" x2="1110" y2="300" stroke="#9bb0c2" stroke-width="4" marker-end="url(#a)"/><rect x="35" y="115" width="190" height="120" rx="15" fill="#edf8f6" stroke="#5ab5a4"/><text x="130" y="151" text-anchor="middle" class="h">1 · Commit v18</text><text x="130" y="181" text-anchor="middle" class="b">quorum stores endpoint</text><text x="130" y="204" text-anchor="middle" class="b">controller gets success</text><circle cx="130" cy="300" r="10" fill="#5ab5a4"/><rect x="270" y="355" width="190" height="120" rx="15" fill="#fff0f0" stroke="#d86969"/><text x="365" y="391" text-anchor="middle" class="h">2 · Leader fails</text><text x="365" y="421" text-anchor="middle" class="b">some watches missed v18</text><text x="365" y="444" text-anchor="middle" class="b">committed log survives</text><circle cx="365" cy="300" r="10" fill="#d86969"/><rect x="505" y="115" width="190" height="120" rx="15" fill="#fff8e8" stroke="#e4b85b"/><text x="600" y="151" text-anchor="middle" class="h">3 · Elect term 10</text><text x="600" y="181" text-anchor="middle" class="b">committed replica wins</text><text x="600" y="204" text-anchor="middle" class="b">old term is fenced</text><circle cx="600" cy="300" r="10" fill="#e4b85b"/><rect x="740" y="355" width="190" height="120" rx="15" fill="#f3effb" stroke="#9377c6"/><text x="835" y="391" text-anchor="middle" class="h">4 · Resume after v17</text><text x="835" y="421" text-anchor="middle" class="b">watch reconnects</text><text x="835" y="444" text-anchor="middle" class="b">gap is detected</text><circle cx="835" cy="300" r="10" fill="#9377c6"/><rect x="975" y="115" width="190" height="120" rx="15" fill="#edf8f6" stroke="#5ab5a4"/><text x="1070" y="151" text-anchor="middle" class="h">5 · Read snapshot</text><text x="1070" y="181" text-anchor="middle" class="b">caller installs full v18</text><text x="1070" y="204" text-anchor="middle" class="b">then resumes watching</text><circle cx="1070" cy="300" r="10" fill="#5ab5a4"/><rect x="175" y="520" width="850" height="56" rx="14" fill="#17324d"/><text x="600" y="554" text-anchor="middle" class="w">Consensus recovers committed membership; versioned re-read recovers each observer's view.</text></svg>
