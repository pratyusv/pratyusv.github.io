<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Highly available service registry</title><desc id="d">Controllers write through a leader to a quorum of registry replicas while callers consume cached snapshots outside the request path.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 26px system-ui;fill:#17324d}.h{font:700 17px system-ui;fill:#17324d}.b{font:14px system-ui;fill:#45627d}.s{font:12px system-ui;fill:#45627d}.w{font:700 15px system-ui;fill:#fff}</style></defs><rect width="1200" height="680" rx="26" fill="#f7fafc"/><text x="600" y="48" text-anchor="middle" class="t">One registry namespace, replicated across failure domains</text><rect x="45" y="165" width="190" height="105" rx="15" fill="#fff8e8" stroke="#e4b85b"/><text x="140" y="202" text-anchor="middle" class="h">Controller</text><text x="140" y="229" text-anchor="middle" class="b">REGISTER generation 42</text><rect x="330" y="100" width="540" height="410" rx="22" fill="#f3effb" stroke="#9377c6"/><text x="600" y="136" text-anchor="middle" class="h">Registry cluster</text><rect x="375" y="180" width="180" height="100" rx="14" fill="#17324d"/><text x="465" y="214" text-anchor="middle" class="w">R1 · leader</text><text x="465" y="240" text-anchor="middle" class="s" fill="#fff">term 9 · commits writes</text><text x="465" y="262" text-anchor="middle" class="s" fill="#fff">version 18</text><rect x="645" y="175" width="180" height="88" rx="14" fill="#fff" stroke="#9377c6"/><text x="735" y="209" text-anchor="middle" class="h">R2 · follower</text><text x="735" y="234" text-anchor="middle" class="s">failure domain B</text><rect x="645" y="325" width="180" height="88" rx="14" fill="#fff" stroke="#9377c6"/><text x="735" y="359" text-anchor="middle" class="h">R3 · follower</text><text x="735" y="384" text-anchor="middle" class="s">failure domain C</text><path d="M555 215H645M555 255L645 350" stroke="#55728f" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="600" y="460" text-anchor="middle" class="b">Acknowledge only after a quorum persists the log entry.</text><path d="M235 217H330" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="965" y="165" width="190" height="105" rx="15" fill="#edf8f6" stroke="#5ab5a4"/><text x="1060" y="202" text-anchor="middle" class="h">Watch fanout</text><text x="1060" y="229" text-anchor="middle" class="b">snapshot version 18</text><path d="M870 217H965" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="875" y="360" width="280" height="150" rx="17" fill="#edf8f6" stroke="#5ab5a4"/><text x="1015" y="397" text-anchor="middle" class="h">Callers and proxies</text><text x="1015" y="427" text-anchor="middle" class="b">cache a complete endpoint snapshot</text><text x="1015" y="452" text-anchor="middle" class="b">business requests bypass registry</text><text x="1015" y="477" text-anchor="middle" class="b">bounded operation during outage</text><path d="M1060 270V360" stroke="#55728f" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="150" y="575" width="900" height="58" rx="14" fill="#17324d"/><text x="600" y="610" text-anchor="middle" class="w">Quorum protects the control-plane history; cached snapshots preserve the application data path.</text></svg>
