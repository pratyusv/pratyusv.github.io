<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img"><title>Client-side service discovery</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="540" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">The client library resolves, selects, and calls directly</text><rect x="70" y="185" width="250" height="120" rx="16" fill="#fff8e8" stroke="#e4b85b"/><text x="195" y="225" text-anchor="middle" class="h">Checkout library</text><text x="195" y="254" text-anchor="middle" class="b">snapshot v18</text><text x="195" y="280" text-anchor="middle" class="b">selection policy</text><rect x="475" y="95" width="250" height="100" rx="16" fill="#f3effb" stroke="#9377c6"/><text x="600" y="135" text-anchor="middle" class="h">Registry</text><text x="600" y="164" text-anchor="middle" class="b">control-plane update</text><rect x="870" y="130" width="240" height="90" rx="15" fill="#edf8f6" stroke="#5ab5a4"/><text x="990" y="168" text-anchor="middle" class="h">payments-1</text><text x="990" y="195" text-anchor="middle" class="b">eligible endpoint</text><rect x="870" y="300" width="240" height="90" rx="15" fill="#edf8f6" stroke="#5ab5a4"/><text x="990" y="338" text-anchor="middle" class="h">payments-2</text><text x="990" y="365" text-anchor="middle" class="b">eligible endpoint</text><path d="M320 205L475 160" stroke="#55728f" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#a)"/><path d="M320 245L870 175M320 255L870 345" stroke="#3b9f8a" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="600" y="475" text-anchor="middle" class="b">No mandatory proxy hop; every client must implement the policy correctly.</text></svg>
