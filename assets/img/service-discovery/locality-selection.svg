<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img"><title>Discovery filtering and endpoint selection</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 15px sans-serif;fill:#17324d}.b{font:12px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="590" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Discovery narrows candidates; balancing chooses one</text><rect x="55" y="160" width="230" height="180" rx="18" fill="#f3effb" stroke="#9377c6"/><text x="170" y="202" text-anchor="middle" class="h">Registry snapshot</text><text x="170" y="242" text-anchor="middle" class="b">6 registered endpoints</text><text x="170" y="272" text-anchor="middle" class="b">zone · revision · state</text><rect x="380" y="135" width="280" height="230" rx="18" fill="#fff8e8" stroke="#e4b85b"/><text x="520" y="177" text-anchor="middle" class="h">Eligibility filter</text><text x="520" y="220" text-anchor="middle" class="b">authorized revision</text><text x="520" y="250" text-anchor="middle" class="b">READY and not draining</text><text x="520" y="280" text-anchor="middle" class="b">prefer caller zone</text><text x="520" y="310" text-anchor="middle" class="b">retain spillover candidates</text><rect x="755" y="160" width="210" height="180" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><text x="860" y="202" text-anchor="middle" class="h">Eligible set</text><text x="860" y="245" text-anchor="middle" class="b">3 local endpoints</text><text x="860" y="275" text-anchor="middle" class="b">2 remote backups</text><rect x="1010" y="190" width="145" height="120" rx="15" fill="#17324d"/><text x="1082" y="232" text-anchor="middle" style="font:700 14px sans-serif;fill:#fff">Selected</text><text x="1082" y="262" text-anchor="middle" style="font:12px sans-serif;fill:#dce8f2">payments-7f9c</text><path d="M285 250H380M660 250H755M965 250H1010" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="600" y="500" text-anchor="middle" class="b">A healthy endpoint can still be ineligible because of revision, ownership, or policy.</text></svg>
