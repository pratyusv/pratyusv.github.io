<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img"><title>Regional service discovery failover</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="580" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Another address helps only when the whole dependency path can fail over</text><rect x="70" y="135" width="430" height="300" rx="20" fill="#fff1f2" stroke="#d96b79"/><text x="285" y="178" text-anchor="middle" class="h">London region · unavailable</text><text x="285" y="245" text-anchor="middle" class="b">payment instances</text><text x="285" y="285" text-anchor="middle" class="b">regional database</text><text x="285" y="325" text-anchor="middle" class="b">network and dependencies</text><path d="M215 365L355 225M355 365L215 225" stroke="#d96b79" stroke-width="8"/><rect x="700" y="135" width="430" height="300" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="915" y="178" text-anchor="middle" class="h">Dublin region · candidate</text><text x="915" y="235" text-anchor="middle" class="b">reserved compute capacity</text><text x="915" y="275" text-anchor="middle" class="b">compatible data and authority</text><text x="915" y="315" text-anchor="middle" class="b">bounded retries and ingress</text><path d="M500 285H700" stroke="#55728f" stroke-width="5" stroke-dasharray="10 7" fill="none" marker-end="url(#a)"/><text x="600" y="510" text-anchor="middle" class="b">Discovery can redirect traffic; it cannot create capacity or safe data ownership.</text></svg>
