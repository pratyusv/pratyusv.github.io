<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img"><title>Service registry control-plane model</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="600" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">The registry is a control plane, not the request data path</text><rect x="65" y="130" width="230" height="105" rx="16" fill="#edf8f6" stroke="#5ab5a4"/><text x="180" y="170" text-anchor="middle" class="h">Payment instances</text><text x="180" y="200" text-anchor="middle" class="b">register + renew</text><rect x="475" y="115" width="250" height="135" rx="16" fill="#f3effb" stroke="#9377c6"/><text x="600" y="158" text-anchor="middle" class="h">Service registry</text><text x="600" y="190" text-anchor="middle" class="b">versioned membership</text><text x="600" y="218" text-anchor="middle" class="b">small metadata</text><rect x="905" y="130" width="230" height="105" rx="16" fill="#fff8e8" stroke="#e4b85b"/><text x="1020" y="170" text-anchor="middle" class="h">Callers / proxies</text><text x="1020" y="200" text-anchor="middle" class="b">cache snapshots</text><path d="M295 182H475M725 182H905" stroke="#55728f" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#a)"/><rect x="155" y="360" width="230" height="100" rx="16" fill="#fff" stroke="#b7c8d8"/><text x="270" y="400" text-anchor="middle" class="h">Checkout caller</text><text x="270" y="428" text-anchor="middle" class="b">business request</text><rect x="815" y="360" width="230" height="100" rx="16" fill="#fff" stroke="#b7c8d8"/><text x="930" y="400" text-anchor="middle" class="h">Payment instance</text><text x="930" y="428" text-anchor="middle" class="b">business response</text><path d="M385 410H815" stroke="#3b9f8a" stroke-width="6" fill="none" marker-end="url(#a)"/><text x="600" y="395" text-anchor="middle" class="b">direct data path</text><text x="600" y="535" text-anchor="middle" class="b">Cached discovery lets ordinary calls continue through a short registry outage.</text></svg>
