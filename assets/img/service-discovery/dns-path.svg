<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img"><title>DNS service discovery path</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 15px sans-serif;fill:#17324d}.b{font:12px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="540" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">DNS discovery deliberately propagates through caches</text><g><rect x="55" y="190" width="190" height="100" rx="15" fill="#fff" stroke="#b7c8d8"/><text x="150" y="228" text-anchor="middle" class="h">Application</text><text x="150" y="258" text-anchor="middle" class="b">resolve name</text><rect x="330" y="190" width="210" height="100" rx="15" fill="#fff8e8" stroke="#e4b85b"/><text x="435" y="228" text-anchor="middle" class="h">Recursive resolver</text><text x="435" y="258" text-anchor="middle" class="b">cache until TTL</text><rect x="625" y="190" width="210" height="100" rx="15" fill="#f3effb" stroke="#9377c6"/><text x="730" y="228" text-anchor="middle" class="h">Authoritative DNS</text><text x="730" y="258" text-anchor="middle" class="b">published records</text><rect x="920" y="170" width="225" height="140" rx="15" fill="#edf8f6" stroke="#5ab5a4"/><text x="1032" y="208" text-anchor="middle" class="h">Endpoint answer</text><text x="1032" y="240" text-anchor="middle" class="b">10.4.9.83</text><text x="1032" y="268" text-anchor="middle" class="b">10.4.9.91</text></g><path d="M245 240H330M540 240H625M835 240H920" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="600" y="400" text-anchor="middle" class="b">A record change is visible only after each relevant cache refreshes.</text></svg>
