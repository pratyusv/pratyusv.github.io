<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"><title>End-to-end service instance discovery lifecycle</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 14px sans-serif;fill:#17324d}.b{font:11px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="640" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">An endpoint moves through one controlled lifecycle</text><g><rect x="45" y="155" width="150" height="95" rx="14" fill="#fff8e8" stroke="#e4b85b"/><text x="120" y="190" text-anchor="middle" class="h">START</text><text x="120" y="218" text-anchor="middle" class="b">not ready</text><rect x="240" y="155" width="150" height="95" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="315" y="190" text-anchor="middle" class="h">REGISTER</text><text x="315" y="218" text-anchor="middle" class="b">generation 42</text><rect x="435" y="155" width="150" height="95" rx="14" fill="#f3effb" stroke="#9377c6"/><text x="510" y="190" text-anchor="middle" class="h">PROPAGATE</text><text x="510" y="218" text-anchor="middle" class="b">snapshot v18</text><rect x="630" y="155" width="150" height="95" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="705" y="190" text-anchor="middle" class="h">SELECT</text><text x="705" y="218" text-anchor="middle" class="b">serve calls</text><rect x="825" y="155" width="150" height="95" rx="14" fill="#fff8e8" stroke="#e4b85b"/><text x="900" y="190" text-anchor="middle" class="h">DRAIN</text><text x="900" y="218" text-anchor="middle" class="b">no new calls</text><rect x="1020" y="155" width="140" height="95" rx="14" fill="#fff1f2" stroke="#d96b79"/><text x="1090" y="190" text-anchor="middle" class="h">REMOVE</text><text x="1090" y="218" text-anchor="middle" class="b">lease/delete</text></g><path d="M195 202H240M390 202H435M585 202H630M780 202H825M975 202H1020" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="235" y="365" width="730" height="120" rx="18" fill="#fff" stroke="#b7c8d8"/><text x="600" y="405" text-anchor="middle" class="h">Failure shortcut</text><text x="600" y="438" text-anchor="middle" class="b">local passive ejection stops selection before global lease expiry</text><text x="600" y="465" text-anchor="middle" class="b">registry removal eventually converges every caller to the new snapshot</text><path d="M705 250V365" stroke="#d96b79" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#a)"/><text x="600" y="570" text-anchor="middle" class="b">Readiness protects startup; draining protects shutdown; leases contain silent failure.</text></svg>
