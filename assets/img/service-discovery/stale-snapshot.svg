<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img"><title>Overlapping service discovery snapshots</title><defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Membership change is observed at different times</text><line x1="80" y1="250" x2="1120" y2="250" stroke="#b7c8d8" stroke-width="3"/><circle cx="340" cy="250" r="9" fill="#d96b79"/><text x="340" y="215" text-anchor="middle" class="h">registry publishes v18</text><circle cx="700" cy="250" r="9" fill="#e4b85b"/><text x="700" y="300" text-anchor="middle" class="h">caller A refreshes</text><circle cx="980" cy="250" r="9" fill="#5ab5a4"/><text x="980" y="215" text-anchor="middle" class="h">caller B refreshes</text><rect x="120" y="340" width="440" height="75" rx="14" fill="#fff1f2" stroke="#d96b79"/><text x="340" y="373" text-anchor="middle" class="h">v17 still exists at callers</text><text x="340" y="398" text-anchor="middle" class="b">includes removed payments-2</text><rect x="700" y="340" width="400" height="75" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="900" y="373" text-anchor="middle" class="h">v18 gradually replaces it</text><text x="900" y="398" text-anchor="middle" class="b">safe transitions tolerate overlap</text><text x="600" y="470" text-anchor="middle" class="b">No control plane produces one simultaneous global observation.</text></svg>
