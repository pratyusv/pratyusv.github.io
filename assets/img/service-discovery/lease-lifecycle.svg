<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img"><title>Service registration lease lifecycle</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 15px sans-serif;fill:#17324d}.b{font:12px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">A lease turns missing renewals into eventual removal</text><g><rect x="65" y="180" width="210" height="100" rx="16" fill="#edf8f6" stroke="#5ab5a4"/><text x="170" y="218" text-anchor="middle" class="h">REGISTERED</text><text x="170" y="248" text-anchor="middle" class="b">lease L42 granted</text><rect x="360" y="180" width="210" height="100" rx="16" fill="#edf8f6" stroke="#5ab5a4"/><text x="465" y="218" text-anchor="middle" class="h">RENEWING</text><text x="465" y="248" text-anchor="middle" class="b">heartbeat before expiry</text><rect x="655" y="180" width="210" height="100" rx="16" fill="#fff8e8" stroke="#e4b85b"/><text x="760" y="218" text-anchor="middle" class="h">SUSPECT WINDOW</text><text x="760" y="248" text-anchor="middle" class="b">renewal missing</text><rect x="950" y="180" width="185" height="100" rx="16" fill="#fff1f2" stroke="#d96b79"/><text x="1042" y="218" text-anchor="middle" class="h">EXPIRED</text><text x="1042" y="248" text-anchor="middle" class="b">record removed</text></g><path d="M275 230H360M570 230H655M865 230H950" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M465 180V115H170V180" stroke="#3b9f8a" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="318" y="100" text-anchor="middle" class="b">successful renew extends lifetime</text><text x="600" y="390" text-anchor="middle" class="b">Expiry is a bounded failure-detector conclusion, not proof the process stopped.</text></svg>
