<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" role="img"><title>Lease grant, renewal, expiry, and takeover lifecycle</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:14px monospace;fill:#17324d}</style><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">A lease bounds how long silent ownership remains current</text><line x1="90" y1="280" x2="1110" y2="280" stroke="#b9c9d8" stroke-width="5"/><g><circle cx="150" cy="280" r="12" fill="#7399dc"/><circle cx="390" cy="280" r="12" fill="#7399dc"/><circle cx="650" cy="280" r="12" fill="#d97979"/><circle cx="900" cy="280" r="12" fill="#5ab5a4"/></g><text x="150" y="235" text-anchor="middle" class="h">grant W1</text><text x="150" y="325" text-anchor="middle" class="c">L-81 · fence 41</text><text x="390" y="235" text-anchor="middle" class="h">renew</text><text x="390" y="325" text-anchor="middle" class="b">extend authority TTL</text><text x="650" y="235" text-anchor="middle" class="h">expiry</text><text x="650" y="325" text-anchor="middle" class="b">W1 claim removed</text><text x="900" y="235" text-anchor="middle" class="h">grant W2</text><text x="900" y="325" text-anchor="middle" class="c">L-82 · fence 42</text><path d="M170 160H625" stroke="#7399dc" stroke-width="10" marker-end="url(#a)"/><text x="397" y="135" text-anchor="middle" class="b">W1 ownership window</text><path d="M675 390H1080" stroke="#5ab5a4" stroke-width="10" marker-end="url(#a)"/><text x="877" y="430" text-anchor="middle" class="b">W2 ownership window</text></svg>
