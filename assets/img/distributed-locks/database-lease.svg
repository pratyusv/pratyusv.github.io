<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" role="img"><title>Database-backed lease takeover transaction</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:14px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="530" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">A database lease needs one takeover transaction</text><rect x="55" y="160" width="220" height="120" rx="18" fill="#eef4ff" stroke="#7399dc"/><text x="165" y="202" text-anchor="middle" class="h">W2 attempts takeover</text><text x="165" y="240" text-anchor="middle" class="c">resource = report</text><path d="M275 220H390" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="390" y="90" width="755" height="300" rx="22" fill="#17324d"/><text x="767" y="132" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff">Serializable database transaction</text><g><rect x="430" y="175" width="180" height="100" rx="14" fill="#fff"/><rect x="670" y="175" width="180" height="100" rx="14" fill="#fff8e7"/><rect x="910" y="175" width="190" height="100" rx="14" fill="#edf8f6"/></g><text x="520" y="212" text-anchor="middle" class="h">Lock row</text><text x="520" y="246" text-anchor="middle" class="c">FOR UPDATE</text><text x="760" y="212" text-anchor="middle" class="h">Check expiry</text><text x="760" y="246" text-anchor="middle" class="c">database clock</text><text x="1005" y="212" text-anchor="middle" class="h">Replace claim</text><text x="1005" y="246" text-anchor="middle" class="c">fence 41 → 42</text><g stroke="#dce5ed" stroke-width="3" marker-end="url(#a)"><path d="M610 225H670"/><path d="M850 225H910"/></g><text x="767" y="330" text-anchor="middle" font-family="monospace" font-size="13" fill="#dce5ed">owner=W2 · lease=L-82 · expires_at=db_now+TTL</text><text x="600" y="450" text-anchor="middle" class="b">The fence allocation and ownership replacement must commit together.</text></svg>
