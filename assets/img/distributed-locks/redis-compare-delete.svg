<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" role="img"><title>Redis lease acquisition and compare-before-delete release</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:14px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Lease identity prevents an old client from deleting a new claim</text><rect x="50" y="105" width="280" height="110" rx="18" fill="#eef4ff" stroke="#7399dc"/><text x="190" y="145" text-anchor="middle" class="h">Acquire</text><text x="190" y="180" text-anchor="middle" class="c">SET key 7f32 NX PX 30000</text><path d="M330 160H460" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="460" y="95" width="680" height="130" rx="20" fill="#17324d"/><text x="800" y="135" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">Redis key</text><text x="800" y="173" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff">lock:report = 7f32… · TTL 30 s</text><rect x="50" y="315" width="280" height="110" rx="18" fill="#fff8e7" stroke="#d6a63f"/><text x="190" y="355" text-anchor="middle" class="h">Release / renew</text><text x="190" y="390" text-anchor="middle" class="c">expected value = 7f32</text><path d="M330 370H460" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="460" y="300" width="680" height="145" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="800" y="338" text-anchor="middle" class="h">One atomic server operation</text><text x="800" y="375" text-anchor="middle" class="c">IF value == 7f32 THEN delete / extend</text><text x="800" y="412" text-anchor="middle" class="b">mismatch → this is not your lease; change nothing</text></svg>
