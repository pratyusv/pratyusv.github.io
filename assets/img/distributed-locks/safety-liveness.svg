<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" role="img"><title>Safety, liveness, and policy properties of a distributed lock</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 18px sans-serif;fill:#17324d}.b{font:14px sans-serif;fill:#45627d}.c{font:14px monospace;fill:#17324d}</style><rect width="1200" height="500" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">A lock name does not define its contract</text><rect x="55" y="105" width="330" height="315" rx="20" fill="#fff0f0" stroke="#d97979"/><text x="220" y="148" text-anchor="middle" class="h">Safety</text><text x="220" y="198" text-anchor="middle" class="c">never accept stale work</text><text x="220" y="248" text-anchor="middle" class="b">requires ordered grants</text><text x="220" y="278" text-anchor="middle" class="b">and resource validation</text><text x="220" y="350" text-anchor="middle" class="h">must hold during failures</text><rect x="435" y="105" width="330" height="315" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><text x="600" y="148" text-anchor="middle" class="h">Liveness</text><text x="600" y="198" text-anchor="middle" class="c">eventually permit takeover</text><text x="600" y="248" text-anchor="middle" class="b">needs expiry, detection,</text><text x="600" y="278" text-anchor="middle" class="b">or administrative recovery</text><text x="600" y="350" text-anchor="middle" class="h">may pause without quorum</text><rect x="815" y="105" width="330" height="315" rx="20" fill="#eef4ff" stroke="#7399dc"/><text x="980" y="148" text-anchor="middle" class="h">Policy</text><text x="980" y="198" text-anchor="middle" class="c">fairness · scope · timeout</text><text x="980" y="248" text-anchor="middle" class="b">controls admission</text><text x="980" y="278" text-anchor="middle" class="b">and operator behavior</text><text x="980" y="350" text-anchor="middle" class="h">chosen for the workload</text></svg>
