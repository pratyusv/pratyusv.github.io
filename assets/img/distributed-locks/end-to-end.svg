<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" role="img"><title>End-to-end fenced report worker handoff</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="660" rx="24" fill="#f7fafc"/><text x="600" y="43" text-anchor="middle" class="t">Safe takeover requires cooperation at three boundaries</text><g><rect x="45" y="90" width="255" height="115" rx="18" fill="#fff8e7" stroke="#d6a63f"/><rect x="45" y="365" width="255" height="115" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="450" y="220" width="300" height="150" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="900" y="220" width="255" height="150" rx="20" fill="#17324d"/></g><text x="172" y="130" text-anchor="middle" class="h">W1 old holder</text><text x="172" y="165" text-anchor="middle" class="c">L-81 · fence 41 · pause</text><text x="172" y="405" text-anchor="middle" class="h">W2 current holder</text><text x="172" y="440" text-anchor="middle" class="c">L-82 · fence 42</text><text x="600" y="262" text-anchor="middle" class="h">Consensus authority</text><text x="600" y="300" text-anchor="middle" class="c">expire 41 → grant 42</text><text x="600" y="335" text-anchor="middle" class="b">restores progress</text><text x="1027" y="262" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">Report store</text><text x="1027" y="303" text-anchor="middle" font-family="monospace" font-size="12" fill="#a9eadc">accept 42</text><text x="1027" y="338" text-anchor="middle" font-family="monospace" font-size="12" fill="#ffb3b3">reject 41</text><path d="M300 422C390 422 390 337 450 337" stroke="#5ab5a4" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="370" y="445" class="b">acquire</text><path d="M750 320H900" stroke="#55728f" stroke-width="3" stroke-dasharray="8 6"/><text x="825" y="305" text-anchor="middle" class="b">ordered token</text><path d="M300 422C590 545 760 430 900 340" stroke="#5ab5a4" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="620" y="525" text-anchor="middle" class="c">publish(report, 42) → applied</text><path d="M300 147C610 55 770 160 900 250" stroke="#d97979" stroke-width="4" stroke-dasharray="10 7" fill="none" marker-end="url(#a)"/><text x="620" y="98" text-anchor="middle" class="c">late publish(report, 41) → stale_owner</text><rect x="310" y="575" width="580" height="55" rx="14" fill="#fff" stroke="#b9c9d8"/><text x="600" y="609" text-anchor="middle" class="b">authority: liveness · client: stop on loss · resource: safety</text></svg>
