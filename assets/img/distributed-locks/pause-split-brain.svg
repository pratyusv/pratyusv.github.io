<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" role="img"><title>A process pause creates overlapping ownership beliefs after lease expiry</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="580" rx="24" fill="#f7fafc"/><text x="600" y="43" text-anchor="middle" class="t">Expiry changes authority state, not old process memory</text><text x="100" y="115" class="h">W1</text><text x="100" y="245" class="h">authority</text><text x="100" y="375" class="h">W2</text><text x="100" y="505" class="h">store</text><g stroke="#b9c9d8" stroke-width="2"><line x1="210" y1="110" x2="1120" y2="110"/><line x1="210" y1="240" x2="1120" y2="240"/><line x1="210" y1="370" x2="1120" y2="370"/><line x1="210" y1="500" x2="1120" y2="500"/></g><rect x="310" y="82" width="350" height="56" rx="12" fill="#fff8e7" stroke="#d6a63f"/><text x="485" y="116" text-anchor="middle" class="c">pause: no code, no heartbeats</text><line x1="270" y1="110" x2="270" y2="240" stroke="#7399dc" stroke-width="3"/><text x="280" y="175" class="b">grant 41</text><line x1="680" y1="215" x2="680" y2="265" stroke="#d97979" stroke-width="5"/><text x="695" y="235" class="b">expire 41</text><line x1="740" y1="240" x2="740" y2="370" stroke="#5ab5a4" stroke-width="3"/><text x="750" y="310" class="b">grant 42</text><line x1="845" y1="370" x2="845" y2="500" stroke="#5ab5a4" stroke-width="3"/><text x="855" y="438" class="c">write(42)</text><line x1="1030" y1="110" x2="1030" y2="500" stroke="#d97979" stroke-width="3"/><text x="1040" y="290" class="c">late write(41)</text><rect x="1000" y="82" width="90" height="56" rx="12" fill="#fff0f0" stroke="#d97979"/><text x="1045" y="116" text-anchor="middle" class="b">resume</text></svg>
