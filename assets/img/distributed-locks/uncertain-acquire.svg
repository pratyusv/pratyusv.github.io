<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" role="img"><title>Lost acquisition response and idempotent recovery</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">A timeout does not reveal whether acquisition committed</text><text x="145" y="110" text-anchor="middle" class="h">Worker W1</text><text x="880" y="110" text-anchor="middle" class="h">Authority</text><line x1="145" y1="135" x2="145" y2="450" stroke="#b9c9d8" stroke-width="3"/><line x1="880" y1="135" x2="880" y2="450" stroke="#b9c9d8" stroke-width="3"/><path d="M145 185H880" stroke="#7399dc" stroke-width="3" marker-end="url(#a)"/><text x="510" y="172" text-anchor="middle" class="c">Acquire(resource, request-81)</text><rect x="775" y="210" width="210" height="80" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="880" y="242" text-anchor="middle" class="b">commit one grant</text><text x="880" y="269" text-anchor="middle" class="c">L-81 · fence 41</text><path d="M880 320H455" stroke="#d97979" stroke-width="3" stroke-dasharray="10 8"/><path d="M425 305l30 15-30 15" fill="#d97979"/><text x="650" y="307" text-anchor="middle" class="b">response lost</text><rect x="50" y="335" width="190" height="80" rx="14" fill="#fff8e7" stroke="#d6a63f"/><text x="145" y="368" text-anchor="middle" class="h">unknown outcome</text><text x="145" y="396" text-anchor="middle" class="c">do not invent new ID</text><path d="M240 395H880" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><text x="550" y="383" text-anchor="middle" class="c">Lookup/retry(request-81)</text><text x="880" y="432" text-anchor="middle" class="b">return original L-81</text></svg>
