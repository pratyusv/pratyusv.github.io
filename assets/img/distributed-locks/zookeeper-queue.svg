<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" role="img"><title>ZooKeeper ephemeral sequential lock queue</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:14px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="550" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">ZooKeeper orders contenders and wakes one successor</text><rect x="60" y="95" width="1080" height="90" rx="18" fill="#17324d"/><text x="600" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">/locks/report-2026-07</text><text x="600" y="163" text-anchor="middle" font-family="monospace" font-size="13" fill="#dce5ed">ephemeral sequential children</text><g><rect x="80" y="280" width="290" height="120" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="455" y="280" width="290" height="120" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="830" y="280" width="290" height="120" rx="18" fill="#fff" stroke="#b9c9d8"/></g><text x="225" y="320" text-anchor="middle" class="h">W1 owns</text><text x="225" y="355" text-anchor="middle" class="c">req-a7-0000000041</text><text x="225" y="383" text-anchor="middle" class="b">smallest sequence</text><text x="600" y="320" text-anchor="middle" class="h">W2 waits</text><text x="600" y="355" text-anchor="middle" class="c">req-b2-0000000042</text><text x="600" y="383" text-anchor="middle" class="b">watch predecessor 41</text><text x="975" y="320" text-anchor="middle" class="h">W3 waits</text><text x="975" y="355" text-anchor="middle" class="c">req-c9-0000000043</text><text x="975" y="383" text-anchor="middle" class="b">watch predecessor 42</text><path d="M455 340H370" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><path d="M830 340H745" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><text x="600" y="470" text-anchor="middle" class="b">session expiry deletes W1's node → only W2's predecessor watch fires</text></svg>
