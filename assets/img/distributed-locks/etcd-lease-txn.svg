<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" role="img"><title>etcd lease-bound lock key and transaction validation</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:14px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">etcd ties liveness to a lease and safety to revision checks</text><rect x="50" y="130" width="220" height="120" rx="18" fill="#fff" stroke="#b9c9d8"/><text x="160" y="170" text-anchor="middle" class="h">Worker W2</text><text x="160" y="207" text-anchor="middle" class="c">keepalive lease 812</text><path d="M270 190H410" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="410" y="95" width="340" height="190" rx="20" fill="#eef4ff" stroke="#7399dc"/><text x="580" y="135" text-anchor="middle" class="h">etcd key space</text><text x="580" y="175" text-anchor="middle" class="c">lock key /mutex/…</text><text x="580" y="207" text-anchor="middle" class="c">lease = 812</text><text x="580" y="239" text-anchor="middle" class="c">create_revision = 9401</text><rect x="410" y="360" width="680" height="130" rx="20" fill="#17324d"/><text x="750" y="400" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">One etcd transaction</text><text x="750" y="438" text-anchor="middle" font-family="monospace" font-size="13" fill="#fff">IF ownership revision == 9401 THEN update config</text><text x="750" y="468" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffcf99">ELSE reject stale holder</text><path d="M580 285V360" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="840" y="115" width="250" height="110" rx="16" fill="#fff8e7" stroke="#d6a63f"/><text x="965" y="155" text-anchor="middle" class="h">Lease expires</text><text x="965" y="190" text-anchor="middle" class="b">attached lock key deleted</text><path d="M840 170H750" stroke="#d97979" stroke-width="3" marker-end="url(#a)"/></svg>
