<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" role="img"><title>A protected resource accepts a newer fence and rejects an older fence</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:14px sans-serif;fill:#45627d}.c{font:14px monospace;fill:#17324d}</style><rect width="1200" height="540" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">The resource turns grant order into write order</text><rect x="60" y="110" width="250" height="115" rx="18" fill="#fff8e7" stroke="#d6a63f"/><text x="185" y="150" text-anchor="middle" class="h">W1 paused</text><text x="185" y="188" text-anchor="middle" class="c">token 41</text><rect x="60" y="325" width="250" height="115" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><text x="185" y="365" text-anchor="middle" class="h">W2 current</text><text x="185" y="403" text-anchor="middle" class="c">token 42</text><rect x="760" y="155" width="375" height="235" rx="22" fill="#17324d"/><text x="947" y="198" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">Report store</text><text x="947" y="244" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff">greatest fence: 0 → 42</text><text x="947" y="292" text-anchor="middle" font-family="monospace" font-size="14" fill="#a9eadc">accept write(42)</text><text x="947" y="340" text-anchor="middle" font-family="monospace" font-size="14" fill="#ffb3b3">reject write(41)</text><path d="M310 382C500 382 545 260 760 260" stroke="#5ab5a4" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M310 168C555 168 570 335 760 335" stroke="#d97979" stroke-width="4" stroke-dasharray="10 8" fill="none" marker-end="url(#a)"/><text x="515" y="410" text-anchor="middle" class="b">new owner arrives first</text><text x="515" y="145" text-anchor="middle" class="b">old packet arrives later</text></svg>
