<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" role="img"><title>Leadership epochs fence commands from an old leader</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:14px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">A leadership term is a fencing generation</text><rect x="55" y="110" width="260" height="115" rx="18" fill="#fff8e7" stroke="#d6a63f"/><text x="185" y="150" text-anchor="middle" class="h">Old leader W1</text><text x="185" y="188" text-anchor="middle" class="c">term 17 · delayed cmd</text><rect x="55" y="315" width="260" height="115" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><text x="185" y="355" text-anchor="middle" class="h">Current leader W2</text><text x="185" y="393" text-anchor="middle" class="c">term 18 · current cmd</text><rect x="690" y="150" width="440" height="240" rx="22" fill="#17324d"/><text x="910" y="195" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">Downstream controller</text><text x="910" y="240" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff">greatest term = 18</text><text x="910" y="290" text-anchor="middle" font-family="monospace" font-size="14" fill="#a9eadc">accept command(term 18)</text><text x="910" y="340" text-anchor="middle" font-family="monospace" font-size="14" fill="#ffb3b3">reject command(term 17)</text><path d="M315 372C500 372 530 280 690 280" stroke="#5ab5a4" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M315 167C510 167 525 335 690 335" stroke="#d97979" stroke-width="4" stroke-dasharray="10 7" fill="none" marker-end="url(#a)"/></svg>
