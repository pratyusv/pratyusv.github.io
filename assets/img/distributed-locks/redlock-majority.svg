<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" role="img"><title>Redlock majority acquisition and elapsed validity window</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Redlock combines independent grants within a timing window</text><rect x="50" y="190" width="210" height="120" rx="18" fill="#eef4ff" stroke="#7399dc"/><text x="155" y="230" text-anchor="middle" class="h">Client W1</text><text x="155" y="267" text-anchor="middle" class="c">value 7f32…</text><g><circle cx="430" cy="135" r="62" fill="#edf8f6" stroke="#5ab5a4"/><circle cx="620" cy="135" r="62" fill="#edf8f6" stroke="#5ab5a4"/><circle cx="810" cy="135" r="62" fill="#edf8f6" stroke="#5ab5a4"/><circle cx="525" cy="330" r="62" fill="#fff0f0" stroke="#d97979"/><circle cx="715" cy="330" r="62" fill="#fff0f0" stroke="#d97979"/></g><text x="430" y="130" text-anchor="middle" class="h">Redis A</text><text x="430" y="156" text-anchor="middle" class="c">granted</text><text x="620" y="130" text-anchor="middle" class="h">Redis B</text><text x="620" y="156" text-anchor="middle" class="c">granted</text><text x="810" y="130" text-anchor="middle" class="h">Redis C</text><text x="810" y="156" text-anchor="middle" class="c">granted</text><text x="525" y="325" text-anchor="middle" class="h">Redis D</text><text x="525" y="351" text-anchor="middle" class="c">timeout</text><text x="715" y="325" text-anchor="middle" class="h">Redis E</text><text x="715" y="351" text-anchor="middle" class="c">timeout</text><path d="M260 250L380 155M260 250L570 155M260 250L760 155M260 250L475 315M260 250L665 315" stroke="#55728f" stroke-width="2"/><rect x="900" y="125" width="250" height="250" rx="20" fill="#17324d"/><text x="1025" y="170" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">Client decision</text><text x="1025" y="215" text-anchor="middle" font-family="monospace" font-size="13" fill="#a9eadc">3 of 5 granted</text><text x="1025" y="255" text-anchor="middle" font-family="monospace" font-size="13" fill="#fff">elapsed &lt; TTL</text><text x="1025" y="300" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffcf99">validity = TTL − elapsed</text><text x="1025" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dce5ed">timing assumptions are part of contract</text><text x="600" y="485" text-anchor="middle" class="b">Majority acquisition does not itself provide an ordered token for an external resource.</text></svg>
