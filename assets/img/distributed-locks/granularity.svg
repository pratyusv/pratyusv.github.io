<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" role="img"><title>Distributed lock granularity trade-off</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:14px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="540" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Lock scope trades coordination simplicity for concurrency</text><rect x="70" y="105" width="1060" height="90" rx="18" fill="#17324d"/><text x="600" y="143" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">/locks/reports</text><text x="600" y="174" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#dce5ed">one global queue · simple ordering · minimal parallelism</text><rect x="160" y="240" width="880" height="90" rx="18" fill="#eef4ff" stroke="#7399dc"/><text x="600" y="278" text-anchor="middle" class="h">/locks/reports/acme</text><text x="600" y="307" text-anchor="middle" class="b">tenant-scoped contention</text><g><rect x="185" y="375" width="370" height="95" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="645" y="375" width="370" height="95" rx="18" fill="#edf8f6" stroke="#5ab5a4"/></g><text x="370" y="412" text-anchor="middle" class="c">…/monthly-sales/2026-07</text><text x="370" y="445" text-anchor="middle" class="b">fine scope · independent work</text><text x="830" y="412" text-anchor="middle" class="c">…/inventory/2026-07</text><text x="830" y="445" text-anchor="middle" class="b">more keys · more metadata</text><text x="90" y="510" class="b">coarse</text><text x="1050" y="510" class="b">fine</text><path d="M155 505H1035" stroke="#55728f" stroke-width="3"/></svg>
