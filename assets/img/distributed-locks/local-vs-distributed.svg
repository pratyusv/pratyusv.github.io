<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" role="img"><title>Comparison between a local mutex and a distributed lock</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 18px sans-serif;fill:#17324d}.b{font:14px sans-serif;fill:#45627d}.c{font:14px monospace;fill:#17324d}</style><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">The protected state lives in a different failure domain</text><rect x="55" y="90" width="500" height="365" rx="22" fill="#edf8f6" stroke="#5ab5a4"/><text x="305" y="130" text-anchor="middle" class="h">Local mutex</text><rect x="105" y="170" width="400" height="205" rx="18" fill="#fff" stroke="#b9c9d8"/><text x="305" y="210" text-anchor="middle" class="c">one process</text><rect x="145" y="245" width="120" height="75" rx="12" fill="#eef4ff" stroke="#7399dc"/><text x="205" y="290" text-anchor="middle" class="b">thread</text><rect x="340" y="245" width="120" height="75" rx="12" fill="#fff8e7" stroke="#d6a63f"/><text x="400" y="290" text-anchor="middle" class="b">memory</text><path d="M265 282H340" stroke="#55728f" stroke-width="3"/><text x="305" y="414" text-anchor="middle" class="b">OS lifetime contains owner and state</text><rect x="645" y="90" width="500" height="365" rx="22" fill="#fff8e7" stroke="#d6a63f"/><text x="895" y="130" text-anchor="middle" class="h">Distributed lock</text><rect x="680" y="180" width="125" height="85" rx="13" fill="#fff" stroke="#b9c9d8"/><text x="742" y="215" text-anchor="middle" class="b">worker</text><text x="742" y="240" text-anchor="middle" class="c">W1</text><rect x="835" y="180" width="125" height="85" rx="13" fill="#eef4ff" stroke="#7399dc"/><text x="897" y="215" text-anchor="middle" class="b">authority</text><text x="897" y="240" text-anchor="middle" class="c">lease</text><rect x="990" y="180" width="125" height="85" rx="13" fill="#edf8f6" stroke="#5ab5a4"/><text x="1052" y="215" text-anchor="middle" class="b">resource</text><text x="1052" y="240" text-anchor="middle" class="c">report</text><path d="M805 222H835M960 222H990" stroke="#55728f" stroke-width="3"/><text x="895" y="325" text-anchor="middle" class="b">process, network, authority, and resource</text><text x="895" y="354" text-anchor="middle" class="b">can each fail independently</text><text x="895" y="414" text-anchor="middle" class="h">ownership belief ≠ write permission</text></svg>
