<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" role="img"><title>A paused worker resumes after its lease has been reassigned</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:14px sans-serif;fill:#45627d}.c{font:14px monospace;fill:#17324d}</style><rect width="1200" height="560" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">One report, two workers, one stale write</text><rect x="55" y="110" width="235" height="145" rx="18" fill="#fff8e7" stroke="#d6a63f"/><text x="172" y="150" text-anchor="middle" class="h">Worker W1</text><text x="172" y="184" text-anchor="middle" class="c">lease L-81 · fence 41</text><text x="172" y="220" text-anchor="middle" class="b">pauses during computation</text><rect x="480" y="105" width="240" height="155" rx="18" fill="#eef4ff" stroke="#7399dc"/><text x="600" y="145" text-anchor="middle" class="h">Lock authority</text><text x="600" y="180" text-anchor="middle" class="c">expire 41 → grant 42</text><text x="600" y="217" text-anchor="middle" class="b">ownership moves to W2</text><rect x="910" y="110" width="235" height="145" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><text x="1027" y="150" text-anchor="middle" class="h">Worker W2</text><text x="1027" y="184" text-anchor="middle" class="c">lease L-82 · fence 42</text><text x="1027" y="220" text-anchor="middle" class="b">publishes current result</text><path d="M290 175H480M720 175H910" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="380" y="350" width="440" height="150" rx="20" fill="#17324d"/><text x="600" y="391" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">Protected report store</text><text x="600" y="428" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff">accept fence 42 · persist watermark 42</text><text x="600" y="466" text-anchor="middle" font-family="monospace" font-size="14" fill="#ffcf99">reject delayed fence 41</text><path d="M1027 255L760 350M172 255L445 350" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><text x="250" y="330" class="b">W1 resumes late</text></svg>
