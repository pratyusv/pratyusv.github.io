<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" role="img"><title>Distributed lock failure modes and defenses</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 15px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:12px monospace;fill:#17324d}</style><rect width="1200" height="650" rx="24" fill="#f7fafc"/><text x="600" y="43" text-anchor="middle" class="t">Each failure needs a mechanism at the right boundary</text><rect x="55" y="85" width="1090" height="65" rx="14" fill="#17324d"/><text x="210" y="125" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#fff">Failure</text><text x="550" y="125" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#fff">Immediate risk</text><text x="930" y="125" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#fff">Containment</text><g><rect x="55" y="160" width="1090" height="70" fill="#fff"/><rect x="55" y="230" width="1090" height="70" fill="#eef4ff"/><rect x="55" y="300" width="1090" height="70" fill="#fff"/><rect x="55" y="370" width="1090" height="70" fill="#eef4ff"/><rect x="55" y="440" width="1090" height="70" fill="#fff"/><rect x="55" y="510" width="1090" height="70" fill="#eef4ff"/></g><g class="h"><text x="210" y="202" text-anchor="middle">holder crash</text><text x="210" y="272" text-anchor="middle">long process pause</text><text x="210" y="342" text-anchor="middle">lost acquire reply</text><text x="210" y="412" text-anchor="middle">delayed old release</text><text x="210" y="482" text-anchor="middle">authority partition</text><text x="210" y="552" text-anchor="middle">hot lock key</text></g><g class="b"><text x="550" y="202" text-anchor="middle">ownership never clears</text><text x="550" y="272" text-anchor="middle">stale holder resumes</text><text x="550" y="342" text-anchor="middle">client outcome unknown</text><text x="550" y="412" text-anchor="middle">new claim removed</text><text x="550" y="482" text-anchor="middle">no safe grant order</text><text x="550" y="552" text-anchor="middle">queue and watch overload</text></g><g class="c"><text x="930" y="202" text-anchor="middle">session / lease expiry</text><text x="930" y="272" text-anchor="middle">resource fencing</text><text x="930" y="342" text-anchor="middle">stable request identity</text><text x="930" y="412" text-anchor="middle">compare lease identity</text><text x="930" y="482" text-anchor="middle">fail acquisition closed</text><text x="930" y="552" text-anchor="middle">admission + predecessor watch</text></g><text x="600" y="620" text-anchor="middle" class="b">Longer TTLs change takeover latency; they do not replace these defenses.</text></svg>
