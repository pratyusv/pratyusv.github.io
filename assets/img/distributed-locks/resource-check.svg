<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" role="img"><title>Atomic fencing-token validation at the protected resource</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55728f"/></marker></defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:14px sans-serif;fill:#45627d}.c{font:14px monospace;fill:#17324d}</style><rect width="1200" height="520" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Validate and mutate in one atomic boundary</text><rect x="55" y="180" width="245" height="125" rx="18" fill="#eef4ff" stroke="#7399dc"/><text x="177" y="220" text-anchor="middle" class="h">Command</text><text x="177" y="258" text-anchor="middle" class="c">publish(body, token)</text><path d="M300 242H430" stroke="#55728f" stroke-width="4" marker-end="url(#a)"/><rect x="430" y="105" width="700" height="280" rx="22" fill="#17324d"/><text x="780" y="150" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff">One resource transaction</text><rect x="475" y="190" width="250" height="110" rx="15" fill="#fff"/><text x="600" y="225" text-anchor="middle" class="h">Compare</text><text x="600" y="262" text-anchor="middle" class="c">token &gt; watermark?</text><path d="M725 245H820" stroke="#dce5ed" stroke-width="4" marker-end="url(#a)"/><rect x="820" y="190" width="260" height="110" rx="15" fill="#edf8f6"/><text x="950" y="225" text-anchor="middle" class="h">Commit together</text><text x="950" y="258" text-anchor="middle" class="c">body + watermark</text><text x="600" y="347" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffb3b3">false → reject stale_owner without mutation</text><text x="600" y="440" text-anchor="middle" class="b">A client-side check followed by an unconditional write leaves a race window.</text></svg>
