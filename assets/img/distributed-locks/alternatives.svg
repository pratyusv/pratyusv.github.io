<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" role="img"><title>Alternatives to a general distributed lock</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:14px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="570" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Put the invariant at the resource when possible</text><g><rect x="55" y="105" width="520" height="165" rx="20" fill="#eef4ff" stroke="#7399dc"/><rect x="625" y="105" width="520" height="165" rx="20" fill="#edf8f6" stroke="#5ab5a4"/><rect x="55" y="320" width="520" height="165" rx="20" fill="#fff8e7" stroke="#d6a63f"/><rect x="625" y="320" width="520" height="165" rx="20" fill="#fff" stroke="#b9c9d8"/></g><text x="315" y="148" text-anchor="middle" class="h">Unique constraint</text><text x="315" y="190" text-anchor="middle" class="c">one logical request key</text><text x="315" y="230" text-anchor="middle" class="b">deduplicate at commit</text><text x="885" y="148" text-anchor="middle" class="h">Compare-and-swap</text><text x="885" y="190" text-anchor="middle" class="c">READY → RUNNING</text><text x="885" y="230" text-anchor="middle" class="b">claim and mutate one row</text><text x="315" y="363" text-anchor="middle" class="h">Partition generation</text><text x="315" y="405" text-anchor="middle" class="c">assignment epoch on commits</text><text x="315" y="445" text-anchor="middle" class="b">specialized stream ownership</text><text x="885" y="363" text-anchor="middle" class="h">Idempotent operation</text><text x="885" y="405" text-anchor="middle" class="c">same key → same outcome</text><text x="885" y="445" text-anchor="middle" class="b">duplicate execution is harmless</text><text x="600" y="535" text-anchor="middle" class="b">A separate lock creates a gap between arbitration and the protected mutation.</text></svg>
