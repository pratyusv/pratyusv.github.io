<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" role="img"><title>Lease renewal and safe work admission window</title><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.c{font:13px monospace;fill:#17324d}</style><rect width="1200" height="500" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">Do not use the entire TTL as a work budget</text><line x1="90" y1="255" x2="1110" y2="255" stroke="#b9c9d8" stroke-width="6"/><rect x="110" y="205" width="530" height="100" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><text x="375" y="245" text-anchor="middle" class="h">HELD: admit bounded work</text><text x="375" y="276" text-anchor="middle" class="c">renew at R, measure acknowledgement</text><rect x="640" y="205" width="260" height="100" rx="18" fill="#fff8e7" stroke="#d6a63f"/><text x="770" y="245" text-anchor="middle" class="h">SUSPECT</text><text x="770" y="276" text-anchor="middle" class="b">stop new work</text><rect x="900" y="205" width="200" height="100" rx="18" fill="#fff0f0" stroke="#d97979"/><text x="1000" y="245" text-anchor="middle" class="h">EXPIRED</text><text x="1000" y="276" text-anchor="middle" class="b">ownership lost</text><text x="110" y="355" class="c">grant</text><text x="640" y="355" text-anchor="middle" class="c">safe-work deadline</text><text x="900" y="355" text-anchor="middle" class="c">authority TTL</text><path d="M640 185V325M900 185V325" stroke="#55728f" stroke-width="2" stroke-dasharray="7 5"/><text x="770" y="130" text-anchor="middle" class="b">margin absorbs scheduling and RPC delay</text></svg>
