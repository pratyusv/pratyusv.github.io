<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Atlas record in Google File System</title><desc id="desc">Crawler producer P7 appends one self-identifying record to a replicated GFS chunk. The master supplies metadata while bytes move directly through chunkservers across racks.</desc><defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}.box{fill:#fff;stroke:#b9c9d8;stroke-width:2}</style></defs><rect width="1200" height="700" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">One crawl record connects the entire GFS design</text>
