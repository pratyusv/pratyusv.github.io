<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">GFS read path</title><desc id="desc">A reader maps offset 140 MiB to chunk index two, obtains handle H9F3 and replica locations from the master on a cache miss, then reads and checksum-verifies bytes directly from CS-B.</desc><defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="670" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">One metadata lookup enables many direct reads</text>
<rect x="55" y="115" width="240" height="145" rx="20" fill="#fff" stroke="#b9c9d8" filter="url(#s)"/><text x="175" y="155" text-anchor="middle" class="h">Reader R2</text><text x="175" y="187" text-anchor="middle" class="c">file offset 140 MiB</text><text x="175" y="216" text-anchor="middle" class="c">chunk index = 2</text><text x="175" y="242" text-anchor="middle" class="b">metadata cache miss</text>
<rect x="480" y="90" width="300" height="190" rx="22" fill="#eef4ff" stroke="#7399dc" filter="url(#s)"/><text x="630" y="130" text-anchor="middle" class="h">GFS master</text><text x="630" y="169" text-anchor="middle" class="c">index 2 → H9F3</text><text x="630" y="201" text-anchor="middle" class="c">version 13</text><text x="630" y="233" text-anchor="middle" class="c">[CS-A, CS-B, CS-C]</text><text x="630" y="260" text-anchor="middle" class="b">metadata only</text>
<path d="M295 160H480" stroke="#2f6fdd" stroke-width="3" marker-end="url(#a)"/><text x="387" y="145" text-anchor="middle" class="b">pathname + index</text><path d="M480 220H295" stroke="#2f6fdd" stroke-width="3" marker-end="url(#a)"/><text x="387" y="242" text-anchor="middle" class="b">handle + replicas</text>
<rect x="775" y="405" width="320" height="160" rx="22" fill="#edf8f6" stroke="#5ab5a4" filter="url(#s)"/><text x="935" y="445" text-anchor="middle" class="h">Nearby replica CS-B</text><text x="935" y="478" text-anchor="middle" class="c">read(H9F3, offset, len)</text><text x="935" y="510" text-anchor="middle" class="b">verify overlapping checksums</text><text x="935" y="539" text-anchor="middle" class="b">return bytes directly</text>
<path d="M250 260C315 480 570 515 775 480" fill="none" stroke="#3b9f8a" stroke-width="4" marker-end="url(#a)"/><path d="M775 530C560 590 325 560 220 300" fill="none" stroke="#3b9f8a" stroke-width="4" marker-end="url(#a)"/><text x="485" y="455" class="h">data request</text><text x="485" y="570" class="h">chunk bytes</text><rect x="305" y="330" width="300" height="78" rx="17" fill="#17324d"/><text x="455" y="360" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fff">Cache (file, index) → locations</text><text x="455" y="387" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#dce5ed">future reads skip the master</text></svg>
