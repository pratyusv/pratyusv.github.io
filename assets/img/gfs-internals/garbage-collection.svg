<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">GFS lazy garbage collection</title><desc id="desc">File deletion becomes a hidden timestamped name, then a namespace scan removes the reference after a grace period, the master marks chunks orphaned, and heartbeats tell chunkservers to delete unknown replicas.</desc><defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">Deletion becomes reachability cleanup, not a fragile RPC fanout</text><g fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"><path d="M230 180H300"/><path d="M520 180H590"/><path d="M810 180H880"/><path d="M990 245V355"/><path d="M880 420H810"/></g>
<g filter="url(#s)"><rect x="30" y="115" width="200" height="130" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="300" y="115" width="220" height="130" rx="18" fill="#fff4dd" stroke="#e2a63b"/><rect x="590" y="115" width="220" height="130" rx="18" fill="#fff" stroke="#b9c9d8"/><rect x="880" y="115" width="220" height="130" rx="18" fill="#fdf3f2" stroke="#d96b63"/><rect x="880" y="355" width="220" height="130" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="590" y="355" width="220" height="130" rx="18" fill="#edf8f6" stroke="#5ab5a4"/></g><text x="130" y="153" text-anchor="middle" class="h">1 · Delete request</text><text x="130" y="184" text-anchor="middle" class="c">events.log</text><text x="130" y="215" text-anchor="middle" class="b">log metadata change</text><text x="410" y="153" text-anchor="middle" class="h">2 · Hidden rename</text><text x="410" y="184" text-anchor="middle" class="c">.deleted-20260817</text><text x="410" y="215" text-anchor="middle" class="b">recoverable grace window</text><text x="700" y="153" text-anchor="middle" class="h">3 · Namespace scan</text><text x="700" y="184" text-anchor="middle" class="b">grace period elapsed</text><text x="700" y="215" text-anchor="middle" class="b">remove file metadata</text><text x="990" y="153" text-anchor="middle" class="h">4 · Chunk scan</text><text x="990" y="184" text-anchor="middle" class="c">H9F3 unreachable</text><text x="990" y="215" text-anchor="middle" class="b">forget handle metadata</text><text x="990" y="393" text-anchor="middle" class="h">5 · Heartbeat compare</text><text x="990" y="424" text-anchor="middle" class="c">server reports H9F3</text><text x="990" y="455" text-anchor="middle" class="b">master says unknown</text><text x="700" y="393" text-anchor="middle" class="h">6 · Local delete</text><text x="700" y="424" text-anchor="middle" class="c">unlink replica H9F3</text><text x="700" y="455" text-anchor="middle" class="b">repeat on every server</text><rect x="170" y="555" width="860" height="65" rx="19" fill="#17324d"/><text x="600" y="582" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#fff">Lost messages and offline servers are harmless</text><text x="600" y="606" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#dce5ed">future scans and heartbeats rediscover any replica no longer reachable from master metadata</text></svg>
