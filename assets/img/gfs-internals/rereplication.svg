<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">GFS re-replication and checksum recovery</title><desc id="desc">The master excludes stale CS-C, prioritizes under-replicated H9F3, and tells CS-D to clone version 14 directly from CS-A. A checksum failure follows the same repair pattern.</desc><defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b9f8a"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="700" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">Master schedules recovery; valid replicas move the bytes</text>
<rect x="450" y="85" width="300" height="155" rx="21" fill="#eef4ff" stroke="#7399dc" filter="url(#s)"/><text x="600" y="125" text-anchor="middle" class="h">Master repair queue</text><text x="600" y="157" text-anchor="middle" class="c">H9F3: 2 / 3 valid</text><text x="600" y="187" text-anchor="middle" class="b">priority: live + under target</text><text x="600" y="215" text-anchor="middle" class="b">choose CS-D in rack-c</text>
<g filter="url(#s)"><rect x="65" y="330" width="240" height="140" rx="19" fill="#17324d"/><rect x="355" y="330" width="240" height="140" rx="19" fill="#edf8f6" stroke="#5ab5a4"/><rect x="645" y="330" width="240" height="140" rx="19" fill="#fdf3f2" stroke="#d96b63"/><rect x="935" y="330" width="220" height="140" rx="19" fill="#fff4dd" stroke="#e2a63b"/></g><text x="185" y="370" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#fff">CS-A · rack-a</text><text x="185" y="404" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#dce5ed">VALID v14</text><text x="185" y="436" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#dce5ed">clone source</text><text x="475" y="370" text-anchor="middle" class="h">CS-B · rack-b</text><text x="475" y="404" text-anchor="middle" class="c">VALID v14</text><text x="475" y="436" text-anchor="middle" class="b">serving replica</text><text x="765" y="370" text-anchor="middle" class="h">CS-C · rack-c</text><text x="765" y="404" text-anchor="middle" class="c">STALE v13</text><text x="765" y="436" text-anchor="middle" class="b">delete later</text><text x="1045" y="370" text-anchor="middle" class="h">CS-D · rack-c</text><text x="1045" y="404" text-anchor="middle" class="c">destination</text><text x="1045" y="436" text-anchor="middle" class="b">throttled clone</text>
<path d="M520 240L1045 330" fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><text x="820" y="270" class="b">instruction only</text><path d="M305 400C500 560 810 560 935 420" fill="none" stroke="#3b9f8a" stroke-width="5" marker-end="url(#g)"/><text x="620" y="570" text-anchor="middle" class="h">H9F3 v14 bytes flow directly CS-A → CS-D</text><rect x="210" y="610" width="780" height="52" rx="18" fill="#17324d"/><text x="600" y="634" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fff">Checksum failure: fail read → try valid replica → clone clean copy → delete corrupt copy</text><text x="600" y="653" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#dce5ed">background bandwidth is limited so repair does not overwhelm clients</text></svg>
