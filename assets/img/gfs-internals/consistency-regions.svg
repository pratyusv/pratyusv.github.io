<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">GFS defined, consistent undefined, and inconsistent regions</title><desc id="desc">Three panels compare a serial successful write, concurrent successful overlapping writes, and a partially failed write across three replicas.</desc><defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="700" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">Consistency asks whether replicas agree; definition asks what they agree on</text><g filter="url(#s)"><rect x="45" y="105" width="350" height="455" rx="22" fill="#fff" stroke="#b9c9d8"/><rect x="425" y="105" width="350" height="455" rx="22" fill="#fff" stroke="#b9c9d8"/><rect x="805" y="105" width="350" height="455" rx="22" fill="#fff" stroke="#b9c9d8"/></g>
<text x="220" y="145" text-anchor="middle" class="h">Defined</text><text x="600" y="145" text-anchor="middle" class="h">Consistent but undefined</text><text x="980" y="145" text-anchor="middle" class="h">Inconsistent</text><g class="c"><text x="75" y="200">CS-A</text><text x="75" y="270">CS-B</text><text x="75" y="340">CS-C</text><text x="455" y="200">CS-A</text><text x="455" y="270">CS-B</text><text x="455" y="340">CS-C</text><text x="835" y="200">CS-A</text><text x="835" y="270">CS-B</text><text x="835" y="340">CS-C</text></g>
<g><rect x="125" y="170" width="220" height="42" rx="8" fill="#3b9f8a"/><rect x="125" y="240" width="220" height="42" rx="8" fill="#3b9f8a"/><rect x="125" y="310" width="220" height="42" rx="8" fill="#3b9f8a"/><text x="235" y="196" text-anchor="middle" class="c">exact mutation X</text><text x="235" y="266" text-anchor="middle" class="c">exact mutation X</text><text x="235" y="336" text-anchor="middle" class="c">exact mutation X</text></g>
<g><rect x="505" y="170" width="220" height="42" rx="8" fill="#e2a63b"/><rect x="505" y="240" width="220" height="42" rx="8" fill="#e2a63b"/><rect x="505" y="310" width="220" height="42" rx="8" fill="#e2a63b"/><text x="615" y="196" text-anchor="middle" class="c">X/Y fragments</text><text x="615" y="266" text-anchor="middle" class="c">X/Y fragments</text><text x="615" y="336" text-anchor="middle" class="c">X/Y fragments</text></g>
<g><rect x="885" y="170" width="220" height="42" rx="8" fill="#d96b63"/><rect x="885" y="240" width="220" height="42" rx="8" fill="#d96b63"/><rect x="885" y="310" width="220" height="42" rx="8" fill="#e7edf3"/><text x="995" y="196" text-anchor="middle" class="c">mutation X</text><text x="995" y="266" text-anchor="middle" class="c">partial X</text><text x="995" y="336" text-anchor="middle" class="c">old bytes</text></g>
<text x="220" y="410" text-anchor="middle" class="b">all replicas agree</text><text x="220" y="441" text-anchor="middle" class="b">and contain exactly X</text><text x="600" y="410" text-anchor="middle" class="b">all replicas agree</text><text x="600" y="441" text-anchor="middle" class="b">but result is not one writer's X or Y</text><text x="980" y="410" text-anchor="middle" class="b">replicas disagree</text><text x="980" y="441" text-anchor="middle" class="b">failed mutation changed a subset</text><rect x="95" y="475" width="250" height="50" rx="14" fill="#edf8f6"/><text x="220" y="506" text-anchor="middle" class="h">consistent + defined</text><rect x="475" y="475" width="250" height="50" rx="14" fill="#fff4dd"/><text x="600" y="506" text-anchor="middle" class="h">consistent + undefined</text><rect x="855" y="475" width="250" height="50" rx="14" fill="#fdf3f2"/><text x="980" y="506" text-anchor="middle" class="h">undefined + inconsistent</text><rect x="200" y="610" width="800" height="45" rx="18" fill="#17324d"/><text x="600" y="638" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fff">An error does not prove rollback; bytes may already exist on some replicas</text></svg>
