<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>Conventional file server compared with GFS</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.s{font:12px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="700" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">GFS separates the metadata path from the bulk-data path</text><rect x="55" y="90" width="500" height="500" rx="20" fill="#fff" stroke="#e4b85b"/><text x="305" y="132" text-anchor="middle" class="h">Conventional file server</text><rect x="105" y="185" width="145" height="85" rx="14" fill="#fff" stroke="#b7c8d8"/><text x="177" y="220" text-anchor="middle" class="h">Clients</text><text x="177" y="246" text-anchor="middle" class="b">metadata + bytes</text><rect x="355" y="170" width="150" height="115" rx="14" fill="#fff8e8" stroke="#e4b85b"/><text x="430" y="207" text-anchor="middle" class="h">File server</text><text x="430" y="235" text-anchor="middle" class="b">paths + blocks</text><text x="430" y="260" text-anchor="middle" class="b">one data path</text><path d="M250 227H355" stroke="#e4b85b" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="305" y="365" text-anchor="middle" class="b">Simple semantics and ownership</text><text x="305" y="400" text-anchor="middle" class="b">One network and failure boundary</text><rect x="645" y="90" width="500" height="500" rx="20" fill="#fff" stroke="#5ab5a4"/><text x="895" y="132" text-anchor="middle" class="h">Google File System</text><rect x="690" y="175" width="150" height="90" rx="14" fill="#f3effb" stroke="#9377c6"/><text x="765" y="210" text-anchor="middle" class="h">Master</text><text x="765" y="238" text-anchor="middle" class="b">metadata only</text><rect x="930" y="165" width="170" height="110" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="1015" y="202" text-anchor="middle" class="h">Chunkservers</text><text x="1015" y="230" text-anchor="middle" class="b">replicated bytes</text><text x="1015" y="254" text-anchor="middle" class="b">many data paths</text><text x="895" y="350" text-anchor="middle" class="b">1. client asks master for locations</text><text x="895" y="390" text-anchor="middle" class="b">2. client transfers directly with replicas</text><path d="M840 220H930" stroke="#55728f" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#a)"/><text x="895" y="455" text-anchor="middle" class="s">Small global decisions stay centralized;</text><text x="895" y="478" text-anchor="middle" class="s">large byte streams scale across chunkservers.</text><rect x="225" y="615" width="750" height="42" rx="9" fill="#17324d"/><text x="600" y="642" text-anchor="middle" style="font:700 14px sans-serif;fill:#fff">One namespace does not require one server to carry every byte.</text></svg>
