<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">GFS copy-on-write snapshot</title><desc id="desc">Source and snapshot initially share chunk handle H9F3 after leases are revoked. The next source write causes local cloning to new handle HAF8 while the snapshot retains H9F3.</desc><defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="700" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">Snapshot copies metadata first and bytes only on the next write</text>
<text x="315" y="100" text-anchor="middle" class="h">Immediately after snapshot</text><rect x="65" y="130" width="250" height="110" rx="18" fill="#eef4ff" stroke="#7399dc" filter="url(#s)"/><text x="190" y="169" text-anchor="middle" class="c">source/events.log</text><text x="190" y="202" text-anchor="middle" class="c">index 2 → H9F3</text><rect x="315" y="130" width="250" height="110" rx="18" fill="#fff4dd" stroke="#e2a63b" filter="url(#s)"/><text x="440" y="169" text-anchor="middle" class="c">snapshot/events.log</text><text x="440" y="202" text-anchor="middle" class="c">index 2 → H9F3</text><path d="M190 240L315 330M440 240L315 330" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="205" y="330" width="220" height="95" rx="18" fill="#17324d"/><text x="315" y="366" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#fff">shared H9F3</text><text x="315" y="395" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#dce5ed">reference count = 2</text>
<path d="M600 180H700" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><text x="650" y="163" text-anchor="middle" class="b">next source write</text><text x="650" y="210" text-anchor="middle" class="b">master observes shared handle</text><text x="900" y="100" text-anchor="middle" class="h">After copy-on-write</text><rect x="715" y="130" width="250" height="110" rx="18" fill="#eef4ff" stroke="#7399dc" filter="url(#s)"/><text x="840" y="169" text-anchor="middle" class="c">source/events.log</text><text x="840" y="202" text-anchor="middle" class="c">index 2 → HAF8</text><rect x="935" y="300" width="220" height="105" rx="18" fill="#fff4dd" stroke="#e2a63b" filter="url(#s)"/><text x="1045" y="339" text-anchor="middle" class="c">snapshot</text><text x="1045" y="370" text-anchor="middle" class="c">still → H9F3</text><rect x="730" y="330" width="220" height="105" rx="18" fill="#17324d"/><text x="840" y="369" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#fff">new HAF8</text><text x="840" y="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#dce5ed">local clone of H9F3</text><path d="M840 240V330M965 220L1045 300" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="195" y="535" width="810" height="85" rx="20" fill="#17324d"/><text x="600" y="567" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#fff">Revoke leases before sharing metadata</text><text x="600" y="596" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#dce5ed">the next writer must ask the master, which clones locally before granting a new lease</text></svg>
