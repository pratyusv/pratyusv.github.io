<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">GFS record append outcomes</title><desc id="desc">A valid record may append once, trigger padding and retry on the next chunk, or append successfully before its reply is lost and then appear again after retry.</desc><defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="700" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">Atomic bytes at least once—not exactly once</text>
<g filter="url(#s)"><rect x="45" y="105" width="350" height="445" rx="22" fill="#fff" stroke="#b9c9d8"/><rect x="425" y="105" width="350" height="445" rx="22" fill="#fff" stroke="#b9c9d8"/><rect x="805" y="105" width="350" height="445" rx="22" fill="#fff" stroke="#b9c9d8"/></g><text x="220" y="145" text-anchor="middle" class="h">A · record fits</text><text x="600" y="145" text-anchor="middle" class="h">B · record crosses boundary</text><text x="980" y="145" text-anchor="middle" class="h">C · success reply is lost</text>
<text x="75" y="190" class="c">H9F3</text><rect x="75" y="210" width="290" height="65" rx="10" fill="#e7edf3"/><rect x="75" y="210" width="180" height="65" rx="10" fill="#dce5ed"/><rect x="255" y="210" width="75" height="65" fill="#3b9f8a"/><text x="292" y="247" text-anchor="middle" class="c">R1042</text><text x="220" y="319" text-anchor="middle" class="b">primary chooses one offset</text><text x="220" y="350" text-anchor="middle" class="b">all replicas use that offset</text><rect x="100" y="400" width="240" height="54" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="220" y="433" text-anchor="middle" class="c">return chosen offset</text>
<text x="455" y="190" class="c">H9F3</text><rect x="455" y="210" width="290" height="65" rx="10" fill="#e7edf3"/><rect x="455" y="210" width="250" height="65" rx="10" fill="#dce5ed"/><rect x="705" y="210" width="40" height="65" fill="#e2a63b"/><text x="725" y="247" text-anchor="middle" class="c">PAD</text><text x="455" y="305" class="c">next: HAF8</text><rect x="455" y="325" width="290" height="65" rx="10" fill="#e7edf3"/><rect x="455" y="325" width="75" height="65" rx="10" fill="#3b9f8a"/><text x="492" y="362" text-anchor="middle" class="c">R1042</text><text x="600" y="438" text-anchor="middle" class="b">pad old chunk → retry next chunk</text>
<text x="835" y="190" class="c">H9F3</text><rect x="835" y="210" width="290" height="65" rx="10" fill="#e7edf3"/><rect x="835" y="210" width="100" height="65" rx="10" fill="#3b9f8a"/><text x="885" y="247" text-anchor="middle" class="c">R1042</text><rect x="965" y="210" width="100" height="65" rx="10" fill="#3b9f8a"/><text x="1015" y="247" text-anchor="middle" class="c">R1042</text><path d="M885 290V335M1015 290V335" stroke="#d96b63" stroke-width="3" stroke-dasharray="7 5"/><text x="885" y="365" text-anchor="middle" class="b">first success</text><text x="1015" y="365" text-anchor="middle" class="b">retry success</text><text x="980" y="420" text-anchor="middle" class="b">same stable record ID</text><rect x="860" y="450" width="240" height="54" rx="14" fill="#fdf3f2" stroke="#d96b63"/><text x="980" y="483" text-anchor="middle" class="c">reader deduplicates</text><rect x="190" y="600" width="820" height="55" rx="18" fill="#17324d"/><text x="600" y="634" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#fff">A successful record is contiguous; padding and duplicate records may surround it</text></svg>
