<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">GFS primary serializes concurrent mutations</title><desc id="desc">Producers P7 and P9 issue concurrent appends. Primary CS-A assigns serials 104 and 105, and all three replicas apply mutations in that same order.</desc><defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">Concurrent arrival becomes one replica-wide order</text>
<rect x="55" y="115" width="220" height="100" rx="18" fill="#fff" stroke="#b9c9d8" filter="url(#s)"/><text x="165" y="153" text-anchor="middle" class="h">Producer P7</text><text x="165" y="185" text-anchor="middle" class="c">crawl-7:1042</text><rect x="55" y="285" width="220" height="100" rx="18" fill="#fff" stroke="#b9c9d8" filter="url(#s)"/><text x="165" y="323" text-anchor="middle" class="h">Producer P9</text><text x="165" y="355" text-anchor="middle" class="c">crawl-9:771</text>
<path d="M275 165C395 165 410 270 500 270" fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><path d="M275 335C395 335 410 300 500 300" fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><text x="360" y="148" class="b">started first</text><text x="350" y="356" class="b">arrives first</text>
<rect x="500" y="190" width="260" height="190" rx="22" fill="#17324d" filter="url(#s)"/><text x="630" y="230" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#fff">Primary CS-A</text><text x="630" y="272" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#dce5ed">#104 → crawl-9:771</text><text x="630" y="312" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#dce5ed">#105 → crawl-7:1042</text><text x="630" y="350" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#dce5ed">lease-local serial order</text>
<g filter="url(#s)"><rect x="850" y="90" width="270" height="130" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="850" y="275" width="270" height="130" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="850" y="460" width="270" height="130" rx="18" fill="#edf8f6" stroke="#5ab5a4"/></g><g text-anchor="middle"><text x="985" y="125" class="h">CS-A · primary</text><text x="985" y="158" class="c">apply #104 → #105</text><text x="985" y="191" class="b">local replica</text><text x="985" y="310" class="h">CS-B · secondary</text><text x="985" y="343" class="c">apply #104 → #105</text><text x="985" y="376" class="b">same order</text><text x="985" y="495" class="h">CS-C · secondary</text><text x="985" y="528" class="c">apply #104 → #105</text><text x="985" y="561" class="b">same order</text></g><g fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"><path d="M760 245L850 155"/><path d="M760 285H850"/><path d="M760 325L850 525"/></g><rect x="250" y="595" width="500" height="48" rx="18" fill="#17324d"/><text x="500" y="625" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fff">Primary order—not client start time—defines history</text></svg>
