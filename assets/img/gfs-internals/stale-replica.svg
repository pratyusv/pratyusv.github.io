<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">GFS stale replica detection with chunk versions</title><desc id="desc">CS-C goes offline at version 13. The master advances current replicas to version 14 for a new lease. When CS-C returns, its lower version excludes it from reads, writes, leases, and cloning.</desc><defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="690" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">The handle still matches; the version proves the bytes are stale</text>
<g filter="url(#s)"><rect x="45" y="110" width="320" height="420" rx="22" fill="#fff" stroke="#b9c9d8"/><rect x="440" y="110" width="320" height="420" rx="22" fill="#eef4ff" stroke="#7399dc"/><rect x="835" y="110" width="320" height="420" rx="22" fill="#fff" stroke="#b9c9d8"/></g><text x="205" y="150" text-anchor="middle" class="h">1 · CS-C goes offline</text><text x="600" y="150" text-anchor="middle" class="h">2 · New lease generation</text><text x="995" y="150" text-anchor="middle" class="h">3 · CS-C returns</text>
<g><rect x="85" y="195" width="240" height="68" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="205" y="223" text-anchor="middle" class="c">CS-A · H9F3 v13</text><text x="205" y="247" text-anchor="middle" class="b">current</text><rect x="85" y="285" width="240" height="68" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="205" y="313" text-anchor="middle" class="c">CS-B · H9F3 v13</text><text x="205" y="337" text-anchor="middle" class="b">current</text><rect x="85" y="375" width="240" height="68" rx="14" fill="#fdf3f2" stroke="#d96b63"/><text x="205" y="403" text-anchor="middle" class="c">CS-C · H9F3 v13</text><text x="205" y="427" text-anchor="middle" class="b">OFFLINE</text></g>
<text x="600" y="215" text-anchor="middle" class="b">master advances only reachable</text><rect x="485" y="250" width="230" height="72" rx="14" fill="#17324d"/><text x="600" y="278" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#fff">CS-A · H9F3 v14</text><text x="600" y="303" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#dce5ed">secondary</text><rect x="485" y="350" width="230" height="72" rx="14" fill="#17324d"/><text x="600" y="378" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#fff">CS-B · H9F3 v14</text><text x="600" y="403" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#dce5ed">new primary</text>
<rect x="875" y="195" width="240" height="78" rx="14" fill="#fdf3f2" stroke="#d96b63"/><text x="995" y="225" text-anchor="middle" class="c">CS-C reports H9F3 v13</text><text x="995" y="250" text-anchor="middle" class="b">master expects v14</text><text x="995" y="315" text-anchor="middle" class="h">Exclude from</text><text x="900" y="355" class="b">× location responses</text><text x="900" y="388" class="b">× mutation replicas</text><text x="900" y="421" class="b">× lease candidacy</text><text x="900" y="454" class="b">× clone sources</text><rect x="900" y="475" width="190" height="37" rx="12" fill="#fdf3f2"/><text x="995" y="499" text-anchor="middle" class="c">garbage collect</text><g fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"><path d="M365 320H440"/><path d="M760 320H835"/></g><rect x="260" y="590" width="680" height="48" rx="18" fill="#17324d"/><text x="600" y="620" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fff">Chunk version is a persistent fencing token for replica generations</text></svg>
