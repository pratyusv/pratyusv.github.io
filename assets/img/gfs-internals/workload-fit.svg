<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img"><title>GFS workload fit</title><defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="590" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">The workload—not the word “file”—justifies GFS</text><rect x="55" y="90" width="520" height="420" rx="20" fill="#fff" stroke="#5ab5a4"/><text x="315" y="132" text-anchor="middle" class="h">Original GFS assumptions</text><g class="b"><text x="105" y="190">✓ multi-gigabyte files</text><text x="105" y="235">✓ large streaming reads</text><text x="105" y="280">✓ append-heavy pipelines</text><text x="105" y="325">✓ high aggregate bandwidth</text><text x="105" y="370">✓ frequent component failure</text><text x="105" y="415">✓ applications accept relaxed outcomes</text></g><rect x="625" y="90" width="520" height="420" rx="20" fill="#fff" stroke="#d96b79"/><text x="885" y="132" text-anchor="middle" class="h">Different design required</text><g class="b"><text x="675" y="190">× mostly tiny files</text><text x="675" y="235">× low-latency random overwrite</text><text x="675" y="280">× full POSIX semantics</text><text x="675" y="325">× exactly-once append by default</text><text x="675" y="370">× one small machine already suffices</text><text x="675" y="415">× arbitrary concurrent byte-range mutation</text></g><text x="600" y="555" text-anchor="middle" class="b">GFS chose a coherent contract for one large-scale workload rather than universal filesystem semantics.</text></svg>
