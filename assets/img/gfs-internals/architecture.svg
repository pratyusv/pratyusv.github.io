<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">GFS control plane and data plane</title><desc id="desc">The client asks the master for metadata and lease information, then transfers file data directly with chunkservers. Heartbeats connect the master to chunkservers.</desc><defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">Metadata passes through one master; file bytes do not</text>
<rect x="55" y="245" width="230" height="135" rx="20" fill="#fff" stroke="#b9c9d8" filter="url(#s)"/><text x="170" y="285" text-anchor="middle" class="h">Atlas client library</text><text x="170" y="316" text-anchor="middle" class="b">maps offsets · caches metadata</text><text x="170" y="345" text-anchor="middle" class="b">reads / writes replicas directly</text>
<rect x="455" y="85" width="290" height="150" rx="21" fill="#eef4ff" stroke="#7399dc" filter="url(#s)"/><text x="600" y="125" text-anchor="middle" class="h">Single GFS master</text><text x="600" y="157" text-anchor="middle" class="b">namespace · handles · versions</text><text x="600" y="185" text-anchor="middle" class="b">leases · placement · lifecycle</text><text x="600" y="213" text-anchor="middle" class="b">no application bytes</text>
<g filter="url(#s)"><rect x="410" y="410" width="210" height="120" rx="19" fill="#edf8f6" stroke="#5ab5a4"/><rect x="680" y="410" width="210" height="120" rx="19" fill="#edf8f6" stroke="#5ab5a4"/><rect x="950" y="410" width="210" height="120" rx="19" fill="#edf8f6" stroke="#5ab5a4"/></g><text x="515" y="450" text-anchor="middle" class="h">Chunkserver A</text><text x="515" y="480" text-anchor="middle" class="c">Linux file H9F3</text><text x="515" y="507" text-anchor="middle" class="b">rack-a</text><text x="785" y="450" text-anchor="middle" class="h">Chunkserver B</text><text x="785" y="480" text-anchor="middle" class="c">Linux file H9F3</text><text x="785" y="507" text-anchor="middle" class="b">rack-b</text><text x="1055" y="450" text-anchor="middle" class="h">Chunkserver C</text><text x="1055" y="480" text-anchor="middle" class="c">Linux file H9F3</text><text x="1055" y="507" text-anchor="middle" class="b">rack-c</text>
<path d="M285 275L455 190" stroke="#2f6fdd" stroke-width="3" marker-end="url(#a)"/><path d="M455 150L285 250" stroke="#2f6fdd" stroke-width="3" marker-end="url(#a)"/><text x="340" y="195" class="b">small control messages</text><g fill="none" stroke="#7399dc" stroke-width="2" stroke-dasharray="7 6"><path d="M540 235L515 410"/><path d="M600 235L785 410"/><path d="M660 235L1055 410"/></g><text x="745" y="290" class="b">heartbeats + instructions</text><path d="M285 340C430 610 815 610 950 500" fill="none" stroke="#3b9f8a" stroke-width="5" marker-end="url(#a)"/><text x="600" y="625" text-anchor="middle" class="h">bulk data plane: client ↔ chunkservers</text></svg>
