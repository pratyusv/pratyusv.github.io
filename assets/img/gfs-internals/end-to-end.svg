<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">Complete GFS record lifecycle</title><desc id="desc">One crawl record moves from file offset mapping through metadata lookup, lease version, data pipeline, primary ordering, duplicate retry, stale replica exclusion, cloning, reading, snapshot, and garbage collection.</desc><defs><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}</style></defs><rect width="1200" height="740" rx="24" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="t">One record crosses lookup, ordering, ambiguity, and recovery</text><g fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"><path d="M190 140H260"/><path d="M475 140H545"/><path d="M760 140H830"/><path d="M940 195V270"/><path d="M830 330H760"/><path d="M545 330H475"/><path d="M260 330H190"/><path d="M115 390V465"/><path d="M190 525H260"/><path d="M475 525H545"/><path d="M760 525H830"/><path d="M940 585V650"/></g>
<g filter="url(#s)"><rect x="30" y="85" width="160" height="110" rx="17" fill="#fff" stroke="#b9c9d8"/><rect x="260" y="85" width="215" height="110" rx="17" fill="#eef4ff" stroke="#7399dc"/><rect x="545" y="85" width="215" height="110" rx="17" fill="#eef4ff" stroke="#7399dc"/><rect x="830" y="85" width="220" height="110" rx="17" fill="#edf8f6" stroke="#5ab5a4"/><rect x="830" y="270" width="220" height="120" rx="17" fill="#17324d"/><rect x="545" y="275" width="215" height="110" rx="17" fill="#edf8f6" stroke="#5ab5a4"/><rect x="260" y="275" width="215" height="110" rx="17" fill="#fff4dd" stroke="#e2a63b"/><rect x="30" y="270" width="160" height="120" rx="17" fill="#fdf3f2" stroke="#d96b63"/><rect x="30" y="465" width="160" height="120" rx="17" fill="#fdf3f2" stroke="#d96b63"/><rect x="260" y="470" width="215" height="110" rx="17" fill="#eef4ff" stroke="#7399dc"/><rect x="545" y="470" width="215" height="110" rx="17" fill="#edf8f6" stroke="#5ab5a4"/><rect x="830" y="470" width="220" height="115" rx="17" fill="#fff4dd" stroke="#e2a63b"/><rect x="830" y="650" width="220" height="65" rx="17" fill="#17324d"/></g>
<g text-anchor="middle"><text x="110" y="117" class="h">1 · Offset</text><text x="110" y="146" class="b">145 MiB tail</text><text x="110" y="171" class="b">chunk index 2</text><text x="367" y="117" class="h">2 · Lookup</text><text x="367" y="146" class="b">index 2 → H9F3</text><text x="367" y="171" class="b">A, B, C · v13</text><text x="652" y="117" class="h">3 · Lease</text><text x="652" y="146" class="b">CS-A primary</text><text x="652" y="171" class="b">version fences generation</text><text x="940" y="117" class="h">4 · Data pipeline</text><text x="940" y="146" class="b">P7 → B → C → A</text><text x="940" y="171" class="b">buffer D1042</text><text x="652" y="307" class="h">6 · Replica apply</text><text x="652" y="336" class="b">same offset + order</text><text x="652" y="361" class="b">A, B, C complete</text><text x="367" y="307" class="h">7 · Lost response</text><text x="367" y="336" class="b">client cannot know success</text><text x="367" y="361" class="b">retry may duplicate</text><text x="110" y="307" class="h">8 · CS-C offline</text><text x="110" y="336" class="b">misses next lease</text><text x="110" y="361" class="b">remains version 13</text><text x="110" y="502" class="h">9 · Stale exclusion</text><text x="110" y="531" class="b">master expects v14</text><text x="110" y="556" class="b">never read / lease / clone</text><text x="367" y="502" class="h">10 · Re-replicate</text><text x="367" y="531" class="b">CS-A → CS-D</text><text x="367" y="556" class="b">restore RF=3</text><text x="652" y="502" class="h">11 · Reader</text><text x="652" y="531" class="b">verify CRC</text><text x="652" y="556" class="b">dedupe record ID</text><text x="940" y="502" class="h">12 · Snapshot</text><text x="940" y="531" class="b">share H9F3</text><text x="940" y="556" class="b">copy on next write</text></g><text x="940" y="306" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#fff">5 · Primary order</text><text x="940" y="336" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#dce5ed">offset · serial 105</text><text x="940" y="365" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#dce5ed">record crawl-7:1042</text><text x="940" y="677" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#fff">13 · Lazy GC</text><text x="940" y="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#dce5ed">forget → heartbeat → delete</text><rect x="220" y="655" width="540" height="48" rx="18" fill="#17324d"/><text x="490" y="685" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fff">The application completes the storage semantics</text></svg>
