<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">GFS master durable and reconstructed state</title><desc id="desc">Namespace, file-to-chunk mappings, and versions are persisted in checkpoints and operation logs, while replica locations are reconstructed from chunkserver reports.</desc><defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="690" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">Persist semantic truth; reconstruct physical observation</text>
<rect x="405" y="95" width="390" height="180" rx="22" fill="#eef4ff" stroke="#7399dc" filter="url(#s)"/><text x="600" y="135" text-anchor="middle" class="h">In-memory master metadata</text><text x="455" y="175" class="c">namespace</text><text x="455" y="205" class="c">file → chunk handles</text><text x="455" y="235" class="c">chunk versions + leases</text><text x="650" y="175" class="c">replica locations</text><text x="650" y="205" class="c">health + placement</text><text x="650" y="235" class="c">repair + GC queues</text>
<path d="M500 275L310 380" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><path d="M700 275L890 380" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><text x="350" y="320" class="b">persist</text><text x="820" y="320" class="b">relearn</text>
<rect x="65" y="380" width="480" height="190" rx="22" fill="#fff4dd" stroke="#e2a63b" filter="url(#s)"/><text x="305" y="420" text-anchor="middle" class="h">Durable logical metadata</text><rect x="105" y="450" width="175" height="72" rx="14" fill="#fff" stroke="#b9c9d8"/><text x="192" y="480" text-anchor="middle" class="c">checkpoint N</text><text x="192" y="506" text-anchor="middle" class="b">compact base</text><rect x="325" y="450" width="175" height="72" rx="14" fill="#fff" stroke="#b9c9d8"/><text x="412" y="480" text-anchor="middle" class="c">operation log</text><text x="412" y="506" text-anchor="middle" class="b">ordered suffix</text><text x="305" y="550" text-anchor="middle" class="b">flushed locally and remotely</text>
<rect x="655" y="380" width="480" height="190" rx="22" fill="#edf8f6" stroke="#5ab5a4" filter="url(#s)"/><text x="895" y="420" text-anchor="middle" class="h">Current physical locations</text><text x="705" y="462" class="c">CS-A reports H9F3 v13</text><text x="705" y="496" class="c">CS-B reports H9F3 v13</text><text x="705" y="530" class="c">CS-C reports H9F3 v13</text><text x="895" y="555" text-anchor="middle" class="b">startup inventory + recurring heartbeats</text><rect x="260" y="620" width="680" height="42" rx="18" fill="#17324d"/><text x="600" y="647" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fff">A disk's present contents cannot be recovered from an old location map</text></svg>
