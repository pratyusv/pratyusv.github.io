<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc"><title id="title">GFS separate data and control flow</title><desc id="desc">Record bytes pipeline from client P7 through secondaries CS-B and CS-C to primary CS-A. Only after all have data does the client request mutation ordering from CS-A, which sends the chosen offset and serial to secondaries.</desc><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b9f8a"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f6fdd"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}.lane{stroke:#b9c9d8;stroke-width:2;stroke-dasharray:7 7}</style></defs><rect width="1200" height="730" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Control follows authority; bytes follow network topology</text><g text-anchor="middle"><text x="105" y="92" class="h">Producer P7</text><text x="370" y="92" class="h">CS-B · secondary</text><text x="650" y="92" class="h">CS-C · secondary</text><text x="960" y="92" class="h">CS-A · PRIMARY</text></g><g class="lane"><path d="M105 110V665"/><path d="M370 110V665"/><path d="M650 110V665"/><path d="M960 110V665"/></g>
<rect x="30" y="125" width="150" height="55" rx="13" fill="#edf8f6" stroke="#5ab5a4"/><text x="105" y="159" text-anchor="middle" class="c">data id D1042</text><path d="M105 205H370" stroke="#3b9f8a" stroke-width="5" marker-end="url(#b)"/><path d="M370 245H650" stroke="#3b9f8a" stroke-width="5" marker-end="url(#b)"/><path d="M650 285H960" stroke="#3b9f8a" stroke-width="5" marker-end="url(#b)"/><text x="240" y="197" class="b">record bytes</text><text x="510" y="237" class="b">pipeline</text><text x="805" y="277" class="b">closest next hop</text><g fill="#edf8f6" stroke="#5ab5a4"><rect x="295" y="310" width="150" height="48" rx="12"/><rect x="575" y="310" width="150" height="48" rx="12"/><rect x="885" y="310" width="150" height="48" rx="12"/></g><g text-anchor="middle" class="c"><text x="370" y="340">buffer D1042</text><text x="650" y="340">buffer D1042</text><text x="960" y="340">buffer D1042</text></g>
<path d="M105 405H960" stroke="#2f6fdd" stroke-width="3" marker-end="url(#a)"/><text x="530" y="394" text-anchor="middle" class="c">append(data=D1042)</text><rect x="870" y="430" width="180" height="85" rx="16" fill="#17324d"/><text x="960" y="461" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#fff">choose offset</text><text x="960" y="486" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#fff">serial = 105</text><path d="M960 545H650" stroke="#2f6fdd" stroke-width="3" marker-end="url(#a)"/><path d="M960 575H370" stroke="#2f6fdd" stroke-width="3" marker-end="url(#a)"/><text x="800" y="538" class="c">apply D1042 @ offset · #105</text><path d="M370 615H960M650 640H960" stroke="#55728f" stroke-width="2.5" marker-end="url(#a)"/><text x="500" y="608" class="b">done</text><path d="M960 675H105" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><text x="530" y="697" text-anchor="middle" class="c">success or replica errors</text></svg>
