<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">GFS lease and chunk version lifecycle</title><desc id="desc">The master advances chunk H9F3 from version 12 to 13 on current replicas, grants CS-A a lease, extends it through heartbeats, and waits for expiration before granting a new primary.</desc><defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="690" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">Version fences generations; lease delegates ordering</text>
<path d="M85 335H1115" stroke="#b9c9d8" stroke-width="5"/><g fill="#55728f"><circle cx="165" cy="335" r="12"/><circle cx="390" cy="335" r="12"/><circle cx="625" cy="335" r="12"/><circle cx="855" cy="335" r="12"/><circle cx="1070" cy="335" r="12"/></g>
<g filter="url(#s)"><rect x="70" y="130" width="190" height="130" rx="18" fill="#fff" stroke="#b9c9d8"/><rect x="285" y="395" width="210" height="145" rx="18" fill="#eef4ff" stroke="#7399dc"/><rect x="520" y="130" width="210" height="130" rx="18" fill="#17324d"/><rect x="750" y="395" width="210" height="145" rx="18" fill="#fff4dd" stroke="#e2a63b"/><rect x="975" y="130" width="190" height="130" rx="18" fill="#edf8f6" stroke="#5ab5a4"/></g>
<text x="165" y="168" text-anchor="middle" class="h">No active lease</text><text x="165" y="199" text-anchor="middle" class="c">H9F3 v12</text><text x="165" y="228" text-anchor="middle" class="b">three current replicas</text><text x="390" y="433" text-anchor="middle" class="h">Master advances version</text><text x="390" y="464" text-anchor="middle" class="c">v12 → v13</text><text x="390" y="493" text-anchor="middle" class="b">persist on current replicas</text><text x="390" y="519" text-anchor="middle" class="b">before client notification</text><text x="625" y="168" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#fff">CS-A lease</text><text x="625" y="199" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#dce5ed">PRIMARY · v13</text><text x="625" y="228" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#dce5ed">orders many mutations</text><text x="855" y="433" text-anchor="middle" class="h">Heartbeat extension</text><text x="855" y="464" text-anchor="middle" class="b">while mutations continue</text><text x="855" y="493" text-anchor="middle" class="b">or wait for expiration</text><text x="855" y="519" text-anchor="middle" class="b">after contact is lost</text><text x="1070" y="168" text-anchor="middle" class="h">Next generation</text><text x="1070" y="199" text-anchor="middle" class="c">CS-B · v14</text><text x="1070" y="228" text-anchor="middle" class="b">new primary only after safe transition</text>
<g fill="none" stroke="#55728f" stroke-width="2.5" marker-end="url(#a)"><path d="M165 260V323"/><path d="M390 347V395"/><path d="M625 260V323"/><path d="M855 347V395"/><path d="M1070 260V323"/></g><rect x="270" y="600" width="660" height="46" rx="18" fill="#17324d"/><text x="600" y="629" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fff">Authority is time-bounded; version survives time and exposes stale replicas</text></svg>
