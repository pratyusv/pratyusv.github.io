<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">GFS master recovery</title><desc id="desc">A restarted master loads the latest complete checkpoint, replays subsequent operation logs, then polls chunkservers to reconstruct physical replica locations before resuming control tasks.</desc><defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs><rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="46" text-anchor="middle" class="t">Master recovery combines durable history with live inventory</text>
<g filter="url(#s)"><rect x="40" y="115" width="215" height="145" rx="19" fill="#fff4dd" stroke="#e2a63b"/><rect x="315" y="115" width="215" height="145" rx="19" fill="#fff4dd" stroke="#e2a63b"/><rect x="590" y="115" width="240" height="145" rx="19" fill="#eef4ff" stroke="#7399dc"/><rect x="890" y="115" width="270" height="145" rx="19" fill="#edf8f6" stroke="#5ab5a4"/></g><text x="147" y="154" text-anchor="middle" class="h">1 · Checkpoint N</text><text x="147" y="187" text-anchor="middle" class="b">namespace + mappings</text><text x="147" y="216" text-anchor="middle" class="b">versions through log switch</text><text x="147" y="240" text-anchor="middle" class="b">latest complete only</text><text x="422" y="154" text-anchor="middle" class="h">2 · Operation logs</text><text x="422" y="187" text-anchor="middle" class="c">N+1 ... N+k</text><text x="422" y="216" text-anchor="middle" class="b">ordered metadata suffix</text><text x="710" y="154" text-anchor="middle" class="h">3 · Logical state</text><text x="710" y="187" text-anchor="middle" class="b">replay into memory</text><text x="710" y="216" text-anchor="middle" class="c">index 2 → H9F3 v14</text><text x="1025" y="154" text-anchor="middle" class="h">4 · Live inventory</text><text x="1025" y="187" text-anchor="middle" class="b">poll chunkservers</text><text x="1025" y="216" text-anchor="middle" class="c">H9F3 @ A, B, D</text>
<g fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"><path d="M255 187H315"/><path d="M530 187H590"/><path d="M830 187H890"/></g><path d="M1025 260V345" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="405" y="345" width="390" height="175" rx="22" fill="#17324d" filter="url(#s)"/><text x="600" y="386" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#fff">Recovered active master</text><text x="600" y="421" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#dce5ed">namespace · handles · versions · locations</text><text x="600" y="456" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#dce5ed">resume leases · placement · repair · GC</text><text x="600" y="488" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#dce5ed">client data remains on chunkservers</text><path d="M890 240C815 290 730 310 690 345" fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><rect x="290" y="585" width="620" height="46" rx="18" fill="#17324d"/><text x="600" y="614" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fff">The checkpoint restores meaning; servers report where bytes actually remain</text></svg>
