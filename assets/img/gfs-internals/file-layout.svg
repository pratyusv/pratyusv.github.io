<path d="M960 260V330" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><text x="980" y="302" class="b">replication factor 3</text><g filter="url(#s)"><rect x="180" y="375" width="245" height="110" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="478" y="375" width="245" height="110" rx="18" fill="#edf8f6" stroke="#5ab5a4"/><rect x="775" y="375" width="245" height="110" rx="18" fill="#edf8f6" stroke="#5ab5a4"/></g><text x="302" y="415" text-anchor="middle" class="h">CS-A · rack-a</text><text x="302" y="449" text-anchor="middle" class="c">H9F3 v13</text><text x="600" y="415" text-anchor="middle" class="h">CS-B · rack-b</text><text x="600" y="449" text-anchor="middle" class="c">H9F3 v13</text><text x="897" y="415" text-anchor="middle" class="h">CS-C · rack-c</text><text x="897" y="449" text-anchor="middle" class="c">H9F3 v13</text><rect x="250" y="555" width="700" height="62" rx="19" fill="#17324d"/><text x="600" y="582" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" fill="#fff">index = floor(offset / 64 MiB)</text><text x="600" y="606" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#dce5ed">the handle is immutable; replica locations can change</text></svg>
