<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Edge request classification</title>
  <desc id="desc">The edge proxy can answer a cacheable request locally or forward a dynamic API request inward.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker>
    <style>
      .title{font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}
      .label{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}
      .body{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}
      .code{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#45627d}
      .box{fill:#fff;stroke:#b9c9d8;stroke-width:2}
      .active{fill:#fff8e8;stroke:#e4b85b;stroke-width:3}
      .cache{fill:#edf8f6;stroke:#5ab5a4;stroke-width:3}
      .next{fill:#eef4ff;stroke:#7399dc;stroke-width:2}
      .arrow{stroke:#55728f;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#9eb0c0;stroke-width:2.5;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#f7fafc"/>
  <text x="600" y="52" text-anchor="middle" class="title">The edge classifies the request before sending it inward</text>
  <rect x="70" y="200" width="200" height="120" rx="18" class="box"/>
  <text x="170" y="246" text-anchor="middle" class="label">Client</text>
  <text x="170" y="278" text-anchor="middle" class="code">GET /payments/42</text>
  <rect x="410" y="170" width="240" height="180" rx="18" class="active"/>
  <text x="530" y="218" text-anchor="middle" class="label">Edge proxy</text>
  <text x="530" y="252" text-anchor="middle" class="body">TLS, policy, routing</text>
  <text x="530" y="286" text-anchor="middle" class="code">match Host + path</text>
  <rect x="790" y="105" width="240" height="110" rx="18" class="cache"/>
  <text x="910" y="148" text-anchor="middle" class="label">Cache hit</text>
  <text x="910" y="180" text-anchor="middle" class="code">/assets/logo.png</text>
  <rect x="790" y="305" width="240" height="110" rx="18" class="next"/>
  <text x="910" y="348" text-anchor="middle" class="label">Dynamic route</text>
  <text x="910" y="380" text-anchor="middle" class="code">/payments/42</text>
  <path d="M270 260H400" class="arrow"/>
  <path d="M650 245C705 190 735 160 780 160" class="dash"/>
  <path d="M650 275C705 330 735 360 780 360" class="arrow"/>
  <rect x="320" y="454" width="560" height="42" rx="21" fill="#17324d"/>
  <text x="600" y="480" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#fff">Static content may stop at the edge; dynamic APIs continue inward.</text>
</svg>
