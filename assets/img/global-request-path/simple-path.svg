<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Single-region request path</title>
  <desc id="desc">A client reaches a regional load balancer, which forwards to one application backend.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker>
    <style>
      .title{font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}
      .label{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}
      .body{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}
      .code{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#45627d}
      .box{fill:#fff;stroke:#b9c9d8;stroke-width:2}
      .active{fill:#edf8f6;stroke:#5ab5a4;stroke-width:3}
      .arrow{stroke:#55728f;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="430" rx="24" fill="#f7fafc"/>
  <text x="600" y="52" text-anchor="middle" class="title">Before global infrastructure, the path is short</text>
  <rect x="85" y="145" width="230" height="140" rx="18" class="box"/>
  <text x="200" y="194" text-anchor="middle" class="label">Client</text>
  <text x="200" y="226" text-anchor="middle" class="code">api.example.com</text>
  <text x="200" y="254" text-anchor="middle" class="body">opens connection</text>
  <rect x="485" y="145" width="230" height="140" rx="18" class="active"/>
  <text x="600" y="194" text-anchor="middle" class="label">Regional load balancer</text>
  <text x="600" y="226" text-anchor="middle" class="body">stable service entry</text>
  <text x="600" y="254" text-anchor="middle" class="code">choose backend</text>
  <rect x="885" y="145" width="230" height="140" rx="18" class="box"/>
  <text x="1000" y="194" text-anchor="middle" class="label">Application backend</text>
  <text x="1000" y="226" text-anchor="middle" class="body">runs request</text>
  <text x="1000" y="254" text-anchor="middle" class="code">GET /payments/42</text>
  <path d="M315 215H475" class="arrow"/>
  <path d="M715 215H875" class="arrow"/>
  <rect x="340" y="337" width="520" height="44" rx="22" fill="#17324d"/>
  <text x="600" y="365" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#fff">One region means fewer routing decisions and fewer failure boundaries.</text>
</svg>
