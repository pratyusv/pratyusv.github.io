<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Response path follows established state</title>
  <desc id="desc">The backend response returns through the proxy, regional egress, edge point of presence, and client-facing connection.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker>
    <style>
      .title{font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}
      .label{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}
      .body{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}
      .code{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#45627d}
      .box{fill:#fff;stroke:#b9c9d8;stroke-width:2}
      .active{fill:#edf8f6;stroke:#5ab5a4;stroke-width:3}
      .mid{fill:#eef4ff;stroke:#7399dc;stroke-width:2.5}
      .edge{fill:#fff8e8;stroke:#e4b85b;stroke-width:2.5}
      .arrow{stroke:#55728f;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="500" rx="24" fill="#f7fafc"/>
  <text x="600" y="52" text-anchor="middle" class="title">The response follows state created on the way in</text>
  <rect x="70" y="185" width="190" height="130" rx="18" class="box"/>
  <text x="165" y="234" text-anchor="middle" class="label">Client</text>
  <text x="165" y="266" text-anchor="middle" class="code">receives JSON</text>
  <rect x="330" y="185" width="190" height="130" rx="18" class="edge"/>
  <text x="425" y="234" text-anchor="middle" class="label">Edge PoP</text>
  <text x="425" y="266" text-anchor="middle" class="body">client connection</text>
  <rect x="590" y="185" width="190" height="130" rx="18" class="mid"/>
  <text x="685" y="234" text-anchor="middle" class="label">L7 proxy P2</text>
  <text x="685" y="266" text-anchor="middle" class="body">matches response</text>
  <rect x="850" y="185" width="190" height="130" rx="18" class="active"/>
  <text x="945" y="234" text-anchor="middle" class="label">Backend B2</text>
  <text x="945" y="266" text-anchor="middle" class="code">payment response</text>
  <path d="M850 250H790" class="arrow"/>
  <path d="M590 250H530" class="arrow"/>
  <path d="M330 250H270" class="arrow"/>
  <path d="M945 170C945 115 165 115 165 170" stroke="#9eb0c0" stroke-width="2.5" stroke-dasharray="7 6" fill="none"/>
  <text x="555" y="103" text-anchor="middle" class="body">request state already selected B2 and P2</text>
  <rect x="310" y="385" width="580" height="42" rx="21" fill="#17324d"/>
  <text x="600" y="411" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#fff">The response does not choose a new backend; it follows existing state.</text>
</svg>
