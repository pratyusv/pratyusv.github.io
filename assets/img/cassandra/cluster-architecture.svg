<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Cassandra coordinator, replicas, and control plane</title>
  <desc id="desc">A client sends a request to a temporary coordinator, which routes to three replicas. Gossip and failure detection form a separate peer-to-peer control plane.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f6fdd"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.n{fill:#fff;stroke:#b9c9d8;stroke-width:2}</style></defs>
  <rect width="1200" height="690" rx="24" fill="#f7fafc"/><text x="600" y="48" text-anchor="middle" class="t">Coordinator is a per-request role, not a permanent leader</text>
  <rect x="65" y="215" width="180" height="95" rx="18" class="n" filter="url(#s)"/><text x="155" y="252" text-anchor="middle" class="h">C++ client</text><text x="155" y="279" text-anchor="middle" class="b">token-aware driver</text>
  <path d="M245 262H395" stroke="#2f6fdd" stroke-width="4" marker-end="url(#a)"/><text x="320" y="246" text-anchor="middle" class="b">CQL request</text>
  <rect x="395" y="190" width="235" height="145" rx="20" fill="#eef4ff" stroke="#7399dc" stroke-width="2" filter="url(#s)"/><text x="512" y="230" text-anchor="middle" class="h">N4 · coordinator</text><text x="512" y="260" text-anchor="middle" class="b">token + topology map</text><text x="512" y="287" text-anchor="middle" class="b">wait for requested CL</text><text x="512" y="314" text-anchor="middle" class="b">role ends with request</text>
  <g class="n" filter="url(#s)"><rect x="830" y="90" width="250" height="110" rx="18"/><rect x="830" y="250" width="250" height="110" rx="18"/><rect x="830" y="410" width="250" height="110" rx="18"/></g>
  <g text-anchor="middle"><text x="955" y="132" class="h">N1 · replica</text><text x="955" y="163" class="b">commit log + memtable</text><text x="955" y="292" class="h">N2 · replica</text><text x="955" y="323" class="b">commit log + memtable</text><text x="955" y="452" class="h">N3 · replica</text><text x="955" y="483" class="b">commit log + memtable</text></g>
  <g fill="none" stroke="#2f6fdd" stroke-width="3" marker-end="url(#a)"><path d="M630 230L830 145"/><path d="M630 262H830"/><path d="M630 295L830 465"/></g>
  <rect x="205" y="570" width="790" height="72" rx="20" fill="#17324d"/><text x="600" y="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#fff">Peer-to-peer control plane</text><text x="600" y="626" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#dce5ed">gossip · membership · token metadata · phi accrual failure detector</text>
  <g stroke="#55728f" stroke-width="2" stroke-dasharray="7 6"><path d="M512 335V570"/><path d="M955 200V570"/><path d="M955 360V570"/><path d="M955 520V570"/></g>
</svg>
