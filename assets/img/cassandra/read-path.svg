<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Cassandra quorum read and reconciliation</title><desc id="desc">A coordinator requests a local quorum. Each replica merges memtable and SSTable state, then the coordinator compares results, returns the winning value, and may repair stale replicas.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs>
  <rect width="1200" height="720" rx="24" fill="#f7fafc"/><text x="600" y="48" text-anchor="middle" class="t">Quorum is distributed; every replica also performs a local merge</text>
  <rect x="45" y="270" width="200" height="105" rx="18" fill="#eef4ff" stroke="#7399dc" filter="url(#s)"/><text x="145" y="310" text-anchor="middle" class="h">Coordinator</text><text x="145" y="339" text-anchor="middle" class="b">LOCAL_QUORUM = 2</text><text x="145" y="364" text-anchor="middle" class="b">reconcile responses</text>
  <g filter="url(#s)"><rect x="390" y="85" width="340" height="150" rx="20" fill="#fff" stroke="#b9c9d8"/><rect x="390" y="285" width="340" height="150" rx="20" fill="#fff" stroke="#b9c9d8"/><rect x="390" y="485" width="340" height="150" rx="20" fill="#fff" stroke="#b9c9d8"/></g>
  <g><text x="425" y="123" class="h">N1 · data response</text><text x="425" y="153" class="c">memtable + SSTables</text><text x="425" y="181" class="c">v=payment_authorized</text><text x="425" y="209" class="c">ts=130000</text><text x="425" y="323" class="h">N2 · digest response</text><text x="425" y="353" class="c">memtable + SSTables</text><text x="425" y="381" class="c">digest(new value)</text><text x="425" y="409" class="c">matches N1</text><text x="425" y="523" class="h">N3 · stale response</text><text x="425" y="553" class="c">v=checkout_started</text><text x="425" y="581" class="c">ts=100000</text><text x="425" y="609" class="b">may be repaired if consulted</text></g>
  <g fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"><path d="M245 305L390 160"/><path d="M245 323L390 360"/><path d="M245 341L390 560" stroke-dasharray="8 7"/></g>
  <rect x="830" y="200" width="315" height="235" rx="20" fill="#edf8f6" stroke="#5ab5a4" stroke-width="2" filter="url(#s)"/><text x="987" y="240" text-anchor="middle" class="h">Coordinator reconciliation</text><text x="870" y="282" class="b">1. compare data and digests</text><text x="870" y="316" class="b">2. fetch full data if needed</text><text x="870" y="350" class="b">3. highest visible version wins</text><text x="870" y="384" class="b">4. optionally repair stale copy</text><path d="M730 330H830" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/>
  <rect x="830" y="505" width="315" height="90" rx="18" fill="#17324d"/><text x="987" y="542" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" fill="#fff">payment_authorized</text><text x="987" y="570" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#dce5ed">returned to client</text>
  <path d="M987 435V505" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/>
</svg>
