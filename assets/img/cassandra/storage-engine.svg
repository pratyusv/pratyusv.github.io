<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Cassandra local LSM storage engine</title><desc id="desc">Each replica appends a mutation to a commit log and memtable, flushes immutable SSTables, and compacts them in the background. Reads merge memory and disk sources.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs>
  <rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="48" text-anchor="middle" class="t">A replica converts random mutations into append, flush, and merge</text>
  <rect x="55" y="130" width="190" height="82" rx="17" fill="#eef4ff" stroke="#7399dc" filter="url(#s)"/><text x="150" y="164" text-anchor="middle" class="h">Mutation</text><text x="150" y="190" text-anchor="middle" class="c">cell + timestamp</text>
  <path d="M245 170H345" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><path d="M295 170V335H345" fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/>
  <rect x="345" y="110" width="280" height="120" rx="20" fill="#fff4dd" stroke="#e2a63b" stroke-width="2" filter="url(#s)"/><text x="485" y="150" text-anchor="middle" class="h">Commit log</text><text x="485" y="180" text-anchor="middle" class="b">append-only · shared by tables</text><text x="485" y="207" text-anchor="middle" class="b">crash replay until flushed</text>
  <rect x="345" y="285" width="280" height="120" rx="20" fill="#edf8f6" stroke="#5ab5a4" stroke-width="2" filter="url(#s)"/><text x="485" y="325" text-anchor="middle" class="h">Active memtable</text><text x="485" y="355" text-anchor="middle" class="b">sorted in-memory mutations</text><text x="485" y="382" text-anchor="middle" class="b">also serves reads</text>
  <path d="M625 345H730" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><text x="678" y="328" text-anchor="middle" class="b">flush</text>
  <g filter="url(#s)"><rect x="730" y="160" width="390" height="96" rx="17" fill="#fff" stroke="#b9c9d8"/><rect x="730" y="282" width="390" height="96" rx="17" fill="#fff" stroke="#b9c9d8"/><rect x="730" y="404" width="390" height="96" rx="17" fill="#fff" stroke="#b9c9d8"/></g>
  <g><text x="770" y="195" class="h">SSTable 3 · newest</text><text x="770" y="225" class="b">Data · Index · Bloom · Statistics</text><text x="770" y="317" class="h">SSTable 2</text><text x="770" y="347" class="b">immutable partition fragments</text><text x="770" y="439" class="h">SSTable 1 · oldest</text><text x="770" y="469" class="b">older versions and tombstones</text></g>
  <path d="M925 505V580H690V505" fill="none" stroke="#d96b63" stroke-width="3" marker-end="url(#a)"/><text x="807" y="608" text-anchor="middle" class="h">background compaction</text><text x="807" y="635" text-anchor="middle" class="b">sorted merge → new SSTables → retire safe inputs</text>
  <rect x="95" y="490" width="510" height="100" rx="18" fill="#17324d"/><text x="350" y="529" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#fff">Read = merge every relevant source</text><text x="350" y="558" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#dce5ed">memtables + Bloom/index-selected SSTables</text>
</svg>
