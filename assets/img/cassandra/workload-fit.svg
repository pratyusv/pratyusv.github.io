<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img"><title>Cassandra workload fit</title><defs><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 17px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="590" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Choose Cassandra for the workload contract</text><rect x="55" y="90" width="520" height="420" rx="20" fill="#fff" stroke="#5ab5a4"/><text x="315" y="132" text-anchor="middle" class="h">Strong fit</text><g class="b"><text x="105" y="190">✓ known partition-key queries</text><text x="105" y="235">✓ high sustained write throughput</text><text x="105" y="280">✓ horizontal data and traffic growth</text><text x="105" y="325">✓ multi-failure-domain replication</text><text x="105" y="370">✓ explicit consistency choices</text><text x="105" y="415">✓ bounded partitions and repair discipline</text></g><rect x="625" y="90" width="520" height="420" rx="20" fill="#fff" stroke="#d96b79"/><text x="885" y="132" text-anchor="middle" class="h">Poor default</text><g class="b"><text x="675" y="190">× arbitrary joins and ad hoc access</text><text x="675" y="235">× global multi-row transactions</text><text x="675" y="280">× one small dataset with modest load</text><text x="675" y="325">× strict order for every ordinary write</text><text x="675" y="370">× unbounded or unpredictable partitions</text><text x="675" y="415">× no capacity for compaction and repair</text></g><text x="600" y="555" text-anchor="middle" class="b">Distribution is justified by a demonstrated constraint, not by the database category.</text></svg>
