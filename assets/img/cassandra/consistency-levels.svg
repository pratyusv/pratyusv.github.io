<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Cassandra consistency-level response sets</title><desc id="desc">For replication factor three, ONE requires one response, QUORUM requires two, and ALL requires three. A quorum read and quorum write must overlap.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs>
  <rect width="1200" height="650" rx="24" fill="#f7fafc"/><text x="600" y="48" text-anchor="middle" class="t">Consistency level chooses required responses, not replica count</text>
  <g filter="url(#s)"><rect x="55" y="110" width="325" height="380" rx="22" fill="#fff" stroke="#b9c9d8"/><rect x="438" y="110" width="325" height="380" rx="22" fill="#fff" stroke="#b9c9d8"/><rect x="820" y="110" width="325" height="380" rx="22" fill="#fff" stroke="#b9c9d8"/></g>
  <g text-anchor="middle"><text x="217" y="153" class="h">ONE · 1 response</text><text x="600" y="153" class="h">QUORUM · 2 responses</text><text x="982" y="153" class="h">ALL · 3 responses</text></g>
  <g><circle cx="130" cy="245" r="47" fill="#3b9f8a"/><circle cx="217" cy="350" r="47" fill="#e7edf3"/><circle cx="304" cy="245" r="47" fill="#e7edf3"/><circle cx="513" cy="245" r="47" fill="#3b9f8a"/><circle cx="600" cy="350" r="47" fill="#3b9f8a"/><circle cx="687" cy="245" r="47" fill="#e7edf3"/><circle cx="895" cy="245" r="47" fill="#3b9f8a"/><circle cx="982" cy="350" r="47" fill="#3b9f8a"/><circle cx="1069" cy="245" r="47" fill="#3b9f8a"/></g>
  <g text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" fill="#17324d"><text x="130" y="251">N1</text><text x="217" y="356">N2</text><text x="304" y="251">N3</text><text x="513" y="251">N1</text><text x="600" y="356">N2</text><text x="687" y="251">N3</text><text x="895" y="251">N1</text><text x="982" y="356">N2</text><text x="1069" y="251">N3</text></g>
  <g text-anchor="middle"><text x="217" y="440" class="b">tolerates two unreachable replicas</text><text x="600" y="440" class="b">tolerates one unreachable replica</text><text x="982" y="440" class="b">one failure makes it unavailable</text></g>
  <rect x="185" y="530" width="830" height="76" rx="20" fill="#17324d"/><text x="600" y="561" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="700" fill="#fff">R + W &gt; N  ⇒  read set intersects write set</text><text x="600" y="590" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#dce5ed">RF=3: quorum read 2 + quorum write 2 must share at least one replica</text>
</svg>
