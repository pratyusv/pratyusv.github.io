<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Cassandra token ranges, virtual nodes, and replicas</title>
  <desc id="desc">A partition token maps clockwise to a vnode, then a topology-aware replication strategy selects three distinct physical nodes across racks.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs>
  <rect width="1200" height="690" rx="24" fill="#f7fafc"/><text x="600" y="48" text-anchor="middle" class="t">Token ownership and replica placement are separate decisions</text>
  <circle cx="365" cy="348" r="220" fill="#fff" stroke="#b9c9d8" stroke-width="15" filter="url(#s)"/>
  <g text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" fill="#fff"><circle cx="365" cy="128" r="27" fill="#2f6fdd"/><text x="365" y="133">N1</text><circle cx="585" cy="348" r="27" fill="#3b9f8a"/><text x="585" y="353">N2</text><circle cx="365" cy="568" r="27" fill="#d96b63"/><text x="365" y="573">N3</text><circle cx="145" cy="348" r="27" fill="#e2a63b"/><text x="145" y="353">N4</text><circle cx="520" cy="190" r="22" fill="#e2a63b"/><text x="520" y="195">N4</text><circle cx="210" cy="505" r="22" fill="#2f6fdd"/><text x="210" y="510">N1</text></g>
  <rect x="475" y="244" width="68" height="38" rx="9" fill="#fcebea" stroke="#d96b63"/><text x="509" y="269" text-anchor="middle" class="c">token t</text><path d="M510 282C560 290 580 310 585 330" fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/>
  <text x="365" y="330" text-anchor="middle" class="h">64-bit token space</text><text x="365" y="358" text-anchor="middle" class="b">one node owns many vnodes</text><text x="365" y="384" text-anchor="middle" class="b">ring is metadata, not network hops</text>
  <path d="M620 348H735" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><text x="678" y="330" text-anchor="middle" class="b">NTS · RF=3</text>
  <rect x="735" y="115" width="395" height="465" rx="22" fill="#fff" stroke="#b9c9d8" filter="url(#s)"/><text x="932" y="153" text-anchor="middle" class="h">Natural replicas in eu-west</text>
  <rect x="785" y="190" width="295" height="85" rx="16" fill="#eef4ff" stroke="#7399dc"/><text x="815" y="222" class="h">N2</text><text x="815" y="249" class="b">rack-b · vnode owner</text>
  <rect x="785" y="300" width="295" height="85" rx="16" fill="#edf8f6" stroke="#5ab5a4"/><text x="815" y="332" class="h">N3</text><text x="815" y="359" class="b">rack-c · next distinct node</text>
  <rect x="785" y="410" width="295" height="85" rx="16" fill="#fff4dd" stroke="#e2a63b"/><text x="815" y="442" class="h">N4</text><text x="815" y="469" class="b">rack-a · next distinct node</text>
  <text x="932" y="538" text-anchor="middle" class="b">Repeated vnodes never count as extra copies</text>
</svg>
