<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Cassandra hinted handoff, read repair, and anti-entropy repair</title><desc id="desc">Three repair mechanisms cover different gaps: hints replay recent missed writes, reads can repair encountered divergence, and scheduled Merkle-tree comparison repairs full token ranges.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}</style></defs>
  <rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="48" text-anchor="middle" class="t">Convergence uses three complementary paths</text>
  <g filter="url(#s)"><rect x="55" y="105" width="330" height="430" rx="22" fill="#fff4dd" stroke="#e2a63b"/><rect x="435" y="105" width="330" height="430" rx="22" fill="#eef4ff" stroke="#7399dc"/><rect x="815" y="105" width="330" height="430" rx="22" fill="#edf8f6" stroke="#5ab5a4"/></g>
  <g text-anchor="middle"><text x="220" y="148" class="h">1 · Hinted handoff</text><text x="600" y="148" class="h">2 · Read repair</text><text x="980" y="148" class="h">3 · Anti-entropy repair</text></g>
  <g><rect x="95" y="190" width="105" height="65" rx="14" fill="#fff" stroke="#b9c9d8"/><text x="147" y="216" text-anchor="middle" class="c">coord</text><text x="147" y="239" text-anchor="middle" class="b">stores hint</text><rect x="245" y="190" width="105" height="65" rx="14" fill="#fdf3f2" stroke="#d96b63"/><text x="297" y="216" text-anchor="middle" class="c">N3</text><text x="297" y="239" text-anchor="middle" class="b">down</text><path d="M200 222H245" stroke="#55728f" stroke-width="3" stroke-dasharray="6 5"/><path d="M297 275V330H170" fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><text x="220" y="357" text-anchor="middle" class="b">replay after N3 returns</text><text x="220" y="402" text-anchor="middle" class="b">fast for recent missed writes</text><text x="220" y="432" text-anchor="middle" class="b">best effort and time-bounded</text></g>
  <g><circle cx="525" cy="225" r="48" fill="#3b9f8a"/><circle cx="675" cy="225" r="48" fill="#d96b63"/><text x="525" y="231" text-anchor="middle" class="c">new</text><text x="675" y="231" text-anchor="middle" class="c">old</text><path d="M550 278C575 315 625 315 650 278" fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"/><text x="600" y="356" text-anchor="middle" class="b">repair disagreement found by read</text><text x="600" y="402" text-anchor="middle" class="b">helps hot, queried partitions</text><text x="600" y="432" text-anchor="middle" class="b">does not cover cold ranges</text></g>
  <g><circle cx="980" cy="204" r="18" fill="#17324d"/><circle cx="925" cy="265" r="16" fill="#2f6fdd"/><circle cx="1035" cy="265" r="16" fill="#2f6fdd"/><circle cx="895" cy="325" r="14" fill="#3b9f8a"/><circle cx="955" cy="325" r="14" fill="#d96b63"/><circle cx="1005" cy="325" r="14" fill="#3b9f8a"/><circle cx="1065" cy="325" r="14" fill="#3b9f8a"/><g stroke="#55728f" stroke-width="2"><path d="M980 222L925 249M980 222L1035 249M925 281L895 311M925 281L955 311M1035 281L1005 311M1035 281L1065 311"/></g><text x="980" y="368" text-anchor="middle" class="b">Merkle hashes narrow mismatch</text><text x="980" y="402" text-anchor="middle" class="b">stream differing range data</text><text x="980" y="432" text-anchor="middle" class="b">scheduled systematic coverage</text></g>
  <rect x="185" y="570" width="830" height="65" rx="19" fill="#17324d"/><text x="600" y="597" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#fff">Hints reduce inconsistency; repair establishes convergence</text><text x="600" y="621" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#dce5ed">all three consume real disk, network, and coordinator capacity</text>
</svg>
