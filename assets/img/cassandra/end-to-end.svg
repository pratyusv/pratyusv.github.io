<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Complete lifecycle of one Cassandra mutation</title><desc id="desc">A mutation passes from query-shaped schema through token routing, three replicas, local commit logs and memtables, quorum acknowledgement, SSTable flush, hint replay, repair, and compaction.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.n{font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#fff}.box{fill:#fff;stroke:#b9c9d8;stroke-width:2}</style></defs>
  <rect width="1200" height="720" rx="24" fill="#f7fafc"/><text x="600" y="48" text-anchor="middle" class="t">One mutation crosses routing, replication, storage, and convergence</text>
  <g fill="none" stroke="#55728f" stroke-width="3" marker-end="url(#a)"><path d="M205 160H285"/><path d="M500 160H580"/><path d="M795 160H875"/><path d="M985 230V315"/><path d="M875 385H795"/><path d="M580 385H500"/><path d="M285 385H205"/><path d="M145 455V535"/><path d="M205 605H285"/></g>
  <g filter="url(#s)"><rect x="55" y="105" width="150" height="110" rx="18" class="box"/><rect x="285" y="105" width="215" height="110" rx="18" class="box"/><rect x="580" y="105" width="215" height="110" rx="18" class="box"/><rect x="875" y="105" width="215" height="125" rx="18" class="box"/><rect x="875" y="315" width="215" height="140" rx="18" class="box"/><rect x="580" y="330" width="215" height="110" rx="18" class="box"/><rect x="285" y="330" width="215" height="110" rx="18" class="box"/><rect x="55" y="330" width="150" height="125" rx="18" class="box"/><rect x="55" y="535" width="150" height="140" rx="18" class="box"/><rect x="285" y="550" width="215" height="110" rx="18" class="box"/></g>
  <g text-anchor="middle"><text x="130" y="140" class="h">CQL schema</text><text x="130" y="169" class="b">bounded partition</text><text x="130" y="193" class="b">ordered rows</text><text x="392" y="140" class="h">Partition token</text><text x="392" y="169" class="b">Murmur3(partition key)</text><text x="392" y="193" class="b">token t</text><text x="687" y="140" class="h">Natural replicas</text><text x="687" y="169" class="b">N1 · N2 · N3</text><text x="687" y="193" class="b">NetworkTopologyStrategy</text><text x="982" y="140" class="h">Replica foreground</text><text x="982" y="169" class="b">append commit log</text><text x="982" y="193" class="b">update memtable</text><text x="982" y="350" class="h">LOCAL_QUORUM</text><text x="982" y="379" class="b">N1 + N2 acknowledge</text><text x="982" y="405" class="b">client succeeds</text><text x="982" y="431" class="b">hint stored for N3</text><text x="687" y="365" class="h">Flush</text><text x="687" y="394" class="b">immutable SSTables</text><text x="687" y="418" class="b">commit-log space recyclable</text><text x="392" y="365" class="h">Read</text><text x="392" y="394" class="b">local merge + quorum</text><text x="392" y="418" class="b">timestamp reconciliation</text><text x="130" y="365" class="h">Hint replay</text><text x="130" y="394" class="b">N3 returns</text><text x="130" y="420" class="b">recent mutation delivered</text><text x="130" y="570" class="h">Repair</text><text x="130" y="599" class="b">compare token ranges</text><text x="130" y="625" class="b">stream differences</text><text x="130" y="651" class="b">verify convergence</text><text x="392" y="585" class="h">Compaction</text><text x="392" y="614" class="b">merge versions</text><text x="392" y="638" class="b">reclaim safe tombstones</text></g>
  <rect x="590" y="535" width="500" height="125" rx="20" fill="#17324d"/><text x="840" y="573" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#fff">The fast write path postpones work</text><text x="840" y="606" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#dce5ed">compaction · replay · repair · streaming</text><text x="840" y="634" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#dce5ed">must all fit inside operational capacity</text>
</svg>
