<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>Single database compared with Cassandra</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker><style>.t{font:700 25px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.b{font:13px sans-serif;fill:#45627d}.s{font:12px sans-serif;fill:#45627d}</style></defs><rect width="1200" height="680" rx="24" fill="#f7fafc"/><text x="600" y="45" text-anchor="middle" class="t">Distribution changes who owns writes, data, and recovery</text><rect x="55" y="90" width="500" height="500" rx="20" fill="#fff" stroke="#e4b85b"/><text x="305" y="132" text-anchor="middle" class="h">One primary database</text><rect x="105" y="190" width="150" height="85" rx="14" fill="#fff" stroke="#b7c8d8"/><text x="180" y="225" text-anchor="middle" class="h">Application</text><text x="180" y="250" text-anchor="middle" class="b">all writes</text><rect x="355" y="175" width="150" height="115" rx="14" fill="#fff8e8" stroke="#e4b85b"/><text x="430" y="212" text-anchor="middle" class="h">Primary</text><text x="430" y="239" text-anchor="middle" class="b">complete dataset</text><text x="430" y="264" text-anchor="middle" class="b">one commit order</text><path d="M255 232H355" stroke="#55728f" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="305" y="355" text-anchor="middle" class="b">Simple transactions and queries</text><text x="305" y="385" text-anchor="middle" class="b">Writes and failover converge on one authority</text><text x="305" y="455" text-anchor="middle" class="s">Keep this design when it meets the workload.</text><rect x="645" y="90" width="500" height="500" rx="20" fill="#fff" stroke="#5ab5a4"/><text x="895" y="132" text-anchor="middle" class="h">Cassandra leaderless cluster</text><rect x="690" y="175" width="130" height="90" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="755" y="212" text-anchor="middle" class="h">Node A</text><text x="755" y="239" text-anchor="middle" class="b">replicas</text><rect x="830" y="175" width="130" height="90" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="895" y="212" text-anchor="middle" class="h">Node B</text><text x="895" y="239" text-anchor="middle" class="b">replicas</text><rect x="970" y="175" width="130" height="90" rx="14" fill="#edf8f6" stroke="#5ab5a4"/><text x="1035" y="212" text-anchor="middle" class="h">Node C</text><text x="1035" y="239" text-anchor="middle" class="b">replicas</text><path d="M755 285L895 345L1035 285M755 285L895 285L1035 285" stroke="#55728f" stroke-width="3" stroke-dasharray="7 5" fill="none"/><text x="895" y="382" text-anchor="middle" class="b">Partitions and writes span nodes</text><text x="895" y="412" text-anchor="middle" class="b">Consistency is selected per operation</text><text x="895" y="455" text-anchor="middle" class="s">Scale and availability move complexity into</text><text x="895" y="478" text-anchor="middle" class="s">schema, reconciliation, repair, and operations.</text><rect x="260" y="615" width="680" height="40" rx="9" fill="#17324d"/><text x="600" y="641" text-anchor="middle" style="font:700 14px sans-serif;fill:#fff">More nodes do not merely make the same database larger; they change its contract.</text></svg>
