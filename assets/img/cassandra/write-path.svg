<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Cassandra write path at local quorum</title><desc id="desc">A coordinator sends a mutation to three replicas. Two append to commit logs and memtables and acknowledge, while the unavailable third replica receives a stored hint.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f6fdd"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b9f8a"/></marker><style>.t{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.h{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.b{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.c{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}.box{fill:#fff;stroke:#b9c9d8;stroke-width:2}</style></defs>
  <rect width="1200" height="700" rx="24" fill="#f7fafc"/><text x="600" y="48" text-anchor="middle" class="t">RF=3, LOCAL_QUORUM=2: replicate to all, wait for two</text>
  <rect x="50" y="125" width="180" height="90" rx="18" class="box" filter="url(#s)"/><text x="140" y="162" text-anchor="middle" class="h">Client</text><text x="140" y="190" text-anchor="middle" class="c">INSERT ...</text><path d="M230 170H355" stroke="#2f6fdd" stroke-width="4" marker-end="url(#a)"/>
  <rect x="355" y="100" width="250" height="140" rx="20" fill="#eef4ff" stroke="#7399dc" stroke-width="2" filter="url(#s)"/><text x="480" y="139" text-anchor="middle" class="h">Coordinator N4</text><text x="480" y="169" text-anchor="middle" class="b">token → N1, N2, N3</text><text x="480" y="197" text-anchor="middle" class="b">wait for 2 local ACKs</text><text x="480" y="224" text-anchor="middle" class="b">store hint if N3 is down</text>
  <g filter="url(#s)"><rect x="750" y="80" width="380" height="145" rx="20" class="box"/><rect x="750" y="275" width="380" height="145" rx="20" class="box"/><rect x="750" y="470" width="380" height="145" rx="20" fill="#fdf3f2" stroke="#d96b63" stroke-width="2"/></g>
  <g><text x="785" y="118" class="h">N1 · replica</text><rect x="785" y="142" width="135" height="46" rx="10" fill="#fff4dd" stroke="#e2a63b"/><text x="852" y="171" text-anchor="middle" class="c">commit log</text><rect x="940" y="142" width="145" height="46" rx="10" fill="#edf8f6" stroke="#5ab5a4"/><text x="1012" y="171" text-anchor="middle" class="c">memtable</text><text x="785" y="313" class="h">N2 · replica</text><rect x="785" y="337" width="135" height="46" rx="10" fill="#fff4dd" stroke="#e2a63b"/><text x="852" y="366" text-anchor="middle" class="c">commit log</text><rect x="940" y="337" width="145" height="46" rx="10" fill="#edf8f6" stroke="#5ab5a4"/><text x="1012" y="366" text-anchor="middle" class="c">memtable</text><text x="785" y="508" class="h">N3 · unavailable</text><text x="785" y="542" class="b">mutation not delivered</text></g>
  <g fill="none" stroke="#2f6fdd" stroke-width="3" marker-end="url(#a)"><path d="M605 145L750 145"/><path d="M605 175L750 335"/><path d="M605 205L750 530" stroke-dasharray="8 7"/></g>
  <g fill="none" stroke="#3b9f8a" stroke-width="3" marker-end="url(#g)"><path d="M750 195L620 240"/><path d="M750 390L620 260"/></g>
  <rect x="355" y="340" width="250" height="88" rx="17" fill="#fff4dd" stroke="#e2a63b"/><text x="480" y="374" text-anchor="middle" class="h">Hint for N3</text><text x="480" y="401" text-anchor="middle" class="b">temporary local disk record</text>
  <rect x="185" y="535" width="455" height="72" rx="20" fill="#17324d"/><text x="412" y="565" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#fff">Client success after N1 + N2</text><text x="412" y="591" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#dce5ed">N3 converges later through hint or repair</text>
</svg>
