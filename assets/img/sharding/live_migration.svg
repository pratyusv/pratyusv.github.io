<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Versioned live partition migration</title>
  <desc id="desc">A partition moves from source to target through prepare, snapshot copy, ordered change-log catch-up, an epoch cutover, a redirect grace period, and cleanup.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b9f8a"/></marker>
    <style>.title{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.label{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#45627d}.arrow{stroke:#55728f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.copy{stroke:#3b9f8a;stroke-width:3;fill:none;marker-end:url(#green)}</style>
  </defs>
  <rect width="1200" height="720" rx="24" fill="#f7fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">Copy first, catch up, then commit one ownership cutover</text>
  <rect x="60" y="110" width="340" height="370" rx="22" fill="#eef4ff" stroke="#7399dc" stroke-width="2" filter="url(#shadow)"/>
  <rect x="800" y="110" width="340" height="370" rx="22" fill="#edf8f6" stroke="#5ab5a4" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="152" text-anchor="middle" class="label">Source A</text><text x="230" y="181" text-anchor="middle" class="code">owner at epoch 81</text>
  <text x="970" y="152" text-anchor="middle" class="label">Target B</text><text x="970" y="181" text-anchor="middle" class="code">shadow copy</text>
  <rect x="105" y="220" width="250" height="94" rx="14" fill="#fff" stroke="#7399dc"/><text x="230" y="253" text-anchor="middle" class="label">Partition P17</text><text x="230" y="281" text-anchor="middle" class="code">snapshot at log 9,400</text>
  <rect x="105" y="345" width="250" height="94" rx="14" fill="#fff4dd" stroke="#e2a63b"/><text x="230" y="378" text-anchor="middle" class="label">Ordered changes</text><text x="230" y="407" text-anchor="middle" class="code">log 9,401 ... current</text>
  <rect x="845" y="220" width="250" height="94" rx="14" fill="#fff" stroke="#5ab5a4"/><text x="970" y="253" text-anchor="middle" class="label">Base image</text><text x="970" y="281" text-anchor="middle" class="code">verified snapshot</text>
  <rect x="845" y="345" width="250" height="94" rx="14" fill="#fff" stroke="#5ab5a4"/><text x="970" y="378" text-anchor="middle" class="label">Catch-up state</text><text x="970" y="407" text-anchor="middle" class="code">replay to watermark</text>
  <path d="M400 267H792" class="copy"/><text x="600" y="246" text-anchor="middle" class="code">2. SNAPSHOT COPY</text>
  <path d="M400 392H792" class="copy"/><text x="600" y="371" text-anchor="middle" class="code">3. CHANGE-LOG CATCH-UP</text>
  <rect x="385" y="505" width="430" height="105" rx="18" fill="#fff4dd" stroke="#e2a63b" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="541" text-anchor="middle" class="label">4. Metadata cutover</text><text x="600" y="570" text-anchor="middle" class="code">epoch 82: P17 -> target B</text><text x="600" y="595" text-anchor="middle" class="body">source A is fenced from authoritative writes</text>
  <path d="M230 480V557H377" class="arrow"/><path d="M815 557H970V480" class="arrow"/>
  <text x="235" y="650" class="code">5. GRACE: redirect stale epoch 81 traffic</text><text x="730" y="650" class="code">6. CLEANUP: delete only after verification</text>
  <rect x="233" y="675" width="734" height="32" rx="16" fill="#17324d"/><text x="600" y="697" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#fff">Before cutover A owns; after cutover B owns; controller restarts cannot change that fact</text>
</svg>
