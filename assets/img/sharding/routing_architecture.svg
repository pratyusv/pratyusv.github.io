<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Sharded request routing architecture</title>
  <desc id="desc">A client sends a key through a router using a versioned partition map. The map identifies a logical shard and its replicated storage group while a control plane publishes map changes.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker>
    <style>.title{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.label{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#45627d}.arrow{stroke:#55728f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#9a75bc;stroke-width:2.5;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="650" rx="24" fill="#f7fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">The partition map separates logical ownership from physical placement</text>
  <g filter="url(#shadow)">
    <rect x="45" y="205" width="180" height="160" rx="18" fill="#eef4ff" stroke="#7399dc"/>
    <rect x="290" y="175" width="230" height="220" rx="20" fill="#fff4dd" stroke="#e2a63b"/>
    <rect x="595" y="145" width="260" height="280" rx="20" fill="#fff" stroke="#b9c9d8"/>
    <rect x="925" y="115" width="230" height="340" rx="20" fill="#edf8f6" stroke="#5ab5a4"/>
    <rect x="410" y="505" width="380" height="88" rx="17" fill="#f7eefc" stroke="#9a75bc"/>
  </g>
  <text x="135" y="248" text-anchor="middle" class="label">Client</text><text x="135" y="290" text-anchor="middle" class="code">GET tenant:1450</text><text x="135" y="328" text-anchor="middle" class="body">caches map v82</text>
  <text x="405" y="220" text-anchor="middle" class="label">Shard router</text><text x="405" y="260" text-anchor="middle" class="code">partition_key=1450</text><text x="405" y="294" text-anchor="middle" class="code">map version=82</text><text x="405" y="340" text-anchor="middle" class="body">local routing decision</text>
  <text x="725" y="185" text-anchor="middle" class="label">Partition map v82</text>
  <rect x="625" y="220" width="200" height="54" rx="10" fill="#eef4ff" stroke="#7399dc"/><text x="725" y="253" text-anchor="middle" class="code">P17 [0, 1000)</text>
  <rect x="625" y="291" width="200" height="54" rx="10" fill="#fff4dd" stroke="#e2a63b" stroke-width="2"/><text x="725" y="324" text-anchor="middle" class="code">P42 tenant 1450</text>
  <rect x="625" y="362" width="200" height="40" rx="10" fill="#eef4ff" stroke="#7399dc"/><text x="725" y="387" text-anchor="middle" class="code">P43 (1450, 2000)</text>
  <text x="1040" y="155" text-anchor="middle" class="label">Replica group E</text>
  <rect x="965" y="195" width="150" height="66" rx="12" fill="#fff" stroke="#5ab5a4" stroke-width="2"/><text x="1040" y="223" text-anchor="middle" class="label">Primary</text><text x="1040" y="246" text-anchor="middle" class="code">node E1 · zone A</text>
  <rect x="965" y="285" width="150" height="66" rx="12" fill="#fff" stroke="#5ab5a4"/><text x="1040" y="313" text-anchor="middle" class="label">Replica</text><text x="1040" y="336" text-anchor="middle" class="code">node E2 · zone B</text>
  <rect x="965" y="375" width="150" height="66" rx="12" fill="#fff" stroke="#5ab5a4"/><text x="1040" y="403" text-anchor="middle" class="label">Replica</text><text x="1040" y="426" text-anchor="middle" class="code">node E3 · zone C</text>
  <text x="600" y="539" text-anchor="middle" class="label">Metadata control plane</text><text x="600" y="570" text-anchor="middle" class="body">splits · moves · replica placement · epochs</text>
  <path d="M225 285H282" class="arrow"/><path d="M520 285H587" class="arrow"/><path d="M855 318H917" class="arrow"/>
  <path d="M600 505V455H725V433" class="dash"/>
  <rect x="287" y="618" width="626" height="25" rx="12" fill="#17324d"/><text x="600" y="636" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#fff">Ordinary requests route locally; topology changes publish a new version</text>
</svg>
