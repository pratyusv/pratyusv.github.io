<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Consistent hash ring ownership</title>
  <desc id="desc">Four shard tokens and several keys lie on a circular hash space. Keys map clockwise to the next shard token. Removing shard B transfers only its interval to shard C.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker>
    <style>.title{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.label{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#45627d}.arc{fill:none;stroke:#55728f;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="680" rx="24" fill="#f7fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">Consistent hashing limits ownership changes to adjacent token intervals</text>
  <circle cx="430" cy="345" r="220" fill="#fff" stroke="#b9c9d8" stroke-width="16" filter="url(#shadow)"/>
  <path d="M430 125A220 220 0 0 1 650 345" class="arc"/><text x="570" y="165" class="body">clockwise ownership</text>
  <g>
    <circle cx="430" cy="125" r="27" fill="#2f6fdd"/><text x="430" y="131" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" fill="#fff">A</text>
    <circle cx="650" cy="345" r="27" fill="#d96b63"/><text x="650" y="351" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" fill="#fff">B</text>
    <circle cx="430" cy="565" r="27" fill="#3b9f8a"/><text x="430" y="571" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" fill="#fff">C</text>
    <circle cx="210" cy="345" r="27" fill="#e2a63b"/><text x="210" y="351" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" fill="#fff">D</text>
    <rect x="566" y="194" width="48" height="34" rx="8" fill="#fcebea" stroke="#d96b63"/><text x="590" y="216" text-anchor="middle" class="code">k1</text>
    <rect x="625" y="437" width="48" height="34" rx="8" fill="#edf8f6" stroke="#5ab5a4"/><text x="649" y="459" text-anchor="middle" class="code">k2</text>
    <rect x="290" y="519" width="48" height="34" rx="8" fill="#fff4dd" stroke="#e2a63b"/><text x="314" y="541" text-anchor="middle" class="code">k3</text>
    <rect x="220" y="206" width="48" height="34" rx="8" fill="#eef4ff" stroke="#7399dc"/><text x="244" y="228" text-anchor="middle" class="code">k4</text>
  </g>
  <rect x="790" y="130" width="335" height="390" rx="22" fill="#fff" stroke="#b9c9d8" filter="url(#shadow)"/>
  <text x="957" y="172" text-anchor="middle" class="label">Ownership before failure</text>
  <text x="830" y="215" class="code">k1 -> B</text><text x="830" y="250" class="code">k2 -> C</text><text x="830" y="285" class="code">k3 -> D</text><text x="830" y="320" class="code">k4 -> A</text>
  <line x1="820" y1="350" x2="1095" y2="350" stroke="#dce5ed" stroke-width="2"/>
  <text x="957" y="388" text-anchor="middle" class="label">Remove shard B</text>
  <text x="830" y="430" class="code" fill="#d96b63">k1 -> C  moved</text><text x="830" y="465" class="code">k2 -> C  unchanged</text><text x="830" y="500" class="code">k3, k4   unchanged</text>
  <rect x="272" y="625" width="656" height="38" rx="19" fill="#17324d"/><text x="600" y="650" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#fff">Consistent means bounded remapping—not consensus or strong consistency</text>
</svg>
