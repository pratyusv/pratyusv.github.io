<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Virtual nodes distributed around a hash ring</title>
  <desc id="desc">Many virtual tokens belonging to physical nodes A, B, and C are interleaved around a consistent hash ring, smoothing ownership and spreading recovery.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter>
    <style>.title{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.label{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#45627d}</style>
  </defs>
  <rect width="1200" height="680" rx="24" fill="#f7fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">Virtual nodes divide physical ownership into many movable units</text>
  <circle cx="410" cy="345" r="220" fill="#fff" stroke="#dce5ed" stroke-width="16" filter="url(#shadow)"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="410" cy="125" r="24" fill="#2f6fdd"/><text x="410" y="130" fill="#fff">A1</text>
    <circle cx="565" cy="190" r="24" fill="#3b9f8a"/><text x="565" y="195" fill="#fff">B1</text>
    <circle cx="630" cy="345" r="24" fill="#e2a63b"/><text x="630" y="350" fill="#fff">C1</text>
    <circle cx="565" cy="500" r="24" fill="#2f6fdd"/><text x="565" y="505" fill="#fff">A2</text>
    <circle cx="410" cy="565" r="24" fill="#e2a63b"/><text x="410" y="570" fill="#fff">C2</text>
    <circle cx="255" cy="500" r="24" fill="#3b9f8a"/><text x="255" y="505" fill="#fff">B2</text>
    <circle cx="190" cy="345" r="24" fill="#2f6fdd"/><text x="190" y="350" fill="#fff">A3</text>
    <circle cx="255" cy="190" r="24" fill="#e2a63b"/><text x="255" y="195" fill="#fff">C3</text>
    <circle cx="486" cy="139" r="20" fill="#3b9f8a"/><text x="486" y="144" fill="#fff">B3</text>
    <circle cx="614" cy="265" r="20" fill="#2f6fdd"/><text x="614" y="270" fill="#fff">A4</text>
    <circle cx="605" cy="430" r="20" fill="#3b9f8a"/><text x="605" y="435" fill="#fff">B4</text>
    <circle cx="330" cy="550" r="20" fill="#2f6fdd"/><text x="330" y="555" fill="#fff">A5</text>
    <circle cx="205" cy="425" r="20" fill="#e2a63b"/><text x="205" y="430" fill="#fff">C4</text>
    <circle cx="205" cy="267" r="20" fill="#3b9f8a"/><text x="205" y="272" fill="#fff">B5</text>
    <circle cx="333" cy="140" r="20" fill="#e2a63b"/><text x="333" y="145" fill="#fff">C5</text>
  </g>
  <text x="410" y="326" text-anchor="middle" class="label">shared token space</text><text x="410" y="359" text-anchor="middle" class="body">15 small ranges</text><text x="410" y="386" text-anchor="middle" class="body">3 physical owners</text>
  <rect x="735" y="115" width="400" height="420" rx="22" fill="#fff" stroke="#b9c9d8" filter="url(#shadow)"/>
  <text x="935" y="157" text-anchor="middle" class="label">Physical ownership</text>
  <rect x="780" y="195" width="310" height="72" rx="13" fill="#eef4ff" stroke="#7399dc"/><circle cx="815" cy="231" r="10" fill="#2f6fdd"/><text x="842" y="226" class="label">Node A</text><text x="842" y="250" class="code">A1 · A2 · A3 · A4 · A5</text>
  <rect x="780" y="290" width="310" height="72" rx="13" fill="#edf8f6" stroke="#5ab5a4"/><circle cx="815" cy="326" r="10" fill="#3b9f8a"/><text x="842" y="321" class="label">Node B</text><text x="842" y="345" class="code">B1 · B2 · B3 · B4 · B5</text>
  <rect x="780" y="385" width="310" height="72" rx="13" fill="#fff4dd" stroke="#e2a63b"/><circle cx="815" cy="421" r="10" fill="#e2a63b"/><text x="842" y="416" class="label">Node C</text><text x="842" y="440" class="code">C1 · C2 · C3 · C4 · C5</text>
  <text x="935" y="500" text-anchor="middle" class="body">A failed node's ranges can move</text><text x="935" y="523" text-anchor="middle" class="body">to several surviving nodes.</text>
  <rect x="230" y="615" width="740" height="42" rx="21" fill="#17324d"/><text x="600" y="641" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="600" fill="#fff">More tokens improve granularity but increase map and migration overhead</text>
</svg>
