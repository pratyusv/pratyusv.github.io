<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">A hot partition hidden by balanced storage</title>
  <desc id="desc">Four shards store similar byte volumes, but one shard receives sixty-two percent of request traffic because it owns a hot key.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d96b63"/></marker>
    <style>.title{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.label{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#45627d}.hot{stroke:#d96b63;stroke-width:4;fill:none;marker-end:url(#red)}</style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#f7fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">Balanced bytes do not imply balanced traffic or work</text>
  <rect x="70" y="105" width="1060" height="105" rx="20" fill="#fff" stroke="#b9c9d8" filter="url(#shadow)"/>
  <text x="120" y="140" class="label">Incoming requests</text>
  <g fill="#7399dc"><circle cx="150" cy="175" r="8"/><circle cx="185" cy="175" r="8"/><circle cx="220" cy="175" r="8"/><circle cx="255" cy="175" r="8"/><circle cx="290" cy="175" r="8"/><circle cx="325" cy="175" r="8"/><circle cx="360" cy="175" r="8"/><circle cx="395" cy="175" r="8"/><circle cx="430" cy="175" r="8"/><circle cx="465" cy="175" r="8"/><circle cx="500" cy="175" r="8"/><circle cx="535" cy="175" r="8"/><circle cx="570" cy="175" r="8"/><circle cx="605" cy="175" r="8"/><circle cx="640" cy="175" r="8"/><circle cx="675" cy="175" r="8"/><circle cx="710" cy="175" r="8"/><circle cx="745" cy="175" r="8"/><circle cx="780" cy="175" r="8"/><circle cx="815" cy="175" r="8"/><circle cx="850" cy="175" r="8"/><circle cx="885" cy="175" r="8"/><circle cx="920" cy="175" r="8"/><circle cx="955" cy="175" r="8"/><circle cx="990" cy="175" r="8"/></g>
  <g filter="url(#shadow)">
    <rect x="70" y="305" width="240" height="205" rx="20" fill="#eef4ff" stroke="#7399dc"/>
    <rect x="345" y="275" width="240" height="265" rx="20" fill="#fcebea" stroke="#d96b63" stroke-width="3"/>
    <rect x="620" y="305" width="240" height="205" rx="20" fill="#edf8f6" stroke="#5ab5a4"/>
    <rect x="895" y="305" width="240" height="205" rx="20" fill="#fff4dd" stroke="#e2a63b"/>
  </g>
  <text x="190" y="347" text-anchor="middle" class="label">Shard S1</text><text x="190" y="387" text-anchor="middle" class="code">storage 24%</text><text x="190" y="420" text-anchor="middle" class="code">traffic 11%</text>
  <text x="465" y="317" text-anchor="middle" class="label">Shard S2 — HOT</text><text x="465" y="360" text-anchor="middle" class="code">storage 26%</text><text x="465" y="395" text-anchor="middle" class="code">traffic 62%</text><rect x="395" y="430" width="140" height="55" rx="11" fill="#fff" stroke="#d96b63"/><text x="465" y="464" text-anchor="middle" class="code">celebrity:42</text>
  <text x="740" y="347" text-anchor="middle" class="label">Shard S3</text><text x="740" y="387" text-anchor="middle" class="code">storage 25%</text><text x="740" y="420" text-anchor="middle" class="code">traffic 13%</text>
  <text x="1015" y="347" text-anchor="middle" class="label">Shard S4</text><text x="1015" y="387" text-anchor="middle" class="code">storage 25%</text><text x="1015" y="420" text-anchor="middle" class="code">traffic 14%</text>
  <path d="M465 210V267" class="hot"/><path d="M500 210V267" class="hot"/><path d="M430 210V267" class="hot"/>
  <rect x="240" y="567" width="720" height="38" rx="19" fill="#17324d"/><text x="600" y="592" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#fff">Moving S2 changes the hot machine; splitting or replicating the hot key changes the workload</text>
</svg>
