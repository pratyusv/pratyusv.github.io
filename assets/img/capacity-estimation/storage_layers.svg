<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">From logical data to provisioned storage</title>
  <desc id="desc">Logical application payload is adjusted for compression, indexes and metadata, replicas, and operational headroom to calculate provisioned storage.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker>
    <style>.title{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.label{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.code{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#45627d}.arrow{stroke:#55728f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="650" rx="24" fill="#f7fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">Logical payload is only the first layer of storage capacity</text>
  <g filter="url(#shadow)">
    <rect x="40" y="185" width="195" height="190" rx="18" fill="#eef4ff" stroke="#7399dc"/>
    <rect x="280" y="185" width="195" height="190" rx="18" fill="#edf8f6" stroke="#5ab5a4"/>
    <rect x="520" y="185" width="195" height="190" rx="18" fill="#fff4dd" stroke="#e2a63b"/>
    <rect x="760" y="185" width="195" height="190" rx="18" fill="#f7eefc" stroke="#9a75bc"/>
    <rect x="1000" y="165" width="160" height="230" rx="18" fill="#17324d"/>
  </g>
  <text x="137" y="228" text-anchor="middle" class="label">Logical data</text><text x="137" y="280" text-anchor="middle" class="code">3.65 TB</text><text x="137" y="325" text-anchor="middle" class="body">records × size</text><text x="137" y="348" text-anchor="middle" class="body">× retention</text>
  <text x="377" y="228" text-anchor="middle" class="label">Compression</text><text x="377" y="280" text-anchor="middle" class="code">× 0.70</text><text x="377" y="325" text-anchor="middle" class="body">measured encoded</text><text x="377" y="348" text-anchor="middle" class="body">size ratio</text>
  <text x="617" y="228" text-anchor="middle" class="label">Indexes + metadata</text><text x="617" y="280" text-anchor="middle" class="code">× 1.25</text><text x="617" y="325" text-anchor="middle" class="body">keys, indexes,</text><text x="617" y="348" text-anchor="middle" class="body">storage overhead</text>
  <text x="857" y="228" text-anchor="middle" class="label">Replication</text><text x="857" y="280" text-anchor="middle" class="code">× 3</text><text x="857" y="325" text-anchor="middle" class="body">three durable</text><text x="857" y="348" text-anchor="middle" class="body">copies</text>
  <text x="1080" y="213" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#fff">Provisioned</text><text x="1080" y="253" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#fff">12.46 TB</text><text x="1080" y="304" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#dce8f2">steady state</text><text x="1080" y="328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#dce8f2">9.58 TB</text><text x="1080" y="365" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#dce8f2">+ 30% headroom</text>
  <path d="M235 280H272" class="arrow"/><path d="M475 280H512" class="arrow"/><path d="M715 280H752" class="arrow"/><path d="M955 280H992" class="arrow"/>
  <text x="600" y="450" text-anchor="middle" class="code">3.65 TB × 0.70 × 1.25 × 3 × 1.30 = 12.46 TB</text>
  <rect x="160" y="493" width="880" height="74" rx="15" fill="#fff" stroke="#b9c9d8"/>
  <text x="600" y="522" text-anchor="middle" class="label">Model separately when applicable</text><text x="600" y="551" text-anchor="middle" class="body">backups · snapshots · second region · compaction peaks · repair traffic · migration overlap</text>
  <text x="600" y="613" text-anchor="middle" class="body">Capacity, IOPS, and throughput are independent storage constraints.</text>
</svg>
