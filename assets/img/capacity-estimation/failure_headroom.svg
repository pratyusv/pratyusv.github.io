<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Capacity after one availability-zone failure</title>
  <desc id="desc">Fourteen application instances are spread as five, five, and four across three zones. Losing a five-instance zone leaves the nine instances required for peak traffic.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter>
    <style>.title{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.label{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.code{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#45627d}.node{fill:#fff;stroke:#5ab5a4;stroke-width:2}.dead{fill:#fcebea;stroke:#d96b63;stroke-width:2}</style>
  </defs>
  <rect width="1200" height="650" rx="24" fill="#f7fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">Provision enough capacity after the chosen failure domain disappears</text>
  <g filter="url(#shadow)">
    <rect x="45" y="105" width="350" height="370" rx="21" fill="#fff7f6" stroke="#d96b63" stroke-width="2"/>
    <rect x="425" y="105" width="350" height="370" rx="21" fill="#edf8f6" stroke="#5ab5a4" stroke-width="2"/>
    <rect x="805" y="105" width="350" height="370" rx="21" fill="#edf8f6" stroke="#5ab5a4" stroke-width="2"/>
  </g>
  <text x="220" y="145" text-anchor="middle" class="label">Zone A — failed</text><text x="600" y="145" text-anchor="middle" class="label">Zone B — survives</text><text x="980" y="145" text-anchor="middle" class="label">Zone C — survives</text>
  <g>
    <rect x="88" y="190" width="98" height="58" rx="11" class="dead"/><rect x="207" y="190" width="98" height="58" rx="11" class="dead"/><rect x="147" y="270" width="98" height="58" rx="11" class="dead"/><rect x="88" y="350" width="98" height="58" rx="11" class="dead"/><rect x="207" y="350" width="98" height="58" rx="11" class="dead"/>
    <path d="M82 184L311 414M311 184L82 414" stroke="#d96b63" stroke-width="8" opacity=".35"/>
    <rect x="468" y="190" width="98" height="58" rx="11" class="node"/><rect x="587" y="190" width="98" height="58" rx="11" class="node"/><rect x="527" y="270" width="98" height="58" rx="11" class="node"/><rect x="468" y="350" width="98" height="58" rx="11" class="node"/><rect x="587" y="350" width="98" height="58" rx="11" class="node"/>
    <rect x="848" y="190" width="98" height="58" rx="11" class="node"/><rect x="967" y="190" width="98" height="58" rx="11" class="node"/><rect x="908" y="270" width="98" height="58" rx="11" class="node"/><rect x="908" y="350" width="98" height="58" rx="11" class="node"/>
  </g>
  <g class="code" text-anchor="middle"><text x="137" y="226">A1</text><text x="256" y="226">A2</text><text x="196" y="306">A3</text><text x="137" y="386">A4</text><text x="256" y="386">A5</text><text x="517" y="226">B1</text><text x="636" y="226">B2</text><text x="576" y="306">B3</text><text x="517" y="386">B4</text><text x="636" y="386">B5</text><text x="897" y="226">C1</text><text x="1016" y="226">C2</text><text x="957" y="306">C3</text><text x="957" y="386">C4</text></g>
  <text x="220" y="445" text-anchor="middle" class="body">5 instances unavailable</text><text x="600" y="445" text-anchor="middle" class="body">5 instances remain</text><text x="980" y="445" text-anchor="middle" class="body">4 instances remain</text>
  <text x="600" y="525" text-anchor="middle" class="code">normal peak requires 9 · deployed 14 · surviving 9</text>
  <rect x="250" y="570" width="700" height="42" rx="21" fill="#17324d"/><text x="600" y="596" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="600" fill="#fff">Healthy-state utilization must leave enough capacity for degraded operation</text>
</svg>
