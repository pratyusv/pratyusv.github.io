<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Little's Law and request concurrency</title>
  <desc id="desc">Requests arrive at rate lambda, spend time W inside a service, and produce average in-flight concurrency L equal to lambda times W.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55728f"/></marker>
    <style>.title{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.label{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45627d}.code{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#45627d}.arrow{stroke:#55728f;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="600" rx="24" fill="#f7fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">Little's Law connects arrival rate, latency, and in-flight work</text>
  <rect x="80" y="190" width="220" height="170" rx="20" fill="#eef4ff" stroke="#7399dc" filter="url(#shadow)"/>
  <text x="190" y="232" text-anchor="middle" class="label">Arrivals</text><text x="190" y="278" text-anchor="middle" class="code">lambda = 10,185/s</text><text x="190" y="318" text-anchor="middle" class="body">requests entering</text>
  <rect x="455" y="125" width="290" height="300" rx="22" fill="#fff4dd" stroke="#e2a63b" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="170" text-anchor="middle" class="label">Service</text><text x="600" y="207" text-anchor="middle" class="code">W = 0.120 seconds</text>
  <g fill="#fff" stroke="#e2a63b"><rect x="500" y="245" width="70" height="48" rx="9"/><rect x="585" y="245" width="70" height="48" rx="9"/><rect x="670" y="245" width="40" height="48" rx="9"/><rect x="500" y="310" width="70" height="48" rx="9"/><rect x="585" y="310" width="70" height="48" rx="9"/><rect x="670" y="310" width="40" height="48" rx="9"/></g>
  <text x="600" y="392" text-anchor="middle" class="code">L = 1,222 in flight</text>
  <rect x="900" y="190" width="220" height="170" rx="20" fill="#edf8f6" stroke="#5ab5a4" filter="url(#shadow)"/>
  <text x="1010" y="232" text-anchor="middle" class="label">Completions</text><text x="1010" y="278" text-anchor="middle" class="code">stable rate</text><text x="1010" y="318" text-anchor="middle" class="body">requests leaving</text>
  <path d="M300 275H447" class="arrow"/><path d="M745 275H892" class="arrow"/>
  <text x="600" y="485" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="26" font-weight="700" fill="#17324d">L = lambda × W</text>
  <rect x="246" y="535" width="708" height="40" rx="20" fill="#17324d"/><text x="600" y="561" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#fff">At fixed traffic, 5× latency creates 5× in-flight work and retained state</text>
</svg>
