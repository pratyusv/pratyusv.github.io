<!-- start custom footer snippets -->

<a href="{{ '/sitemap/' | relative_url }}">Sitemap</a>
<span aria-hidden="true"> · </span>
<a href="{{ '/privacy/' | relative_url }}">Privacy</a>

{% if page.mathjax or page.content contains '\(' or page.content contains '\[' %}
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script"></script>
{% endif %}

{% if page.mermaid %}
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({startOnLoad:true, theme:'default'});
    await mermaid.run({querySelector:'code.language-mermaid'});
  </script>
{% endif %}

<script>
  const themeToggle = document.getElementById("theme-toggle");
  themeToggle?.addEventListener("click", (event) => event.preventDefault());
  themeToggle?.addEventListener("keydown", (event) => {
    if (event.key === " ") {
      event.preventDefault();
      themeToggle.click();
    }
  });

  const followButton = document.querySelector(".author__urls-wrapper button");
  followButton?.addEventListener("click", () => {
    requestAnimationFrame(() => {
      followButton.setAttribute("aria-expanded", followButton.classList.contains("open").toString());
    });
  });
</script>

<!-- end custom footer snippets -->
